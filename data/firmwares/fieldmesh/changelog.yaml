    prerelease: false
    notes: "> [!NOTE]\r\n> **Formerly v5.3.** FieldMesh moved to semantic versioning in November 2026; only the version number changed.\r\n \r\n## MeshCore Upstream Sync\r\n \r\n### Changes\r\n- **MeshCore upstream alignment** — codebase updated to track MeshCore v1.15.0; no FieldMesh-specific feature changes in this release\r\n# Download\r\n \r\nAll files are attached below under **Assets**. Flash the zip with the web flasher (DFU). This release still has separate files for the Off-Grid region (one firmware for all regions came with 2.1.0).\r\n \r\n| Device | EU Off-Grid frequency (869.4625 MHz) | US Off-Grid frequency (916.4625 MHz) |\r\n|---|---|---|\r\n| ThinkNode M1 | `ThinkNode_M1_companion_radio_ble_FieldMeshv1.10.0.zip` | `ThinkNode_M1_companion_radio_ble_FieldMeshv1.10.0_US.zip` |\r\n| Wio Tracker L1 | `WioTrackerL1_companion_radio_ble_FieldMeshv1.10.0.zip` | `WioTrackerL1_companion_radio_ble_FieldMeshv1.10.0_US.zip` |\r\n| T1000-E | `t1000e_companion_radio_ble_FieldMeshv1.10.0.zip` | `t1000e_companion_radio_ble_FieldMeshv1.10.0_US.zip` |"
  - version: v1.9.0
    name: FieldMesh 1.9.0
    datetime: '2026-04-09T14:29:21Z'
    url: https://github.com/fieldmesh-radio/FieldMesh/releases/tag/v1.9.0
    prerelease: false
    notes: "> [!NOTE]\n> **Formerly v5.2.** FieldMesh moved to semantic versioning in November 2026; only the version number changed.\n\n## HomeScreen Redesign & Online Node Counter\r\n\r\n### New features\r\n- **Online node counter** — HomeScreen now shows how many nodes have been\r\n  heard in the last 30 minutes, combining advert senders and message senders\r\n  in a single deduplicated count (16-entry LRU cache)\r\n- **Node counter icon** — the online count is displayed with a filled circle\r\n  icon (●) instead of plain [X] text\r\n- **Real channel name in title bar** — message history and favorite preview\r\n  now show the actual channel name (e.g. \"Public\") instead of the hardcoded\r\n  \"[CH]\" tag\r\n- **Mode indicator** — GPS-SHARE and OFF-GRID modes are now shown on the\r\n  HomeScreen FIRST page\r\n\r\n### Changes\r\n- **M1 HomeScreen layout** — node counter fixed at y=22 regardless of\r\n  connection state; MSG:X replaces `< Connected >` when disconnected;\r\n  nodes_icon y-offset corrected (+3px) to align with text baseline\r\n- **Channel message title bar** — sender name omitted from title bar for\r\n  channel messages (already visible inside the message text)\r\n- **Favorite indicator** — clears correctly after all messages are deleted\r\n  (deleteEntry / clearAll); no longer persists stale data after app sync\r\n- **MSG:X counter** — hidden on HomeScreen while phone app is connected\r\n- **RECENT/TRACKING pages** — row limits now display-height-adaptive via\r\n  max_y variable instead of hardcoded values\r\n\r\n### Bug fixes\r\n- **BLE init: send_queue flood** — between `onSecured()` and `CMD_APP_START`\r\n  async pushes could fill all 12 send_queue slots, causing the app to time\r\n  out. Fixed via `_app_initialized` flag and `isWriteBusy()` guard\r\n- **Double-counting in node counter** — nodes heard via both advert and\r\n  message were counted twice. Fixed via `countOnlineNodesExcluding()`\r\n- **adv_fresh buffer** — was reusing the 4-entry RECENT display array,\r\n  capping the advert-based node count at 4. Now uses a dedicated\r\n  ADVERT_PATH_TABLE_SIZE (16) buffer\r\n- **formatRelTime undefined behavior** — replaced signed int cast with\r\n  safe uint32_t arithmetic\r\n\r\n### Technical notes\r\n- Changes confined to `UITask.cpp`, `UITask.h`, `MyMesh.cpp`, `MyMesh.h`,\r\n  `icons.h`\r\n- `DataStore`, `AbstractUITask`, `platformio.ini` unaffected\r\n\r\n# Download latest build\r\n## EU Offgrid frequency\r\n[ThinkNode_M1_companion_radio_ble_FieldMeshv5.2.zip](https://github.com/user-attachments/files/26605877/ThinkNode_M1_companion_radio_ble_FieldMeshv5.2.zip)\r\n[WioTrackerL1_companion_radio_ble_FieldMeshv5.2.zip](https://github.com/user-attachments/files/26605890/WioTrackerL1_companion_radio_ble_FieldMeshv5.2.zip)\r\n[t1000e_companion_radio_ble_FieldMeshv5.2.zip](https://github.com/user-attachments/files/26605896/t1000e_companion_radio_ble_FieldMeshv5.2.zip)\r\n\r\n## US Offgrid frequency\r\n[ThinkNode_M1_companion_radio_ble_USFieldMeshv5.2.zip](https://github.com/user-attachments/files/26605905/ThinkNode_M1_companion_radio_ble_USFieldMeshv5.2.zip)\r\n[WioTrackerL1_companion_radio_ble_USFieldMeshv5.2.zip](https://github.com/user-attachments/files/26605916/WioTrackerL1_companion_radio_ble_USFieldMeshv5.2.zip)\r\n[t1000e_companion_radio_ble_USFieldMeshv5.2.zip](https://github.com/user-attachments/files/26605923/t1000e_companion_radio_ble_USFieldMeshv5.2.zip)"
  - version: v1.8.0
    name: FieldMesh 1.8.0
    datetime: '2026-04-04T08:18:12Z'
    url: https://github.com/fieldmesh-radio/FieldMesh/releases/tag/v1.8.0
    prerelease: false
    notes: "> [!NOTE]\r\n> **Formerly v5.1.** FieldMesh moved to semantic versioning in November 2026; only the version number changed.\r\n\r\n##  Headless Device Support (T1000-E, RAK WiseMesh TAG)\r\n\r\n### New features\r\n- **Headless device support** — `ui-orig` now fully integrated into FieldMesh; devices with no display and a single button (Seeed T1000-E, RAK WiseMesh TAG) are supported as first-class citizens\r\n- **Off-Grid toggle via 5× click** — 5 presses on the single button toggles Off-Grid mode on/off; buzzer feedback is forced regardless of mute state (ascending tone = on, descending = off)\r\n- **SOS alarm via buzzer** — incoming `!SOS` messages trigger a continuous buzzer siren that overrides quiet mode and loops until acknowledged with a short press\r\n\r\n### Changes\r\n- All button actions (advert, GPS toggle, buzzer toggle, Off-Grid toggle) now produce forced buzzer feedback regardless of quiet mode — essential for display-less operation\r\n- Ascending tone (`c,e`) = feature enabled; descending tone (`e,c`) = feature disabled — consistent across all actions\r\n- `newMsg()` signature updated to include `is_favorite` parameter — compatible with the v1.7 `AbstractUITask` interface\r\n- `refreshDisplay()` and `isOnRecentOrTrackingPage()` added as explicit no-op overrides — required for `MyMesh` compatibility\r\n\r\n### Button mapping (headless devices — single button)\r\n| Press | Action |\r\n|---|---|\r\n| 1× | Wake display / acknowledge SOS alarm |\r\n| 2× | Send advert |\r\n| 3× | Buzzer mute on/off |\r\n| 4× | GPS on/off |\r\n| 5× | Off-Grid mode on/off |\r\n| Long press (first 8 s) | CLI Rescue Mode |\r\n| Long press | Shutdown |\r\n\r\n### Technical notes\r\n- Changes confined to `ui-orig/Button.h`, `ui-orig/Button.cpp`, `ui-orig/UITask.h`, `ui-orig/UITask.cpp`\r\n- `ui-new` (ThinkNode M1, Wio Tracker L1) is completely unaffected\r\n- `_buzzer_restore_quiet` flag ensures non-blocking buzzer playback before quiet state is restored\r\n\r\n# Download latest build\r\n\r\n## EU Offgrid frequency\r\n[ThinkNode_M1_companion_radio_ble_FieldMeshv5.1.zip](https://github.com/user-attachments/files/26479266/ThinkNode_M1_companion_radio_ble_FieldMeshv5.1.zip)\r\n[WioTrackerL1_companion_radio_ble_FieldMeshv5.1.zip](https://github.com/user-attachments/files/26479268/WioTrackerL1_companion_radio_ble_FieldMeshv5.1.zip)\r\n[t1000e_companion_radio_ble_FieldMeshv5.1.zip](https://github.com/user-attachments/files/26479270/t1000e_companion_radio_ble_FieldMeshv5.1.zip)\r\n\r\n## US Offgrid frequency\r\n[ThinkNode_M1_companion_radio_ble_USFieldMeshv5.1.zip](https://github.com/user-attachments/files/26479519/ThinkNode_M1_companion_radio_ble_USFieldMeshv5.1.zip)\r\n[WioTrackerL1_companion_radio_ble_USFieldMeshv5.1.zip](https://github.com/user-attachments/files/26479520/WioTrackerL1_companion_radio_ble_USFieldMeshv5.1.zip)\r\n[t1000e_companion_radio_ble_USFieldMeshv5.1.zip](https://github.com/user-attachments/files/26479521/t1000e_companion_radio_ble_USFieldMeshv5.1.zip)"
