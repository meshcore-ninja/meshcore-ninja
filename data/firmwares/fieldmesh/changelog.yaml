    notes: "## [V6.1] - FieldMesh Repeater, GPS Duty Cycle & Smarter Tracking\r\n\r\nv6.1 brings the biggest addition to FieldMesh so far: the **FieldMesh Repeater**. A Station G2 becomes the base station for your camp, festival or multi-day tour — a full MeshCore repeater with its own message board, a WiFi dashboard for phones, SOS on the board and a weather forecast that works in the field.\r\n\r\nAll trackers also get a new GPS engine (about 2–2½ days with GPS on in our T1000-E tests), smarter tracking and one firmware file for all regions. Still based on MeshCore v1.18.0.\r\n\r\n<p align=\"center\">\r\n  <img src=\"https://raw.githubusercontent.com/TogeriX-hub/FieldMesh/main/docs/FieldMesh/images/repeater_dashboard_board.png\" width=\"24%\">\r\n  <img src=\"https://raw.githubusercontent.com/TogeriX-hub/FieldMesh/main/docs/FieldMesh/images/repeater_dashboard_nodes.png\" width=\"24%\">\r\n  <img src=\"https://raw.githubusercontent.com/TogeriX-hub/FieldMesh/main/docs/FieldMesh/images/repeater_dashboard_radar.png\" width=\"24%\">\r\n  <img src=\"https://raw.githubusercontent.com/TogeriX-hub/FieldMesh/main/docs/FieldMesh/images/repeater_dashboard_network.png\" width=\"24%\">\r\n</p>\r\n\r\n### New: FieldMesh Repeater (Station G2)\r\n\r\nSet up a Station G2 at your base — for example in a box with a power station — and your group has a meeting point in the mesh. It is still a **normal MeshCore repeater** (all repeater settings, CLI commands and app tools work as usual), with these additions:\r\n\r\n- **Message board** — a room server runs as a second identity next to the repeater (e.g. \"BaseCamp\"). Read and post from the MeshCore app; posts and users survive a restart. The repeater keeps repeating and shows up correctly in the app's paths\r\n- **WiFi dashboard** — the box opens its own WiFi. Any phone sees the board, SOS alerts, all nodes as a list or radar with distance and direction (team first) and network statistics — no app, no LoRa device, no internet needed\r\n- **SOS on the board** — every `!SOS` heard in the box's SOS channels appears on the board and in the dashboard, with position, battery and an \"Open in map app\" button\r\n- **Weather in the field** — when a phone with mobile data opens the dashboard, the box loads a 48 h forecast. Anyone can then ask `!weather` (or `!wetter` in German) in the room: rain from when, wind gusts, frost, thunderstorms — metric or imperial\r\n- **Off-Grid with one press** — switch the whole repeater to the Off-Grid frequency of your FieldMesh nodes and back, live, from the G2 menu, the CLI (`set offgrid on|off`) or the dashboard\r\n- **Room commands** — `!ping`, `!status`, `!weather` for everyone; `!commands` and `/<CLI command>` for the admin\r\n- **Easy to run** — G2 menu (Status, Off-Grid, Room, Room reset, WiFi, Power off), admin setup in the dashboard and firmware updates straight from the dashboard\r\n\r\nGetting started, menu, commands and dashboard: see the [[README](https://github.com/TogeriX-hub/FieldMesh#fieldmesh-repeater-station-g2)].\r\n\r\n### GPS Duty Cycle & Tracking\r\n\r\n- **GPS duty cycle** — while GPS is on, the receiver takes a fix every 2 minutes and sleeps in between (timing modelled on Meshtastic). T1000-E with GPS on: about 2–2½ days in our tests\r\n- **Adapts to the sky** — short searches indoors, longer ones at a window, up to 4 minutes under open sky. In our field tests the first fix after leaving the house came within 1–2 minutes, even after a night indoors\r\n- **All satellite systems** — GPS, GLONASS, Galileo, BeiDou (and QZSS) wherever the receiver supports them\r\n- **Smarter tracking** (GPS-Share on) — position is sent when you moved ≥ 100 m (at most every 2 min) plus a heartbeat every 10 min. At ≥ 30 km/h (car, bike) the GPS measures and sends every 60 s\r\n- **Fresh positions only** — adverts and SOS only carry a fix that is at most 2 minutes old\r\n- **ThinkNode M1 GPS switch** — the GPS runs only when the hardware switch and the setting are on\r\n\r\n### One Firmware for All Regions\r\n\r\nOff-Grid now picks the region automatically from your normal fre\n…"
  - version: v6.0
    name: FieldMesh v6.0
    datetime: '2026-10-18T11:03:55Z'
    url: https://github.com/TogeriX-hub/FieldMesh/releases/tag/v6.0
    prerelease: false
    notes: "> ⚠️ **Known issue:** On some devices, updating from V5.x to V6.0 reset the node identity (new public key) and settings (name, radio parameters). Contacts and channels were kept. **Before updating, export your private key in the MeshCore app** so you can re-import it if needed. Investigation in progress.\r\n\r\n## [V6.0] - MeshCore v1.18.0 Base\r\n\r\nFieldMesh now runs on MeshCore v1.18.0 (previously v1.15.0). All FieldMesh features are kept and sit on top of the current upstream firmware. New features will follow in V6.x.\r\n\r\n### New from upstream (MeshCore v1.16 – v1.18)\r\n\r\n- **Repeater discovery page** (`ui-new`) — new home screen page before the SOS page; scans for repeaters in direct range and shows their signal strength\r\n- **Charging indicator** (`ui-new`) — lightning bolt while charging, plug when full, next to the battery icon\r\n- **Startup tone** — short tune on boot on all devices with a buzzer (respects buzzer mute)\r\n- **Low-battery shutdown** — no longer shuts down while externally powered; the warning is shown on all display types\r\n- **Settings stored as JSON** (`/prefs.json`) — migrated automatically from the old binary format on first boot\r\n- **Power saving on nRF52** — CPU sleeps between events\r\n- **T1000-E** — RGB status LED and vibration motor support from upstream `ui-orig`\r\n- Plus all other upstream changes: multi-interface companion (BLE/USB/WiFi), companion CLI, 5-byte ACKs, reserved anonymous contact slots, new display colour API\r\n\r\n### Changes\r\n\r\n- **UI decoupled from MyMesh** — MeshCore v1.18 introduced a listener interface; FieldMesh's message handling (history only when the app is not connected, online node counter, SOS detection, favourites, advert refresh on RECENT/TRACKING) moved from `MyMesh.cpp` into the UI (`ui-new` and `ui-orig`). `MyMesh.cpp` is now much closer to upstream\r\n- **Off-Grid return parameters** are stored in their own JSON object `\"fm\"` in the settings file and migrated from V5.x\r\n- **GPS flag of adverts** is now passed via `BaseChatMesh::lastAdvertHasLatLon()` instead of bit 4 (`0x10`) in `contact.type` — `contact.type` is no longer modified, the three masking points are gone\r\n- **Static BLE PIN** moved to `main.cpp` (upstream moved the PIN logic there)\r\n- Off-Grid uses the upstream radio wrapper call `radio_driver.setParams()` (upstream removed `radio_set_params()`)\r\n- Splash screen shows \"v6\"\r\n\r\n### Bug Fixes\r\n\r\n- **Room server login with GPS adverts** — a room server whose last advert contained GPS had `type = 0x13` instead of `0x03` (bit 4), so the login was sent in the wrong format; fixed by the new GPS flag approach\r\n- **Favourite detection with a full contact list** — `isSenderFavorite()` now also checks the last 8 contacts (upstream added 8 reserved slots at the start of the contact table)\r\n- **CLI text messages** (`TXT_TYPE_CLI_COMMAND`, new in upstream) are not shown in the message history\r\n- `_msgcount` is now initialised in `UITask` (`ui-new`)\r\n\r\n### Updating from V5.x\r\n\r\n- Contacts and channels are kept (file format unchanged)\r\n- Settings are migrated to `/prefs.json`; the old `/new_prefs` file is left in place, so going back to V5.x restores the settings as they were before the update\r\n- New home screen page: page indicator shows one more dot\r\n\r\n\r\n# Download latest build\r\n## EU Offgrid frequency\r\n[ThinkNode_M1_companion_radio_ble_FieldMeshv6.0.zip](https://github.com/user-attachments/files/33626688/ThinkNode_M1_companion_radio_ble_FieldMeshv6.0.zip)\r\n[WioTrackerL1_companion_radio_ble_FieldMeshv6.0.zip](https://github.com/user-attachments/files/33626696/WioTrackerL1_companion_radio_ble_FieldMeshv6.0.zip)\r\n[t1000e_companion_radio_ble_FieldMeshv6.0.zip](https://github.com/user-attachments/files/33626699/t1000e_companion_radio_ble_FieldMeshv6.0.zip)\r\n\r\n\r\n## US Offgrid frequency\r\n[ThinkNode_M1_companion_radio_ble_USFieldMeshv6.0.zip](https://github.com/user-attachments/files/33626700/ThinkNode_M1_companion_radio_ble_USFieldMeshv6.0.zip)\r\n[WioTrackerL1_companion_radio_ble_USFieldM\n…"
