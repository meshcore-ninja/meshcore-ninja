  - version: v0.4.1
    name: v0.4.1 OTA update
    datetime: '2026-09-11T02:58:12Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.4.1
    prerelease: false
    notes: "You can now update the firmware over wifi or by downloading the firmware.bin file to your sd card. \r\nTo update just run the Firmware app in settings and update whenever you need without having to reflash the firmware!\r\nAlso included are module network imports, doom now has multiplayer!\r\nA flash screen now shows on startup so you are no longer left waiting."
  - version: v0.4.0
    name: v0.4.0 protocol agnostic update
    datetime: '2026-09-06T05:50:39Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.4.0
    prerelease: false
    notes: "this update focuses on breaking the lora radio protocol out from the base firmware. \r\nit is now loaded from an elf on startup. the meshcore protocol is still included with the firmware! \r\nadditional protocols can be downloaded from the App Library. in order to use a new protocol you will also need the apps that go along with it. \r\nyou can swap to any protocol with a quick reset to customize your experience and explore whatever mesh you want. \r\ninstalled protocols have their own app category where you will find the messenger app and settings apps for each protocol."
  - version: v0.3.7
