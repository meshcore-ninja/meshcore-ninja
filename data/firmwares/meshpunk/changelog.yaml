    datetime: '2026-08-24T17:18:41Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.7
    prerelease: false
    notes: "You can now take screenshots using a keyboard or the on screen gamepad in module games or using the screenshot app in lua.\r\nAdded a easy type mode for the on screen keyboard. press the keyboard button on the bottom left to cycle to easy type mode.\r\nEasy type features larger buttons as well as entry confirmation."
  - version: v0.3.6
    name: v0.3.6 power menu update
    datetime: '2026-08-22T21:23:14Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.6
    prerelease: false
    notes: "There is now a power menu available in by pressing the battery area in the top bar or by going to the settings.\r\nThere is a standby, a shutdown, and a restart option. \r\nStandby auto activates after a set amount of time which preserves battery power. this can be turned off in the power menu.\r\nIn the background i have updated lua to 5.5 which should improve a few things.\r\nThe ble sync cap should now be correctly applied. anyone updating may need to adjust their sync cap in the wireless settings."
