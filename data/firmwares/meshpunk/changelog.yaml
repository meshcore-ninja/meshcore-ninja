releases:
  - version: v0.4.0
    name: v0.4.0 protocol agnostic update
    datetime: '2026-09-06T05:50:39Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.4.0
    prerelease: false
    notes: "this update focuses on breaking the lora radio protocol out from the base firmware. \r\nit is now loaded from an elf on startup. the meshcore protocol is still included with the firmware! \r\nadditional protocols can be downloaded from the App Library. in order to use a new protocol you will also need the apps that go along with it. \r\nyou can swap to any protocol with a quick reset to customize your experience and explore whatever mesh you want. \r\ninstalled protocols have their own app category where you will find the messenger app and settings apps for each protocol."
  - version: v0.3.7
    name: v0.3.7 screenshots
    datetime: '2026-08-24T17:18:41Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.7
    prerelease: false
    notes: "You can now take screenshots using a keyboard or the on screen gamepad in module games or using the screenshot app in lua.\r\nAdded a easy type mode for the on screen keyboard. press the keyboard button on the bottom left to cycle to easy type mode.\r\nEasy type features larger buttons as well as entry confirmation."
  - version: v0.3.6
    name: v0.3.6 power menu update
    datetime: '2026-08-22T21:23:14Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.6
    prerelease: false
    notes: "There is now a power menu available in by pressing the battery area in the top bar or by going to the settings.\r\nThere is a standby, a shutdown, and a restart option. \r\nStandby auto activates after a set amount of time which preserves battery power. this can be turned off in the power menu.\r\nIn the background i have updated lua to 5.5 which should improve a few things.\r\nThe ble sync cap should now be correctly applied. anyone updating may need to adjust their sync cap in the wireless settings."
  - version: v0.3.5
    name: v0.3.5 heltec v4 r8 expansion v2 support
    datetime: '2026-08-18T16:14:12Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.5
    prerelease: false
    notes: "Added full support for the heltec v4 r8 with the v2 expansion.\r\nImplemented on screen keyboard and gamepad.\r\nImage decoding and bridge for jpgs as well as the image viewer app.\r\nRead me app update with dynamic per device text and per app read me pages."
  - version: v0.3.4
    name: v0.3.4 launcher fix
    datetime: '2026-08-08T02:10:27Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.4
    prerelease: false
    notes: "this release has 2 major components.\r\nthe launcher fix renamed the file partition to assets from spiffs.\r\nthe other is that all the device specific code has been moved to there own modules. modules are built together per device type."
  - version: v0.3.3
    name: v0.3.3
    datetime: '2026-08-06T22:43:15Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.3
    prerelease: false
    notes: "Raw packet capture as well as packet ability to save a file of of packets logged.\r\nnew Packet app in tools\r\nall module apps now use a single key binding lib\r\nlua wifi, ble shutdown bindings"
  - version: v0.3.2
    name: v0.3.2 alpha - legacy keyboard support
    datetime: '2026-07-31T04:47:24Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.2
    prerelease: false
    notes: "Legacy t-deck keyboard support.\r\nOlder model t-decks have a different keyboard firmware from the newer ones.\r\nOnce 3 inputs have been detected the on an older firmware it will switch over to legacy keyboard mode.\r\nThis is persistent but a new setting is in devices if you ever update your keyboard firmware.\r\nIt will limit the keyboard to single key presses only so none of the combo options will work."
  - version: v0.3.1
    name: 'v0.3.1 alpha '
    datetime: '2026-07-30T04:33:04Z'
    url: https://github.com/PhilMo6/meshpunk/releases/tag/v0.3.1
    prerelease: false
    notes: "ble app connection sync limits.\r\nset how many messages back you want to sync when you connect with your phone. \r\nmuch faster sync time with large number of messages when set. \r\nupdated firmware for more compatibility with elf loading."
  - version: v0.3.0
    name: v0.3.0 alpha
