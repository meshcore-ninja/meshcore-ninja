  - version: mishmesh-v1.3.0
    name: mishmesh Firmware v1.3.0
    datetime: '2026-08-21T18:51:01Z'
    url: https://github.com/burakcan/MeshCore-mishmesh/releases/tag/mishmesh-v1.3.0
    prerelease: false
    notes: >-
      **Now built on meshcore v1.17.1** (was v1.16.0)


      - Active repeater/sensor discovery, from the Discover tab in Contacts.

      - Repeat alert: a chat's notification tone replays while a message is unread.

      - System Info now shows the MCU temperature, on boards that report it.

      - Fix: contact rows could show the wrong node, or drop the last few contacts.

      - Fix: a bug causing failed retries to never drop and retry indefinitely




      **Full Changelog**:
      https://github.com/burakcan/MeshCore-mishmesh/compare/mishmesh-v1.2.0...mishmesh-v1.3.0
  - version: mishmesh-v1.2.0
    name: mishmesh Firmware v1.2.0
    datetime: '2026-07-27T16:37:02Z'
    url: https://github.com/burakcan/MeshCore-mishmesh/releases/tag/mishmesh-v1.2.0
    prerelease: false
    notes: >-
      - Pomodoro timer added to the Clock app.

      - "Wake screen on message" configuration (global + per-chat override).

      - Battery settings panel with battery display style (gauge, percentage, voltage) and ADC
      calibration.

      - Screen brightness control (thanks @Bjorkan).




      ## What's Changed

      * Add persistent screen brightness control to MishMesh by @Bjorkan in
      https://github.com/burakcan/MeshCore-mishmesh/pull/10



      **Full Changelog**:
      https://github.com/burakcan/MeshCore-mishmesh/compare/mishmesh-v1.1.0...mishmesh-v1.2.0
  - version: mishmesh-v1.1.0
    name: mishmesh Firmware v1.1.0
    datetime: '2026-07-17T20:44:45Z'
    url: https://github.com/burakcan/MeshCore-mishmesh/releases/tag/mishmesh-v1.1.0
    prerelease: false
    notes: >-
      - Configurable path hash size, in Experimental settings.

      - System Info now shows the node's public key.

      - Piezo buzzer tone tuning.

      - Release firmware filenames now encode both versions:
        `<env>_mm-<mm>_mc-<mc>-<hash>`.
      - Fix: empty preference file no longer causes a load error.

      - Fix: multibyte path hashes are now stored and displayed correctly.




      ## What's Changed

      * Fix multibyte path hash handling in MishMesh by @Bjorkan in
      https://github.com/burakcan/MeshCore-mishmesh/pull/9


      ## New Contributors

      * @Bjorkan made their first contribution in
      https://github.com/burakcan/MeshCore-mishmesh/pull/9


      **Full Changelog**:
      https://github.com/burakcan/MeshCore-mishmesh/compare/mishmesh-v1.0.0...mishmesh-v1.1.0
