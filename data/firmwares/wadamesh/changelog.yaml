      at the end; the settings blob is a raw byte copy, so every later value shifted by one on
      upgrade. The worst casualty: the remote-mode flag inherited a neighbouring value that an old
      migration forces to 1 on every install — so upgraded devices enabled Remote Mode without
      consent, which renders the interface off-screen for a browser and stops drawing to the
      physical panel. From the outside that looked like a device frozen on a half-drawn boot logo,
      on the T-Display P4 as much as the Pager. The map's developer debug overlay switched on the
      same way, and a chat-history safety flush was silently disabled.


      Independently found, byte-for-byte analysed, and fixed by **@PixPMusic** (#229, #230) —
      including compile-time guards that make this class of mistake a build error from now on, and a
      test suite over the migration paths. Affected devices repair themselves on this update: a
      normal install, no erase. On devices that ran beta_57, the repaired settings (web control
      panel, remote mode and its orientation, web terminal, map debug overlay, history-flush tuning)
      return to their defaults — the pre-beta_57 values were overwritten and cannot be recovered.
      Everything else, including your language, radio settings and per-chat history limits, is
      preserved. Devices coming straight from beta_56 or older upgrade losslessly.


      ### Auto-retry is now opt-in


      beta_57 turned "retry sends until heard" on for everyone. That choice should be yours: it now
      defaults **off**, and the toggle lives in **Settings → Radio & Mesh** if you want your sends
      retransmitted until the mesh confirms them.


