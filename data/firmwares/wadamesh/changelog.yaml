      ## T-Display P4: two measured hardware fixes


      **The P4 was transmitting at roughly a twentieth of its rated power.** It never exceeded about
      **+14.1 dBm** however high you set it, and the steps stopped tracking near the top. The SX1262
      needs ~118 mA to deliver +22 dBm, but its over-current protection was left at the chip default
      of 60 mA, so the amplifier was current-limited long before reaching the requested power. Every
      S3 board has always set this; the P4 was the one target that never did. Found by @wb6zsu on an
      HP E8285A test set, and confirmed independently by @stephen-62
      ([#283](https://github.com/ALLFATHER-BV/wadamesh/issues/283)).


      **The P4 battery percentage now comes from the fuel gauge**, not from terminal voltage. The
      BQ27220 coulomb-counts against its learned pack profile and knows the real state of charge;
      voltage is charger-driven, which is why it pinned at 100% the instant USB went in, sat under
      100% on a rested full pack, and once read 71% on a pack Meck-P4 measured at 11%. Calibrating
      "this is full" while charging baked that error in permanently. Reported by @D-Melhede and
      @wb6zsu ([#273](https://github.com/ALLFATHER-BV/wadamesh/issues/273)).


      ⚠️ This does **not** cover charging itself or the red/green charge LED — those are the BQ25896
      charger, which we do not talk to yet. That half of #273 stays open.


      ## The map was hiding your newest contacts


      The marker array held 32 entries with one reserved for self, so **31 contact dots was the
      ceiling** — and the loop stopped there silently while the counter in the corner kept counting
      every positioned contact. Because contacts are appended and the loop walks in order, the dots
      that never got drawn were always the newest ones.


      Ceiling is now **256**, and if it is ever reached the counter says "31 of 45 on map" rather
      than quietly disagreeing with the screen. **Map options → "Max dots"** (default All) is there
      for anyone who wants to cap it.


      ## A crash on the home screen


      From a coredump a user sent in. Boards with the Expansion Kit were reading the BME280 over I2C
      **on every home-screen refresh, about once a second**, on the UI thread. Adafruit reads it
      with a repeated start, and if that sequence stalls, Arduino's `TwoWire` is left holding a lock
      it then tries to release from the wrong task — FreeRTOS asserts and the device reboots. The
      reading is now cached and refreshed at most every few seconds.


