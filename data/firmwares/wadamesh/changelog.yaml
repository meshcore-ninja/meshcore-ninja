      ## wadamesh beta_54 — test build


      **T-Display P4 owners: this is the one.** The whole-screen blue flash (#167) is fixed, and GPS
      actually works now.


      Flash or update via **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (Beta toggle),
      the on-device updater ("Get test builds"), or the LauncherHub WADAMESH BETA entry.


      ### T-Display P4

      - **Screen flash fixed (#167).** Root cause, established by on-device measurement: SD-card
      write bursts delay the interrupt that re-arms the display's frame DMA — the panel shows the
      late frame as a blue flash (35–39 ms gaps against a 20 ms cadence, one-for-one with card
      transactions). The hot store (contacts, channels, chat history) now lives on fast internal
      storage; the SD carries map tiles, backups and exports. Your data migrates automatically on
      first boot — the card is left untouched as a rollback.

      - **Card independence:** the SD card no longer holds your identity — swapping or removing it
      can never change your node or lose contacts.

      - **GPS fixed for real.** The sensor loop was never serviced on this board, so the firmware
      never read the GPS module at all. Confirmed fixing outdoors.

      - **Live satellite page:** in view / in use / signal strength, updating while open.

      - Storage writes run on a dedicated worker task — no more UI stutter on big saves.


      ### Romanian — by @jcyrio (#188, #189)

      Romanian is the 13th UI language, with a proper keyboard layout: **ă** on the home row,
      **ş/ţ** on the deck, **â/î** via the accent popups. Mulţumim!


      ### Heltec V4-R8

      - **Landscape touch fixed** (was point-mirrored — the R8's panel baseline differs from the
      V4's, and the touch mapping assumed the V4). If you got stuck in landscape: this build boots
      back to portrait automatically.

      - For safety the R8 returns to portrait on every boot until a tester confirms the corrected
      mapping — please try landscape and report.


      ### General

      - Airtime + Snake apps: crash fix on close.


