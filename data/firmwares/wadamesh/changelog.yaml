    prerelease: true
    notes: >-
      **Test build.** Stable stays
      [beta_63](https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_63).


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** with the Beta toggle on,
      or on-device via **Settings → Firmware** with "Get test builds (beta)" enabled.


      Mostly a follow-up to beta_64: two things testers hit within hours, one feature request, and a
      documentation correction that was overdue.


      ---


      ## Updating no longer strands you on "LoRa radio not detected"


      Reported on a T-Deck immediately after taking beta_64. On boards where the radio sits behind a
      peripheral power switch, an update ends in a **software** reset — which releases that switch,
      collapses the rail, and then the firmware checks for the radio before it has finished powering
      back up. So the first boot after an update could dead-end on the fatal error screen, and the
      only way out was to power-cycle by hand.


      The firmware now does that power-cycle itself and probes again. It only runs when the
      alternative is halting on the error screen, so a board that comes up normally never executes
      any of it.


      ## Back no longer opens the status bar too


      Leaving an app by the "‹" went back **and** pulled the dropdown open — one tap doing two
      things. The bar closes an app page on touch-down (so a dropped tap can't trap you on a
      touch-only board), and the click that followed the same tap was falling through to the
      control-center toggle. Harmless while that behaviour was limited to one page; wrong for every
      app page since beta_49. Thanks @Istvan.


      ## Share your position without broadcasting it


      Until now the only way to share position was to put it in your advert — broadcast in the clear
      to every node in range, indefinitely. MeshCore can instead answer position **on request**,
      encrypted to the contact that asked, and only for contacts you chose. Almost all of that was
      already implemented and simply had no way to switch it on.


      - **Settings → Mesh → "Share my location when asked"** — Never / Chosen contacts only / Anyone
      who asks.

      - **A contact's own menu → "Share my loc"** — grant it, and take it back from the same place.


      Nothing is broadcast; it is sent only when that contact asks. No protocol change, so it
      interoperates with the MeshCore app and other MeshCore nodes. Requested by @janmashat
      ([#266](https://github.com/ALLFATHER-BV/wadamesh/issues/266)).


      ## If you tried to write a Lua app and gave up — try again


      The SDK page at **[wadamesh.com/sdk.html](https://wadamesh.com/sdk.html)** was wrong about the
      very first thing an app author does. It said to define your callbacks as globals named
      `on_start` / `on_stop`. The firmware has never called those: an app is a table you build and
      `return`, with `on_open`, `on_tick`, `on_input`, `on_message`, `on_close`.


      Following the published example gave you an app where **nothing ran and nothing was reported**
      — a blank screen with no error. If that happened to you, it was the documentation, not you. It
      is corrected now, along with `ev.key` (the page named a field that does not exist) and the
      real `label` / `button` signatures.


      The page also now documents everything beta_64 added: the clock, buzzer, battery, GPS, per-app
      file storage, sending and receiving mesh messages, and the permission model behind the last
      two.


      ## Store fixed


      The app and language Store is served from a path nothing was publishing to. Translations sat
      at an older version than the ones in the project, and an app published to the catalog never
      appeared at all. Fixed — the Hungarian, German and Dutch updates are live, along with the
      **SDK Test** app, which exercises every SDK call and reports pass/fail per line.


      ---


      **Boards:** Heltec V4 TFT · Heltec V4-R8 TFT · LilyGo T-Deck · T-Lora Pager (LR1121 / SX1262)
      · ThinkNode M9 · RAK TAP v2 · Attaky Mesh Series · LilyGo T-Display P4 (AMOLED + LCD).


      Use `-merged.bin` for a fresh install at offset 0x0; the plain `.bin` is the app-only image
      for OTA and the Launcher.
