      ### Open-licensed fonts, by @PixPMusic (#198)


      The bundled fonts are rebuilt from their OFL sources. The set shipped before this was
      generated from a proprietary system font, which was never ours to redistribute — the firmware
      is GPL, so that needed correcting whether or not anyone had noticed. Glyph shapes shift very
      slightly; nothing else about the text changes.


      ### Accented and non-Latin characters render everywhere again


      The rebuilt fonts carry their extended coverage in a fallback chain, and roughly eighty labels
      across the interface pinned a base font directly rather than the chained one. On those, an ä,
      a Hungarian ő or a Cyrillic character came out as an empty box while the identical string
      rendered fine one screen over. Every label now takes the chained font, verified by a static
      sweep of the UI source rather than by eye. Surfaced while checking @pisti87's Hungarian
      translation.


      ### The Heltec V4 no longer locks up when its contact list is full (#222)


      Once the contact table is full, every advert from an unknown node evicts the oldest contact —
      and the firmware deleted that contact's stored record on the spot, on the receive path. On the
      V4 that store is internal flash, where a delete can trigger a garbage-collection pass, and
      such a pass suspends the flash cache and stalls **both** processor cores: the whole device
      goes dead, Bluetooth and TCP drop, the screen will not wake, and it comes back on its own a
      moment later. It got steadily worse the fuller the list was — degrading around 350 contacts,
      locking hard by 600, constant at 2000.


