  - version: beta_58
    name: wadamesh beta_58
    datetime: '2026-08-04T09:08:26Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_58
    prerelease: true
    notes: >-
      Test build. Stable stays **beta_50**.


      **Update strongly recommended if you ran beta_57** — this fixes the upgrade bug that left
      devices booting into remote mode with the screen frozen on the boot logo.


      Flash it from **https://flasher.wadamesh.com** (flip the Beta toggle), or on-device via
      Settings → Firmware with "Get test builds (beta)" enabled.


      ---


      ### The beta_57 upgrade bug


      Updating from beta_56 to beta_57 corrupted part of the stored settings. beta_57's new retry
      preference was inserted into the middle of the persisted settings layout instead of appended
      at the end; the settings blob is a raw byte copy, so every later value shifted by one on
      upgrade. The worst casualty: the remote-mode flag inherited a neighbouring value that an old
      migration forces to 1 on every install — so upgraded devices enabled Remote Mode without
      consent, which renders the interface off-screen for a browser and stops drawing to the
      physical panel. From the outside that looked like a device frozen on a half-drawn boot logo,
      on the T-Display P4 as much as the Pager. The map's developer debug overlay switched on the
      same way, and a chat-history safety flush was silently disabled.


      Independently found, byte-for-byte analysed, and fixed by **@PixPMusic** (#229, #230) —
      including compile-time guards that make this class of mistake a build error from now on, and a
      test suite over the migration paths. Affected devices repair themselves on this update: a
      normal install, no erase. On devices that ran beta_57, the repaired settings (web control
      panel, remote mode and its orientation, web terminal, map debug overlay, history-flush tuning)
      return to their defaults — the pre-beta_57 values were overwritten and cannot be recovered.
      Everything else, including your language, radio settings and per-chat history limits, is
      preserved. Devices coming straight from beta_56 or older upgrade losslessly.


      ### Auto-retry is now opt-in


      beta_57 turned "retry sends until heard" on for everyone. That choice should be yours: it now
      defaults **off**, and the toggle lives in **Settings → Radio & Mesh** if you want your sends
      retransmitted until the mesh confirms them.


      ### Magyar


      Hungarian translation across the full interface, contributed by **@pisti87** (#227). Existing
      language choices are preserved across the update. Köszönjük!


      ### Fixes


      - **The lock screen finally says WADAMESH.** The old MESHCOMOD was baked into the wallpaper
      image itself rather than drawn as text, so the earlier branding fix missed it — both the
      built-in wallpaper and the copy seeded to storage are replaced. Reported by **@smhawkes**
      (#228).

      - **T-Display P4: profile export and backups work again.** The backup writer still pointed at
      the storage system beta_54 retired, so every save failed with "can't open file" — the backup
      list and restore were equally affected. Reported by **@D-Melhede** (#231).


      ---


      Both P4 panel variants are built fresh for this tag: `wadamesh-tdisplay-p4*` (AMOLED) and
      `wadamesh-tdisplay-p4-lcd*` (TFT-LCD).


      Full notes: `release-notes/beta_58.txt`.
  - version: beta_57
    name: wadamesh beta_57
    datetime: '2026-08-03T15:18:09Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_57
    prerelease: true
    notes: >-
      Test build. Stable stays **beta_50**.


      Flash it from **https://flasher.wadamesh.com** (flip the Beta toggle), or on-device via
      Settings → Firmware with "Get test builds (beta)" enabled.


      Most of this beta is contributed work: **@PixPMusic** (storage and Pager fixes) and
      **@mikecarper** (the new send retry). Thank you both.


      ---


      ### Sends retry until the mesh has heard them


      Until now a message was transmitted exactly once. If that single transmission collided with
      other traffic or a repeater was mid-hop, it was simply gone — the app showed it as sent, the
      mesh never saw it. Built by **@mikecarper** (#207): the device now listens for evidence its
      message went out (a repeater echoing it, or the delivery ACK) and retransmits on a growing
      backoff until something confirms it was heard — direct and flood sends alike, including sends
      from the phone app. If you prefer the old single-shot behaviour, there is a new toggle under
      **Settings → Radio & Mesh → "Retry sends until heard"** (on by default).


      ### Saving settings on SD storage was broken


      If your device stores data on the SD card (T-Deck, V4-R8, Pager, Launcher installs), every
      settings save has been failing with "Couldn't save name to storage" and quietly surviving only
      through a recovery file. The commit step renamed a file onto itself because both rename
      arguments shared one path buffer, so it could never succeed. Found and fixed by **@PixPMusic**
      (#211).


      Two more storage fixes from the same series: watchdog state is now preserved around long
      SD/flash work instead of being blindly re-armed afterwards, which removes a cause of spurious
      watchdog reboots (#213), and preference reads no longer hand out pointers into a shared cache
      that another task could invalidate mid-read (#212).


      ### Pager radio: the oscillator voltage was wrong


      The SX1262 T-Lora Pager drove its radio oscillator at a generic 1.6 V fallback; LilyGo's own
      reference code uses 3.0 V for this exact board. The result was a weak link — transmissions
      nearby nodes missed, ACKs that never arrived. **@PixPMusic** confirmed on hardware that the
      voltage was the difference (#209).


      ### Fixes


      - **Discover froze when a node name contains an emoji or a `#`.** The scanner list colours
      each row with text markup, and a name cut mid-emoji (or a stray hash) broke that markup for
      every row after it — the list looked frozen from that point on. Names are now cleaned and
      escaped before display, here and in the message-info repeat list. Reported by **@4nuts** with
      the exact culprit name, "Ouderkerk☀️" (#223).

      - **Formatting an SD card on the V4-R8 or ThinkNode M9 hung forever.** The Format button
      exists on both boards, but the code that performs the format was only compiled for the T-Deck
      — the "this can take up to a minute" notice stayed up with nothing running behind it, and the
      card stayed unusable until a reboot. Reported by **@TrustYourTechnoLust** (#172).

      - **Files-app Copy/Paste silently did nothing except on the T-Deck** — same root cause as the
      format hang, fixed the same way.


      ---


      Both P4 panel variants are built fresh for this tag: `wadamesh-tdisplay-p4*` (AMOLED) and
      `wadamesh-tdisplay-p4-lcd*` (TFT-LCD).


      Full notes: `release-notes/beta_57.txt`.
