  - version: beta_61
    name: wadamesh beta_61
    datetime: '2026-08-10T11:15:20Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_61
    prerelease: true
    notes: >-
      Test build. Stable stays **beta_50**.


      **If you are on beta_60, update.** It shipped with three regressions from the MeshCore 1.17
      rebase, all fixed here. Flashing beta_61 over the top is enough — nothing needs erasing, and
      no data was lost in any of them.


      Flash it from **https://flasher.wadamesh.com** (flip the Beta toggle), or on-device via
      Settings → Firmware with "Get test builds (beta)" enabled.


      ---


      ### The beta_60 regressions


      **Boot loop on an empty contact list** (#249). A device with no contacts saved — a fresh
      install, an erase-and-flash, or a card that had not mounted yet — crashed during startup and
      rebooted forever. 1.17 reserved eight slots at the head of the contact table and claimed them
      before the table was allocated, so a new startup routine walked a null pointer. Every board on
      our bench had contacts on it, which is exactly why this got past testing; the release process
      now checks that case. Reported by @Pierre747 and @rustinmyeye, whose boot log is what cracked
      it.


      **The newest contacts were unreachable** (#252). Same reserved slots, different consequence:
      the contact list, the action sheets and the phone-app sync were still counting from the old
      start of the table, so the eight most recently added contacts could not be shown or acted on.
      A contact you had just added was invisible, and a room server's **Log in** silently did
      nothing because it resolved to an empty reserved slot. Nothing was lost — those contacts were
      in the table the whole time. Reported by myshoeisonfire.


      **The T-Display P4 could send but never receive** (#253). No channel messages, no delivery
      confirmations, no adverts, RX counters flat at zero — while the Monitor app still showed
      signal, because it talks to the radio directly. The P4 is the one board whose radio interrupt
      is not wired to the processor, so it has to ask the radio over SPI whether a packet arrived.
      That polling code was never in the repository — it lived only in a generated directory that
      gets rebuilt — so the 1.17 rebase erased it. It is rewritten and now version-controlled, with
      a build-time check so it cannot vanish again. Reported by @D-Melhede.


      ### Also fixed


      - A contact that changes its node name no longer leaves two chat threads behind. The thread is
      matched by key, but its title was never updated, while incoming messages are filed by sender
      name — so the first message after a rename started a second thread. Reported by
      myshoeisonfire.

      - Release builds now derive the firmware version, build date and core version from the release
      itself, and a release **aborts** if any board's image does not carry its own tag. beta_60
      reported `v1.16.0-touch` in About because that value was maintained by hand.

      - All 13 language files gained the 48 UI strings none of them had, so those stop being
      permanently English and translators can see the gaps. New tool `scripts/build/audit-lang.py`
      reports drift in both directions.


      ### Known, not fixed here


      The intermittent T-Lora Pager crash (#233, #251) is still open. Both dumps decode to a freed
      LVGL callback — the same underlying fault seen from two angles — and @PixPMusic's #234
      restructures exactly that teardown. It is not a 1.17 regression and predates beta_60.
  - version: beta_60
    name: wadamesh beta_60
    datetime: '2026-08-09T16:19:17Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_60
    prerelease: true
    notes: >-
      Test build. Stable stays **beta_50** — but this one is different: **beta_60 is the build we
      want to promote to stable as soon as it proves itself**, so tester feedback matters more than
      for any beta before it.


      The reason: **the MeshCore core under wadamesh moved from 1.16 to 1.17.** Every board in this
      release is rebased on the new core — mesh routing, the seen-packet tables, radio drivers and
      the companion protocol are all the current upstream generation, with our buffered LoRa receive
      path carried over on top.


      **If you run betas, please run this one as your daily build** and report anything that behaves
      differently from beta_59 — radio range, message delivery, room servers, battery life, phone
      pairing. Nothing you can send helps more right now than "ran it for two days, here is what
      changed". Once feedback clears it, beta_60 becomes the new stable so every new user starts on
      the 1.17 core.


      Flash it from **https://flasher.wadamesh.com** (flip the Beta toggle), or on-device via
      Settings → Firmware with "Get test builds (beta)" enabled.


      ---


      ### MeshCore 1.17


      The whole core is the current upstream generation. Two things are worth knowing beyond
      "everything underneath is newer":


      - **Channel activity detection (listen-before-talk) groundwork is in.** The radio can check
      the channel is clear before transmitting. It ships **disabled** in this build while upstream
      finishes making it configurable — a Radio & Mesh toggle follows in a later beta.

      - **Our local core additions survived the rebase** — buffered LoRa receive (the drain task and
      the heard/read/late counters in About) is intact on 1.17.


      About now reports **v1.17.0-touch**.


      ### Fixes


      - A white frame around the boot logo in the first seconds after power-on — a 1.17 side effect
      caught on the bench: the early boot screen let the new core pick its background instead of
      forcing black.

      - A LoRa radio that fails to start now says so on screen — "LoRa radio not detected", with a
      hint to check the module — instead of a silent boot with the only clue on serial (#244).

      - Messages retried from the failed state appear in the open chat immediately, not after
      reopening it (#248).

      - **Favorites survive the contact-table cleanup.** The star only lived in the touch UI's
      records, so the core's eviction could silently drop a starred contact when the table filled;
      the star is now written through to the core's contact flags, which skip favorites (#178).

      - Settings saves skip writes when nothing changed, ending bursts of identical snapshot writes
      to flash (#246).

      - The Files app shows each file's modified date and time (#185).

      - Discover rows show the distance to a node when both sides have a position fix (#239).

      - The Store no longer offers a language "update" that is older than the installed one (#247,
      #232).

      - The long-press accent picker gained æ/Æ on the A key for Danish and Norwegian (#237).


      ### Community


      The T-Pager stack in this release is by **@PixPMusic** — four merged PRs:


      - **Wi-Fi/BLE coexistence** (#210): enabling Wi-Fi no longer reboots the board, BLE bonds
      survive the handoff so the phone re-pairs without deleting the device, and BLE returns
      automatically when Wi-Fi is unavailable.

      - **SD arbitration + map tiles** (#206, #221): SD access from different parts of the firmware
      no longer collides on the shared bus, and map tiles load reliably from the card.

      - **Lock-screen brand mark** (#235).


      Hungarian is at **v9** — a full sweep by **@pisti87**, with the one punctuation glyph our
      fonts lack swapped for its typographic twin.
