      ### Lua apps


      An app is a single `.lua` file. It installs from the Store, appears in the app drawer beside
      the built-ins, and updates when a newer version lands in the catalog — no firmware flash
      involved.


      **Store** lives in the app drawer, with three tabs:


      - **Apps** — install, update or remove what the catalog offers.

      - **Built-in** — hide the stock apps you never open, so the drawer holds what you actually
      reach for. The MQTT bridge is hidden by default now.

      - **Languages** — download translations (see below).


      **RF Monitor** and **Airtime** are Lua apps rather than firmware pages, and they gained things
      the native versions never had: RF Monitor scrolls the full packet list, Airtime has proper
      Y-axis labels and a Reset button. **Snake** is a Lua app too. Removing one really removes it;
      reinstalling brings it back with your scores intact.


      **Write your own.** Drop a bare `.lua` file into `/apps/` on the card and it appears in the
      drawer — no manifest needed. The API is about thirty functions covering the screen, input,
      read-only mesh data, an HTTP fetch and a little per-app storage.


      📖 **API reference: https://wadamesh.com/sdk.html**


      Two constraints worth knowing up front. The mesh is **read-only** in v1 — an app can read
      contacts, the packet log and radio statistics, but cannot transmit; a buggy or hostile app
      must not be able to put packets on the air in your name. And `http_get` is plain HTTP, because
      after Wi-Fi associates there is not enough internal heap left for a TLS handshake on the
      smaller boards.


