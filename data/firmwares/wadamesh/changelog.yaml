      ---


      ## The Heltec V4 freeze, properly this time


      V4 units that froze whenever a new contact arrived are fixed, and **both reporters have
      confirmed it on their own devices**. beta_62 moved one storage delete off the packet path,
      which helped but left the larger half in place.


      A contact record is 152 bytes and the table holds up to 2000 of them, so saving contacts
      rewrote the entire **304 KB** file on every change, and the crash-safe write keeps a second
      copy of the same size beside it during the swap. Roughly **600 KB of flash churn because one
      contact changed**. On a card-less board that lands on internal flash, whose garbage collection
      suspends the flash cache and stalls **both CPU cores**. That is why the whole device went away
      rather than dropping a packet.


      But the table never changes in bulk: replacing the oldest contact overwrites one slot, and
      hearing from a known node touches one entry. So each record is now compared against what is
      stored and only the differences are written back. **A new contact replacing an old one writes
      152 bytes instead of 304,000**, and a save with nothing to change writes nothing at all. Every
      patched record is read back and compared, and on any disagreement the firmware falls through
      to the old whole-file write, so your contact list cannot end up half-written by the new path.


      Thanks to @Yoss101 and @pisti87 — and particularly to @Yoss101 for coming back to say a first
      fix had only half worked, which is the report that found the rest of it.


      ## Apps can do much more, and now ask permission


      Lua apps gained the real date and time, the buzzer, battery state, GPS position, a scoped and
      rate-limited private folder each, hardware key presses, and the ability to send mesh messages
