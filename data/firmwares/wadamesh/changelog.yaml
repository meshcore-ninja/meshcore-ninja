    prerelease: false
    notes: >-
      **Stable.** This is the same build as the beta_101 test release, promoted unchanged, and it
      replaces beta_85 as the recommended version.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)**, or update on the device.


      Sixteen builds went into this one, beta_86 through beta_101, and everything below is in it. It
      is the biggest step wadamesh has taken: a new interface, colour themes, a Home made of
      widgets, MeshCore 1.18, a repeater admin app, the whole UI in a browser, and a long list of
      fixes, many of them from the community.


      Much of it is community work: **@oumike** sent more than thirty pull requests across nearly
      every board, **@MrYoshii** brought the T-LoRa Pager to life, and **@TerryTel93**,
      **@samuelcoustet**, **@jcyrio**, **@Confituurke** and many others added features, apps, boards
      and translations. The full thank-you is at the end.


      ## Read this first if you are coming from beta_85


      - **The whole interface is redesigned**, and many things have moved: the status bar, Chats,
      the conversation screen, the lock screen, the screensaver, Home, Settings and notifications.
      The sections below say where things went.

      - **Home is made of widgets now**, and Glance is the layout you get after the update. Your old
      Home is still there as the **Commander** preset, in Settings > Display > Home.

      - **Colour settings moved to a new Theme page.** Appearance, High contrast, the accent colour,
      Colourful chat bubbles and Compact messages are no longer under Display. MORE COLORS! is
      switched on for everyone in its Regular style, and an aurora in your accent colour sits behind
      every screen; turn either off on the Theme page for a calmer look.

      - **Make a fresh settings backup after updating.** Backups made with beta_85 or earlier were
      written as invalid JSON and cannot be imported again. New ones are valid, carry the screen and
      app preferences the old ones were missing, and are named `meshcore-backup-<date>`.

      - **Chat history on a busy device could stop saving without a word.** Once the history reached
      its 24 files, a reboot left every new message in memory only, gone at the next restart. Full
      files are now merged to make room, a new file is opened when they cannot be merged, and no
      message is ever dropped to keep saving. Messages lost that way before the update cannot be
      recovered.

      - **T-Deck trackball: Scroll is the default now**, and a trackball set to Cursor is moved to
      Scroll once by the update. Hold the trackball still for about half a second to switch.

      - **The screensaver also runs on battery**, for 15 seconds after the screen timeout by default
      (Settings > Display > On battery, show it for). The old "Only while charging" option is gone.

      - **Boards without a GPS take up to 5 seconds longer to boot**, because MeshCore 1.18 waits
      longer for a GPS to answer. A device with no clock source starts from 1 March 2026 instead of
      May 2024.

      - **Heltec V4:** to make room for everything else, Snake is its only built-in game (2048,
      Tetris and Breakout are not built in), and it has no picture background.

      - **Wio Tracker L2:** the screen starts in landscape once after this update, now that it can
      rotate. The Orientation setting turns it back.

      - **A failed SD card no longer costs your node its key.** The device keeps a copy of the key
      in its own memory, and a device that keeps its data on the card and starts without it says so
      and offers to try the card again, instead of opening first-time setup.


      ## Read this first if you have a T-Display P4


      - **Landscape works.** If beta_85 left your screen stuck in landscape with the controls out of
      reach, flash this build **over USB** from the flasher. Taps were being rotated twice, once by
      the touch driver and once by the interface.

      - **If Wi-Fi never connects**, your unit's Wi-Fi chip still runs LilyGo's factory firmware:
      pick the **"factory Wi-Fi chip"** image in the flasher (#612; thanks @jalevdev for spotting
      the missing choice in #619). If the board crashes with Wi-Fi on, within a minute of star

