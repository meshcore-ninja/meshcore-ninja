      ## Home is widgets


      Home is now a grid of widgets you arrange yourself. **Hold any widget** to arrange Home:


      - drag a widget to move it, and pick its size: small, wide or large,

      - add widgets from the catalog, or take them away,

      - set each widget's own options (which chat, which node, which app, which switches).


      Each orientation keeps its own layout. Start from a preset: **Glance** (the new default),
      **Commander** (the old Home, rebuilt from widgets), **Radio**, **Minimal** or **Sensors**.


      Twenty-four widgets: clock, sun and moon, system, note, unread, chat, mentions, heard,
      nearest, remote sensor, radio, signal, airtime, GPS, position, battery, sensors (Expansion
      Kit), links, advert, app, switches and app widgets, plus a **mesh radar** on the 8 MB boards
      and a **compass** on the ThinkNode M9. Tapping a widget opens what it shows.


      - **Unread, Chat and Mentions** have a large size that lists the messages themselves. Mentions
      now shows the message that names you, not the chat's latest line, and counts messages instead
      of chats.

