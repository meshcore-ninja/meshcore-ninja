      Test build. Stable is now **beta_85**.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (switch the toggle to
      Beta), or update on the device if you have "Get test builds (beta)" turned on.


      Most of this is [@oumike](https://github.com/oumike)'s: a 50-commit set covering the T-Display
      P4, the T-Deck Pro, the M9 and the shared UI, plus a new board. The five new Store apps are
      [@samuelcoustet](https://github.com/samuelcoustet)'s, and the trackball fix is
      [@samdems](https://github.com/samdems)'.


      ## If you have a T-Display P4, this is the one to take


      **Landscape works.** In beta_85 switching to landscape left the touch screen rotated and
      offset, which meant the control to switch back could not be hit and the only way out was
      reflashing over USB. Taps were being rotated twice, once by the touch driver and once by the
      interface. If beta_85 left you stuck in landscape, this build is the way out.


      The P4 also gains the **LR2021 radio variants** (#504), a clip-on keyboard, GPS that starts
      reliably, Wi-Fi through the C6 coprocessor, and a clock that syncs over saved Wi-Fi on a cold
      boot. Several screens that were cut off or overlapping in portrait are laid out properly, and
      the Remote UI placeholder is drawn on the real panel.


      ## A new board: Elecrow CrowPanel Advance 3.5"


      ESP32-S3, ILI9488 display, GT911 touch (#561). Experimental, and new enough that anything you
      report is useful.


      ## T-Deck Pro owners: pick your hardware revision


      There are now separate **v1.0** and **v1.1** builds. The touchscreen that did nothing on some
      Pros was simply the wrong touch driver for that revision (#568). If you do not know which you
      have, try v1.1: it is what the single Pro build always was, and updating from the device keeps
      working without you choosing anything.


      ## Fixes


      - **#562** the terminal on the Pro and Max drew black text on a black background.

      - **#563** compact chat messages ran into each other on the Pro and Max. The gap added in
      beta_85 was measured in one place and drawn in another.

      - **#132** the screen lock now holds the trackball as well as touch, so the map no longer pans
      under a locked screen.

      - **#574** a crash when tapping the accent popup after its text box had closed.

      - **#570** leaving a profile field you did not edit no longer claims it saved, and scrolling
      no longer says "saved" on every row.

      - **#564** M9 back button. **#569** mark all chats and channels read. **#576** the map's side
      buttons show which is selected. **#571** Wardrive naming. **#579** the lock screen shows the
      battery, on every panel.

      - Settings backups were exported as **invalid JSON**, so they could not be imported again.
      They now also carry the screen and app preferences they were missing.

      - ThinkNode M9: the battery percentage no longer overlaps the signal bars at the larger text
      sizes added in beta_85.


      ## Five new apps in the Store, by @samuelcoustet


      **Tetris**, **Breakout**, **Trip Odometer**, **Ping** and **ProTreck**. Tetris, Breakout and
      Ping are built into the boards that cannot reach the Store; Trip Odometer and ProTreck need
      GPS and sensors, so they stay a download rather than spending flash on boards that cannot use
      them.


      ## Emoji in any text field


      Long-press a field and the picker is there beside Cut, Copy, Paste and Sym. That includes the
      text entry a Lua app opens with `wada.ui.input()`.


      ## For people writing Lua apps


      Two things that were asked for already existed and are now documented: **`wada.sys.epoch()`
      and `wada.sys.datetime()`** give you the device clock, and the field `wada.ui.input()` opens
      is the firmware's own, so it already has Cut, Copy, Paste, Sym and now Emoji on a long press.


      The SDK page also had **the wrong path** for side-loading: on a device with an SD card it is
      `/meshcomod/apps/`, not `/apps/` at the root of the card. Following the old wording silently
      did nothing, which cost at least one person an evening.


      ## For testers


      The P4 landscape fix and the CrowPanel 3.5 are what want eyes. When

