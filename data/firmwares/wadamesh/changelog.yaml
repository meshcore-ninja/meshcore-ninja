      ## A Lua app could reset the device


      Running a Lua app could reboot the device outright. Decoding a crash dump from a T-Deck put it
      inside Lua's own panic path: the firmware never told Lua what to do when an error escapes a
      protected call, so Lua fell back to its default, which is to abort the program. On a phone
      that closes an app; here it resets the radio.


      An app's own faults were already caught and turned into a message plus a clean close. The gap
      was everything that runs *before* that safety net is armed, including the lookup of the app's
      callback, which an app could make run its own code. That lookup is now raw, stack space for
      the arguments is reserved in advance where failure can be reported instead of raised, and if
      anything still escapes, the error text is printed rather than lost along with the device.


