      ### ⚠️ Duty-cycle fix (#161)

      The region presets set the airtime limit **10× too loose**: a 10% preset actually allowed ~91%
      duty — the home-screen meter reading "91% max duty cycle" was correctly reporting your radio's
      real budget. This build fixes the preset math **and self-heals affected devices**: if your
      radio parameters exactly match a preset and carry the old faulty limit, the correct one is
      written automatically at boot. Hand-tuned airtime factors are never touched. Thanks
      @Lankyalong for the report.


      ### T-Pager

      - **The SD card is used now (#193).** It mounted and browsed but nothing stored to it — the
      storage feature was never switched on for this board. The Pager now has the same "Store data
      on SD", boot storage selection and migration as the T-Deck. Thanks @AtomAlex12.


      ### Fixes

      - Message details show the region scope for scoped **direct** messages, and no longer show
      `Scope 0000` when the sender carries the region in the alternate slot (#157, thanks
      @D-Melhede).

      - Discover app: long node names no longer push the last-heard time off screen (#191, thanks
      @4nuts). Note: companions don't answer discover pings yet — only repeaters implement the
      responder — so only repeaters appear, that's expected for now.

      - The unlock animation says WADAMESH (#165 — the last MESHCOMOD leftover, thanks @D-Melhede).


