      ## Your offline map pack was being deleted


      **If you keep map tiles on an SD card, previous releases were permanently deleting files from
      your own pack.** Every tile the firmware wanted but could not find as a `.jpg` erased the
      `.png` sitting next to it. `SD.remove()` is not recoverable.


      Found and fixed by [@cvhviz](https://github.com/cvhviz)
      ([#354](https://github.com/ALLFATHER-BV/wadamesh/pull/354)), confirmed on M9 hardware with a
      boot log.


      The cleanup responsible was written for the firmware's own small tile cache, and it resolves
      through `s_tile_fs`. But `UITask::begin` re-points that at the **SD card root** on every board
      that caches tiles to the card: the M9 always, the V4-R8 with a card present, T-Deck and Pager
      under Launcher, and anyone with "Tiles from SD card" enabled. The skip-check above it only
      ever tested the `.jpg`. It is now limited to the cache partition it was written for.


      **This release stops the damage but cannot undo it.** If you keep an offline pack, check
      whether tiles are missing and re-copy that area.


      ## Names


      By **[@tun0](https://github.com/tun0)** (Ruben Laban), a first contribution, and in the right
      order: make the problem visible, then remove it.


      - **Long sender names are stored in full**
      ([#377](https://github.com/ALLFATHER-BV/wadamesh/pull/377)). MeshCore names run to 31
      characters and only the first 24 were kept, so anything longer was cut permanently on arrival.
      Raised to exactly the wire width, with no migration and no wiped history.

      - **A long name no longer pushes the message text out of shape**
      ([#376](https://github.com/ALLFATHER-BV/wadamesh/pull/376)), and a colon inside an ordinary
      message is no longer mistaken for an author name.


      ## ThinkNode M9


