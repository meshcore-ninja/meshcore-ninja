      ## Fixes


      - **ThinkNode M9 and other keypad boards:** Up and Down on a web page scroll the text instead
      of jumping past it to the toolbar (#680 by @oumike, reported by @Buko84 in #677).

      - A **lock screen PIN with a 0** (or any digit on the Sym layer) can be typed on the T-Deck
