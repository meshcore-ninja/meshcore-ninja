  - version: beta_95
    name: wadamesh beta_95
    datetime: '2026-10-15T16:46:44Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_95
    prerelease: true
    notes: >-
      Test build, on top of beta_94. Stable stays **beta_85**.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (switch the toggle to
      Beta), or update on the device if you have "Get test builds (beta)" turned on.


      ## MeshCore 1.18


      wadamesh now runs on **MeshCore 1.18**, through **meshcomod v1.18.0.1**. Settings > About
      shows it under Build.


      - **The MeshCore app's Command Line works with the device:** name, Bluetooth PIN, Wi-Fi, radio
      settings, airtime and duty cycle, transmit power, receive gain, path hash mode, board and
      version.

      - **Remote CLI:** a contact you give remote CLI permission in the app can run those commands
      on your device over the mesh. Anyone else's command arrives in the chat as a message.

      - Channel data, pushed sensor telemetry and raw sends over multi-byte paths now reach the app
      as they do on MeshCore 1.18.

      - A device without a clock source starts from 1 March 2026 instead of May 2024, and keeps its
      time through a restart that was not a power cut.

      - Boards without a GPS take up to 5 seconds longer to start: MeshCore 1.18 waits longer for a
      GPS to answer, so slow modules are found.


      ## New


      - **Spectrum is redesigned:** tiles for the peak, the noise floor, your channel and how busy
      it is, a filled trace with a peak hold line and a marker on your channel, and a waterfall that
      stays dark until there is real signal. **Band / Channel** switches between the whole band and
      your channel up close; **Live / 1 min / 10 min** sets the waterfall's history.

      - **RF Monitor 1.4:** tiles, a filled signal chart and the recently heard packets with their
      type and signal. Tap a packet for who sent it, its route, its margin above what your spreading
      factor can still decode, its size and its time on the air.

      - **Airtime 1.6:** the channel load as a big figure, average, peak and your own airtime, a
      chart with the duty-cycle limit, and the receive / transmit split.

      - **New in the Store: Music.** Plays the MP3 and WAV files in a `Music` folder on the SD card,
      with shuffle and repeat, and keeps going through the list with the screen off. Runs on every
      board with a speaker: T-Deck, T-LoRa Pager, T-Display P4, Tanmatsu and T-Deck Max.

      - **The Store tile shows how many installed apps have an update waiting**, checked with the
      firmware update check.

      - **T-Deck Max sound** (#665 by @Ender436): notification sounds, your own sounds and app audio
      play through its speaker.

      - **Emoji (and # on the ThinkNode M9) sit next to Send** (#669 by @oumike, reported on
      Discord), so on the M9 one press of Right from the end of your message reaches them.

      - Store apps on the **T-Display P4, Tanmatsu and Wio Tracker L2 can read the SD card** and
      play music from it.

      - **For app makers:** rounded panels, bold and large figures, `app.on_audio` (also with the
      screen off), and a corrected list of the input events apps receive ([SDK
      guide](https://wadamesh.com/sdk.html)).


