      image itself rather than drawn as text, so the earlier branding fix missed it — both the
      built-in wallpaper and the copy seeded to storage are replaced. Reported by **@smhawkes**
      (#228).

      - **T-Display P4: profile export and backups work again.** The backup writer still pointed at
      the storage system beta_54 retired, so every save failed with "can't open file" — the backup
      list and restore were equally affected. Reported by **@D-Melhede** (#231).


