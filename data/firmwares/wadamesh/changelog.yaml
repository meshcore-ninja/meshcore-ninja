      ## wadamesh beta_55 — test build


      **The reliability release** — with two community contributions by @PixPMusic. Flash via
      **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (Beta toggle), the on-device updater,
      or LauncherHub WADAMESH BETA.


      ### Settings that stay put — by @PixPMusic (#195, #196)

      An interrupted settings write could truncate the settings file: sound toggles reverting, the
      setup wizard reappearing, phantom `#unknown` channels. Settings now persist through paired
      CRC-checked snapshots written in the background — a torn write can only lose the newest
      change, never your configuration. Saves also no longer hitch the UI.

      *Downgrade note: older firmware reads the settings file, which can be one save behind after
      running this build.*


      ### 3-minute boots with an SD card fixed (#194)

      A card that woke at a low clock kept that clock all session — contacts and history loading at
      ~25 KB/s, the file manager showing an inserted card as 0 KB/empty, backups wedging. The mount
      now raises the clock to full speed after a slow wake. Mostly hit T-Deck Launcher installs.
      Thanks @scsirob for the decisive testing.


      ### T-Pager UI size presets — by @PixPMusic (#197)

      Small (current, default), Medium, Large — bigger text tuned for the 480×222 screen, encoder
      scrolling for tall content. **Pager testers: please try Medium/Large and report anything that
      clips.**


      ### Heltec V4-R8

      - **The buzzer works** — it shipped disabled because the Expansion Kit V2's driver-chip wiring
      was unconfirmed; Heltec's schematic settled it (DIN = GPIO4, driver hardware-enabled). Still
      silent? The small **SW1** switch on the expansion board is a hardware mute.

      - Landscape touch fix from beta_54 confirmed by testers — thank you.


      ### General

      - Long-pressing the GPS tile in the control centre opens the GPS settings page (was: radio
      page).


