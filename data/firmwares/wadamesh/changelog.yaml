      web flasher at [wadamesh.com](https://wadamesh.com) with the Beta toggle on, or from the
      device under Settings > Updates with "Get test builds (beta)" enabled.


      This drop is almost entirely new **Lua SDK** surface. If you write apps, this is the one to
      try. If you do not, the user-facing changes are a handful of fixes and two new Store apps.


      ## Apps can now do the things the firmware does


      The SDK gained the four capabilities that were keeping third-party apps a sketch of a built-in
      one.


      **`wada.map`** puts the real map on an app's page. Not a drawing of a map: the same
      OpenStreetMap tiles, the same Web Mercator projection and the same on-disk cache the Map tab
      uses. Markers and lines are placed by latitude and longitude, taps convert back to
      coordinates, and `map:tiles()` reports how many tiles were actually placed so an app can say
      "nothing cached here" rather than showing an empty rectangle that looks like open water. It
      owns a small pool of its own rather than borrowing the Map tab's, so the two cannot evict each
      other's tiles.


      **`wada.ui.list`** is the "pick one of N" widget that did not exist. Every app needing one
      drew rows by hand and tracked scrolling itself, which is most of why app screens looked worse
      than the firmware's own. Rows are real buttons, so keyboard and trackball navigation walks
      them on boards with no touchscreen.


      **`app.on_packet`** delivers each received frame once, in arrival order. Polling `rx_log()`
      sampled a 16-deep ring on a timer, so in real traffic an app saw a subset and could not count
      anything.


      **`wada.mesh.discover`** fires the active zero-hop discovery probe. A reply proves the link
      works from where you are standing, which listening can never establish, and each reply carries
      **both directions**: how well you heard them and how well they heard you. Those are rarely
      equal, and "I can hear the repeater but it cannot hear me" is a different fact from "no
      coverage". It sits behind its own permission, separate from sending messages, because a probe
      spends airtime on every neighbour's radio and not only yours.


      Everything those need to be useful came with them:


      - Packets report **who sent them, only where the frame honestly says so**. An advert carries a
      real public key and is reported as one; addressed frames carry one-byte hashes and are
      reported as those; anything else stays anonymous. Nothing is inferred.

      - **`wada.ui.input`** for a line of text, using the firmware's own dialog and keyboard, so it
      behaves the same on touch, on a physical keyboard and on a trackball.

      - **`wada.geo`** for distance, bearing and compass point, in C. A dozen trigonometry calls per
      contact per tick was a real slice of an app's instruction budget. (It is not a compass: no
      board here has a magnetometer, so this is the direction to steer, not the direction you are
      facing.)

      - **`wada.sys.env`** for temperature, humidity and pressure, gated on whether the board *has*
      the sensors rather than on the memory limit that gates the rest of the extended SDK. Those are
      different questions.

      - **Named and one-shot timers.** An app had one clock; anything with a second cadence had to
      be a counter inside it.

      - **`wada.net.http_post`**, so a survey log or a sensor series can leave the device.

      - **Exact coordinates.** Lua is built with 32-bit floats, so anything logging a track was
      quietly losing about a metre. `lat_e6`/`lon_e6` are the same reading as exact integers,
      alongside GPS altitude and satellite time.


      Two new Store apps demonstrate the lot. **Wardrive** is a coverage survey: it probes on a
      cadence, discards samples taken without a GPS fix rather than logging them at 0,0, and writes
      a CSV with both link directions per node. **Nearby** puts your contacts on a real map sorted
      by distance, with bearing, and counts frames live.


