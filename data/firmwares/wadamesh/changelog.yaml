      ## The Heltec V4 freeze — the rest of it


      beta_62 took one storage delete off the packet path and that genuinely helped. Then @Yoss101
      came back with the detail that mattered: the freezes had got **rarer and longer**. Rarer was
      the fix working. Longer was the half nobody had measured.


      Here is what was actually costing the time. A contact record is **152 bytes** and the table
      holds up to **2000** of them, so saving contacts rewrote the whole **304 KB** file on *every*
      change — and the crash-safe write keeps a second copy of the same size beside it while it
      swaps. Roughly **600 KB of flash churn because one contact changed**. On a board with no card
      that lands on internal flash, whose garbage collection suspends the flash cache and stalls
      **both CPU cores**. That is why the entire device went away instead of dropping a packet.


      But the table never changes in bulk. Replacing the oldest contact overwrites **one slot** —
      the array is unsorted and never shifts — and hearing from a node you already know touches
      **one entry**. So each record is now compared against what is already stored and only the
      differing ones are written back.


      **A new contact replacing an old one writes 152 bytes instead of 304,000.** A save with
      nothing to change writes nothing at all.


      Because that is a new way of writing the file, and because the data at stake is your contact
      list, it checks its own work: every patched record is **read back and compared**, and on any
      disagreement it falls through to the old whole-file write. A filesystem that accepts a
      positioned write and quietly drops it cannot leave you with a half-written contact list.


      Also: contact deletes that overflowed the queue used to leak their stored record permanently —
      fixed, and the queue is 4× deeper. **About → System info** gained a **Contact store** panel
      (contacts, space used, how full internal flash is, and what the last save cost). If you report
      a freeze, that panel is the useful photograph.


