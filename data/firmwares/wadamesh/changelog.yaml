      rest came out of reports from @PD0RCM, @jesshampshire, @Steve8677 and @Buko84. Thanks also to
      @comraderachel, @B0N3-GD and @wpawelczyk-wq, whose reports drove the PR.


      ## Bluetooth keyboards, on every board with Bluetooth


      Bluetooth now serves either the phone app or a keyboard, and Settings, Bluetooth is where you
      choose. Pairing lists the keyboards that are in pairing mode and pairs with a code or without
      one; the keyboard you paired reconnects by itself after that.


      - **Keys are read from the keyboard's own report map**, the way a phone or a computer reads
      them, so media keys and touchpads are left alone and the boot protocol is only a fallback.

      - **Layouts**: US, UK, German, French and Belgian, including AltGr and the dead keys for
      accents.

      - **Touchscreen boards keep the on-screen keyboard down** while a keyboard is connected, and a
      second tap on a field brings it up anyway.

      - **The whole interface works from the keyboard**: arrows, Tab, Enter and Page Up/Down drive
      the highlight, and the letter hotkeys over the tab bar switch pages.

      - **Esc is the back button**, and for keyboards whose Esc key types a character instead, the
      Back key setting captures whichever key you press and uses that.

      - **Command tapped on its own** opens the emoji picker while you are writing, and the status
      bar shows a keyboard instead of the Bluetooth glyph while one is connected.


      Not on the Tanmatsu or the T-Display P4, which have no Bluetooth of their own. Both ESP32-P4
