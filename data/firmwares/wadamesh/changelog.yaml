      > **This beta reworks how chat history is stored on the SD card, and it has NOT been
      soak-tested over long uptime yet. It may have data-loss bugs.**

      >

      > - 🧪 **It needs community testing.** Please run it for hours or days and report any SD
      errors, "history not saving," or storage weirdness on the issues tracker.

      > - 💾 **The chat-history format changes, and the change is ONE-WAY.** If you flash an older
      firmware after running this, your saved chat history is lost. Back up anything you care about
      first.

      > - 🛑 **Do not run this as your only or daily device** unless you're OK risking your chat
      history.

      >

      > If you just want a solid device, stay on **beta_50** (current stable) or **beta_51**.


      ---


      **wadamesh beta_52** lands a major community SD/storage rework for testing.


      > Test build. Turn on **Get test builds (beta)** on the device, use the **Beta** toggle on the
      [web flasher](https://flasher.wadamesh.com), or grab a `-merged.bin` below. Stable stays on
      beta_50.


      ## What's new — SD storage rework (by @Vybo,
      [#179](https://github.com/ALLFATHER-BV/wadamesh/pull/179))

      - **Runtime SD recovery**: the device now recovers from an SD card that wedges or is pulled at
      runtime, instead of playing dead until a reboot.

      - **Chat-store health** on the About page: resolved backend, last save time, and failure
      details, so a sick store is visible.

      - **Segmented message store**: chat history is written as small append-friendly segment files
      instead of rewriting the whole file on every save — shorter write windows, per-segment
      corruption isolation, crash-atomic migration.

      - Plus a fix for the follow-on bug where SD writes started failing after a few hours of uptime
      once the segment table filled.


      Huge thanks to **@Vybo** (Dan Vybiral) for the deep root-cause work on the SD stack.


      ## Also included (from beta_51)

      Chat bubble timestamp on the top row (@scratchdiver), the Airtime channel-utilization tool
      (@jacobpretorius), the lockscreen wallpaper corruption fix (@Yazutsu, #127), and the T-Display
      P4 text-size fix.


      ## Boards

      T-Deck · Heltec V4 TFT · Heltec V4-R8 · ThinkNode M9 · RAK TAP v2 · T-LoRa Pager (LR1121 /
      SX1262) · Attaky Core · T-Display P4 (AMOLED + LCD). Flash `<board>-merged.bin` at `0x0` for a
      full install, or `<board>.bin` for an app-only update.
