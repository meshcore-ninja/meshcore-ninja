  - version: beta_99
    name: wadamesh beta_99
    datetime: '2026-10-21T16:56:13Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_99
    prerelease: true
    notes: >-
      Test build, on top of beta_98. Stable stays **beta_85**.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (switch the toggle to
      Beta), or update on the device if you have "Get test builds (beta)" turned on.


      A big community round: most of this build is pull requests from **@oumike**, with fixes and
      apps from **@tun0**, **@Ender436**, **@JackCortines**, **@halflive-743** and
      **@samuelcoustet**. Thank you all.


      ## New


      - **Orientation: four choices** (Portrait, Portrait 180, Landscape, Landscape 180) on every
      board that can rotate, including the T-Display P4, CrowPanel P4 10.1 and Wio Tracker L2 (#698,
      #701 by @oumike). The Wio Tracker L2 and CrowPanel P4 10.1 start in landscape once after this
      update.

      - **"Fewest hops" sort** for Contacts and Discovered (#718, asked for by @mrickey, built by
      @oumike).

      - **USB Files on more boards, and about 30x faster.**
      [files.wadamesh.com](https://files.wadamesh.com) now also works on the T-LoRa Pager, Heltec
      V4-R8, RAK WisMesh Tap V2 and Wio Tracker L2 (every board whose USB socket is the ESP32-S3's
      own). Uploads went from about 4 KB/s to about 120 KB/s: 1 reply in 5 sat in the USB chip's
      buffer until the next write, and the page waited 3 seconds for it each time.

      - **T-Deck: switch a damaged trackball off** (Settings, Keyboard, Navigation, "Use the
      trackball"). With it off, Space still locks, Enter on the lit lock screen unlocks (or opens
      the PIN screen), and a powered-off T-Deck wakes only with the reset button, so a phantom click
      cannot switch it on.

      - **T-Display P4 keyboard light separate from the screen.** They shared one PWM channel; now
      F11 changes only the keyboard light, the brightness slider only the screen, and Settings,
      Keyboard has its own keyboard light choice.

      - **Wio Tracker L2 speaker** for notification chimes (#712, @oumike).


      ## Fixes


      - **P4 boards restart after a crash** instead of freezing on the last frame (which looked like
      a blue screen after boot). The crash report is still saved. T-Display P4, CrowPanel P4 10.1
      and Tanmatsu.

      - **Wi-Fi switches itself off after crashes** on the T-Display P4 and CrowPanel P4 10.1 (a
      crash within a minute of starting Wi-Fi, or two in half an hour), and the next boot says so.
      Boards whose Wi-Fi chip runs very old firmware crashed every time Wi-Fi started.

      - **Button captions shrink, then wrap** when a translation is too wide (#418, reported by
      @B0N3-GD, built by @oumike).

      - **Wallpapers and background pictures** load on SD_MMC / internal-storage boards like the
      T-Display P4 (#691, reported by @zomgugoff, fixed by @oumike).

      - A settings page opened from the control center stays in front of the app drawer (#696,
      @oumike).

      - Emoji in a settings field are drawn instead of empty boxes (#690 by @tun0).

      - Lua apps draw correctly on e-paper (#704 by @Ender436).

      - A message's region scope shows in its Info and under the bubble (#594, reported by
      @DenRalle).

      - Heltec V4-R8: chat bar buttons are easier to hit and a near miss no longer opens the control
      center (#598, reported by @Jess-39).

      - Slider drags save, avatar initials fit at large UI sizes, the keyboard's symbol keys are
      readable in dark mode, the T-Deck Pro is easier to read on e-paper, and the Mesh Deck hides
      the on-screen keyboard while its keyboard module is attached (@oumike).

      - CrowPanel P4 10.1: the touch controller gets 300 ms after its reset before the first
      command.


      ## Apps (in the Store now)


      - **Space Invaders** (#707 by @JackCortines), **Blackjack 1.2.2** (#705 by @halflive-743),
      **ProTreck 1.2** with compass and three alarms (#648) and **Trip Odometer 1.1** with
      return-to-home (#607), both by @samuelcoustet.


      ## Also


      - The touch UI now also builds for the browser from this same source:
      **[app.wadamesh.com](https://app.wadamesh.com)** drives your own MeshCore node over USB or
      Bluetooth, or a wadamesh or meshcomod node over Wi-Fi.


      Please report what you find with "Send a test report" in Settings, or an issue here.
  - version: beta_98
    name: wadamesh beta_98
    datetime: '2026-10-18T18:30:07Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_98
    prerelease: true
    notes: >-
      Test build, on top of beta_97. Stable stays **beta_85**.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (switch the toggle to
      Beta), or update on the device if you have "Get test builds (beta)" turned on.


      ## New


      - **Repeater and room server admin.** The Admin button on a repeater or room server now opens
      a full admin app instead of a password box and a raw console. Log in as admin or guest (a
      remembered password logs in at once), then see the node's status, firmware and owner, its
      neighbours (newest or strongest), telemetry and the access list, change roles, edit identity
      and location, radio, repeating and limits, adverts, passwords and regions, and run actions: an
      advert, a clock sync, discovering neighbours, resetting counters, a reboot or a firmware
      update. The old console stays under Advanced.

      - **wadamesh in your browser.** The same touch UI runs at
      **[app.wadamesh.com](https://app.wadamesh.com)** and drives your own MeshCore node over USB or
      Bluetooth (Chrome or Edge), or a wadamesh or meshcomod node over Wi-Fi from
      [wifi.app.wadamesh.com](http://wifi.app.wadamesh.com). Map, Store and Lua apps, backups and
      your device's location included, chats kept in the browser, portrait on phones, and a demo
      mesh when no node is connected. More on
      [wadamesh.com/webclient.html](https://wadamesh.com/webclient.html).

      - Settings, Theme, Background has a **Glass tiles** switch (on by default); off draws the Home
      tiles solid.

      - Large screens in landscape (T-Display P4, Tanmatsu, CrowPanel 5.0 and 10.1): the empty
      message box is one line tall and grows as you type.


      ## Fixes


      - **Firmware updates over Wi-Fi no longer stop at 0% and restart the device.** The download
      waited without yielding, so a slow start tripped the task watchdog. The image is now copied in
      small blocks, and the update gives up cleanly after 15 seconds without data (#689, reported by
      @Hixsten on a T-Deck Plus).

      - **Backups get one name, `meshcore-backup-<date>`,** and a device without a set clock numbers
      them instead of overwriting an earlier one (#688 by @oumike, for #686 reported by @zomgugoff).
      On the Tanmatsu the free name is found by opening the file, since its storage reports existing
      files as missing.

      - **T-Display P4: a Wi-Fi chip that stops answering is reset and rejoins on its own.** Units
      running LilyGo's factory ESP-AT image lost Wi-Fi after about an hour, with empty scans and
      Connect doing nothing until a reboot (#685, reported by @william-stearns). Not yet checked on
      a unit that shows the problem, so please report.

      - Companion sync: a node keeps a sync position for up to 8 apps. When all 8 were taken, a new
      app was never synced at all; the slot of the app that synced longest ago is now reused.


      ## Boards


      - **SenseCAP Indicator D1L** is a new board in the web flasher (#682 by @Confituurke): ST7701S
      screen, FT6336 touch and the SX1262 radio behind the TCA9535 expander. Power off is hidden, as
      nothing on the board can wake it again.

      - **CrowPanel Advanced 10.1: touch works.** The SD card driver claimed pin 45, the touch
      controller's data line, and shut the touch bus down after the first card check. Map tiles are
      kept on the board's own storage and the boot is quieter. Still experimental, so please report
      what works.

      - **T-Display P4:** Radio settings has "Always use the external antenna (MMCX)", which asks
      first with a warning, and the control panel has an Antenna tile.


      The admin app was checked on a LilyGo T-Deck against a real repeater (guest login). Every
      other board builds. Please report what you find with "Send a test report" in Settings, or an
      issue here.
