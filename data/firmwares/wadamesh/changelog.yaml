      ## New board: LilyGo T-Deck Max, by @pelgraine (#545, #546, #547)


      The T-Deck Pro's hardware with the peripheral power rails and resets behind an I/O expander
      and a fuel gauge for the battery. It reuses the Pro's display and touch drivers, so the Pro
      build is unchanged.


      The e-paper screen gets its own handling: no fades, no black frame left on the glass when it
      sleeps, a banner that says the screen is asleep, tap to wake, and the keyboard backlight on a
      both-Shift chord. It boots with Wi-Fi off and Bluetooth on, because both at once leave this
      board short of internal memory; the Settings toggle keeps whatever you choose.


      Experimental, tested by its contributor on one unit. Please report what works and what does
      not.


      ## Reading the screen outdoors (#544)


      High contrast day and night themes, for sunlight where the normal palette washes out.
      Settings, Display, Theme.


      ## Regions you can discover (#541)


      The region page scans for repeaters you can hear and lists the regions they allow, and channel
      scope offers them in a picker, so a region no longer has to be typed exactly.


      ## Czech, by @brebtatv (#540)


      A full Czech translation, 1270 strings. Settings, Language.


      ## ThinkNode M9 (#528)


      With the home drawer locked, Back (and Esc on a Bluetooth keyboard) stays on it instead of
      escaping to the tabs behind it. The Language settings cursor returns where it was after
      visiting the Store, and a channel keeps its unread colour.


      ## Heltec V4 and V4-R8 (#536)


      An M5Stack CardKB can be plugged into the board's I2C bus and used as a keyboard; it is
      detected when present, so nothing changes without one. On the V4-R8 there are bigger text
      sizes to choose from, and the top row of the screen no longer swallows taps meant for the
      page.


      ## Fixes


      - Radio settings save again when the region field holds a name the new rules reject, such as
      one with capitals. Only the region is skipped, instead of the frequency, bandwidth and power
      going with it.

      - The Show button on telemetry shows its label in Russian, Ukrainian, Bulgarian, Serbian and
      Greek instead of empty boxes.

      - Scanning for regions no longer leaves nameless entries behind in Contacts, and sends one
      request per tick rather than sixteen at once.

      - The V4-R8 image fits again: it no longer carries the compiled-in translations it inherited
      from the V4, which it never needed.

      - Wio Tracker L2: the SD card gets a power cycle and a second try when it does not mount at
      boot.


      ## For testers


      Region discovery is new on-air traffic and has not been tested on a live mesh yet. Worth
      reporting whether a scan finds your repeaters' regions.
