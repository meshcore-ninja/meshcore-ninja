  - version: beta_62
    name: wadamesh beta_62
    datetime: '2026-08-11T08:32:44Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_62
    prerelease: true
    notes: >-
      Test build. Stable stays **beta_50**.


      Most of this release is community work — **@PixPMusic** wrote 22 of its 30 changes, and the
      German, Dutch and Hungarian translations are **@pisti87**'s.


      Flash it from **https://flasher.wadamesh.com** (flip the Beta toggle), or on-device via
      Settings → Firmware with "Get test builds (beta)" enabled.


      ---


      ### The enlarged UI, by @PixPMusic (#198)


      The large font presets are usable across the whole interface now, not just in chat.


      Chat rows, the composer and the Pager's line spacing size themselves from the font's real
      metrics instead of fixed pixel heights, so nothing clips or overlaps at the bigger presets.
      Contact detail menus, the contact share panel, mentions, the overview header and its action
      buttons, and the QR panel all scale with the preset instead of overflowing it. The
      discovered-count badge is centred, the close button and the signal poll no longer strand a
      focus outline, and app pages close from the back gesture.


      New in the same pass: a full-width traffic detail chart, Jumbo chat text properly distinct
      from Large, and the preset names kept as the ones you already know.


      ### Open-licensed fonts, by @PixPMusic (#198)


      The bundled fonts are rebuilt from their OFL sources. The set shipped before this was
      generated from a proprietary system font, which was never ours to redistribute — the firmware
      is GPL, so that needed correcting whether or not anyone had noticed. Glyph shapes shift very
      slightly; nothing else about the text changes.


      ### Accented and non-Latin characters render everywhere again


      The rebuilt fonts carry their extended coverage in a fallback chain, and roughly eighty labels
      across the interface pinned a base font directly rather than the chained one. On those, an ä,
      a Hungarian ő or a Cyrillic character came out as an empty box while the identical string
      rendered fine one screen over. Every label now takes the chained font, verified by a static
      sweep of the UI source rather than by eye. Surfaced while checking @pisti87's Hungarian
      translation.


      ### The Heltec V4 no longer locks up when its contact list is full (#222)


      Once the contact table is full, every advert from an unknown node evicts the oldest contact —
      and the firmware deleted that contact's stored record on the spot, on the receive path. On the
      V4 that store is internal flash, where a delete can trigger a garbage-collection pass, and
      such a pass suspends the flash cache and stalls **both** processor cores: the whole device
      goes dead, Bluetooth and TCP drop, the screen will not wake, and it comes back on its own a
      moment later. It got steadily worse the fuller the list was — degrading around 350 contacts,
      locking hard by 600, constant at 2000.


      The delete is now queued and performed between packets, at most one every half second, so a
      stream of adverts can no longer chain those pauses together. Reported by @Yoss101 and
      @pisti87.


      ### Also


      - Downloading a firmware image to the SD card checks the card's free space first and says so,
      instead of failing partway through the write with a bare "SD write failed".

      - German, Dutch and Hungarian now translate all 48 interface strings that had been left
      English in every language (@pisti87). The other ten have the strings listed and still fall
      back to English — the files are in `deploy/apps/lang` and contributions are welcome.


      ### Known, not fixed here


      The intermittent T-Lora Pager crash (#233, #251) is still open. Both dumps decode to a freed
      LVGL callback — the same fault from two angles — and @PixPMusic's #234 restructures that
      teardown. It predates beta_60 and is not a 1.17 regression.
  - version: beta_61
    name: wadamesh beta_61
    datetime: '2026-08-10T11:15:20Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_61
    prerelease: true
    notes: >-
      Test build. Stable stays **beta_50**.


      **If you are on beta_60, update.** It shipped with three regressions from the MeshCore 1.17
      rebase, all fixed here. Flashing beta_61 over the top is enough — nothing needs erasing, and
      no data was lost in any of them.


      Flash it from **https://flasher.wadamesh.com** (flip the Beta toggle), or on-device via
      Settings → Firmware with "Get test builds (beta)" enabled.


      ---


      ### The beta_60 regressions


      **Boot loop on an empty contact list** (#249). A device with no contacts saved — a fresh
      install, an erase-and-flash, or a card that had not mounted yet — crashed during startup and
      rebooted forever. 1.17 reserved eight slots at the head of the contact table and claimed them
      before the table was allocated, so a new startup routine walked a null pointer. Every board on
      our bench had contacts on it, which is exactly why this got past testing; the release process
      now checks that case. Reported by @Pierre747 and @rustinmyeye, whose boot log is what cracked
      it.


      **The newest contacts were unreachable** (#252). Same reserved slots, different consequence:
      the contact list, the action sheets and the phone-app sync were still counting from the old
      start of the table, so the eight most recently added contacts could not be shown or acted on.
      A contact you had just added was invisible, and a room server's **Log in** silently did
      nothing because it resolved to an empty reserved slot. Nothing was lost — those contacts were
      in the table the whole time. Reported by myshoeisonfire.


      **The T-Display P4 could send but never receive** (#253). No channel messages, no delivery
      confirmations, no adverts, RX counters flat at zero — while the Monitor app still showed
      signal, because it talks to the radio directly. The P4 is the one board whose radio interrupt
      is not wired to the processor, so it has to ask the radio over SPI whether a packet arrived.
      That polling code was never in the repository — it lived only in a generated directory that
      gets rebuilt — so the 1.17 rebase erased it. It is rewritten and now version-controlled, with
      a build-time check so it cannot vanish again. Reported by @D-Melhede.


      ### Also fixed


      - A contact that changes its node name no longer leaves two chat threads behind. The thread is
      matched by key, but its title was never updated, while incoming messages are filed by sender
      name — so the first message after a rename started a second thread. Reported by
      myshoeisonfire.

      - Release builds now derive the firmware version, build date and core version from the release
      itself, and a release **aborts** if any board's image does not carry its own tag. beta_60
      reported `v1.16.0-touch` in About because that value was maintained by hand.

      - All 13 language files gained the 48 UI strings none of them had, so those stop being
      permanently English and translators can see the gaps. New tool `scripts/build/audit-lang.py`
      reports drift in both directions.


      ### Known, not fixed here


      The intermittent T-Lora Pager crash (#233, #251) is still open. Both dumps decode to a freed
      LVGL callback — the same underlying fault seen from two angles — and @PixPMusic's #234
      restructures exactly that teardown. It is not a 1.17 regression and predates beta_60.
