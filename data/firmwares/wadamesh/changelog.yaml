      Discord).

      - **New in the Store: Blackjack**, with split, double down and your bankroll kept between
      sessions (#681 by @halflive-743). Every Store app now has a page at
      [wadamesh.com/apps.html](https://wadamesh.com/apps.html).

      - The Store now lists more than 16 apps; it stopped at 16 before, so new apps would not have
