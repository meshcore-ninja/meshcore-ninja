      ## The crash on the regions screen


      Adding or removing known regions and then leaving that screen crashed the device. If you have
      been stuck in Radio & mesh and had to reset to get out
      ([#314](https://github.com/ALLFATHER-BV/wadamesh/issues/314)), this was why.


      The cause is general rather than anything to do with regions. When LVGL destroys a text field
      it sends that field one last `LV_EVENT_DEFOCUSED`, and seven fields in this firmware save
      their value on losing focus. So a field was reading its own text and writing it back **from
      inside its own destructor**, on memory that was already being freed. All seven now ignore a
      blur that is really a deletion.


      Decoded from the core dump attached to
      [#330](https://github.com/ALLFATHER-BV/wadamesh/issues/330) against a beta_69 image rebuilt
      from the tag. Sending that file is what made this findable, so thank you.


      ## Translations: undoing damage we caused


      Language file v18 shipped keys that exist nowhere in the firmware. `Paste (move)Paste (copy)`
      and `Unblock  Block` are two separate buttons glued together, and one entry was a **Dutch**
      phrase that appears only inside a source-code comment.


      That was a bug in the tool that decides which text belongs in a language file, which I
      introduced in the previous release. Fixed on both counts: it no longer joins the two halves of
      a ternary into one key, and it no longer reads string literals out of comments. **202 invented
      entries removed** from all thirteen files, with nothing that had actually been translated
      touched.


      Also: the curly quotes in the Hungarian map credits rendered as empty boxes, because no
      bundled font carries U+201E/U+201D. Five more strings are translatable
      ([@pisti87](https://github.com/pisti87) found them and gave line numbers). Language files are
      at **v19**; v18 is withdrawn.


      ## The Store stops offering apps your board cannot run


      Wardrive and Nearby need the extended SDK, which the Heltec V4 does not have. The Store
      offered both anyway, so the most common board in the mesh could download, install and open two
      apps that then refused to do anything. Apps declare `requires` in the catalog now, and the
      Store greys the button and says so on the row.


