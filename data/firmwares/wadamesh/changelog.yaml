      ## Console mode is new, and it is very early


      Console mode boots the device into a plain text console with **no graphical interface at
      all**: no LVGL, no widgets, no draw buffer. You type commands, you read replies, and the
      memory and processor time the interface would have used are yours instead.


      **Please read this as a first look, not a feature.** It has had one day on hardware. Most of
      the graphical interface is simply not there: no map, no file manager, no Lua apps, no settings
      editor. Expect missing commands, rough text layout and things you reach for that do not exist
      yet.


      - It is **off by default**, in Settings > General, marked experimental. Toggling it reboots.

      - Type `ui` or `exit` to come back.

      - If it ever crashes on the way up, the device notices and returns to the graphical interface
      on its own, so you cannot strand yourself in it.

      - What works today: contacts, channels, unread counts, reading a thread, sending to a contact
      or channel, a live monitor of arriving messages, radio and battery and Wi-Fi readouts,
      discovery, a numbered quick-launch menu, and anything the node CLI already answers.


      The most useful thing you can send us is what you reached for and could not find.


