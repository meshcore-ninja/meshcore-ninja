      - **Lua:** `wada.ui.input` returns the text on Enter, also from an external keyboard on a
      touch board (the second Enter used to land on Cancel); `wada.sys.random(n)` gives 1 to n,
      `random(1, 1)` gives 1, and a random over the full number range no 

