      ## ⚠️ App developers and testers: this is the build to hammer


      The Lua SDK gained the ability to hold a **whole conversation**, and it is the least-proven
      part of this release. It builds on all ten images and has **not been exercised on hardware** —
      I would rather say that plainly than have you find out.


      ```lua

      wada.mesh.send_dm(to, text)   -- ok, "sent" | "room" | err   (contact NAME, a room is a
      contact)

      wada.mesh.channels()          -- names of the channels configured on this device

      app.on_message(m)             -- m.kind = "channel" | "dm" | "room"

      wada.crypto.hmac_sha1(k, m)   -- + sha1/sha256/hmac_sha256/hex, on EVERY board

      ```


      **What would help most:**


      1. **Send a DM from an app** and confirm it lands in that contact's thread on the device, not
      just on the air. This is the highest-consequence call in the SDK: it writes as you.

      2. **Receive a DM and a room post** with an app open and check `m.kind`. Apps previously only
      ever got channel messages, because the delivery hook ran before the sender and body were
      parsed. That is fixed but unverified.

      3. **Toggle the four permissions independently** in Settings → App permissions and confirm one
      does not clear another.

      4. **Run SDK Test 1.2** from the Store. Its crypto section checks against published RFC 2202 /
      4231 vectors, so a PASS is real evidence rather than "it returned something", and it times 200
      HMACs so you can see why this belongs in C.


      Permissions went **two → four**: post to channels as me, read channel messages, send private
      messages as me, read private messages. Posting to a channel you are already in is not the same
      act as writing to one person as you, and channel traffic is not your private conversations, so
      each is granted separately.


      **Two bugs found while building it.** Granting one permission silently revoked another (the
      grant wrote the whole permission set rather than the one switch) — invisible with one
      permission, constant with four. And apps could only ever receive channel messages, never DMs
      or room posts.


      **`wada.crypto`** exists because Tiamat and Jade hit "instruction budget exceeded" doing
      HMAC-SHA1 in pure Lua for a one-time-password app. That is a legitimate use of 100k VM
      instructions, not a runaway: SHA-1 is 80 bit operations per block and the interpreter
      multiplies each one. mbedTLS is already linked, so it is now microseconds. Deliberately
      available on **every** board, including those without the rest of the extended toolkit, since
      it only computes over data the app already holds.


      Full API at **[wadamesh.com/sdk.html](https://wadamesh.com/sdk.html)**.


