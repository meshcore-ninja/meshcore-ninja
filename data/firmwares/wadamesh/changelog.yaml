  - version: beta_50
    name: wadamesh beta_50
    datetime: '2026-07-22T21:02:30Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_50
    prerelease: false
    notes: >-
      **wadamesh beta_50 is the new stable build.** It rolls up everything since beta_46 (beta_47 →
      beta_50). Flash it from the [web flasher](https://flasher.wadamesh.com), or grab a
      `-merged.bin` below and flash at `0x0`.


      Thanks to community contributors @attakygit and @codemonkeybr.


      ## New

      - **Discover app** — actively sweep for nearby nodes and list everything that answers
      (repeaters, companions, room servers), ranked by signal, with live RSSI/SNR, a **direct**
      badge for anything in RF range, and a last-heard age. Tap a node to add it straight to your
      contacts.

      - **Wardriving** — with a GPS fix, Discover logs every node it hears against your position to
      a CSV on the SD card and plots your RF coverage on the map as a signal-coloured track (green =
      strong, red = weak). A standalone on-device coverage mapper, no phone needed.

      - **New board: Attaky Core** (ESP32-S3, 16 MB / 8 MB PSRAM), contributed by @attakygit
      ([#158](https://github.com/ALLFATHER-BV/wadamesh/pull/158)).

      - **T-Display P4 TFT-LCD** screen model now supported alongside the AMOLED.


      ## On-device updates

      - The updater was downloading the **wrong firmware** on the Heltec V4-R8, ThinkNode M9, RAK
      Tap V2, T-LoRa Pager and Attaky (it pulled the V4 TFT build). Each board now installs its own
      build.

      - **T-Display P4**: the "Get test builds (beta)" toggle and on-device updates now appear — the
      P4 was previously USB-only.


      ## Fixes

      - Crash that could reboot the device while typing in a chat.

      - Devices stuck on the boot screen after an update with a microSD card fitted.

      - Message times showing 1910 / wrong dates — they now match the clock.

      - MQTT bridge settings not saving across reboots.

      - Dutch keyboard typing "ij" / "IJ" on the "1" and "!" keys.

      - The message box dropping the end of long messages; copy/paste cutting off long text.

      - Quick messages list not scrolling; room-server names with an unusual first character showing
      an empty box on Join.

      - Tanmatsu: only about half the emoji were reachable in the picker.


      ## Per-board

      - **T-Display P4**: screen timeout works (plus standby / burn-in dimming); the full-screen
      tools and the Snake game exit with a top-bar tap instead of trapping you; GPS (L76K) detected
      reliably at 9600; taller control-center dropdown; LCD backlight fixed.

      - **T-LoRa Pager** (@codemonkeybr, [#162](https://github.com/ALLFATHER-BV/wadamesh/pull/162)):
      lock screen fixed (Backspace peek / hold-to-unlock, layout fits the wide screen); rotary
      encoder keeps focus in the chat list with the composer keys remapped.

      - **Attaky Core**: on-screen keyboard works with the detachable keyboard module; POWER button
      toggles/wakes the screen; LoRa-clock, GPS-baud and sensor-probe fixes.


      ## Boards

      T-Deck · Heltec V4 TFT · Heltec V4-R8 · ThinkNode M9 · RAK TAP v2 · T-LoRa Pager (LR1121 /
      SX1262) · Attaky Core · T-Display P4 (AMOLED + LCD).
