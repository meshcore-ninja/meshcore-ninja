      **Settings > Theme > Background** has five choices:


      - **Still aurora** (the default): soft light behind every screen in your accent colour, every
      colour with Taste the rainbow.

      - **Moving aurora**: the same, drifting in a slow loop. It only moves while you are not
      touching anything, and stays still with the battery saver on.

      - **Colour**: any colour from the picker.

      - **Image**: open a JPEG in Files and tap **Set as background**.

      - **None**: the plain black page (the light page by day).


      A colour or a picture is darkened, or lightened by day, just enough for all text to stay
