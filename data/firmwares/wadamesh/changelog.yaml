    notes: >-
      Test build. **Stable stays beta_65.**


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (Beta toggle), or turn on
      "Get test builds (beta)" on the device and reboot.


      ## A crash at startup


      A device could crash **while starting up**, before it finished booting, which on an unlucky
      unit means it never comes up at all. Found by decoding a crash dump from a Heltec V4-R8 on
      beta_77.


      The cause was a race in the Arduino Wi-Fi stack: `WiFi.onEvent()` appends to a list that the
      core walks from its own task, with no lock on either side. We were registering handlers
      *after* the radio had started, one of them after `WiFi.begin()`, so a disconnect arriving in
      that window could be dispatched while the list was being reallocated underneath, and the event
      task then called through a freed pointer. All handlers now register before the radio starts,
      which closes the window rather than narrowing it. A failed first association is ordinary,
      which is why this could happen at all.


      ## The location privacy setting was on the wrong page


      beta_77 added the option to advertise a position near you rather than your exact one, and put
      it in a settings section most devices do not show. Two people went looking and correctly
      concluded it was not there. **It was not.**


      It is now in **Settings, GPS**, at the bottom, called **Location privacy** rather than
      "Position in adverts", and it shows four buttons (Exact, 100 m, 250 m, 1 km) so every choice
      and the current one are visible without tapping anything. Thanks to
      [@Buko84](https://github.com/Buko84) and gadgeteerza for pushing on it rather than assuming
      they had missed it.


      ## Lock screen notifications


      A message arriving on a dark screen now says **who sent it and how far away they are**, not
      just which conversation it was in. A channel post shows the channel, the sender and the hop
      count; a direct message shows the contact, and "direct" when they are one hop away. A count
      alone tells you nothing you can act on.


      **Messages in a muted channel no longer light the screen.** Muting silenced the chime but
      still woke the display and printed the message in large type, which was the louder half of the
      notification rather than the quieter one. Mentions keep their own mute bit, so a channel muted
      for chatter still surfaces an @-mention.


