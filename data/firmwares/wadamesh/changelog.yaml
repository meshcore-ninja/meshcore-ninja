      All from [@cvhviz](https://github.com/cvhviz):


      - The map opens in about **1.5 seconds instead of 2.6**
      ([#355](https://github.com/ALLFATHER-BV/wadamesh/pull/355))

      - **Back returns to the previous screen** rather than jumping out of where you were
      ([#356](https://github.com/ALLFATHER-BV/wadamesh/pull/356))

      - The **SD card remounts properly** after formatting it on the device
      ([#359](https://github.com/ALLFATHER-BV/wadamesh/pull/359))

      - Live-updating labels no longer overlap the rows beneath them
      ([#357](https://github.com/ALLFATHER-BV/wadamesh/pull/357)), and hidden or inactive controls
      are skipped when moving with the d-pad instead of trapping the cursor
      ([#358](https://github.com/ALLFATHER-BV/wadamesh/pull/358))

