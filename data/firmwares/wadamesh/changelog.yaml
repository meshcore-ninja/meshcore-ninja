    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_47
    prerelease: true
    notes: >-
      **wadamesh beta_47** — a new **Discover** app (find, list and map the nodes around you, plus
      wardriving), a new board, and pager + T-Display P4 additions.


      > 🧪 Test build. Flip **Get test builds (beta)** on-device, use the **Beta** toggle on the
      [web flasher](https://flasher.wadamesh.com), or grab a `-merged.bin` below. Stable stays on
      beta_46.


      🙏 **Community contributions:** thanks to **[@attakygit](https://github.com/attakygit)** for
      the **Attaky Core** board port ([#158](https://github.com/ALLFATHER-BV/wadamesh/pull/158)) and
      **[@codemonkeybr](https://github.com/codemonkeybr)** (Tesso Codemonkey) for the **T-LoRa
      Pager** navigation fix ([#162](https://github.com/ALLFATHER-BV/wadamesh/pull/162)).


      ## ✨ Discover — find what's around you

      - **Active discovery** — open the **Discover** app (app drawer → the ⟳ tile, next to Map): it
      sweeps for nearby nodes and lists every repeater / companion / room server that answers,
      **ranked by signal** — live RSSI/SNR, a green **direct** badge for anything in direct RF
      range, and a last-heard age.

      - **One-tap add** — tap a node to add it straight to your contacts (it keeps the right type:
      repeater, companion or room).

      - **Wardriving** — with a GPS fix it logs every node it hears against your position to a CSV
      on the SD card as you move, and paints your **RF coverage on the map** as a signal-coloured
      track (green = strong → red = weak). A standalone, on-device coverage mapper — no phone
      tethered.


      ## 📟 New boards

      - **Attaky Core** (ESP32-S3, 16 MB flash / 8 MB PSRAM) — a new board *(by @attakygit, #158)*.
      Experimental: beta channel only while hardware verification finishes.

      - **LilyGo T-Display P4 — TFT-LCD variant** — early support for the LCD screen model (the
      AMOLED variant was already supported). Experimental; the `wadamesh-tdisplay-p4-lcd-merged.bin`
      asset below is for LCD-screen units (flash at `0x0`).


      ## 🛠 Fixed

      - **LilyGo T-LoRa Pager** — the rotary encoder now keeps its focus inside the chat message
      list, and the composer navigation keys are remapped so moving around and typing a message no
      longer collide *(by @codemonkeybr, #162)*.


      ## 📦 Boards

      T-Deck · Heltec V4 TFT · Heltec V4-R8 · ThinkNode M9 · RAK TAP v2 · T-LoRa Pager (LR1121 /
      SX1262) · Attaky Core · T-Display P4. Flash `<board>-merged.bin` at `0x0` (full install) or
      `<board>.bin` for an app-only/OTA update.
  - version: beta_46
    name: wadamesh beta_46
    datetime: '2026-07-16T20:42:03Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_46
    prerelease: false
    notes: >-
      **wadamesh beta_46 — now the stable release.** This promotes beta_46 to stable; below is
      everything since the previous stable (**beta_45**).


      > ✅ Stable channel. Install via the [web flasher](https://flasher.wadamesh.com) (Stable), the
      LauncherHub **WADAMESH** entry, or a `-merged.bin` below. Newer test builds live on the Beta
      channel.


      🙏 **Community contribution:** huge thanks to
      **[@codemonkeybr](https://github.com/codemonkeybr)** (Tesso Codemonkey) for the **Do Not
      Disturb** feature (originally [#156](https://github.com/ALLFATHER-BV/wadamesh/pull/156)).


      ## 🛠 Fixed

      - **Contacts no longer go missing between reboots on microSD devices.** Saves are now
      **atomic** — written to a temp file and swapped in only once fully written — so an interrupted
      write can never truncate your contact list, and the card is mounted far more reliably at boot.
      *(If you've ever lost repeaters/contacts overnight, this is the fix — update to it.)*

      - **Heltec V4-R8** — the microSD card now mounts, and the freeze when waking the device from
      sleep is fixed.

      - **LilyGo T-Pager** — the map no longer shows a "storage error" under the launcher; it now
      caches tiles to the microSD card (like the T-Deck).

      - **Heltec V4 (portrait)** — the Bluetooth icon no longer overlaps the clock, and
      control-center buttons no longer clip when tapped.


      ## ✨ New

      - **Redesigned control center** — round quick-toggle buttons that spread to fill the panel, a
      frosted-glass look, real lock/bell glyphs, and a confirmation popup on every toggle.

      - **Do Not Disturb** *(by @codemonkeybr,
      [#156](https://github.com/ALLFATHER-BV/wadamesh/pull/156))* — set quiet hours in **Settings →
      Sound** to silence the incoming-message chime during a daily window, with a bell in the status
      bar while it's active. Plus a matching control-center quick-toggle (a bell that gains a slash
      while quiet hours are on).


      ## 📦 Boards

      T-Deck · Heltec V4 TFT · Heltec V4-R8 · ThinkNode M9 · RAK TAP v2 · T-LoRa Pager (LR1121 /
      SX1262) · T-Display P4. Flash `<board>-merged.bin` at `0x0` (full install) or `<board>.bin`
      for an app-only/OTA update.
  - version: beta_45
    name: wadamesh beta_45
    datetime: '2026-07-15T18:52:36Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_45
    prerelease: false
    notes: >-
      **wadamesh beta_45 — now the stable release.** This promotes beta_45 to stable; below is
      everything that landed since the previous stable (**beta_40**).


      > ✅ Stable channel. Install via the [web flasher](https://flasher.wadamesh.com) (Stable), the
      LauncherHub **WADAMESH** entry, or a `-merged.bin` below. Newer test builds live on the Beta
      channel.


      🙏 **Community:** big thanks to **[@codemonkeybr](https://github.com/codemonkeybr)** for the
      entire **LilyGo T-LoRa Pager** port
      ([#149](https://github.com/ALLFATHER-BV/wadamesh/pull/149)).


      ## ✨ Control wadamesh from a browser (over Wi-Fi — no app, account or cloud)

      - **Web control panel** — run the device from a phone or laptop browser: full **Chats,
      Contacts, Discovered, Terminal and Settings** tabs, served by the device itself. Turn on the
      **VNC** app, then open `http://<device-ip>:8765/` on the same network.

      - **VNC** mirrors the live screen and lets you drive it; **REMOTE** renders the whole UI at a
      larger, browser-friendly resolution with a Rotate button for desktop/phone layouts.

      - Web **Contacts** (search/sort/filter, distance + last-heard, per-contact actions, one-tap
      "Add" for Discovered nodes) and **Chats** (arrival pop-ups + beep, auto-refresh, acks +
      repeats-heard on messages you send from the browser).


      ## 🌐 On-device web browser + links in chat

      - New **"Web" app** (8 MB boards — T-Deck, Tanmatsu): open a URL and read the page as plain
      readable text — no proxy, tracking, JS or images — with tappable links and
      back/forward/refresh.

      - **Links in chat are tappable** — "Open in web", or "Create QR" to scan the link onto your
      phone (works on every board, incl. the Heltec V4).


      ## 📟 New boards

      - **LilyGo T-LoRa Pager** (ESP32-S3) — QWERTY + rotary-encoder handheld, no touchscreen; both
      radio variants (LR1121 / SX1262). *(by @codemonkeybr, #149)*

      - **LilyGo T-Display P4** (ESP32-P4) — AMOLED touchscreen handheld. Early port ("partially
      supported"): mesh, chat, map, GPS, phone-app companion work; BT pairing unavailable (stock
      coprocessor limit — use Wi-Fi/USB).

      - **Heltec V4-R8** (8 MB PSRAM + Expansion Kit V2 microSD) — "partially supported" while
      hardware testing finishes.


      ## 🛠 Fixed

      - **Heltec V4** map tiles now fill the whole map (2 MB-PSRAM tile-pool fix), and web/tile
      fetching is more resilient under memory pressure.

      - **Heltec V4-R8** random hard-freezes (shared-I2C bus wedge) fixed.

      - **Tanmatsu / keyboard-only boards** — the Wi-Fi name + password fields are
      selectable/editable again.

      - **T-Display P4** clock sets over Wi-Fi even where NTP is blocked; no more stuck bad-date.

      - **French (AZERTY)** on-screen keyboard spacebar restored in the normal letter view.

      - **REMOTE** works on the Heltec V4 (and 2 MB boards); keyboard-less boards leave it by
      holding the screen ~3 s, and the web page has an "Exit remote" button.


      ## 📦 Boards

      T-Deck · Heltec V4 TFT · Heltec V4-R8 · ThinkNode M9 · RAK TAP v2 · T-LoRa Pager (LR1121 /
      SX1262) · T-Display P4.
  - version: beta_44
    name: wadamesh beta_44
    datetime: '2026-07-13T15:30:35Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_44
    prerelease: true
    notes: >-
      **wadamesh beta_44** (test channel) adds an on-device text web browser, makes links in chat
      tappable, and fixes the French keyboard's missing spacebar.


      Flash it from **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (flip the **Beta**
      toggle), or grab a `-merged.bin` below (flash at `0x0`). On the device, beta testers can also
      enable **Settings → Get test builds (beta)**.


      ## New - on-device web browser

      A new **Web** app opens a URL and shows the page as plain, readable text - articles, wikis,
      docs, plain sites - right on the device. No proxy, no tracking, no JavaScript or images: just
      the words. Links are tappable, with back / forward / refresh.


      The browser needs the RAM only the 8 MB boards have (T-Deck, Tanmatsu), so it is **hidden on
      the 2 MB Heltec V4** - that board can't complete an on-device HTTPS handshake.


      ## New - tappable links in chat

      Links in a chat now render in blue. Tap one for a small menu:

      - **Open in web** - loads the page in the on-device browser (8 MB boards).

      - **Create QR** - shows a scannable QR code so you can open the link on your phone. This works
      on **every** board, including the Heltec V4 - so even where the browser isn't available, you
      can still bounce a link to your phone.


      ## Fixed

      - **French (AZERTY) on-screen keyboard**: the spacebar (and the OK / keyboard-switch keys) are
      back in the normal letter view. You no longer have to switch to the symbols page just to type
      a space. (A stray empty entry was cutting the keyboard map short.)

      - **Heltec V4**: web page fetching and map tiles are more resilient when memory is tight.

      - **Home signal & traffic box**: the "tap for details" cue is back at the top of the box.


      ---

      This is a **test-channel** (beta) build. Devices on the beta update feed will offer it; stable
      stays on beta_40.
  - version: beta_43
    name: wadamesh beta_43
    datetime: '2026-07-12T14:35:48Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_43
    prerelease: true
    notes: >-
      **wadamesh beta_43** (test channel) turns the browser control panel into a full remote app and
      fixes map tiles on the Heltec V4.


      Flash it from **[flasher.wadamesh.com](https://flasher.wadamesh.com)**, or grab a
      `-merged.bin` below (flash at `0x0`). Boards: LilyGo T-Deck and Heltec V4 TFT.


      ## New - web control panel

      The browser panel is now a full remote app, so you can run the device from a phone or laptop
      without picking up the T-Deck. Proper **Chats**, **Contacts**, **Terminal** and **Settings**
      tabs.


      - **Contacts**: search, sort and filter; each contact shows distance, coordinates and
      last-heard age; tap for the same actions as on the device (favourite, block, reset path,
      remove).

      - **Discovered nodes** appear in the browser with a one-tap **Add** to save them as contacts,
      so you can build your whole contact list from the web app.

      - **Chats**: pop-up notifications (with an optional beep) on a new message, and the open chat
      refreshes on its own as replies come in.

      - **Acknowledgements and repeats-heard** now show for messages sent from the web app.

      - A **Settings** page for the everyday options that make sense remotely, including live radio
      changes.

      - A **quick-command** button in the Terminal that drops common commands into the input.


      ## Fixed

      - **Heltec V4 map tiles**: tiles downloaded but only the top of the map rendered (the rest
      stayed black). The 2 MB-PSRAM V4 was running out of contiguous memory for the tile grid; tiles
      now reuse a small fixed pool and only load what is on screen, so the whole map fills in
      smoothly again.

      - **Heltec V4 remote/VNC**: typing from a physical keyboard in the browser now works (it
      previously only worked on the T-Deck).

      - **Remote-access screen** on the device is clearer: the IP address is at the top, the
      explanation is shorter and more accurate, the toggles sit above it, and the address box only
      appears once remote access is on.

      - **Terminal `help`** now lists every command, on both the device and the web terminal.


      ## Changed

      - The web app header shows the same signal, Wi-Fi, Bluetooth and battery icons as the device
      status bar, and the title reads **WADAMESH**.

      - Contact and chat sort/filter controls open a menu to pick an option instead of cycling on
      each tap.

      - New developer **Tile debug overlay** toggle in Map options (off by default) for diagnosing
      map-tile issues.


      ---

      This is a **test-channel** (beta) build. Devices on the beta update feed will offer it; stable
      stays on beta_40.
  - version: beta_42
    name: wadamesh beta_42
    datetime: '2026-07-11T21:35:50Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_42
    prerelease: true
    notes: >-
      ## wadamesh beta_42 (test build)


      Fixes for the REMOTE mode introduced in beta_41.


      Install from the web flasher at https://flasher.wadamesh.com (test channel), or grab a bin
      below.


      ### Fixed


      - **REMOTE mode now works on the Heltec V4 TFT** (and other 2 MB-PSRAM boards) instead of
      showing a black screen in the browser. Its off-screen renderer needed more free memory than
      those boards had, so nothing streamed; the buffers are sized to fit now, and the render is a
      bit smaller and faster as a result. VNC was never affected and already worked.

      - **Keyboard-less touch boards (Heltec V4, RAK WisMesh Tap) can leave REMOTE mode** again:
      touch and hold the device screen for about 3 seconds. Those boards have no SPACE key, which
      used to be the only on-device way out.


      ### New


      - The web page has an **"Exit remote"** button (with a confirmation) that leaves REMOTE mode
      from any browser, on any board.


      Boards in this build: LilyGo T-Deck, Heltec V4 TFT, ThinkNode M9, RAK WisMesh Tap V2.
  - version: beta_41
    name: wadamesh beta_41
    datetime: '2026-07-11T20:33:02Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_41
    prerelease: true
    notes: >-
      ## wadamesh beta_41 (test build)


      Experimental web control: view and drive the wadamesh UI from a phone or desktop browser over
      Wi-Fi. Two new apps, VNC and REMOTE.


      Install from the web flasher at https://flasher.wadamesh.com (test channel), or grab a bin
      below.


      ### New


      - **VNC app** (app drawer, between Advertise and Signal): mirrors the live device screen into
      a web browser over Wi-Fi and lets you drive it. Taps and typing in the browser control the
      device, and anything that changes on the device shows up in the browser. Turn it on, then open
      `http://<device-ip>:8765/` from any browser on the same network. The app page itself is
      scrollable.

      - **REMOTE app**: a headless mode that renders the whole UI at a larger, browser-friendly
      resolution and serves it over Wi-Fi, while the device's own screen drops to a placeholder
      showing the address to open. Turning it on or off reboots the device. On the web page a Rotate
      button flips between landscape (desktop) and portrait (phone); on the device, double-tap the
      space bar to leave remote mode.

      - Both are served by the device itself over plain Wi-Fi, no phone app, no account, no cloud.


      ### Note


      This is an experimental first cut, and an honest heads-up from Kaj: for me the remote UI still
      feels too slow, and I will most likely move toward a dedicated, lighter remote client instead
      of streaming the entire live UI. It is in this test build mainly because community feedback on
      it would be genuinely useful. If you try it, let us know how it runs for you and what you
      would actually want from a web or remote client.


      Boards in this build: LilyGo T-Deck, Heltec V4 TFT, ThinkNode M9, RAK WisMesh Tap V2.
  - version: beta_40
    name: wadamesh beta_40 (stable)
    datetime: '2026-07-10T16:36:42Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_40
    prerelease: false
    notes: >-
      **wadamesh beta_40 — new STABLE release.** The first stable since beta_35, rolling up
      everything from beta_36 through beta_40.


      Flash from the web installer at **https://flasher.wadamesh.com**, install via Launcher / the
      Tanmatsu store, or grab a `.bin` below.


      Huge thanks to the contributors who drove big parts of this release: **@scratchdiver**
      (full-history chat scrolling, reliable SD storage, atomic history saves), **@Yazutsu** (GPS
      quick-reply, keyboard-backlight fix), **ded** (complete ThinkNode M9 support), **Ethac.chen**
      (RAK WisMesh Tap V2), and **jochentj** (Tanmatsu ALT accents). And to Leon P and MrWeavis for
      the persistence bug reports that shaped the storage fixes.


      ## New

      - **Translations** — hundreds of previously-English strings across menus, settings, dialogs
      and setup are now translated into all 11 non-English languages (NL, DE, FR, ES, IT, RU, UK,
      BG, SR, EL, PT-BR), icon-prefixed rows included.

      - **Full-history chat scrolling** (scratchdiver, #130) — scroll a chat through its ENTIRE
      stored history (up to 5000 messages on SD devices), smooth in bubble and compact mode.

      - **Message delete** — long-press a message to delete just that one; "Delete history" in
      chat/channel settings wipes a whole conversation. Slim, auto-fading in-chat jump arrows.

      - **Two new boards** — **ThinkNode M9** (ded, #138) and **RAK WisMesh Tap V2** (Ethac.chen,
      #136), both installable from the web flasher.

      - **Storage & setup** — "Store data on SD" is reliable (scratchdiver, #123); full-screen Wi-Fi
      network pages; lock-screen unread-message count (#93); special-character password entry with a
      Sym picker (#122); "Save update bin to SD" for Launcher installs.

      - **Radio** — new "Australia (Mid)" region preset (#121).

      - **Quick send** — GPS position is the first quick-reply row (Yazutsu, #125).

      - **Tanmatsu** — ALT-accents and double-tap-space language switching (jochentj, #129); active
      keyboard language shown in the chat top bar.


      ## Fixed

      - **Card-less devices (Heltec V4 etc.) no longer freeze** for seconds at a time —
      advert-driven contact rewrites to internal flash are coalesced, so the flash
      garbage-collection stalls stop.

      - **Deletes stick and are fast** (Leon P, MrWeavis) — a deleted message / cleared chat
      survives a reboot or hard reset, and history is written compactly so saves no longer pause the
      screen.

      - **No more lost messages** on reboot from the phone app (Leon P); atomic, fallback-guarded SD
      history saves (scratchdiver, #135).

      - **Profile/identity migration** to SD is safe on upgrade, with a recovery button if you were
      hit by the empty-card adoption bug.

      - **Long translated labels fit** — the message menu, confirmation dialogs, and app-drawer
      tiles shrink oversized text to one line instead of clipping/wrapping; the signal-card hint no
      longer overlaps.

      - **Emoji picker** — the food/object glyphs that showed as empty boxes now render.

      - **Tanmatsu** — profile/identity persist reliably across reboots; full-size accents at
      Large/Huge scales; About shows the correct firmware version.

      - **T-Deck** — recovers automatically from the stuck "phantom finger" touch glitch; touch init
      retries at boot. Keyboard-backlight "Off" preset actually turns it off (Yazutsu, #88).


      ## Boards

      LilyGo T-Deck / T-Deck Plus, Heltec V4 + TFT, ThinkNode M9, RAK WisMesh Tap V2 (bins below);
      Tanmatsu ships via the Tanmatsu launcher store. For a Launcher side-load use the app-only
      `.bin` (not `-merged`).
  - version: beta_39
    name: wadamesh beta_39
    datetime: '2026-07-09T21:46:09Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_39
    prerelease: true
    notes: >-
      **wadamesh beta_39** (TEST channel) — on top of beta_38.


      Flash from the web installer at **https://flasher.wadamesh.com**, install via Launcher / the
      Tanmatsu store, or grab a `.bin` below.


      ## New

      - **Big translation pass.** Hundreds of strings that were still English — across menus,
      settings, dialogs and the setup flow — are now translated into all 11 non-English languages
      (Dutch, German, French, Spanish, Italian, Russian, Ukrainian, Bulgarian, Serbian, Greek,
      Brazilian Portuguese). Menu rows that carry an icon now translate too, instead of silently
      falling back to English. Pick a language under Settings.

      - **ThinkNode M9** and **RAK WisMesh Tap V2** can now be installed straight from the web
      flasher.


      ## Fixed

      - **Deletes stick now.** Deleting a message, or clearing a whole chat, survives a reboot or a
      hardware reset instead of coming back (reported by Leon P and MrWeavis). The delete used to
      sit in a save that was batched up to 30 seconds later, so a reset in that window undid it.

      - **Deleting is fast.** Chat history is now written compactly — only the messages you actually
      have, instead of the full 5000-slot ring every time — so a delete, a history wipe, or a reboot
      no longer pauses the screen while it saves. Normal message saving is lighter too.

      - **Emoji picker:** the food/object emoji that showed as empty boxes (umbrella, coffee, pizza,
      cake, rocket, camera, phone, laptop, calendar, antenna, e-mail, house, car, watch) now render
      — they were listed but never baked into the font.


      ## Boards

      T-Deck / T-Deck Plus, Heltec V4 + TFT, ThinkNode M9, RAK WisMesh Tap V2 (bins below); Tanmatsu
      ships via the Tanmatsu launcher store. For a Launcher side-load use the app-only `.bin` (not
      `-merged`).
  - version: beta_38
    name: wadamesh beta_38
    datetime: '2026-07-09T11:22:29Z'
    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_38
    prerelease: true
    notes: >-
      Test-channel build. Flash it from [flasher.wadamesh.com](https://flasher.wadamesh.com) (enable
      test builds) or grab the bins below; on-device via About with the test-builds toggle on.


      Big community drop: the headline chat rework is by @scratchdiver, the ThinkNode M9 reaches
      hardware-complete thanks to @446564, and the RAK WisMesh Tap V2 port lands from
      @Ethan-chen1234-zy. Thanks also to Leon P for the report that pinned down the reboot message
      loss.


      ## Full-history chat scrolling, by @scratchdiver (#130)


      Chats now scroll through the ENTIRE stored history, up to 5000 messages on SD-card devices,
      smoothly in both bubble and compact mode, instead of only the newest rows. Several LVGL crash
      fixes came along for the ride. On top of it:


      - Long-press any message for a new Delete option; the message menu lays out two buttons per
      row so it always fits on one screen.

      - Chat and channel settings gain "Delete history" (confirmation, keeps the channel or
      contact).

      - The jump buttons are now slim arrows at the right edge: fully visible while scrolling,
      fading to half opacity a second after you stop.


      ## ThinkNode M9 hardware-complete, by @446564 (#138)


      GPS, microSD, buzzer, backlight control, lock screen, long-press context menus and a
      d-pad-driven setup wizard. Two of the fixes (nested-page focus scrolling and the lock-screen
      paint order) improve every keyboard-nav board.


      ## RAK WisMesh Tap V2, by @Ethan-chen1234-zy (#136)


      New board support in the source tree with a 30+ fps LovyanGFX display driver. Prebuilt images
      follow once web-flasher integration lands.


      ## Fixed


      - Messages no longer vanish when rebooting the device from the phone app (reported by Leon P):
      the history writer batches saves up to 30 seconds apart and the app's reboot command skipped
      the final save that the on-device power menu performs. It saves first now.

      - T-Deck: enabling "Store data on SD" migrates your existing profile, settings and identity to
      the card FIRST. Upgrading to beta_36/37 with the toggle already on could adopt an empty card
      and boot as a brand-new node while the real profile sat orphaned on internal flash.

      - T-Deck: already hit by that? Set -> General -> "Copy internal data to SD" restores the
      profile from internal flash (confirmation, then automatic reboot). Until then, toggling "Store
      data on SD" OFF and rebooting brings the old profile back.

      - Tanmatsu: profile name, settings and node identity now persist reliably across reboots
      (moved to the SD card; the internal flash metadata layer on this board is unreliable).
      Existing data is rescued automatically on first boot.

      - Tanmatsu: the app builds size-optimized now, roughly 300 KB smaller, with real headroom
      under the launcher's app-size limit.
  - version: beta_37
