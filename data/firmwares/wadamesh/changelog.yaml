    url: https://github.com/ALLFATHER-BV/wadamesh/releases/tag/beta_92
    prerelease: true
    notes: >-
      Test build, on top of beta_91. Stable stays **beta_85**.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (switch the toggle to
      Beta), or update on the device if you have "Get test builds (beta)" turned on.


      ## Faster screens


      The screens draw faster. Measured on a T-Deck with the still aurora, in milliseconds per
      frame:


      | | beta_91 | beta_92 |

      |---|---|---|

      | Home redraw | 126 | 85 |

      | App drawer scroll | 102 | 69 |

      | Chat list scroll | 70 | 49 |

      | Settings scroll | 88 | 62 |

      | Conversation scroll | 84 | 64 |


      That is a third to a half more frames a second, with the same pixels. The T-Deck drew every
      frame in 14 slices, each a walk through the whole screen, and now draws it in 6; the still
      aurora is drawn once and copied instead of worked out again every frame; and the drawing code
      is compiled for speed, with its busiest loops in the chip's fast memory.


      The same treatment reaches the **ThinkNode M9, Attaky, RAK WisMesh Tap V2, Wio Tracker L2,
      CrowPanel 3.5 and Heltec V4-R8**, and the **T-LoRa Pager** draws in fewer slices. Those were
      not tested on their own hardware yet, so please report how scrolling feels there, and anything
      that looks off. The **Heltec V4** gets the smaller part (rounded corners and gradients are
      cached now); it has no flash left for the rest.


      ## Fixes


      - **Hop counts above 64** (#621, reported by @jesshampshire): with 2- and 3-byte path hashes
      the hop count shares its byte with the hash size, and the Discovered list, the "auto-delete
      above N hops" setting and the direct-neighbour checks read the whole byte. The auto-delete
      setting could throw away nodes one hop away.

      - **Arabic** (#582, thanks @jcyrio and a native-speaking tester): letters join properly (آ, ئ,
      ة and the Persian digits were wrong in the graphics library), Shift gives the Arabic 101 shift
      layer (أ إ آ, لأ لإ لآ, ، ؛ and the tashkeel), ك is on 8, ! $ @ type themselves again and ?
      types ؟. Text leaves the device as standard Arabic letters, so a #channel name gives the same
      channel as on a phone.

      - **Info popup colours** (#602): a long repeater name that wraps no longer scrambles the
      colours and lines after it. @NewtsLament found the cause.

      - **Chat settings on keypad boards** (#623, reported by @bobbythefett): on the ThinkNode M9,
      Tanmatsu and T-LoRa Pager, move up to the conversation header and press Enter for a chat's
      settings, Region & scope included.

      - **Browser start page** (#622, an idea from @jesshampshire): with no home page on the SD card
      and Wi-Fi up, the browser opens the [changelog](https://wadamesh.com/changelog.html).

      - **Theme > Background > Colour** changed the accent colour instead; it sets the background
      now.

      - **T-Display P4 with Wi-Fi that never connects** (#612): the flasher now offers "factory
      Wi-Fi chip" images (the `-at` files below), for units whose Wi-Fi chip still runs LilyGo's
      original firmware. Thanks @jalevdev for spotting the missing choice (#619).


      Built and checked on a LilyGo T-Deck. Every other board builds. Please report what you find
      with "Send a test report" in Settings > About, or an issue here.
