    notes: >-
      Test build. Stable is **beta_85**.


      Flash it at **[flasher.wadamesh.com](https://flasher.wadamesh.com)** (switch the toggle to
      Beta), or update on the device if you have "Get test builds (beta)" turned on.


      Most of this drop is [@oumike](https://github.com/oumike)'s, with two fixes from
      [@jcyrio](https://github.com/jcyrio).


      ## Read this if you own a T-Display P4


      **beta_86 and beta_87 do not boot on older P4 units.** If yours has been dark and restarting
      since you updated, this build fixes it, and you are not alone: three people hit it.


      The P4 ships with one of two different firmwares on its C6 radio co-processor. Newer units run
      esp-hosted, which is what beta_86 switched to; older units still carry the factory ESP-AT, and
      on those the two sides could never agree. That alone should have cost you Wi-Fi. Instead the
      co-processor driver rebooted the whole board about ten seconds into every boot, and the Wi-Fi
      handshake sat in front of the display, so the screen never got as far as drawing.


      Two things changed. The screen, touch and LoRa now come up before anything talks to the C6, so
      a co-processor that cannot be reached can no longer take the device with it. And the driver no
      longer restarts the board, or spins retrying, when the link is never going to work.


      **If you have an older unit, there is now a build that matches it.** Look for the entries
      marked "older unit, ESP-AT C6" in the flasher, or the `-at` files below. Those restore Wi-Fi
      as well. If you are not sure which you have, flash the normal one: it will work, and you will
      know by whether Wi-Fi does.


      Thanks to [@jalevdev](https://github.com/jalevdev) for the report and a log that named the
      cause (#600).


      ## A channel message could go out on the public channel


      If a channel went missing while you had its chat open, and you sent from the web interface,
      the message did not fail. It went out on the first channel on the device, which is normally
      the public one, with nothing on screen to say so.


      The web path did look the channel up by name before sending. It then fell back to the thread's
      remembered slot when that lookup failed, which is exactly the thing the lookup existed to
      protect against: after a channel is added or removed the slots shift, so the remembered one
      points at a different, still valid channel. It now refuses and says so, which is what the
      on-device composer already did. The check also moved to the one point every sender passes
      through.


      Reported by [@TippyLion28](https://github.com/TippyLion28) (#588, #589).


      ## Fixes


      - **Deleting a chat's history no longer deletes the chat.** The confirmation always said the
      chat would stay. It does now, and Delete chat is still how you remove it. By
      [@jcyrio](https://github.com/jcyrio) (#587).

      - **The T-LoRa Pager stops losing half an hour a day.** The clock ran off the processor's own
      timer and drifted, while the accurate clock chip beside it was only read at boot. It is read
      back hourly now. [@jcyrio](https://github.com/jcyrio) diagnosed this from the source before
      filing it (#583).

      - **The ThinkNode M9's bottom icons have stopped flashing.** They carry a count now and show
      only when they mean something. The new-nodes one used to blink forever because it counted
      every node ever heard rather than the ones you had not looked at.

      - **"100%" is no longer hidden behind the signal bars** on the M9 and the Heltec V4-R8, at any
      text size, and it no longer jumps back when you plug in a charger. Reported by buko84 and
      jd1227.

      - **The status-bar clock no longer sits under the Bluetooth icon**, which
      [@DenRalle](https://github.com/DenRalle) spotted while asking about something else (#594).

      - **Map tiles cache again on a P4 with no SD card.** The cache was pointed at a filesystem
      nothing had mounted.

      - **The Secondary keyboards page named a key the Pager does not have.** T-LoRa Pager, T-Deck
      Pro and T-Deck Max were told to tap an on-screen language key; double-tap SPACE is what
      actually switches layout there. By [@jcyrio](https://

