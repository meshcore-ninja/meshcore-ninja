      ## New


      - **Settings opens with a Device page:** what this unit is, its radio and hardware, and the
      About information, with Run setup again and Reboot. The group with Display, Theme, Lock
      screen, Sound and Keyboard is now called **Display & lock** (#630 by @oumike, asked for by
      @Jess-39 in #596).

      - **First-time setup keeps Bluetooth on** and shows a switch for it (#416, by @oumike).

      - **T-Display P4:** a one-row status bar with the title on the left and the clock beside the
      icons, and Settings in landscape uses two real columns (by @oumike).

      - In a chat, the clock and battery stay at the height they have on every other screen (by
      @oumike).

      - **USB Files can put Lua apps on the device:** drop a `.lua` or `.json` file into the apps
      folder (`meshcomod/apps` on the SD card) at [files.wadamesh.com](https://files.wadamesh.com),
