      The large font presets are usable across the whole interface now, not just in chat.


      Chat rows, the composer and the Pager's line spacing size themselves from the font's real
      metrics instead of fixed pixel heights, so nothing clips or overlaps at the bigger presets.
      Contact detail menus, the contact share panel, mentions, the overview header and its action
