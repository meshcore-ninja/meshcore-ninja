      Most of this beta is contributed work: **@PixPMusic** (storage and Pager fixes) and
      **@mikecarper** (the new send retry). Thank you both.


      ---


      ### Sends retry until the mesh has heard them


      Until now a message was transmitted exactly once. If that single transmission collided with
      other traffic or a repeater was mid-hop, it was simply gone — the app showed it as sent, the
      mesh never saw it. Built by **@mikecarper** (#207): the device now listens for evidence its
      message went out (a repeater echoing it, or the delivery ACK) and retransmits on a growing
      backoff until something confirms it was heard — direct and flood sends alike, including sends
      from the phone app. If you prefer the old single-shot behaviour, there is a new toggle under
      **Settings → Radio & Mesh → "Retry sends until heard"** (on by default).


      ### Saving settings on SD storage was broken


      If your device stores data on the SD card (T-Deck, V4-R8, Pager, Launcher installs), every
      settings save has been failing with "Couldn't save name to storage" and quietly surviving only
      through a recovery file. The commit step renamed a file onto itself because both rename
      arguments shared one path buffer, so it could never succeed. Found and fixed by **@PixPMusic**
      (#211).


      Two more storage fixes from the same series: watchdog state is now preserved around long
      SD/flash work instead of being blindly re-armed afterwards, which removes a cause of spurious
      watchdog reboots (#213), and preference reads no longer hand out pointers into a shared cache
      that another task could invalidate mid-read (#212).


      ### Pager radio: the oscillator voltage was wrong


      The SX1262 T-Lora Pager drove its radio oscillator at a generic 1.6 V fallback; LilyGo's own
      reference code uses 3.0 V for this exact board. The result was a weak link — transmissions
      nearby nodes missed, ACKs that never arrived. **@PixPMusic** confirmed on hardware that the
      voltage was the difference (#209).


      ### Fixes


      - **Discover froze when a node name contains an emoji or a `#`.** The scanner list colours
      each row with text markup, and a name cut mid-emoji (or a stray hash) broke that markup for
      every row after it — the list looked frozen from that point on. Names are now cleaned and
      escaped before display, here and in the message-info repeat list. Reported by **@4nuts** with
      the exact culprit name, "Ouderkerk☀️" (#223).

      - **Formatting an SD card on the V4-R8 or ThinkNode M9 hung forever.** The Format button
      exists on both boards, but the code that performs the format was only compiled for the T-Deck
      — the "this can take up to a minute" notice stayed up with nothing running behind it, and the
      card stayed unusable until a reboot. Reported by **@TrustYourTechnoLust** (#172).

      - **Files-app Copy/Paste silently did nothing except on the T-Deck** — same root cause as the
      format hang, fixed the same way.


