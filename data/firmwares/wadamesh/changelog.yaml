      ## Console mode is new, and it is very early


      Console mode boots the device into a plain text console with **no graphical interface at
      all**: no LVGL, no widgets, no draw buffer. You type commands, you read replies, and the
      memory and processor time the interface would have used are yours instead.


      **Please read this as a first look, not a feature.** It has had one day on hardware. Most of
      the graphical interface is simply not there: no map, no file manager, no Lua apps, no settings
      editor. Expect missing commands, rough text layout and things you reach for that do not exist
      yet.


      - It is **off by default**, in Settings > General, marked experimental. Toggling it reboots.

      - Type `ui` or `exit` to come back.

      - If it ever crashes on the way up, the device notices and returns to the graphical interface
      on its own, so you cannot strand yourself in it.

      - What works today: contacts, channels, unread counts, reading a thread, sending to a contact
      or channel, a live monitor of arriving messages, radio and battery and Wi-Fi readouts,
      discovery, a numbered quick-launch menu, and anything the node CLI already answers.


      The most useful thing you can send us is what you reached for and could not find.


      ## ThinkNode M9 compass, GPS motion and a GPS Compass app, by @cvhviz
      ([#292](https://github.com/ALLFATHER-BV/wadamesh/pull/292))


      The M9's magnetometer was on the board and nothing had ever talked to it. The driver is
      written from the chip's own register map rather than a library that writes the sample rate
      into the wrong register, and the axis orientation was **measured on hardware** at four
      headings ninety degrees apart rather than inherited from a declaration nobody had verified. A
      calibrated device points north with no setup.


      The new **GPS Compass** app in the Store gives you a dial with bearing and range to a chosen
      contact, a satellite meter, hard-iron calibration and per-row imperial or metric units. On
      boards without a magnetometer it falls back to GPS course over ground.


      It also carries a set of fixes found while testing on real hardware, which affect every board:


      - Opening the Map cost about 2.5 seconds **every single visit**, because leaving the tab threw
      away every decoded tile. Boards with the memory now keep them: roughly ten times faster to
      return.

      - Lua apps opened on a white page on keyboard and trackball boards.

      - An app closed mid-request could free the buffer the other processor core was still reading
      from.

      - The `icon` field in an app manifest finally does something. Every app had been drawing the
      same generic glyph.


      Apps can also read speed and heading from the GPS, and the raw field vector where there is a
      magnetometer.


