    notes: >-
      **wadamesh beta_46 — now the stable release.** This promotes beta_46 to stable; below is
      everything since the previous stable (**beta_45**).


      > ✅ Stable channel. Install via the [web flasher](https://flasher.wadamesh.com) (Stable), the
      LauncherHub **WADAMESH** entry, or a `-merged.bin` below. Newer test builds live on the Beta
