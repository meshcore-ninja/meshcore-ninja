  - version: room-server-v1.17.1
    name: Room Server Firmware v1.17.1
    datetime: '2026-08-14T13:31:40Z'
    url: https://github.com/meshcore-dev/MeshCore/releases/tag/room-server-v1.17.1
    prerelease: false
    notes: >-
      ## Download


      Latest firmwares are in the [flasher.meshcore.io](https://flasher.meshcore.io/)


      ## Change Log


      ### New Features


      -   [#3137](https://github.com/meshcore-dev/MeshCore/pull/3137) new ‘get/set
      radio.fem.rxgain/txgain’ CLI commands (txgain is Station G3 only), fixed pref mapping for
      radio.fem.rxgain

      -   [#3148](https://github.com/meshcore-dev/MeshCore/pull/3148) added missing kiss radio
      roles, kiss radio build added to build.sh


      ### Enhancements


      -   [#3106](https://github.com/meshcore-dev/MeshCore/pull/3106) login response no longer sent
      as flood on direct login, fix for unscoped flood login

      -   [#3146](https://github.com/meshcore-dev/MeshCore/pull/3146) LR2021: PREAMBLE\_DETECTED bit
      and IRQ rx timeout logic

      -   [#3154](https://github.com/meshcore-dev/MeshCore/pull/3154) NRF52 CC310:
      nRFCrypto.begin()/end() now called only once

      -   [#3166](https://github.com/meshcore-dev/MeshCore/pull/3166) RadioLibWrapper noise floor
      debug print moved behind new `MESH_DEBUG_NOISE_FLOOR` flag

      -   [#3206](https://github.com/meshcore-dev/MeshCore/pull/3206) nRF RadioNoiseListener RNG now
      combines entropy from radio and CC310


      ### Bug fixes and Other


      -   [#3140](https://github.com/meshcore-dev/MeshCore/pull/3140) T-Echo Lite pins aligned to
      updated Lilygo schematic, TCXO voltage set to 3.0V

      -   [#3142](https://github.com/meshcore-dev/MeshCore/pull/3142) build fix for R1 Neo and
      Minewsemi repeater

      -   [#3158](https://github.com/meshcore-dev/MeshCore/pull/3158) Rx boosted gain no longer
      reset to compiled value after AGC reset

      -   [#3164](https://github.com/meshcore-dev/MeshCore/pull/3164) T-Beam Supreme S3 display fix

      -   [#3170](https://github.com/meshcore-dev/MeshCore/pull/3170) ProMicro pinmap tidy up, LoRa
      pins moved to variant.h

      -   [#3185](https://github.com/meshcore-dev/MeshCore/pull/3185) T-Echo Card TCXO voltage set
      to 3.0V as per [#3140](https://github.com/meshcore-dev/MeshCore/pull/3140)

      -   [#3188](https://github.com/meshcore-dev/MeshCore/pull/3188) Heltec T096 Tx failure fixed
      (out of bounds PIN\_SPI1\_MISO)

      -   [#3189](https://github.com/meshcore-dev/MeshCore/pull/3189) Heltec T1 / MeshPocket /
      T-Echo Lite: unused pin fix ([root
      cause](https://github.com/meshcore-dev/MeshCore/issues/3151#issuecomment-5268905160))

      -   [#3203](https://github.com/meshcore-dev/MeshCore/pull/3203) Companion:
      fem\_radio\_rx/txgain pref disabled until settable.


      ## Fixes and enhancements for devices with FEM


      The `radio.fem.rxgain` setting was not being persisted properly in v1.17.0, this is now fixed.
      Repeater admins will want to check that `radio.fem.rxgain` and `radio.rxgain` are configured
      to their liking after updating. Companion firmware currently has no way to configure these
      settings, so they they will use the default values only for now.


      ## Heltec T096 Transmit issue fix


      The Heltec T096 transmit issue was found to be an out of bounds read of the pin map due to
      `PIN_SPI1_MISO` being set to -1. It was causing the FEM’s Tx enable pin to stop working. This
      has been fixed and other NRF52 boards have had their unused pins corrected.
    notesUrl: https://blog.meshcore.io/2026/08/14/release-1-17-1
