      ## [0.1.37-alpha] - 2026-07-04

      ### Changed / 变更

      - Reworked the Settings Date/Time dialog into a bounded six-column datetime picker for year,
      month, day, hour, minute, and second, replacing free text input with scroll-only selection,
      explicit keyboard focus traversal, and automatic day-range clamping. / 将 Settings
      的日期时间弹窗重做为有界六列 datetime picker（年、月、日、时、分、秒），用滚动选择替代自由文本输入，补上明确的键盘焦点移动顺序，并自动收口当月合法日期范围。


      ### Fixed / 修复

      - Fixed Shutdown confirmation dialog CJK rendering by routing translated labels through the
      shared localized font fallback instead of forcing the ASCII Montserrat font. / 修复 Shutdown
      确认弹窗的中文显示：翻译文本改走共享 localized font fallback，不再强制使用只覆盖 ASCII 的 Montserrat 字体。




