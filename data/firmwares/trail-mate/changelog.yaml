    notes: "## [0.1.43-alpha] - 2026-08-28\r\n\r\n### Fixed\r\n\r\n- Fixed ESP32 timezone changes so they apply without restarting the device and are\r\n  synchronized to the SD working configuration before a later boot can restore an older\r\n  `config.tms` value (#86).\r\n\r\n\n\n## What's Changed\n* Codex/t display p4 lilygo display chain by @vicliu624 in https://github.com/vicliu624/trail-mate/pull/85\n* Codex/fix issue 86 timezone persistence by @vicliu624 in https://github.com/vicliu624/trail-mate/pull/87\n\n\n**Full Changelog**: https://github.com/vicliu624/trail-mate/compare/v0.1.42-alpha...v0.1.43-alpha"
