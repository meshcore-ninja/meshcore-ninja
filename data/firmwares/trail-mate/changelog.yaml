    prerelease: true
    notes: "## [0.1.33-alpha] - 2026-06-28\r\n### Fixed / 修复\r\n- Fixed Meshtastic Android/iOS peer identity projection for MQTT map-report nodes by decoding `MAP_REPORT_APP` through the shared node metadata path, preserving public-key state correctly, and preventing map reports from being retransmitted as normal LoRa downlink packets. / 修复 Meshtastic Android/iOS 中 MQTT 地图上报节点的对方身份展示：通过共享节点元数据路径解析 `MAP_REPORT_APP`，正确保留公钥状态，并防止地图上报被当成普通 LoRa 下行包转发。\r\n- Fixed route/track file loading so GPX and KML files are parsed through bounded streaming readers, including KML `<coordinates>` token parsing and active route overlay loading from `route_path`. / 修复路线/轨迹文件加载：GPX 与 KML 均通过有界流式读取解析，包括 KML `<coordinates>` token 流式解析，以及从 `route_path` 加载活动路线 overlay。\r\n\r\n\n\n**Full Changelog**: https://github.com/vicliu624/trail-mate/compare/v0.1.32-alpha...v0.1.33-alpha"
