    notes: "## MeshCore EastMesh Observer with ESP-NOW Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-espnow` firmware for MeshCore boards that combine secure MQTT uplink with ESP-NOW bridge support, based on MeshCore firmware `v1.17.1` (as of 2026-08-15).\r\n\r\nThis release includes the same Observer updates as `observer-eastmesh-v2026.8.2` — the new Wi-Fi gateway connectivity watchdog, the `wifi reconnect` command, and the upstream MeshCore v1.17.1 base — with ESP-NOW bridge support included.\r\n\r\n### What's Changed\r\n\r\n- Same changes as `observer-eastmesh-v2026.8.2`:\r\n  - **New: gateway connectivity watchdog.** While connected, the node ARP-probes its gateway every 30 seconds. If the gateway stays silent for 3 minutes (for example, an AP that keeps beaconing after losing its wired uplink), the node forces a full disconnect and rescan on its own so it can roam to a healthy AP, backing off up to 48 minutes between attempts while the outage persists.\r\n  - Added `wifi reconnect` to drop the current association and rejoin from a full channel scan — for nodes that report connected but are unreachable over the network.\r\n  - Extended `get wifi.status` with gateway health (`gw:ok|lost`) and the watchdog reconnect count (`wd:<n>`), also shown in the web panel.\r\n  - Merged upstream MeshCore `v1.17.1`, including improved reply routing (direct requests reply over known return paths, and replies fall back to the default scope when the request scope is unknown), LR2021 radio improvements, and board/platform fixes.\r\n  - Fixed the RX boosted gain setting reverting to the compiled-in default after an automatic gain control reset (SX126x radios).\r\n  - Adopted upstream's SH1106 display address fallback (0x3C/0x3D) so board revisions with the other SA0 strap setting still get a working display, while keeping the EastMesh T-Beam S3 Supreme bring-up order and headless fallback.\r\n- Includes ESP-NOW bridge firmware targets using the `*_repeater_observer_espnow` PlatformIO environment suffix.\r\n\r\n### Breaking Changes\r\n\r\n- None in 2026.8.2. (If upgrading from 2026.7.x or earlier: saved settings move to the new `prefs.json` format on first boot, and downgrading afterwards reverts the device to the old pre-migration settings file.)\r\n\r\n### Notes\r\n\r\n- **If your observer has ever sat \"connected\" with good signal but unreachable on the network until someone rebooted it, this release is the fix** — the watchdog now detects the dead gateway and reconnects automatically. `wd:<n>` in `get wifi.status` counts these forced reconnects since boot.\r\n- This track is separate from `observer-eastmesh`.\r\n- Use `get wifi.status` to confirm the active 2.4 GHz Wi-Fi channel before setting `bridge.channel`.\r\n- `bridge.channel` should match the connected Wi-Fi channel for reliable ESP-NOW bridge operation.\r\n- For maximum heap headroom after setup, disable the web panel with `set web off`.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
  - version: companion-wifi-v1.17.1
    name: Companion WiFi Firmware v1.17.1
    datetime: '2026-08-15T00:16:59Z'
    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/companion-wifi-v1.17.1
    prerelease: false
    notes: "## MeshCore EastMesh Companion WiFi\r\n\r\nThis is standard MeshCore companion WiFi firmware based on MeshCore `v1.17.1`, with EastMesh additions for Wi-Fi setup and recovery.\r\n\r\n### What's Changed in 1.17.1\r\n\r\n- Updated the firmware base to upstream MeshCore `v1.17.1`.\r\n- Fixed the RX boosted gain setting reverting to the compiled-in default after an automatic gain control reset (SX126x radios) — the value you set now sticks.\r\n- Included upstream board, radio, display, and platform fixes from MeshCore dev, including external FEM gain groundwork for companion builds.\r\n\r\n### What's Different from Stock MeshCore\r\n\r\n**Recovery access point.** If the device has no Wi-Fi credentials, or can't connect to its network for 60 seconds, it broadcasts its own `EastMesh-WiFi` access point so you can fix the Wi-Fi settings in place — no serial cable needed. The AP shuts down automatically once the device connects to its configured network.\r\n\r\n- The AP password is the device pin, zero-padded to 8 digits. Devices with a screen show the pin on the home screen (`Pin:NNNNNN` → password `00NNNNNN`); headless devices default to pin `123456` (password `00123456`); `set pin <pin>` overrides both.\r\n- Once connected to the AP, the rescue CLI is available over TCP: `telnet 192.168.4.1` (or `nc 192.168.4.1 23`), then `set wifi.ssid <ssid>`, `set wifi.pwd <password>`, `reboot`.\r\n- The companion app works over the recovery AP too: connect to host `192.168.4.1` port `5000`.\r\n\r\nThe EastMesh Wi-Fi CLI commands, available over serial rescue and the recovery AP:\r\n\r\n- `get wifi.status`\r\n- `get wifi.ssid`\r\n- `get wifi.powersaving`\r\n- `set wifi.ssid <ssid>`\r\n- `set wifi.pwd <password>`\r\n- `set wifi.powersaving none|min|max`\r\n\r\n### Breaking Changes\r\n\r\n- None in 1.17.1. (If upgrading from 1.16.x or earlier: saved settings move to the new `prefs.json` format on first boot, and downgrading afterwards reverts the device to the old pre-migration settings file.)\r\n\r\n### Notes\r\n\r\n- Headless devices in public areas should set a custom pin (`set pin <pin>`) — the default recovery AP password `00123456` is documented, so treat it like a default router password\r\n- Everything else behaves like the normal MeshCore companion WiFi firmware\r\n- Use the file that matches your board exactly\r\n- Companion WiFi releases use the upstream MeshCore version number\r\n\r\n### Documentation\r\n\r\nhttps://xjarid.github.io/MeshCore-EastMesh/\r\n\r\n### Flashing\r\n\r\n- https://flasher.eastmesh.au/\r\n- https://flasher.meshcore.io/\r\n\r\n### Assets\r\n\r\n- `.bin` – standard update\r\n- `-merged.bin` – full image (after erase, ESP32)"
