    prerelease: false
    notes: "## MeshCore EastMesh Room Server with MQTT Bridge\r\n\r\nEastMesh `room-server-eastmesh-bridge-mqtt` firmware: a MeshCore room server with Wi-Fi, a local web panel, an MQTT mesh bridge, and post sync between room servers, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\n**This is the first release of the Room Server MQTT bridge track**, built by popular demand. Room servers that share a broker, topic and secret now share their posts: post to one room and every other room on the topic gets it.\r\n\r\n### What's New\r\n\r\n- **Room sync.** Posts made to a room, by a client or with `room.post`, are published to `meshcore/rooms/<topic>`. Every room server on the same broker, `bridge.topic` and `bridge.secret` stores them under the original author and pushes them to its own logged-in clients.\r\n  - Posts are encrypted and authenticated with a key derived from the topic and secret. Room servers with a different secret ignore them.\r\n  - Duplicates and the broker's echo are ignored, and posts are never re-published, so they can't loop.\r\n  - Posts older than 24 hours by the sender's clock are dropped as replays. Keep NTP working.\r\n- **MQTT mesh bridge.** Room servers bridge mesh packets on the shared `meshcore/bridge/packets` topic, so they also join existing Observer MQTT bridges on the same broker and secret.\r\n- **Repeating is on by default** in this firmware so bridged packets reach LoRa. Turn it off with `set repeat off`.\r\n- **Room server web panel** at `https://<room-ip>/`:\r\n  - status tiles for Wi-Fi, MQTT Bridge and Room Sync\r\n  - room name, location, room password, read-only logins and admin password\r\n  - Wi-Fi SSID and password\r\n  - broker `host:port`, username, password, room sync topic and repeat\r\n  - community radio presets, the AU region selector and TX power\r\n  - **Start OTA**, plus **direct firmware upload** that refuses `.bin` files named for a different board and `-merged.bin` images\r\n  - a CLI box with quick buttons\r\n- **Local HTTPS API**, the same as observers: `/login`, `/api/session`, `/api/command`, `/api/firmware-update` and `/api/stats?view=legacy`.\r\n- **IP address on the display** for room servers with a screen.\r\n- **New CLI commands:** `set/get bridge.topic`, `get bridge.status`, `get bridge.sync` and `get mqtt.client_env`, plus the observer Wi-Fi, NTP, web and `bridge.peer.*` commands.\r\n- **45 boards:** every observer board except Station G2 logging, using the `*_room_server_mqtt_bridge` PlatformIO environment suffix.\r\n\r\n### First-Time Setup\r\n\r\nFrom the serial console (any flasher console works):\r\n\r\n```text\r\nset wifi.ssid <your-ssid>\r\nset wifi.pwd <your-password>\r\n```\r\n\r\nThen open `https://<room-ip>/`. The IP is on the display, or run `get wifi.status`. In the panel:\r\n\r\n1. Pick the radio preset and AU region, then reboot.\r\n2. Set the broker `host:port` and credentials.\r\n3. Set the room sync topic.\r\n4. Set the same `bridge.secret` on every room server in the group from the CLI.\r\n5. Confirm `get bridge.status` and `get bridge.sync` both report `online`.\r\n6. Test with `room.post hello`.\r\n\r\n### Before You Bridge\r\n\r\nBridges aren't for everyone, and a synced room is a bridge too.\r\n\r\n- **Every bridged packet is retransmitted on the other side**, so both meshes carry more traffic. Bridging busy meshes can congest both.\r\n- **Talk to the people who run the meshes you're joining** before bridging into a shared mesh.\r\n- **Change the default `bridge.secret`.** The default is public. Pick your own and share it only with the room servers and bridges that should link.\r\n- **Treat the broker as part of your network.** The bridge uses plain MQTT over TCP, not TLS. Use broker usernames and passwords, and don't run it open to the internet.\r\n- **Room sync shares everything posted to the room** with every room on the topic. Anyone with the topic and secret can read and post.\r\n- **Check your radio settings first.** New installs start on the upstream default radio settings, which are not the Australian band.\r\n\n…"
