    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/repeater-bridge-espnow-v1.17.1
    prerelease: false
    notes: "## MeshCore Repeater ESP-NOW Bridge\r\n\r\nRepeater ESP-NOW bridge firmware built from the upstream `meshcore-dev/MeshCore` firmware base.\r\n\r\nThis release updates the firmware base to upstream MeshCore `v1.17.1`.\r\n\r\n### What's Changed\r\n\r\n- Updated the firmware base to upstream MeshCore `v1.17.1`.\r\n- Improved reply routing: direct requests now reply over the stored return path when one is known, and replies fall back to the repeater's default scope when the request scope is unknown, instead of always flooding un-scoped.\r\n- Fixed the RX boosted gain setting reverting to the compiled-in default after an automatic gain control reset (SX126x radios).\r\n- Added `get radio.fem.txgain` and `set radio.fem.txgain on|off` for boards with a controllable external FEM PA gain (such as Station G3).\r\n- Included upstream board, radio, display, and platform fixes from MeshCore dev.\r\n\r\n### Breaking Changes\r\n\r\n- None in 1.17.1. (If upgrading from 1.16.x or earlier: saved settings move to the new `prefs.json` format on first boot, and downgrading afterwards reverts the device to the old pre-migration settings file.)\r\n\r\n### Flashing\r\n\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
  - version: observer-eastmesh-v2026.8.2
    name: Observer EastMesh Firmware v1.17.1-eastmesh-v2026.8.2
