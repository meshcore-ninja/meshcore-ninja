    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\nThis release brings in the **latest upstream MeshCore fixes**, adds **ThinkNode M7** and **eight more boards**, and refreshes the docs for every EastMesh release track.\r\n\r\n### What's Changed\r\n\r\n- **Upstream MeshCore fixes on top of `v1.18.0`.** The firmware base stays `v1.18.0`, plus the upstream `dev` fixes merged since then: RadioLib 7.8.1; received packets whose LoRa header says there is no CRC are now dropped; the RadioLib receive error counter is initialised; duplicate-packet stats saturate instead of wrapping; LR2021 radios are put in standby before being re-configured; `set af` refuses `nan`; a negative TX power is no longer stored as a large positive value; a possible reply overflow in `sensor list` is fixed; scope 0 rule fixes; and empty anonymous contact slots are skipped in peer lookups.\r\n- **New board: ThinkNode M7** ([#88](https://github.com/xJARiD/MeshCore-EastMesh/pull/88)).\r\n- **Eight more boards:** Heltec V4 R8 (OLED and TFT), Heltec V4 Expansion Kit, Heltec RC32 (with and without display), LilyGo T-ETH Elite SX1262, Meshnology W12 (LR2021) and Seeed Xiao ESP32-S3.\r\n- **Docs refreshed for public release.** Every release track, including the Observer MQTT bridge and the new Room Server MQTT bridge, is now described across Home, Boards, Releases, Custom CLI, Web Panel, Web API and Local Builds.\r\n\r\n### Breaking Changes\r\n\r\n- None.\r\n\r\n### Notes\r\n\r\n- New EastMesh release tracks ship alongside this one: **Observer MQTT bridge** (`observer-eastmesh-bridge-mqtt`) and **Room Server MQTT bridge** (`room-server-eastmesh-bridge-mqtt`). See their releases for details. Bridges aren't for everyone; read the cautions before deploying one.\r\n- Web panel self-healing remains in place: `heals:<n>` and `deferred:<n>` in `get web.status` count heap-related restarts and deferred starts since boot.\r\n- The Wi-Fi gateway connectivity watchdog remains in place: `gw:ok|lost` and `wd:<n>` in `get wifi.status` show gateway health and forced reconnects, and `wifi reconnect` forces a rejoin manually.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper` and `waev` are available as global second brokers.\r\n- Select brokers from the Primary and Secondary dropdowns in the web panel, or toggle them from the CLI (`set mqtt.eastmesh-au on`, `set mqtt.meshmapper on`, `set mqtt.waev on`, etc.). A maximum of two brokers can be enabled at once.\r\n- `waev` (`mqtt.waev.app`) uses a 1-hour auth token that the firmware refreshes automatically. Set your Waev account email with `set mqtt.email <email>` so Waev can link the observer to your account.\r\n- Custom MQTT is available for private broker deployments and uses username/password auth only. For WSS custom MQTT, set the host and port, select WSS transport, and the firmware connects using `wss://host:port/mqtt`.\r\n- For maximum heap headroom on busy observers, use the web panel for setup and troubleshooting, then disable it with `set web off`.\r\n- Browsers may still require accepting the self-signed certificate warning on first HTTPS access.\r\n- `flood.max.unscoped` defaults to `64`; lower it only if you want to limit how far unscoped flood traffic repeats.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
