    notes: "## MeshCore EastMesh Observer with ESP-NOW Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-espnow` firmware for MeshCore boards that combine secure MQTT uplink with ESP-NOW bridge support, based on MeshCore firmware `v1.17.0` (as of 2026-08-09).\r\n\r\nThis release includes the same Observer updates as `observer-eastmesh-v2026.8.1` — the upstream MeshCore v1.17.0 base, the automatic migration to the new key-based `prefs.json` settings format, the web panel long-uptime fix, and the T-Beam S3 Supreme display bring-up fix — with ESP-NOW bridge support included.\r\n\r\n### What's Changed\r\n\r\n- Same changes as `observer-eastmesh-v2026.8.1`:\r\n  - Merged upstream MeshCore `v1.17.0`, including new board support, ethernet interface groundwork, LR2021 radio support, display and UI improvements, and board/platform fixes.\r\n  - Moved saved node settings to upstream's new key-based `prefs.json` format. Existing settings — including bridge peer and fan control — are migrated automatically on first boot; no reconfiguration needed this time.\r\n  - Fixed the web panel refusing connections (browser `PR_CONNECT_RESET_ERROR`) after long uptimes.\r\n  - Hardened T-Beam S3 Supreme display bring-up so a failed boot-time OLED probe boots the node headless instead of crash-looping.\r\n- Includes ESP-NOW bridge firmware targets using the `*_repeater_observer_espnow` PlatformIO environment suffix.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot. Upgrading is seamless, but downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file — anything changed since the upgrade would be lost.\r\n\r\n### Notes\r\n\r\n- **If your observer's web panel stopped responding after a week or more of uptime (connection reset in the browser), this release is the fix** — previously only a reboot would recover it.\r\n- Settings migrate automatically this time — unlike 2026.7.0, there is nothing to re-set after updating; bridge peer and channel settings carry over.\r\n- This track is separate from `observer-eastmesh`.\r\n- Use `get wifi.status` to confirm the active 2.4 GHz Wi-Fi channel before setting `bridge.channel`.\r\n- `bridge.channel` should match the connected Wi-Fi channel for reliable ESP-NOW bridge operation.\r\n- For maximum heap headroom after setup, disable the web panel with `set web off`.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
