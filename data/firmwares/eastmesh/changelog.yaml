    notes: "## MeshCore EastMesh Observer with MQTT Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-mqtt` firmware for MeshCore boards that combine secure MQTT uplink with an MQTT mesh bridge, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\nThis release adds **gateway mode**, so a node can link its LoRa area to the bridge without acting as a general repeater. It also includes the same Observer updates as `observer-eastmesh-v2026.11.2`.\r\n\r\n### What's Changed\r\n\r\n- **Gateway mode** ([#90](https://github.com/xJARiD/MeshCore-EastMesh/pull/90), thanks Artemia76). `set bridge.gateway on|off`, default `off`. With `repeat off`, the node still puts packets from the bridge on LoRa, but doesn't repeat local LoRa traffic. To run a node as a gateway:\r\n\r\n  ```text\r\n  set repeat off\r\n  set bridge.source rx\r\n  set bridge.gateway on\r\n  ```\r\n\r\n  `bridge.gateway` has no effect while `repeat` is `on`, and with the default `off` behaviour is unchanged.\r\n- Same changes as `observer-eastmesh-v2026.11.2`:\r\n  - **More IATA codes in the web panel:** BDB, GYP, MNQ, BHS, DNQ, TMW, TRO, WOL, TWB, BSJ and TGN.\r\n  - **LetsMesh is back.** LetsMesh EU and US are no longer marked retired, and upgrading no longer clears saved LetsMesh selections.\r\n  - **Upstream MeshCore fixes on top of `v1.18.0`**, including a fix for remote CLI replies that could crash the node, reworked GPS handling and CLI, repeater telemetry push, an ESP32 sleep fix for boards without a radio wake pin, boosted RX gain on LR1110, a Xiao ESP32-S3 Wio USB serial fix, and GPS baud probing on Station G2 and G3.\r\n  - **New docs guides**, including a dedicated Observer MQTT Bridge guide with the Mosquitto broker example, what gets bridged in each direction, gateway mode and troubleshooting.\r\n\r\n### Breaking Changes\r\n\r\n- None.\r\n\r\n### Before You Bridge\r\n\r\nBridges aren't for everyone. Most repeaters should stay plain repeaters or observers, and a bridge should be a deliberate choice.\r\n\r\n- **Every bridged packet is retransmitted on the other side.** Bridging busy meshes can congest both.\r\n- **Talk to the people who run the meshes you're joining** before bridging into a shared mesh.\r\n- **Change the default `bridge.secret`.** The default is public. Pick your own and share it only with the bridges that should link.\r\n- **Treat the broker as part of your network.** The bridge uses plain MQTT over TCP, not TLS. Use broker usernames and passwords, and don't run it open to the internet.\r\n- **Check your radio settings before you connect.** Set the correct regional radio preset first.\r\n\r\n### Notes\r\n\r\n- **What gets bridged:** `bridge.source` decides what goes to the broker. The default `logTx` sends what the node transmits, so a node with `repeat off` sends only its own packets. `set bridge.source rx` sends everything the node hears. `repeat` (or gateway mode) decides whether packets from the broker go out on LoRa.\r\n- Discovery replies from a gateway still report it as a repeater with repeating disabled, because they follow `repeat`.\r\n- Room servers on the same broker and `bridge.secret` join the bridge, and can use gateway mode too.\r\n- For maximum heap headroom after setup, disable the web panel with `set web off`.\r\n\r\n### Documentation\r\n\r\n- [Observer MQTT Bridge guide](https://xjarid.github.io/MeshCore-EastMesh/observer-mqtt-bridge/)\r\n- [xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
