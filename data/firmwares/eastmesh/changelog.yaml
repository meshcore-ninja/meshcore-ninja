    prerelease: false
    notes: "## MeshCore EastMesh Observer with ESP-NOW Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-espnow` firmware for MeshCore boards that combine secure MQTT uplink with ESP-NOW bridge support, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\nThis release fixes the **ESP-NOW bridge on ESP32-C6 boards**, adding three C6 boards to this track, and includes the same Observer updates as `observer-eastmesh-v2026.11.2`.\r\n\r\n### What's Changed\r\n\r\n- **ESP-NOW fix for ESP32-C6 boards.** C6 boards build with ESP-IDF 5, which passes the sender's address to the ESP-NOW receive callback differently. The bridge now handles both ESP-IDF 4 and 5.\r\n- **Three new ESP-NOW boards** thanks to that fix: LilyGo T-Lora C6, M5Stack Unit C6L and the WHY2025 badge.\r\n- Same changes as `observer-eastmesh-v2026.11.2`:\r\n  - **More IATA codes in the web panel:** BDB, GYP, MNQ, BHS, DNQ, TMW, TRO, WOL, TWB, BSJ and TGN.\r\n  - **LetsMesh is back.** LetsMesh EU and US are no longer marked retired, and upgrading no longer clears saved LetsMesh selections.\r\n  - **Upstream MeshCore fixes on top of `v1.18.0`**, including a fix for remote CLI replies that could crash the node, reworked GPS handling and CLI, repeater telemetry push, an ESP32 sleep fix for boards without a radio wake pin, boosted RX gain on LR1110, a Xiao ESP32-S3 Wio USB serial fix, and GPS baud probing on Station G2 and G3.\r\n  - **New docs guides**, including ESP-NOW channel setup in the Observer guide.\r\n- Includes ESP-NOW bridge firmware targets using the `*_repeater_observer_espnow` PlatformIO environment suffix.\r\n\r\n### Breaking Changes\r\n\r\n- None.\r\n\r\n### Notes\r\n\r\n- This track is separate from `observer-eastmesh`.\r\n- Use `get wifi.status` to confirm the active 2.4 GHz Wi-Fi channel before setting `bridge.channel`. The bridge channel must match it.\r\n- ESP-NOW bridges are for nearby repeaters on different radio configs. To link meshes out of ESP-NOW range, see the `observer-eastmesh-bridge-mqtt` track.\r\n- For maximum heap headroom after setup, disable the web panel with `set web off`.\r\n\r\n### Documentation\r\n\r\n- [Observer guide: ESP-NOW builds](https://xjarid.github.io/MeshCore-EastMesh/observer/#observer-esp-now-builds)\r\n- [xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
