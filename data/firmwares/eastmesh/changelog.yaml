    notes: "## MeshCore EastMesh Companion WiFi\r\n\r\nThis is standard MeshCore companion WiFi firmware based on MeshCore `v1.17.0`, with EastMesh additions for Wi-Fi setup and recovery.\r\n\r\n### What's Changed in 1.17.0\r\n\r\n- Updated the firmware base to upstream MeshCore `v1.17.0`, including the new interface manager for BLE, Wi-Fi, USB, and serial connections.\r\n- Saved settings move to upstream's new key-based `prefs.json` format; existing settings, including saved Wi-Fi credentials, are migrated automatically on first boot.\r\n- **New: recovery access point.** If the device has no Wi-Fi credentials, or can't connect to its network for 60 seconds, it broadcasts its own `EastMesh-WiFi` access point so you can fix the Wi-Fi settings in place — no serial cable needed. The AP shuts down automatically once the device connects to its configured network.\r\n  - The AP password is the device pin, zero-padded to 8 digits. Devices with a screen show the pin on the home screen (`Pin:NNNNNN` → password `00NNNNNN`); headless devices default to pin `123456` (password `00123456`); `set pin <pin>` overrides both.\r\n  - Once connected to the AP, the rescue CLI is available over TCP: `telnet 192.168.4.1` (or `nc 192.168.4.1 23`), then `set wifi.ssid <ssid>`, `set wifi.pwd <password>`, `reboot`.\r\n\r\n### What's Different from Stock MeshCore\r\n\r\nThe EastMesh Wi-Fi CLI commands, available over serial rescue and the recovery AP:\r\n\r\n- `get wifi.status`\r\n- `get wifi.ssid`\r\n- `get wifi.powersaving`\r\n- `set wifi.ssid <ssid>`\r\n- `set wifi.pwd <password>`\r\n- `set wifi.powersaving none|min|max`\r\n\r\nPlus the recovery access point described above.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot; downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file.\r\n- Headless devices in public areas should set a custom pin (`set pin <pin>`) — the default recovery AP password `00123456` is documented, so treat it like a default router password.\r\n\r\n### Notes\r\n\r\n- Everything else behaves like the normal MeshCore companion WiFi firmware\r\n- Use the file that matches your board exactly\r\n- Companion WiFi releases use the upstream MeshCore version number\r\n\r\n### Documentation\r\n\r\nhttps://xjarid.github.io/MeshCore-EastMesh/\r\n\r\n### Flashing\r\n\r\n- https://flasher.eastmesh.au/\r\n- https://flasher.meshcore.io/\r\n\r\n### Assets\r\n\r\n- `.bin` – standard update\r\n- `-merged.bin` – full image (after erase, ESP32)"
