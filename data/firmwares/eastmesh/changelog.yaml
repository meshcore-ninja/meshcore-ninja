      ## MeshCore EastMesh Observer with ESP-NOW Bridge


      EastMesh `observer-eastmesh-bridge-espnow` firmware for MeshCore boards that combine secure
      MQTT uplink with ESP-NOW bridge support, based on MeshCore firmware `v1.18.0` (as of
      2026-10-15).


      This release includes the same Observer updates as `observer-eastmesh-v2026.10.0` — the
      upstream MeshCore `v1.18.0` update, the fix for the web panel randomly logging out during
      active use, and upstream's T-Beam 1W thermal fan control — with ESP-NOW bridge support
      included.


      ### What's Changed


      - Same changes as `observer-eastmesh-v2026.10.0`:
        - **Updated to upstream MeshCore `v1.18.0`.** Includes: ACK forwarding in direct mode now uses the normal TX delay instead of none; transport code 0 is treated as unscoped; repeaters with adverts turned off no longer answer DISCOVER requests; `loop.detect` defaults to `minimal` on new installs; `set af` input is validated; and ESP32 clocks no longer reset to 1970 after a crash, watchdog or brownout reset.
        - **Fixed: web panel randomly logging out during active use** ([#85](https://github.com/xJARiD/MeshCore-EastMesh/issues/85)). A request arriving while the main loop was checking the idle timer could make the elapsed time wrap around and look expired, locking the session well before the 15-minute idle timeout. Activity newer than the check is now treated as active; the same fix applies to the idle check used by web panel self-healing.
        - **Changed: LilyGo T-Beam 1W fan control now uses upstream's thermal controller.** `get fan` reports mode, NTC temperature, fan state and TX cooldown; `set fan on|off|auto` is kept; new `set fan.lo <C>` / `set fan.hi <C>` set the auto-mode thresholds (defaults 30C / 36C), and the post-TX cooldown is a fixed 15 seconds. The EastMesh switching of the external LNA off before TX is kept.
        - The ESP32 clock now restores from upstream's RTC-memory backup after a soft reset, and falls back to the EastMesh NVS-saved time after a power loss, so the clock survives both.
        - Ported upstream sensor fixes onto the EastMesh I2C probe path: one driver instance per sensor type (BMP/BME are probed at both 0x76 and 0x77), and an I2C address is claimed once a sensor initializes so later entries can't claim the same device.
        - The web panel region setup now saves the selected region with a single `region def au <region>` command instead of separate `region put` and `region allowf` commands.
      - Includes ESP-NOW bridge firmware targets using the `*_repeater_observer_espnow` PlatformIO
      environment suffix.


      ### Breaking Changes


      - **LilyGo T-Beam 1W:** the EastMesh `set fan timeout <Ns>` command has been removed. Fan mode
      and timeout saved by earlier EastMesh builds are not migrated, so the fan returns to `auto`
      with the default thresholds after upgrading; use `set fan on|off` or `set fan.lo` / `set
      fan.hi` to adjust.


      ### Notes


      - **If the web panel kept sending you back to the login page shortly after logging in, this
      release is the fix.**

      - Web panel self-healing from 2026.8.3 remains in place: `heals:<n>` and `deferred:<n>` in
      `get web.status` count heap-related restarts and deferred starts since boot.

      - The Wi-Fi gateway connectivity watchdog remains in place: `gw:ok|lost` and `wd:<n>` in `get
      wifi.status` show gateway health and forced reconnects, and `wifi reconnect` forces a rejoin
      manually.

      - This track is separate from `observer-eastmesh`.

      - Use `get wifi.status` to confirm the active 2.4 GHz Wi-Fi channel before setting
      `bridge.channel`.

      - `bridge.channel` should match the connected Wi-Fi channel for reliable ESP-NOW bridge
      operation.

      - For maximum heap headroom after setup, disable the web panel with `set web off`.

      - `flood.max.advert` controls the hop limit for flooded advert packets.


