    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/observer-eastmesh-v2026.8.2
    prerelease: false
    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.17.1` (as of 2026-08-15).\r\n\r\nThis release adds a **Wi-Fi gateway connectivity watchdog** — observers that sit \"connected\" to an access point that has lost its uplink now detect the dead gateway and reconnect on their own — plus a manual `wifi reconnect` command, and updates the firmware base to **upstream MeshCore v1.17.1**.\r\n\r\n### What's Changed\r\n\r\n- **New: gateway connectivity watchdog.** While connected, the node ARP-probes its gateway every 30 seconds. If the gateway stays silent for 3 minutes (for example, an AP that keeps beaconing after losing its wired uplink), the node forces a full disconnect and rescan on its own so it can roam to a healthy AP, backing off up to 48 minutes between attempts while the outage persists.\r\n- Added `wifi reconnect` to drop the current association and rejoin from a full channel scan — for nodes that report connected but are unreachable over the network.\r\n- Extended `get wifi.status` with gateway health (`gw:ok|lost`) and the watchdog reconnect count (`wd:<n>`), also shown in the web panel.\r\n- Merged upstream MeshCore `v1.17.1`, including improved reply routing (direct requests reply over known return paths, and replies fall back to the default scope when the request scope is unknown), LR2021 radio improvements, and board/platform fixes.\r\n- Fixed the RX boosted gain setting reverting to the compiled-in default after an automatic gain control reset (SX126x radios).\r\n- Adopted upstream's SH1106 display address fallback (0x3C/0x3D) so board revisions with the other SA0 strap setting still get a working display, while keeping the EastMesh T-Beam S3 Supreme bring-up order and headless fallback.\r\n\r\n### Breaking Changes\r\n\r\n- None in 2026.8.2. (If upgrading from 2026.7.x or earlier: saved settings move to the new `prefs.json` format on first boot, and downgrading afterwards reverts the device to the old pre-migration settings file.)\r\n\r\n### Notes\r\n\r\n- **If your observer has ever sat \"connected\" with good signal but unreachable on the network until someone rebooted it, this release is the fix** — the watchdog now detects the dead gateway and reconnects automatically. `wd:<n>` in `get wifi.status` counts these forced reconnects since boot.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper` and `waev` are available as global second brokers.\r\n- Select brokers from the Primary and Secondary dropdowns in the web panel, or toggle them from the CLI (`set mqtt.eastmesh-au on`, `set mqtt.meshmapper on`, `set mqtt.waev on`, etc.). A maximum of two brokers can be enabled at once.\r\n- `waev` (`mqtt.waev.app`) uses a 1-hour auth token that the firmware refreshes automatically, so no extra configuration is needed. Set your Waev account email with `set mqtt.email <email>` so Waev can link the observer to your account.\r\n- MQTT status messages report cumulative `packets_sent` and `packets_received` alongside the existing radio stats; both counters reset on reboot.\r\n- LetsMesh EU/US are retired but still selectable for legacy use.\r\n- Custom MQTT is available for private broker deployments and uses username/password auth only. For TCP custom MQTT, use the broker host and port as before. For WSS custom MQTT, set the host and port, select WSS transport, and the firmware connects using `wss://host:port/mqtt`.\r\n- WSS uses TLS encryption and validates against the ESP-IDF x509 root CA bundle.\r\n- For maximum heap headroom on busy observers, use the web panel for setup and troubleshooting, then disable it with `set web off`.\r\n- Browsers may still require accepting the self-signed certificate warning on first HTTPS access.\r\n- `flood.max.unscoped` defaults to `64`; lower it only if you want to limit how far unscoped flood traffic repeats.\r\n- `flood.max.advert` controls the hop limit for flooded advert pac\n…"
