    notes: "## MeshCore EastMesh Observer with MQTT Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-mqtt` firmware for MeshCore boards that combine secure MQTT uplink with an MQTT mesh bridge, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\n**This is the first public release of the Observer MQTT bridge track.** The community asked for it, so here it is. The bridge relays encrypted mesh packets between bridge nodes through an MQTT broker you run, linking meshes that radio alone can't reach.\r\n\r\n### What's Changed\r\n\r\n- Same changes as `observer-eastmesh-v2026.11.1`:\r\n  - **Upstream MeshCore fixes on top of `v1.18.0`.** The firmware base stays `v1.18.0`, plus the upstream `dev` fixes merged since then: RadioLib 7.8.1; received packets whose LoRa header says there is no CRC are now dropped; the RadioLib receive error counter is initialised; duplicate-packet stats saturate instead of wrapping; LR2021 radios are put in standby before being re-configured; `set af` refuses `nan`; a negative TX power is no longer stored as a large positive value; a possible reply overflow in `sensor list` is fixed; scope 0 rule fixes; and empty anonymous contact slots are skipped in peer lookups.\r\n  - **New board: ThinkNode M7** ([#88](https://github.com/xJARiD/MeshCore-EastMesh/pull/88)).\r\n  - **Eight more boards:** Heltec V4 R8 (OLED and TFT), Heltec V4 Expansion Kit, Heltec RC32 (with and without display), LilyGo T-ETH Elite SX1262, Meshnology W12 (LR2021) and Seeed Xiao ESP32-S3.\r\n  - **Docs refreshed for public release.** Every release track, including the Observer MQTT bridge and the new Room Server MQTT bridge, is now described across Home, Boards, Releases, Custom CLI, Web Panel, Web API and Local Builds.\r\n- **Promoted to a public release** with full release notes and docs. Earlier `observer-eastmesh-bridge-mqtt` pre-releases shipped the same changes as the matching `observer-eastmesh` releases.\r\n- **Works with the new Room Server MQTT bridge.** Room servers bridge on the same `meshcore/bridge/packets` topic, so they join an observer bridge that uses the same broker and `bridge.secret`. Observer bridging behaviour is unchanged.\r\n- Includes MQTT bridge firmware targets for every observer board, using the `*_repeater_observer_mqtt_bridge` PlatformIO environment suffix.\r\n\r\n### Breaking Changes\r\n\r\n- None.\r\n\r\n### Before You Bridge\r\n\r\nBridges aren't for everyone. Most repeaters should stay plain repeaters or observers, and a bridge should be a deliberate choice.\r\n\r\n- **Every bridged packet is retransmitted on the other side.** Adverts, floods, and chat from one mesh are repeated over LoRa on the other, so both meshes carry more traffic and use more airtime. Bridging busy meshes can congest both.\r\n- **Talk to the people who run the meshes you're joining.** A bridge links meshes that may have been kept separate on purpose. Don't bridge into a shared mesh without agreement.\r\n- **Change the default `bridge.secret`.** The default is public, so any bridge on the same broker with the default secret joins your bridge. Pick your own and share it only with the bridges that should link.\r\n- **Treat the broker as part of your network.** The bridge uses plain MQTT over TCP, not TLS. Use a broker with usernames and passwords, and don't run it open to the internet. Mesh messages stay MeshCore-encrypted end to end; the bridge secret only keeps other bridges out and isn't strong security.\r\n- **Check your radio settings before you connect.** A bridge transmits traffic from elsewhere, so set the correct regional radio preset first.\r\n\r\n### Notes\r\n\r\n- The bridge broker is separate from the MQTT uplink brokers (`eastmesh-au`, `meshmapper`, `waev`). Set it with `bridge.peer.host`, `bridge.peer.port`, `bridge.peer.username` and `bridge.peer.password`, or from **Mesh bridge peer** under MQTT Settings in the web panel. Set `bridge.secret` from the CLI.\r\n- Every bridge node must use the same broker, credentials and `bridge.secret`. Packets are bridged on t\n…"
