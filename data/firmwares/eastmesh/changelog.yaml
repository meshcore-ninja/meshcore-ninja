    prerelease: false
    notes: "## MeshCore Repeater ESP-NOW Bridge\r\n\r\nRepeater ESP-NOW bridge firmware built from the upstream `meshcore-dev/MeshCore` firmware base.\r\n\r\nThis release updates the firmware base to upstream MeshCore `v1.17.0`.\r\n\r\n### What's Changed\r\n\r\n- Updated the firmware base to upstream MeshCore `v1.17.0`.\r\n- Moved saved node settings to upstream's new key-based `prefs.json` format; existing settings, including bridge configuration, are migrated automatically on first boot.\r\n- Included upstream board, radio, display, and platform fixes from MeshCore dev, including new board support and an external watchdog manager.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot; downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file.\r\n\r\n### Flashing\r\n\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
  - version: observer-eastmesh-v2026.8.1
    name: Observer EastMesh Firmware v1.17.0-eastmesh-v2026.8.1
    datetime: '2026-08-09T09:21:43Z'
    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/observer-eastmesh-v2026.8.1
    prerelease: false
    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.17.0` (as of 2026-08-09).\r\n\r\nThis release updates the firmware base to **upstream MeshCore v1.17.0**, moves saved settings to upstream's new key-based `prefs.json` format — **with automatic migration, so your existing settings carry over on first boot** — and **fixes the web panel becoming unreachable after long uptimes** (`PR_CONNECT_RESET_ERROR` in the browser until reboot).\r\n\r\n### What's Changed\r\n\r\n- Merged upstream MeshCore `v1.17.0`, including new board support, ethernet interface groundwork, LR2021 radio support, display and UI improvements, and board/platform fixes.\r\n- Moved saved node settings to upstream's new key-based `prefs.json` format. Existing settings — including EastMesh fan control and bridge peer configuration — are migrated automatically on first boot; no reconfiguration needed this time.\r\n- Fixed the web panel refusing connections (browser `PR_CONNECT_RESET_ERROR`) after long uptimes: stale keep-alive connections from vanished clients are now evicted instead of permanently occupying the connection pool.\r\n- Hardened T-Beam S3 Supreme display bring-up: restored the proven SH1106 init order so the OLED reliably comes up at boot, and a failed or absent display now boots the node headless instead of crash-looping.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot. Upgrading is seamless, but downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file — anything changed since the upgrade would be lost.\r\n\r\n### Notes\r\n\r\n- **If your observer's web panel stopped responding after a week or more of uptime (connection reset in the browser), this release is the fix** — previously only a reboot would recover it.\r\n- Settings migrate automatically this time — unlike 2026.7.0, there is nothing to re-set after updating.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper` and `waev` are available as global second brokers.\r\n- Select brokers from the Primary and Secondary dropdowns in the web panel, or toggle them from the CLI (`set mqtt.eastmesh-au on`, `set mqtt.meshmapper on`, `set mqtt.waev on`, etc.). A maximum of two brokers can be enabled at once.\r\n- `waev` (`mqtt.waev.app`) uses a 1-hour auth token that the firmware refreshes automatically, so no extra configuration is needed. Set your Waev account email with `set mqtt.email <email>` so Waev can link the observer to your account.\r\n- MQTT status messages report cumulative `packets_sent` and `packets_received` alongside the existing radio stats; both counters reset on reboot.\r\n- LetsMesh EU/US are retired but still selectable for legacy use.\r\n- Custom MQTT is available for private broker deployments and uses username/password auth only. For TCP custom MQTT, use the broker host and port as before. For WSS custom MQTT, set the host and port, select WSS transport, and the firmware connects using `wss://host:port/mqtt`.\r\n- WSS uses TLS encryption and validates against the ESP-IDF x509 root CA bundle.\r\n- For maximum heap headroom on busy observers, use the web panel for setup and troubleshooting, then disable it with `set web off`.\r\n- Browsers may still require accepting the self-signed certificate warning on first HTTPS access.\r\n- `flood.max.unscoped` defaults to `64`; lower it only if you want to limit how far unscoped flood traffic repeats.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
  - version: observer-eastmesh-bridge-espnow-v2026.8.1
    name: Observer EastMesh Firmware with ESP-NOW Bridge v1.17.0-eastmesh-v2026.8.1
    datetime: '2026-08-09T09:21:29Z'
    url: >-
      https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/observer-eastmesh-bridge-espnow-v2026.8.1
    prerelease: false
    notes: "## MeshCore EastMesh Observer with ESP-NOW Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-espnow` firmware for MeshCore boards that combine secure MQTT uplink with ESP-NOW bridge support, based on MeshCore firmware `v1.17.0` (as of 2026-08-09).\r\n\r\nThis release includes the same Observer updates as `observer-eastmesh-v2026.8.1` — the upstream MeshCore v1.17.0 base, the automatic migration to the new key-based `prefs.json` settings format, the web panel long-uptime fix, and the T-Beam S3 Supreme display bring-up fix — with ESP-NOW bridge support included.\r\n\r\n### What's Changed\r\n\r\n- Same changes as `observer-eastmesh-v2026.8.1`:\r\n  - Merged upstream MeshCore `v1.17.0`, including new board support, ethernet interface groundwork, LR2021 radio support, display and UI improvements, and board/platform fixes.\r\n  - Moved saved node settings to upstream's new key-based `prefs.json` format. Existing settings — including bridge peer and fan control — are migrated automatically on first boot; no reconfiguration needed this time.\r\n  - Fixed the web panel refusing connections (browser `PR_CONNECT_RESET_ERROR`) after long uptimes.\r\n  - Hardened T-Beam S3 Supreme display bring-up so a failed boot-time OLED probe boots the node headless instead of crash-looping.\r\n- Includes ESP-NOW bridge firmware targets using the `*_repeater_observer_espnow` PlatformIO environment suffix.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot. Upgrading is seamless, but downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file — anything changed since the upgrade would be lost.\r\n\r\n### Notes\r\n\r\n- **If your observer's web panel stopped responding after a week or more of uptime (connection reset in the browser), this release is the fix** — previously only a reboot would recover it.\r\n- Settings migrate automatically this time — unlike 2026.7.0, there is nothing to re-set after updating; bridge peer and channel settings carry over.\r\n- This track is separate from `observer-eastmesh`.\r\n- Use `get wifi.status` to confirm the active 2.4 GHz Wi-Fi channel before setting `bridge.channel`.\r\n- `bridge.channel` should match the connected Wi-Fi channel for reliable ESP-NOW bridge operation.\r\n- For maximum heap headroom after setup, disable the web panel with `set web off`.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
  - version: companion-wifi-v1.17.0
    name: Companion WiFi Firmware v1.17.0
    datetime: '2026-08-09T09:21:19Z'
    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/companion-wifi-v1.17.0
    prerelease: false
    notes: "## MeshCore EastMesh Companion WiFi\r\n\r\nThis is standard MeshCore companion WiFi firmware based on MeshCore `v1.17.0`, with EastMesh additions for Wi-Fi setup and recovery.\r\n\r\n### What's Changed in 1.17.0\r\n\r\n- Updated the firmware base to upstream MeshCore `v1.17.0`, including the new interface manager for BLE, Wi-Fi, USB, and serial connections.\r\n- Saved settings move to upstream's new key-based `prefs.json` format; existing settings, including saved Wi-Fi credentials, are migrated automatically on first boot.\r\n- **New: recovery access point.** If the device has no Wi-Fi credentials, or can't connect to its network for 60 seconds, it broadcasts its own `EastMesh-WiFi` access point so you can fix the Wi-Fi settings in place — no serial cable needed. The AP shuts down automatically once the device connects to its configured network.\r\n  - The AP password is the device pin, zero-padded to 8 digits. Devices with a screen show the pin on the home screen (`Pin:NNNNNN` → password `00NNNNNN`); headless devices default to pin `123456` (password `00123456`); `set pin <pin>` overrides both.\r\n  - Once connected to the AP, the rescue CLI is available over TCP: `telnet 192.168.4.1` (or `nc 192.168.4.1 23`), then `set wifi.ssid <ssid>`, `set wifi.pwd <password>`, `reboot`.\r\n\r\n### What's Different from Stock MeshCore\r\n\r\nThe EastMesh Wi-Fi CLI commands, available over serial rescue and the recovery AP:\r\n\r\n- `get wifi.status`\r\n- `get wifi.ssid`\r\n- `get wifi.powersaving`\r\n- `set wifi.ssid <ssid>`\r\n- `set wifi.pwd <password>`\r\n- `set wifi.powersaving none|min|max`\r\n\r\nPlus the recovery access point described above.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot; downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file.\r\n- Headless devices in public areas should set a custom pin (`set pin <pin>`) — the default recovery AP password `00123456` is documented, so treat it like a default router password.\r\n\r\n### Notes\r\n\r\n- Everything else behaves like the normal MeshCore companion WiFi firmware\r\n- Use the file that matches your board exactly\r\n- Companion WiFi releases use the upstream MeshCore version number\r\n\r\n### Documentation\r\n\r\nhttps://xjarid.github.io/MeshCore-EastMesh/\r\n\r\n### Flashing\r\n\r\n- https://flasher.eastmesh.au/\r\n- https://flasher.meshcore.io/\r\n\r\n### Assets\r\n\r\n- `.bin` – standard update\r\n- `-merged.bin` – full image (after erase, ESP32)"
  - version: observer-eastmesh-v2026.7.0
    name: Observer EastMesh Firmware v1.16.0-eastmesh-v2026.7.0
    datetime: '2026-07-19T04:09:45Z'
    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/observer-eastmesh-v2026.7.0
    prerelease: false
    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.16.0` plus upstream dev updates (as of 2026-07-09).\r\n\r\nThis release syncs with **upstream MeshCore dev** — bringing power-off/deep-sleep improvements, SX1262 LDO support, hardware channel-activity detection, and board/platform fixes — **realigns saved settings storage** with upstream so future syncs can't shift or corrupt EastMesh settings, and **restores EastMesh/MeshMapper broker TLS trust** after a server-side certificate change.\r\n\r\n### What's Changed\r\n\r\n- Merged upstream MeshCore dev updates including power-off/deep-sleep improvements, SX1262 LDO support, hardware channel-activity detection, radio gain fixes, and board/platform fixes.\r\n- Realigned saved node settings to upstream byte offsets and moved EastMesh-specific fields behind a reserved gap so future upstream syncs no longer shift or corrupt them.\r\n- Restored EastMesh and MeshMapper broker TLS trust after `mqtt2.eastmesh.au` moved from Let's Encrypt to a Google Trust Services certificate.\r\n- Bumped CI build and docs workflows to Python 3.13.\r\n\r\n### Breaking Changes\r\n\r\n- The saved settings layout changed: devices upgrading from `2026.6.6` or earlier may need EastMesh-specific settings (such as fan control and bridge peer) and recently added radio settings reconfigured after the update.\r\n\r\n### Notes\r\n\r\n- **If your observer stopped uplinking to `eastmesh-au` or `meshmapper` with TLS certificate errors, this release is the fix** — update and the connection will recover on its own.\r\n- After updating, check your fan control, bridge peer, and recently added radio settings (see Breaking Changes) and re-set any that came back at defaults.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper` and `waev` are available as global second brokers.\r\n- Select brokers from the Primary and Secondary dropdowns in the web panel, or toggle them from the CLI (`set mqtt.eastmesh-au on`, `set mqtt.meshmapper on`, `set mqtt.waev on`, etc.). A maximum of two brokers can be enabled at once.\r\n- `waev` (`mqtt.waev.app`) uses a 1-hour auth token that the firmware refreshes automatically, so no extra configuration is needed. Set your Waev account email with `set mqtt.email <email>` so Waev can link the observer to your account.\r\n- MQTT status messages report cumulative `packets_sent` and `packets_received` alongside the existing radio stats; both counters reset on reboot.\r\n- LetsMesh EU/US are retired but still selectable for legacy use.\r\n- Custom MQTT is available for private broker deployments and uses username/password auth only. For TCP custom MQTT, use the broker host and port as before. For WSS custom MQTT, set the host and port, select WSS transport, and the firmware connects using `wss://host:port/mqtt`.\r\n- WSS uses TLS encryption and validates against the ESP-IDF x509 root CA bundle.\r\n- For maximum heap headroom on busy observers, use the web panel for setup and troubleshooting, then disable it with `set web off`.\r\n- Browsers may still require accepting the self-signed certificate warning on first HTTPS access.\r\n- `flood.max.unscoped` defaults to `64`; lower it only if you want to limit how far unscoped flood traffic repeats.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
