    prerelease: false
    notes: "## MeshCore Repeater ESP-NOW Bridge\r\n\r\nRepeater ESP-NOW bridge firmware built from the upstream `meshcore-dev/MeshCore` firmware base.\r\n\r\nThis release updates the firmware base to upstream MeshCore `v1.17.0`.\r\n\r\n### What's Changed\r\n\r\n- Updated the firmware base to upstream MeshCore `v1.17.0`.\r\n- Moved saved node settings to upstream's new key-based `prefs.json` format; existing settings, including bridge configuration, are migrated automatically on first boot.\r\n- Included upstream board, radio, display, and platform fixes from MeshCore dev, including new board support and an external watchdog manager.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot; downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file.\r\n\r\n### Flashing\r\n\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
  - version: observer-eastmesh-v2026.8.1
    name: Observer EastMesh Firmware v1.17.0-eastmesh-v2026.8.1
    datetime: '2026-08-09T09:21:43Z'
    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/observer-eastmesh-v2026.8.1
    prerelease: false
    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.17.0` (as of 2026-08-09).\r\n\r\nThis release updates the firmware base to **upstream MeshCore v1.17.0**, moves saved settings to upstream's new key-based `prefs.json` format — **with automatic migration, so your existing settings carry over on first boot** — and **fixes the web panel becoming unreachable after long uptimes** (`PR_CONNECT_RESET_ERROR` in the browser until reboot).\r\n\r\n### What's Changed\r\n\r\n- Merged upstream MeshCore `v1.17.0`, including new board support, ethernet interface groundwork, LR2021 radio support, display and UI improvements, and board/platform fixes.\r\n- Moved saved node settings to upstream's new key-based `prefs.json` format. Existing settings — including EastMesh fan control and bridge peer configuration — are migrated automatically on first boot; no reconfiguration needed this time.\r\n- Fixed the web panel refusing connections (browser `PR_CONNECT_RESET_ERROR`) after long uptimes: stale keep-alive connections from vanished clients are now evicted instead of permanently occupying the connection pool.\r\n- Hardened T-Beam S3 Supreme display bring-up: restored the proven SH1106 init order so the OLED reliably comes up at boot, and a failed or absent display now boots the node headless instead of crash-looping.\r\n\r\n### Breaking Changes\r\n\r\n- Saved settings move to the new `prefs.json` format on first boot. Upgrading is seamless, but downgrading to earlier firmware afterwards reverts the device to the old (pre-migration) settings file — anything changed since the upgrade would be lost.\r\n\r\n### Notes\r\n\r\n- **If your observer's web panel stopped responding after a week or more of uptime (connection reset in the browser), this release is the fix** — previously only a reboot would recover it.\r\n- Settings migrate automatically this time — unlike 2026.7.0, there is nothing to re-set after updating.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper` and `waev` are available as global second brokers.\r\n- Select brokers from the Primary and Secondary dropdowns in the web panel, or toggle them from the CLI (`set mqtt.eastmesh-au on`, `set mqtt.meshmapper on`, `set mqtt.waev on`, etc.). A maximum of two brokers can be enabled at once.\r\n- `waev` (`mqtt.waev.app`) uses a 1-hour auth token that the firmware refreshes automatically, so no extra configuration is needed. Set your Waev account email with `set mqtt.email <email>` so Waev can link the observer to your account.\r\n- MQTT status messages report cumulative `packets_sent` and `packets_received` alongside the existing radio stats; both counters reset on reboot.\r\n- LetsMesh EU/US are retired but still selectable for legacy use.\r\n- Custom MQTT is available for private broker deployments and uses username/password auth only. For TCP custom MQTT, use the broker host and port as before. For WSS custom MQTT, set the host and port, select WSS transport, and the firmware connects using `wss://host:port/mqtt`.\r\n- WSS uses TLS encryption and validates against the ESP-IDF x509 root CA bundle.\r\n- For maximum heap headroom on busy observers, use the web panel for setup and troubleshooting, then disable it with `set web off`.\r\n- Browsers may still require accepting the self-signed certificate warning on first HTTPS access.\r\n- `flood.max.unscoped` defaults to `64`; lower it only if you want to limit how far unscoped flood traffic repeats.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
