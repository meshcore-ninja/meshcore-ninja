    prerelease: false
    notes: "## MeshCore EastMesh Room Server with MQTT Bridge\r\n\r\nEastMesh `room-server-eastmesh-bridge-mqtt` firmware: a MeshCore room server with Wi-Fi, a local web panel, an MQTT mesh bridge, and post sync between room servers, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\nThis release lets you **choose how much a room server repeats**, so a room can sync posts over MQTT **without bridging the rest of your mesh**. It also brings web panel fixes and the latest upstream MeshCore fixes.\r\n\r\n### What's Changed\r\n\r\n- **New Repeating control in the web panel**, replacing the old repeat on/off:\r\n  - **Repeat all packets** (`repeat on`): repeats local LoRa traffic and bridged packets, as before.\r\n  - **Repeat bridged packets only** (`repeat off`, `bridge.gateway on`): puts packets from the bridge on LoRa without repeating local LoRa traffic.\r\n  - **Room traffic only** (`repeat off`, `bridge.gateway off`): repeats nothing.\r\n  - In every mode the room still handles its own logins and posts over LoRa and the bridge, and room sync keeps working.\r\n- **MQTT-connected room only.** Choose **Room traffic only** to run a synced room without bridging your mesh: companion adverts and other local traffic stay local, and traffic from other meshes on the broker is not put on your LoRa.\r\n- **`set bridge.gateway on|off`** now works on room servers, the same as the Observer MQTT bridge's new gateway mode.\r\n- **`get mqtt.client_version`** shows the EastMesh build version, for example `EastMesh/v2026.11.2-<commit>`. The web panel shows it next to the `ver` output under the action buttons.\r\n- **Web panel fixes and tweaks:**\r\n  - The page no longer flashes light mode before switching to dark.\r\n  - The panel stays hidden until your login session is confirmed, and goes straight to login when there is no session or it has expired, instead of briefly showing the empty panel.\r\n  - The browser tab shows the room server's name instead of `Room Server Config`.\r\n  - The room sync `Topic` field is now **Room Name**. The CLI command is still `set bridge.topic`.\r\n  - The Room Password field is now labelled **Room Password (Guest password)**.\r\n- **Upstream MeshCore fixes on top of `v1.18.0`.** The firmware base stays `v1.18.0`, plus the upstream `dev` fixes merged since then, including:\r\n  - a fix for remote CLI replies that could overflow their buffer by 2 bytes and crash the node\r\n  - reworked GPS handling and CLI, with an optional anti-spoofing guard, a saved first-fix timeout and 2D fixes accepted; `get/set advert.loc` replaces `gps advert`, which still works\r\n  - ESP32 boards without a radio wake pin no longer try to sleep on it\r\n  - boosted RX gain on LR1110 radios\r\n  - a USB serial fix for Seeed Xiao ESP32-S3 Wio, and GPS baud rate probing on Station G2 and G3\r\n- **New Room Server guide** in the docs, covering setup, room sync, the Repeating modes, logins and access, the web panel and troubleshooting.\r\n\r\n### Breaking Changes\r\n\r\n- None.\r\n\r\n### Notes\r\n\r\n- **Logins and access:** the room password (default `hello`) lets users read and post. Change it with the Room Password field or `set guest.password <password>` unless the room is meant to be open.\r\n- **Allow Read-Only Logins** lets people with a wrong or blank password in as read-only guests. It doesn't block logins; with it off, a wrong password is simply ignored.\r\n- Users who logged in since the last restart can log in again with a blank password and keep their access, even after you change the room password or turn read-only logins off. Restart the room server to make everyone log in again; only admins are kept across restarts.\r\n- To run the room on LoRa only, with no MQTT, use `set bridge.enabled off`. This also stops room sync.\r\n- The bridge secret is CLI-only and is not shown in the web panel.\r\n\r\n### Documentation\r\n\r\n- [Room Server guide](https://xjarid.github.io/MeshCore-EastMesh/room-server/)\r\n- [xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n…"
  - version: observer-eastmesh-v2026.11.2
    name: Observer EastMesh Firmware v1.18.0-eastmesh-v2026.11.2
    datetime: '2026-11-26T07:44:16Z'
    url: https://github.com/xJARiD/MeshCore-EastMesh/releases/tag/observer-eastmesh-v2026.11.2
    prerelease: false
    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.18.0` (as of 2026-10-15) plus later upstream fixes.\r\n\r\nThis release brings in the **latest upstream MeshCore fixes**, adds **11 more IATA codes** to the web panel, and brings **LetsMesh** back as a normal broker.\r\n\r\n### What's Changed\r\n\r\n- **More IATA codes in the web panel:** BDB (Bundaberg), GYP (Gympie), MNQ (Monto), BHS (Bathurst), DNQ (Deniliquin), TMW (Tamworth), TRO (Taree), WOL (Wollongong/Shellharbour), TWB (Toowoomba), BSJ (Bairnsdale) and TGN (Latrobe Valley). Most were already in use on CoreScope, set from the CLI.\r\n- **LetsMesh is back.** LetsMesh EU and US are maintained again and no longer marked retired. The web panel drops the `(retired)` label, and upgrading from an older build no longer clears saved LetsMesh selections.\r\n- **Upstream MeshCore fixes on top of `v1.18.0`.** The firmware base stays `v1.18.0`, plus the upstream `dev` fixes merged since then, including:\r\n  - a fix for remote CLI replies that could overflow their buffer by 2 bytes and crash the node (for example a prefixed `regions` query)\r\n  - reworked GPS handling and CLI, with an optional anti-spoofing guard, a saved first-fix timeout and 2D fixes accepted; `get/set advert.loc` replaces `gps advert`, which still works\r\n  - repeaters can push sensor telemetry to subscribed clients when values change\r\n  - ESP32 boards without a radio wake pin no longer try to sleep on it\r\n  - boosted RX gain on LR1110 radios\r\n  - a USB serial fix for Seeed Xiao ESP32-S3 Wio, and GPS baud rate probing on Station G2 and G3\r\n- **New docs guides.** Observer, Observer MQTT Bridge and Room Server each have their own guide. Custom CLI is now a shorter CLI Reference that links to them, and now lists `bridge.type`, `bridge.source` and `bridge.delay`.\r\n\r\n### Breaking Changes\r\n\r\n- None.\r\n\r\n### Notes\r\n\r\n- If your LetsMesh selection was cleared by an earlier upgrade, turn it back on with `set mqtt.letsmesh-eu on` or `set mqtt.letsmesh-us on`, or pick it from the Primary or Secondary broker dropdown in the web panel. A maximum of two brokers can be enabled at once.\r\n- If your area's IATA code still isn't in the web panel list, `set mqtt.iata <code>` from the CLI accepts any code.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper`, `waev` and `letsmesh-eu`/`letsmesh-us` are available as second brokers.\r\n- For maximum heap headroom on busy observers, use the web panel for setup and troubleshooting, then disable it with `set web off`.\r\n- Browsers may still require accepting the self-signed certificate warning on first HTTPS access.\r\n\r\n### Documentation\r\n\r\n- [Observer guide](https://xjarid.github.io/MeshCore-EastMesh/observer/)\r\n- [xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
