    prerelease: false
    notes: >-
      ## MeshCore Repeater ESP-NOW Bridge


      Repeater ESP-NOW bridge firmware built from the upstream `meshcore-dev/MeshCore` firmware
      base.


      This release updates the firmware base to upstream MeshCore `v1.18.0`.


      ### What's Changed


      - Updated the firmware base to upstream MeshCore `v1.18.0`.

      - ACK forwarding in direct mode now uses the normal TX delay instead of none.

      - Transport code 0 is treated the same as unscoped.

      - Repeaters with adverts turned off no longer answer DISCOVER requests.

      - `loop.detect` defaults to `minimal` on new installs, and `set af` input is validated.

      - Fixed ESP32 clocks resetting to 1970 after a crash, watchdog or brownout reset.

      - LilyGo T-Beam 1W fan control now uses upstream's thermal controller: `get fan`, `set fan
      on|off|auto`, and new `set fan.lo <C>` / `set fan.hi <C>` thresholds (defaults 30C / 36C),
      with a fixed 15-second post-TX cooldown.

      - Included upstream board, radio, sensor, and platform fixes from MeshCore dev.


      ### Breaking Changes


      - **LilyGo T-Beam 1W:** the earlier `set fan timeout <Ns>` command has been removed. Fan mode
      and timeout saved by earlier builds are not migrated, so the fan returns to `auto` with the
      default thresholds after upgrading.


      ### Flashing


      - [flasher.meshcore.io](https://flasher.meshcore.io/)

      - [flasher.eastmesh.au](https://flasher.eastmesh.au/)


      ### Assets


      - `.bin` - standard update image

      - `-merged.bin` - full ESP32 image for flashing after erase
