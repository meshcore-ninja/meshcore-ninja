    notes: "## MeshCore EastMesh Observer with ESP-NOW Bridge\r\n\r\nEastMesh `observer-eastmesh-bridge-espnow` firmware for MeshCore boards that combine secure MQTT uplink with ESP-NOW bridge support, based on MeshCore firmware `v1.17.1` (as of 2026-08-15).\r\n\r\nThis release includes the same Observer updates as `observer-eastmesh-v2026.8.3` — the fix for the web panel becoming unreachable after long uptimes, web panel self-healing with heap-health CLI counters, and the T-Beam 1W external PA ramp fix — with ESP-NOW bridge support included.\r\n\r\n### What's Changed\r\n\r\n- Same changes as `observer-eastmesh-v2026.8.3`:\r\n  - **Fixed: web panel unreachable after days of uptime** while LoRa and MQTT kept working. Browser page-load bursts were evicting live HTTPS sessions and forcing repeated TLS handshakes, fragmenting internal RAM until no handshake could be allocated. One-shot responses (pages, favicon, login, redirects, 401s) now release their socket immediately, while the authenticated API connection keeps keep-alive.\r\n  - **New: web panel self-healing.** The HTTPS server now refuses to start without enough internal heap headroom (retrying every 15 seconds), and restarts itself when idle if the largest free block shrinks below what a TLS handshake needs.\r\n  - Extended `get web.status` with `heals:<n>` and `deferred:<n>`, and `get mqtt.status` with `leaked:<n>` (MQTT clients abandoned after a heap-integrity failure), so heap-related failures are visible over LoRa.\r\n  - Fixed the Channel and Gateway cells on the web panel stats page always showing `--`; the stats summary now carries the Wi-Fi channel, gateway health, and watchdog reconnect count.\r\n  - Fixed the LilyGo T-Beam 1W external PA ramp time being silently reset from 800 µs back to RadioLib's 200 µs default whenever TX power was applied (at boot and via `set tx`); every power change now re-applies the 800 µs ramp the external PA requires.\r\n  - Added `eastmesh-tools/web-heap-check.sh` to read heap and service health over the HTTPS API and optionally stress the web panel with browser-style bursts.\r\n- Includes ESP-NOW bridge firmware targets using the `*_repeater_observer_espnow` PlatformIO environment suffix.\r\n\r\n### Breaking Changes\r\n\r\n- None in 2026.8.3. (If upgrading from 2026.7.x or earlier: saved settings move to the new `prefs.json` format on first boot, and downgrading afterwards reverts the device to the old pre-migration settings file.)\r\n\r\n### Notes\r\n\r\n- **If your observer's web panel has ever stopped responding after days of uptime while LoRa and MQTT kept working, this release is the fix** — and if heap pressure does recur, the panel now heals itself instead of staying down. `heals:<n>` and `deferred:<n>` in `get web.status` count these events since boot.\r\n- The Wi-Fi gateway connectivity watchdog from 2026.8.2 remains in place: `gw:ok|lost` and `wd:<n>` in `get wifi.status` show gateway health and forced reconnects, and `wifi reconnect` forces a rejoin manually.\r\n- This track is separate from `observer-eastmesh`.\r\n- Use `get wifi.status` to confirm the active 2.4 GHz Wi-Fi channel before setting `bridge.channel`.\r\n- `bridge.channel` should match the connected Wi-Fi channel for reliable ESP-NOW bridge operation.\r\n- For maximum heap headroom after setup, disable the web panel with `set web off`.\r\n- `flood.max.advert` controls the hop limit for flooded advert packets.\r\n\r\n### Documentation\r\n\r\n[xjarid.github.io/MeshCore-EastMesh](https://xjarid.github.io/MeshCore-EastMesh/)\r\n\r\n### Flashing\r\n\r\n- [flasher.eastmesh.au](https://flasher.eastmesh.au/)\r\n- [flasher.meshcore.io](https://flasher.meshcore.io/)\r\n\r\n### Assets\r\n\r\n- `.bin` - standard update image\r\n- `-merged.bin` - full ESP32 image for flashing after erase"
