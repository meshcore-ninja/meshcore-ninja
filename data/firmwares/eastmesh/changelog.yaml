    notes: "## MeshCore EastMesh Observer\r\n\r\nEastMesh `observer-eastmesh` firmware for MeshCore boards with secure MQTT uplink and optional local web management, based on MeshCore firmware `v1.17.1` (as of 2026-08-15).\r\n\r\nThis release fixes the **web panel becoming unreachable after long uptimes** — repeated TLS handshakes were fragmenting internal RAM until the panel could no longer accept connections — adds **web panel self-healing** and heap-health CLI counters, fixes the stats page Channel/Gateway cells, and stops the **T-Beam 1W external PA ramp time** being reset by TX power changes.\r\n\r\n### What's Changed\r\n\r\n- **Fixed: web panel unreachable after days of uptime** while LoRa and MQTT kept working. Browser page-load bursts were evicting live HTTPS sessions and forcing repeated TLS handshakes, fragmenting internal RAM until no handshake could be allocated. One-shot responses (pages, favicon, login, redirects, 401s) now release their socket immediately, while the authenticated API connection keeps keep-alive.\r\n- **New: web panel self-healing.** The HTTPS server now refuses to start without enough internal heap headroom (retrying every 15 seconds), and restarts itself when idle if the largest free block shrinks below what a TLS handshake needs.\r\n- Extended `get web.status` with `heals:<n>` and `deferred:<n>`, and `get mqtt.status` with `leaked:<n>` (MQTT clients abandoned after a heap-integrity failure), so heap-related failures are visible over LoRa.\r\n- Fixed the Channel and Gateway cells on the web panel stats page always showing `--`; the stats summary now carries the Wi-Fi channel, gateway health, and watchdog reconnect count.\r\n- Fixed the LilyGo T-Beam 1W external PA ramp time being silently reset from 800 µs back to RadioLib's 200 µs default whenever TX power was applied (at boot and via `set tx`); every power change now re-applies the 800 µs ramp the external PA requires.\r\n- Added `eastmesh-tools/web-heap-check.sh` to read heap and service health over the HTTPS API and optionally stress the web panel with browser-style bursts.\r\n\r\n### Breaking Changes\r\n\r\n- None in 2026.8.3. (If upgrading from 2026.7.x or earlier: saved settings move to the new `prefs.json` format on first boot, and downgrading afterwards reverts the device to the old pre-migration settings file.)\r\n\r\n### Notes\r\n\r\n- **If your observer's web panel has ever stopped responding after days of uptime while LoRa and MQTT kept working, this release is the fix** — and if heap pressure does recur, the panel now heals itself instead of staying down. `heals:<n>` and `deferred:<n>` in `get web.status` count these events since boot.\r\n- The Wi-Fi gateway connectivity watchdog from 2026.8.2 remains in place: `gw:ok|lost` and `wd:<n>` in `get wifi.status` show gateway health and forced reconnects, and `wifi reconnect` forces a rejoin manually.\r\n- `eastmesh-au` remains the recommended MQTT endpoint once `mqtt.iata` is configured; `meshmapper` and `waev` are available as global second brokers.\r\n- Select brokers from the Primary and Secondary dropdowns in the web panel, or toggle them from the CLI (`set mqtt.eastmesh-au on`, `set mqtt.meshmapper on`, `set mqtt.waev on`, etc.). A maximum of two brokers can be enabled at once.\r\n- `waev` (`mqtt.waev.app`) uses a 1-hour auth token that the firmware refreshes automatically, so no extra configuration is needed. Set your Waev account email with `set mqtt.email <email>` so Waev can link the observer to your account.\r\n- MQTT status messages report cumulative `packets_sent` and `packets_received` alongside the existing radio stats; both counters reset on reboot.\r\n- LetsMesh EU/US are retired but still selectable for legacy use.\r\n- Custom MQTT is available for private broker deployments and uses username/password auth only. For TCP custom MQTT, use the broker host and port as before. For WSS custom MQTT, set the host and port, select WSS transport, and the firmware connects using `wss://host:port/mqtt`.\r\n- WSS uses TLS encryption and validates aga\n…"
