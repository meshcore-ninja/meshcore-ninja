    prerelease: false
    notes: >-
      ## Fix: E-Ink bleibt nicht mehr im Controller-Deep-Sleep hängen


      Behebt den in #2 gemeldeten Zustand, in dem das Panel auf dem Schlafbild stehen bleibt und
      jeder Refresh in `Busy Timeout!` endet.


      `display::hibernate()` schickt den UC8253 des GDEQ031T10 per Kommando `0x07` in den
      Controller-Deep-Sleep — daraus kommt er ausschließlich über einen Hardware-Reset zurück.
      GxEPD2 setzt beim nächsten `init()` aber `_hibernating = false`, unabhängig davon, ob der
      RST-Puls gewirkt hat. War der Puls zu kurz (Fennek nutzte bisher 2 ms, GxEPD2-Default ist 10
      ms), ignoriert das schlafende Panel den anschließenden Soft-Reset, BUSY bleibt dauerhaft
      aktiv, und das Bild lässt sich firmwareübergreifend nicht mehr aktualisieren, bis sich das
      Panel nach Stunden selbst entladen hat.


      **Neu:** `initPanel()` in `src/core/display.cpp` eskaliert die Reset-Puls-Länge (20 / 50 / 200
      ms) und prüft nach jedem Versuch die BUSY-Leitung. Greift beim Kaltstart (`begin()`) wie beim
      Timer-Wake (`beginAfterSleep()`); schlägt alles fehl, landet eine Zeile `[EINK] Panel
      antwortet nicht` im Serial-Log statt eines stillen Timeouts.
