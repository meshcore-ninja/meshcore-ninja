  - version: v2.6.4
    name: Fennek v2.6.4
    datetime: '2026-07-14T07:44:33Z'
    url: https://github.com/danst0/fennek/releases/tag/v2.6.4
    prerelease: false
    notes: >-
      Schutznetze gegen stille Akku-Tiefentladung im Standby:


      - Schlaf-Diagnose im RTC-RAM (Phase-Breadcrumb + Wake-Historie, beim nächsten Vollboot ins
      battlog)

      - Task-Watchdog um Timer-Wake-Minimalpfad (30 s) und enterStandby (60 s),
      Loslass-Warteschleife mit 10-s-Timeout

      - Crash-Loop-Bremse: 3 abnormale Resets in Folge → Not-Standby (nur Knopf-Wake), Crash-Boots
      flushen sofort auf SD

      - Tiefentladeschutz: ≤5 % auf Akku → sofort Standby, im Schlaf keine Stunden-Wakes mehr
      (Wecker bis 3 %)

      - GPIO42 (Tastatur-Backlight-Gate) über Deep Sleep gehalten, E-Ink-Controller vor Deep Sleep
      in hibernate()

      - Launcher: Kachel-Icons links + Text-Label, Lage/Gyro-App deaktiviert
