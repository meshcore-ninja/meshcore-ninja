    url: https://github.com/MeshCore-Beacon/beacon-server/releases/tag/v2.0.0
    prerelease: false
    notes: >-
      # Beacon Server 2.0.0


      A huge thank you to [n30nex](https://github.com/n30nex) for helping get Beacon to this point.
      Many of the dashboards and features in 2.0.0, from observer monitoring and the analytics
      endpoints to channel scopes and the MeshMapper work, are there because of his help.


      Pair this release with [Beacon Web
      2.0.0](https://github.com/MeshCore-Beacon/beacon-web/releases/tag/v2.0.0).


      ## Breaking change: 2.0.0 needs a fresh database


      There were so many changes to the backend database over this cycle that it made sense to start
      clean. 2.0.0 starts from a new schema baseline and will not run against a 1.x database. It
      refuses to start with:


      ```

      migrations failed error="database schema predates Beacon 2.0.0; 2.0.0 needs a fresh database"

      ```


      1.x history does not carry over. The database user and database name also change from `tower`
      to `beacon`, and several config settings that used to be tolerated now stop startup. Follow
      the [upgrade
      guide](https://github.com/MeshCore-Beacon/beacon-docs/blob/main/docs/upgrading.md#upgrading-to-200-from-1x)
      step by step before you pull the new image.


      ## Built for big instances


      A lot of this release is about load. MeshMapper's instance at
      [analyzer.meshmapper.net](https://analyzer.meshmapper.net/) handles around 400,000 packets
      every 15 minutes on 2.0.0 and barely sweats. MQTT bursts are buffered into bounded
      per-observer workers, route reconfirmation runs in batches that no longer stall ingest,
      retention deletes are batched with tuned autovacuum, and every historical stat now reads from
      hourly rollups instead of materialized views or live scans.


      ## MeshMapper integration


      MeshMapper has expanded its API and Beacon now ingests it. With the `meshmapper` config block
      turned on, Beacon can:


      - Tag scoped traffic using the transport scope catalogue MeshMapper publishes for each IATA.

      - Set up regions automatically from MeshMapper zone groups, so you do not have to hand-write
      `regions:`.

      - Draw geo borders from MeshMapper zone outlines, used for the map border layer and the
      foreign repeater flag.

      - Import each IATA's public hashtag channels and decrypt them like configured ones.


      Everything is off by default, needs no API key, and respects MeshMapper's per-endpoint rate
      limits. Details are in the [configuration
      guide](https://github.com/MeshCore-Beacon/beacon-docs/blob/main/docs/configuration.md).


      ## Versioning from here on


      Starting with 2.0.0, Beacon Server and Beacon Web share the same major and minor version. Only
      the patch number moves on its own, so server 2.0.3 runs with web 2.0.1. Keep both on the same
      `2.X`. The `latest` image tag is now reserved for stable releases from `main`; pin `:2.0` on
      both images if you want to choose when to move to the next minor.


      ## Everything since v1.6.0


      ## Breaking changes and configuration


      - Fresh database required. All 1.x migrations are flattened into a single 2.0.0 baseline, and
      migrations now run under an advisory lock inside a transaction so a crash mid-migration cannot
      strand a database.

      - The 1.6.0 materialized views are gone. Historical stats read hourly rollup tables instead
      (see Stats and analytics).

      - `packets.retention` now defaults to 7 days (down from 30) and also covers observations and
      channel messages. Hourly stats outlive raw packets under `analytics.rollup_retention`, default
      90 days.

      - Every manual `scopes:` entry must set `region:` to one of your `regions:` slugs. A missing
      or unknown region stops startup.

      - REST rate limiting is on by default: 300 requests per minute per client IP on `/api/v1/*`,
      answered with 429 and `Retry-After`. Behind a proxy, set `server.trusted_proxies` (CIDRs only)
      and have the proxy send `X-Real-IP`, or all visitors share one budget.

      - WebSocket upgrades are limited to `websocket.max_connects_per_minute` (default 10) per
      client IP, and only the page's own host may open `/ws` unless other origins are listed in
      `websocket.allowed_origins`.

      - Admin endpoints under `/api/v1/admin/` need `BEACON

      …
  - version: v1.6.0
    name: v1.6.0
    datetime: '2026-07-24T20:37:44Z'
    url: https://github.com/MeshCore-Beacon/beacon-server/releases/tag/v1.6.0
    prerelease: false
    notes: "## New Features\r\n\r\n- **Channel message backfill at boot** — when a channel's decryption key is added to config, packets for that channel that arrived *before* the key was known (and were stored as hash-only, undecrypted rows) are now retried against the keystore on the next startup. Previously that history just sat in the database unused forever; now it surfaces automatically. Backfilled messages don't emit live WebSocket events (they're history, not new activity), and the process is non-fatal — a decrypt failure logs and moves on rather than blocking boot. *(3cad2df)*\r\n- **Node staleness & automatic deletion** — new config: `nodes.stale_threshold` (default 24h) marks a node `stale: true` in the API once it hasn't been seen in that long; `nodes.delete_after` (default 30 days, same default as packet retention) removes nodes from the database entirely once they've been gone that long, via the existing cleanup background job. Node deletion correctly excludes any node with a manually-recorded owner record, so operator-curated ownership data is never silently orphaned. *(99d7eb0)*\r\n- **IATA region borders (GeoJSON)** — `GET /api/v1/iatas/{iata}/border` returns a region's border as a GeoJSON Feature (Polygon or MultiPolygon, with a server-computed bounding box) for map rendering — `204` when a region has no border configured, `404` for an unknown IATA. Borders are supplied per-IATA via config (`borderFile: path/to.geojson`) and validated at boot — malformed geometry, out-of-range coordinates, or unclosed rings fail startup rather than shipping bad data silently. Deliberately kept off the main `/iatas` list response so it stays lightweight for callers that don't need it. *(3f2506f)*\r\n- **Node clock drift detection** — repeaters and room servers self-report a device clock in every advert; the server now compares that against its own receive time and surfaces the delta (`clockDriftSeconds`, `clockOutOfSync`, `clockCheckedAt`) on the node API, with the out-of-sync threshold configurable (`nodes.clock_drift_threshold`, default 5m). Useful for spotting devices with a broken or badly-drifted RTC. *(8e27986)*\r\n- **Top advertisers & top talkers stats** — two new endpoints, `GET /stats/top-advertisers` and `GET /stats/top-talkers`, following the same `since`/`limit`/`iatas` shape as the existing top-observers endpoint. Top advertisers counts distinct ADVERT packets per node (not raw hearings, so a broadcast heard by five observers doesn't inflate the count); top talkers aggregates by decrypted sender display name. Now served from materialized views (see Performance) rather than live queries. *(b38663d, later matview-backed in cbde3d0/bc3a375)*\r\n- **Node public-key prefix search** — `GET /nodes?pubkeyPrefix=...` matches nodes by a partial hex prefix of their public key, alongside the existing exact-match `pubkey` filter — useful when a UI only shows a node's key truncated. *(0ca28cc)*\r\n- **Plural filter params on packet list** — `GET /packets` now accepts comma-separated `payloadTypes`, `routeTypes`, and `scopes` alongside the existing singular params, so multi-select filters can be expressed in one request instead of requiring client-side post-filtering. *(b33ebc0)*\r\n- **Source/destination endpoints in resolved path data** — packet path data (both the live WebSocket feed and the REST packet detail) now resolves and includes the sender and, where determinable, the recipient — not just the intermediate hops — for payload types where that's meaningful (ADVERT, TEXT_MESSAGE, PATH, REQUEST/RESPONSE, ANON_REQ's destination). This is what makes the live map able to draw a packet's full source→destination path instead of stopping at the first/last known repeater. *(f07edf9)*\r\n- **`?neighbors` on node list** — `GET /nodes?neighbors` opts into including each node's known neighbor IDs in the list response. *(4e2ee62)*\r\n- **Resolved path in WebSocket observation events** — live packet observation events over the WebSocket now carry the same resolved-path\n…"
