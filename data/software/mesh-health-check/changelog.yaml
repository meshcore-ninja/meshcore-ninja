  - version: v1.3.0
    name: v1.3.0 - Region-Aware Observer Targeting
    datetime: '2026-04-20T16:01:49Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.0
    prerelease: false
    notes: "This release adds region-based observer filtering, so targeting no longer has to be managed as a single flat observer list. Observers with saved coordinates can now be assigned to named regions using GeoJSON boundary files, and the dashboard can present grouped region selectors such as `New England → Massachusetts` for faster targeting.\r\n\r\nThis release also makes the region feature fully deployable rather than only locally usable. Bundled region boundary files are now included for multiple countries and datasets, Docker images now ship those files correctly, and the region system supports both grouped hierarchies and flat region sets for custom GeoJSON inputs. In practice, operators can point the app at a boundary file, map observers by location, and immediately filter coverage checks by region without relying on external services.\r\n\r\nOn the UI side, the observer selector now supports region-first filtering on top of the existing observer workflow, and the receipt timeline received a small but important polish fix so the final marker stays inside the track instead of rendering half off-screen.\r\n\r\nSpecial thanks to `@gadgethd` for PR #14, which introduced the region-based observer filtering foundation for this release.\r\n\r\n### Highlights\r\n\r\n- Added server-side observer region detection from configurable GeoJSON boundary files\r\n- Added grouped region filtering in the observer selector for targeting by division and child region\r\n- Added support for bundled region files including:\r\n  - US states\r\n  - UK\r\n  - Germany\r\n  - Australia\r\n  - Canada\r\n  - France\r\n  - US Census places\r\n- Added new region configuration environment variables:\r\n  - `REGIONS_FILE`\r\n  - `REGION_NAME_PROPERTY`\r\n  - `REGION_GROUP_PROPERTY`\r\n- Added Docker image support for bundled `regions/` files\r\n- Added flat, no-group fallback support for custom GeoJSON region files\r\n- Added test coverage for grouped and flat region hierarchy behavior\r\n- Fixed the receipt timeline so the last observer marker stays inside the track\r\n\r\n### Validation\r\n\r\n- `npm run check`\r\n- `npm test`\r\n\r\n### Full changelog\r\n\r\n- https://github.com/yellowcooln/meshcore-health-check/blob/main/CHANGES.md"
  - version: v1.2.5
    name: v1.2.5 - Control-Center UI Refresh
    datetime: '2026-04-16T19:10:01Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.2.5
    prerelease: false
    notes: "This release brings a full web UI refresh across the dashboard, shared-result pages, and landing flow, while carrying forward the repeater-awareness added in `v1.2.4`. The goal was to move the app from a purely utilitarian surface to a clearer, more intentional control-center style interface without changing the core health-check workflow.\r\n\r\n### Highlights\r\n\r\n- Redesigned the main dashboard into a new control-center layout with a stronger hero section, cleaner command flow, and updated health summary presentation\r\n- Redesigned the shared-result view so retained links now use the same modern UI system as the live dashboard instead of the older shell\r\n- Refreshed the landing and Turnstile flow to match the new visual direction\r\n- Carried the **Repeaters** metric from `v1.2.4` into the redesigned score cards, so relay-hop visibility remains part of the primary result view\r\n- Improved light-mode styling so the redesigned UI has a coherent light theme instead of a rough placeholder treatment\r\n- Improved mobile behavior so the redesigned layout works cleanly on smaller screens, including stacking the top telemetry cards vertically instead of forcing sideways scrolling\r\n- Updated the shared control area and related layout details so the redesigned shell works consistently across both live and shared views\r\n- Fixed the stale smoke-test expectation on the UI branch so CI now reflects the current observer-target behavior\r\n\r\n### Why this release\r\n\r\n`v1.2.5` is primarily a presentation and usability release. It keeps the underlying health-check and repeater logic intact, while making the app easier to read, easier to share, and more consistent across the dashboard, share links, mobile layouts, and light mode.\r\n\r\n### Credit\r\n\r\nSpecial thanks to `@mitchellmoss` for the new web UI design that shaped this release.\r\n\r\n### Validation\r\n\r\n- `npm run check`\r\n- `npm test`\r\n- `docker compose up -d --build`\r\n\r\n### Full changelog\r\n\r\n- https://github.com/yellowcooln/meshcore-health-check/blob/main/CHANGES.md"
  - version: v1.2.3
    name: v1.2.3 - Route Visibility, Observer Safety, and UI Consistency
    datetime: '2026-04-14T19:35:13Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.2.3
    prerelease: false
    notes: "This release improves route visibility, tightens observer metadata handling, and cleans up several UI consistency issues across the live dashboard and shared result views.\r\n\r\n### Highlights\r\n\r\n- Fixed receipt path rendering so 2-byte and 3-byte MeshCore hops are preserved instead of collapsing the final observer hop to 1 byte\r\n- Added API coverage for both 2-byte and 3-byte path handling\r\n- Changed `OBSERVER_RETENTION_SECONDS=0` to fully disable stale-observer pruning\r\n- Stopped decoded packet adverts from renaming observers or saving bogus `0,0` coordinates\r\n- Stopped MQTT `/status` metadata from renaming or relocating other observers through mismatched embedded keys\r\n- Merged PR #8, which improves the health score ring with status-based coloring and SVG stroke rendering\r\n- Merged PR #9, which adds the optional `data-map-observer-scope=\"expected\"` hook for deployments that want the map to follow the active scoring set\r\n- Added follow-up fixes so the shared-result page uses the same SVG score ring markup as the main dashboard\r\n- Linked the footer version label directly to the repository changelog\r\n- Updated the PWA service worker cache strategy so normal refreshes no longer mix stale cached assets with new markup after UI changes\r\n\r\n### Why this release\r\n\r\n`v1.2.3` focuses on three problem areas:\r\n\r\n- better correctness for multibyte route display\r\n- safer observer identity and location learning\r\n- more consistent dashboard rendering across the main app, shared views, and normal browser refreshes\r\n\r\n### Validation\r\n\r\n- `npm run check`\r\n- `npm test`\r\n\r\n### Included PRs\r\n\r\n- PR #8: Improve score ring rendering\r\n- PR #9: Add optional expected-observer map scope\r\n\r\nThank you @gadgethd for the PR's!\r\n\r\n### Full changelog\r\n\r\n- `CHANGES.md`"
