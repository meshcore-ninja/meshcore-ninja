    notes: "## Mesh Health Check v1.2.1\r\n\r\nThis release restores the app to the upstream `@michaelhart/meshcore-decoder`, fixes the share-link flow, and tightens release quality around the retained result experience.\r\n\r\n### Highlights\r\n\r\n- Switched runtime packet decoding back to `@michaelhart/meshcore-decoder`\r\n- Added a local compatibility patch so the published decoder package still loads cleanly on Node 18\r\n- Fixed the dashboard **Share** button so supported browsers use the native share sheet with the retained `/share/:sessionId` link\r\n- Kept clipboard copy as the fallback when the Web Share API is unavailable\r\n- Added regression coverage for the browser share flow and retained share-link payload\r\n\r\n### Why this release\r\n\r\nThe main goal of `v1.2.1` is to stabilize two areas:\r\n\r\n- decoder and runtime compatibility in the current deployment environment\r\n- reliable sharing of retained session results from the dashboard\r\n\r\n### Validation\r\n\r\n- `npm run check`\r\n- `npm test`"
