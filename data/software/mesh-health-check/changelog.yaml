    notes: "This release focuses on observer targeting, stale observer cleanup, and improved dashboard consistency.\r\n\r\n### Highlights\r\n\r\n- The map now shows all known observers with saved coordinates, not just the current target set\r\n- Added `OBSERVER_RETENTION_SECONDS` so observers that have not been heard from recently can drop out of the dashboard and map\r\n- Tightened the matched-message panel so long payloads no longer take over the score card\r\n- Default target observers remain visible in the selector even when they are no longer retained, keeping the UI aligned with scoring\r\n- Changing the observer selection now updates the target preview immediately and regenerates an unused waiting code so the next check scores against the new set\r\n- Added API and smoke-test coverage for retained default observers and observer-target retargeting\r\n- Fixed the dashboard smoke test expectation so GitHub Actions is green again for this release\r\n\r\n### Validation\r\n\r\n- `npm run check`\r\n- `npm test`\r\n- GitHub Actions smoke and Docker coverage on `dev`"
