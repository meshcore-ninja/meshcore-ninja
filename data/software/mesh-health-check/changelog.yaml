    name: v1.1.0 — Coverage Map, Receipt Timeline, and Smarter Observer Profiles
    datetime: '2026-03-11T03:16:36Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.1.0
    prerelease: false
    notes: "## Mesh Health Check v1.1\r\n\r\nMesh Health Check is a self-hosted web app for measuring real-world MeshCore message coverage across your observer network. Generate a short test code, send it to the configured channel, and watch observer receipts build in real time.\r\n\r\n### Highlights\r\n\r\n- Added an observer coverage map with dark mode by default and a light-map toggle\r\n- Added a receipt timeline showing when each observer first saw the message\r\n- Observer markers now show **green** for observers that saw the message and **red** for observers that did not\r\n- Observer coordinates are now learned from MQTT metadata and persisted into `observer.json`\r\n- `observer.json` now supports saved observer profiles with `name`, `lat`, and `lon`\r\n- Matched message hashes now link directly to the packet analyzer\r\n- Added an optional env-driven external hero link\r\n- Moved the repo reference to a footer note and corrected it to the project repository\r\n\r\n### Reliability Improvements\r\n\r\n- Fixed active-session hash alias handling so in-flight coverage does not reset mid-run\r\n- Fixed map tile loading under CSP\r\n- Fixed map tile-layer flicker caused by repeated refresh rendering\r\n\r\n### Operator Notes\r\n\r\n- `.env.example` is now deployment-neutral instead of Boston-specific\r\n- The app remains Docker-first and proxy-friendly\r\n- MQTT decoding is limited to the configured test channel only\r\n- Observer names and locations persist across rebuilds via `observer.json`\r\n\r\n### Verification\r\n\r\n- `npm run check`\r\n- `npm test` (Node 22)\r\n- Docker rebuild and runtime validation"
