  - version: v1.3.7
    name: v1.3.7 — Map Filtering and Location Fixes
    datetime: '2026-08-07T15:29:21Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.7
    prerelease: false
    notes: "# Coverage Map Fixes & Reliability Improvements\r\n\r\nThis release fixes coverage-map filtering and invalid observer locations based on reports and testing from the MeshCore community.\r\n\r\n# Map Fixes\r\n\r\n* Coverage maps now follow the active session's expected observer set.\r\n* Region and custom observer selections correctly hide unrelated observers instead of displaying the full retained observer directory.\r\n* Observer locations reporting `0,0` are no longer displayed.\r\n* Invalid coordinates are now rejected, including:\r\n\r\n  * Non-numeric latitude or longitude values\r\n  * Out-of-range latitude values\r\n  * Out-of-range longitude values\r\n\r\n# Reliability & Maintenance\r\n\r\n* Added browser regression coverage for region-scoped maps and invalid observer coordinates.\r\n* Stabilized mocked dashboard smoke tests by isolating them from service-worker request interception.\r\n* Updated `ws` from **8.21.2** to **8.21.3**.\r\n* Added weekly Dependabot monitoring for the Docker base image.\r\n\r\n# Verification\r\n\r\nBoth reported map issues were confirmed fixed using the **v1.3.7 development Docker image**.\r\n\r\nAutomated validation included:\r\n\r\n* ✅ 41 unit and API tests\r\n* ✅ 7 Playwright browser smoke tests\r\n* ✅ Syntax checks\r\n* ✅ Docker Compose build and runtime validation\r\n* ✅ Published development-image verification\r\n* ✅ Clean npm security audit\r\n\r\nFixes #44 and #45.\r\n\r\n## What's Changed\r\n* Prepare v1.3.7 by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/46\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-health-check/compare/v1.3.6...v1.3.7"
  - version: v1.3.6
    name: v1.3.6 – Security Hardening & Dependency Maintenance
    datetime: '2026-08-04T01:17:32Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.6
    prerelease: false
    notes: "This release focuses on security hardening, dependency maintenance, and deployment improvements. \r\n## Security\r\n\r\n* Fixed client IP handling so rate limiting follows Express's configured `TRUST_PROXY` policy instead of independently trusting `X-Forwarded-For`.\r\n* Added explicit boolean and numeric parsing for `TRUST_PROXY`.\r\n* Directly exposed deployments can now safely use `TRUST_PROXY=false`.\r\n* Restricted the optional `EXTERNAL_LINK_URL` to valid HTTP and HTTPS URLs.\r\n* Updated the transitive `ip-address` dependency to **10.4.0**, resolving advisories related to IPv4 and IPv6 trust-boundary classification.\r\n\r\n## Dependency Updates\r\n\r\nUpdated:\r\n\r\n* `ws` → **8.21.2**\r\n* `@playwright/test` → **1.62.1**\r\n* `actions/setup-node` → **v7**\r\n\r\nAdditionally:\r\n\r\n* Confirmed all npm dependencies are current.\r\n* Production and full npm audits report **zero vulnerabilities**.\r\n\r\n## Docker & Testing\r\n\r\n* Switched Docker production builds to deterministic `npm ci` lockfile installs.\r\n* Added regression tests preventing forged forwarded addresses from bypassing rate limiting.\r\n* Updated deployment documentation for trusted-proxy and direct-access configurations.\r\n\r\n## Upgrade Notes\r\n\r\nNo storage or configuration migration is required. Existing `.env` files and persisted data remain fully compatible.\r\n\r\nDeployment recommendations:\r\n\r\n* Deployments behind a single trusted reverse proxy can continue using:\r\n\r\n  * `TRUST_PROXY=1`\r\n* Directly exposed deployments should use:\r\n\r\n  * `TRUST_PROXY=false`\r\n* `EXTERNAL_LINK_URL`, when configured, must use an `http://` or `https://` URL.\r\n\r\n## Validation\r\n\r\n* ✅ Syntax checks passed\r\n* ✅ 41 unit/API tests passed\r\n* ✅ 5 Playwright smoke tests passed\r\n* ✅ Docker image rebuilt and restarted successfully\r\n* ✅ Runtime `npm audit` reports zero vulnerabilities\r\n* ✅ Live MQTT connectivity and persisted observer metadata verified\r\n\r\n## What's Changed\r\n* Bump actions/setup-node from 6 to 7 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/40\r\n* Bump ws from 8.21.0 to 8.21.1 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/41\r\n* Bump @playwright/test from 1.61.1 to 1.62.0 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/42\r\n* Update dependencies: setup-node, ws, and playwright/test by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/43\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-health-check/compare/v1.3.5...v1.3.6"
  - version: v1.3.5
    name: v1.3.5 – CoreScope Integration & Smarter Observer Tracking
    datetime: '2026-07-09T02:44:21Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.5
    prerelease: false
    notes: "This release improves CoreScope integration, refines observer tracking, and enhances automatic observer selection, along with documentation, testing, and dependency updates.\r\n\r\n## Highlights\r\n\r\n### CoreScope Integration\r\n\r\n* Added support for linking matched packet hashes directly to CoreScope.\r\n* New `CORESCOPE_URL` environment variable.\r\n* When configured, **Message Hash** links now open the matching packet in CoreScope.\r\n* Existing packet analyzer links remain the fallback when `CORESCOPE_URL` is not configured.\r\n\r\n### Observer Improvements\r\n\r\n* Improved observer name learning from `/status` metadata by using `origin` as a fallback observer name.\r\n* Decoded MeshCore advert metadata now updates the advertised node's profile, even when received through another observer's MQTT topic.\r\n* Decoded advert names can refresh stale saved node names without renaming the receiving MQTT observer.\r\n\r\n### Dynamic Observer Selection\r\n\r\n* Auto-selected top observers now honor `OBSERVER_RETENTION_SECONDS`.\r\n* Stale high-volume observers are no longer selected after aging out of the dashboard retention window.\r\n\r\n### Documentation\r\n\r\nExpanded observer region documentation, including:\r\n\r\n* `REGIONS_FILE`\r\n* `REGION_NAME_PROPERTY`\r\n* `REGION_GROUP_PROPERTY`\r\n\r\nAlso added guidance for both grouped and flat GeoJSON region filtering.\r\n\r\n### Testing & Dependency Updates\r\n\r\n#### Test Improvements\r\n\r\n* Replaced Boston-specific test defaults with generic test values.\r\n* Added synthetic observer advert coverage for decoded metadata behavior.\r\n* Added CoreScope link regression coverage.\r\n\r\n#### Dependency Updates\r\n\r\n* `mqtt` → **5.15.2**\r\n* `@playwright/test` → **1.61.1**\r\n* `docker/build-push-action` → **v7**\r\n\r\n## Validation\r\n\r\n* ✅ `npm run check`\r\n* ✅ `npm test`\r\n* ✅ `npm run test:smoke`\r\n* ✅ GitHub Actions CI passed\r\n* ✅ Docker publish workflow passed on the `dev` branch\r\n\r\n## What's Changed\r\n* Bump docker/build-push-action from 6 to 7 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/36\r\n* Bump @playwright/test from 1.61.0 to 1.61.1 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/37\r\n* Bump mqtt from 5.15.1 to 5.15.2 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/38\r\n* Update dependencies: docker/build-push-action, @playwright/test, mqtt by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/39\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-health-check/compare/v1.3.4...v1.3.5"
  - version: v1.3.4
    name: v1.3.4 - Reverse Proxy Improvements and Dependency Refresh
    datetime: '2026-06-20T01:41:25Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.4
    prerelease: false
    notes: "This release improves public deployment support, updates the dependency stack, and adds compatibility fixes for Express 5.\r\n\r\n## Highlights\r\n\r\n### Public Deployment Support #25 \r\n\r\n- Added `SITE_URL` configuration for deployments behind Docker, reverse proxies, and path-prefixed URLs.\r\n- Generated share links now use the configured public URL instead of internal container hostnames.\r\n- Server-rendered social preview metadata now uses the configured public URL.\r\n- Supports deployments under subpaths such as:\r\n\r\n```text\r\nhttps://example.com/mesh-health\r\n```\r\n\r\n### Share Link Improvements\r\n\r\n- Generated `/share/:sessionId` URLs now honor `SITE_URL`.\r\n- OpenGraph and social preview metadata use the configured public URL.\r\n- URL normalization removes trailing slashes, query strings, and hash fragments.\r\n\r\n### Express 5 Compatibility\r\n\r\n- Upgraded Express to v5.\r\n- Updated the application's catch-all route to use an Express 5-compatible pattern.\r\n- Fixes the route parser error:\r\n\r\n```text\r\nMissing parameter name at index 1: *\r\n```\r\n\r\n### Dependency & Tooling Updates\r\n\r\nUpdated application dependencies:\r\n\r\n- `dotenv` → 17.4.2\r\n- `express` → 5.2.1\r\n- `@playwright/test` → 1.61.0\r\n\r\nUpdated GitHub Actions:\r\n\r\n- `actions/checkout` → v7\r\n- `actions/setup-node` → v6\r\n- `docker/setup-buildx-action` → v4\r\n- `docker/login-action` → v4\r\n- `docker/metadata-action` → v6\r\n\r\n### Dependabot\r\n\r\n- Added npm dependency monitoring for the `dev` branch.\r\n- Added GitHub Actions dependency monitoring for the `dev` branch.\r\n\r\n### Testing\r\n\r\nAdded regression coverage for:\r\n\r\n- `SITE_URL` share-link generation\r\n- OpenGraph/social metadata generation using the configured public URL\r\n\r\n## Validation\r\n\r\n- `npm run check` ✅\r\n- `npm test` ✅\r\n- 39 tests passed\r\n\r\n## Why This Release\r\n\r\nv1.3.4 focuses on making self-hosted and reverse-proxy deployments behave correctly when generating public URLs, while also modernizing the dependency stack and ensuring compatibility with Express 5.\r\n\r\n## What's Changed\r\n* Add configurable site URL and Dependabot checks for dev by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/26\r\n* Bump dotenv from 16.6.1 to 17.4.2 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/34\r\n* Bump @playwright/test from 1.60.0 to 1.61.0 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/32\r\n* Bump docker/metadata-action from 5 to 6 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/31\r\n* Bump docker/login-action from 3 to 4 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/30\r\n* Bump actions/setup-node from 4 to 6 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/29\r\n* Bump docker/setup-buildx-action from 3 to 4 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/28\r\n* Bump actions/checkout from 4 to 7 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/27\r\n* Bump express from 4.22.2 to 5.2.1 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/33\r\n* Update dependencies including dotenv, Playwright, and Express by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/35\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-health-check/compare/v1.3.3...v1.3.4"
  - version: v1.3.3
    name: v1.3.3
    datetime: '2026-06-10T15:54:07Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.3
    prerelease: false
    notes: "# Mesh Health Check v1.3.3\r\n\r\nThis release adds packet-distance reporting, improves retained share links, hardens rendering of untrusted observer metadata, and refreshes deployment documentation.\r\n\r\n## Highlights\r\n\r\n### Packet Distance Reporting\r\n\r\n* Added packet-path distance estimates between known observer hops.\r\n* Added a new **Longest Packet** distance metric.\r\n* Added distance labels to each **Who Saw the Message** receipt card.\r\n* Added fallback observer-span distance calculations when packet-path hops are unknown or lack coordinate data.\r\n* Added support for displaying distances in miles or kilometers via:\r\n\r\n  * `DISTANCE_UNIT`\r\n\r\n## Share Link Improvements\r\n\r\n* Fixed retained share links so dynamic `/share/` and `/api/` responses are not cached by browsers or service workers.\r\n* Updated the dashboard **Share** button to generate cleaner retained-result URLs without observer-specific text.\r\n\r\n## Security Hardening\r\n\r\n* Escaped untrusted MeshCore/MQTT observer labels in:\r\n\r\n  * Receipt timeline entries\r\n  * Leaflet map popups\r\n* Added browser regression coverage for CVE-2026-45323-style stored XSS payloads in observer names.\r\n\r\n## Documentation and Deployment\r\n\r\n* Simplified and cleaned up `README.md`.\r\n* Expanded `HOWTO.md` with clearer source-build and Docker deployment instructions.\r\n* Moved the complete runtime variable reference to `ENVIRONMENT.md`.\r\n* Clarified Docker image tagging:\r\n\r\n  * `latest` is built from `main`\r\n  * `dev` is built from `dev`\r\n\r\n## Dependency Updates\r\n\r\nUpdated safe same-major versions of:\r\n\r\n* `mqtt`\r\n* `@playwright/test`\r\n\r\n## Why This Release\r\n\r\nv1.3.3 focuses on making health-check results more informative, easier to share, and safer to display.\r\n\r\nKey improvements include:\r\n\r\n* Better visibility into estimated packet travel distances.\r\n* Cleaner retained share links.\r\n* Safer handling of untrusted observer metadata.\r\n* Clearer deployment and configuration documentation.\r\n\r\n## Validation\r\n\r\n* `npm run check`\r\n* `npm test`\r\n* `npm run test:smoke`\r\n* `npm audit --audit-level=low`\r\n* `docker compose up -d --build`\r\n\r\n## What's Changed\r\n* Prepare v1.3.3 with documentation and distance estimation updates by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/24\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-health-check/compare/v1.3.2...v1.3.3"
  - version: v1.3.2
    name: v1.3.2
    datetime: '2026-05-23T16:27:32Z'
    url: https://github.com/yellowcooln/meshcore-health-check/releases/tag/v1.3.2
    prerelease: false
    notes: "## Mesh Health Check v1.3.2\r\n\r\nThis release improves how the app chooses its default observer set, makes observer identity more stable, and tightens dashboard accessibility and usability around observer targeting.\r\n\r\n---\r\n\r\n### Highlights\r\n\r\n* Added rolling observer activity tracking in:\r\n\r\n  * `data/observer-activity.json`\r\n* When `KNOWN_OBSERVERS` is blank, the app now automatically selects the top recent observers from a configurable lookback window instead of relying only on the active observer window\r\n* Kept `KNOWN_OBSERVERS` as a strict manual override for deployments that want a fixed observer set\r\n\r\n### New Environment Variables\r\n\r\n* `OBSERVER_ACTIVITY_FILE`\r\n* `OBSERVER_TOP_WINDOW_DAYS`\r\n* `OBSERVER_TOP_COUNT`\r\n* `OBSERVER_HASH_DISPLAY_BYTES`\r\n\r\n---\r\n\r\n### Observer Identity Improvements\r\n\r\n* Improved observer name handling so saved names from:\r\n\r\n  * `data/observer.json`\r\n\r\n  are no longer easily replaced by lower-quality MQTT metadata\r\n\r\n* Stabilized the Observer Set selector so live updates no longer constantly reset:\r\n\r\n  * The list contents\r\n  * Scroll position\r\n\r\n  while users browse nodes\r\n\r\n* Simplified Observer Set display formatting so it uses the configured short observer hash instead of showing redundant long key fragments\r\n\r\n---\r\n\r\n### Accessibility and UI Improvements\r\n\r\n* Improved accessibility for seen vs not-seen observer states using stronger non-color differentiation\r\n* Fixed layout issues in the “Scored Against” cards introduced by the clearer status treatment\r\n\r\n---\r\n\r\n### Why This Release\r\n\r\nv1.3.2 focuses on making the app smarter about default observer targeting while also making the observer UI easier to trust and easier to use.\r\n\r\nThe result is:\r\n\r\n* Less manual observer tuning\r\n* Better persistence of known observer identity\r\n* Clearer score-state presentation\r\n* Improved accessibility for users who do not distinguish colors the same way\r\n\r\n---\r\n\r\n### Validation\r\n\r\n* `npm run check`\r\n* `npm test`\r\n* `docker compose up -d --build`\r\n\r\n---\r\n\r\n### Full Changelog\r\n\r\n* https://github.com/yellowcooln/meshcore-health-check/blob/main/CHANGES.md\r\n\r\n## What's Changed\r\n* Bump qs and express by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/21\r\n* Track top observers and update qs and express dependencies by @yellowcooln in https://github.com/yellowcooln/meshcore-health-check/pull/22\r\n* Bump ws from 8.19.0 to 8.21.0 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-health-check/pull/23\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-health-check/compare/v1.3.1...v1.3.2"
