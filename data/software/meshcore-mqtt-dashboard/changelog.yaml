  - version: v1.3.3
    name: v1.3.3
    datetime: '2026-06-10T19:12:10Z'
    url: https://github.com/yellowcooln/meshcore-mqtt-dashboard/releases/tag/v1.3.3
    prerelease: false
    notes: "# v1.3.3\r\n\r\nThis release focuses on security hardening, dependency maintenance, and CI/CD improvements.\r\n\r\n## Highlights\r\n\r\n### Security\r\n\r\n* Hardened the dashboard against CVE-2026-45323-style stored XSS attacks from untrusted MeshCore/MQTT data.\r\n* Reviewed and validated rendering paths across the dashboard, traffic page, and battery information views.\r\n* Added regression tests covering malicious metadata, node fields, retained traffic data, and decoded message content.\r\n\r\n### Dependencies\r\n\r\n* Updated safe non-major Python dependencies.\r\n* Verified Node dependencies are current.\r\n* `npm audit --audit-level=low` reports zero vulnerabilities.\r\n\r\n### CI/CD\r\n\r\n* Synced `dev` with `main` while preserving the self-hosted Docker build workflow.\r\n* Docker builds now run on:\r\n\r\n  * Pushes to `main`\r\n  * Pushes to `dev`\r\n  * Pull requests targeting `main`\r\n  * Version tags (`v*`)\r\n  * Manual workflow dispatches\r\n* Pull request validation now builds Docker images without requiring Docker Hub credentials or publishing artifacts.\r\n\r\n### Other Changes\r\n\r\n* Updated application version to `v1.3.3`.\r\n* Refreshed release documentation and changelog entries.\r\n\r\n## Validation\r\n\r\n* Full test suite passed (`33 passed`).\r\n* GitHub Actions test workflow passed.\r\n* Docker build workflow completed successfully on the self-hosted runner.\r\n\r\nSee `CHANGES.MD` for the complete list of changes.\r\n\r\n\r\n## What's Changed\r\n* Use self-hosted runner for Docker publish and improve XSS coverage by @yellowcooln in https://github.com/yellowcooln/meshcore-mqtt-dashboard/pull/9\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-mqtt-dashboard/compare/v1.3.2...v1.3.3"
  - version: v1.3.2
    name: v1.3.2 - CPU Reduction and Docker Publishing
    datetime: '2026-05-08T19:05:55Z'
    url: https://github.com/yellowcooln/meshcore-mqtt-dashboard/releases/tag/v1.3.2
    prerelease: false
    notes: "v1.3.2 focuses on reducing unnecessary runtime overhead and improving deployment options.\r\n\r\nThis release reduces idle CPU work in the MQTT hot path. When battery telemetry is disabled, the dashboard now skips the battery decode path entirely. It also avoids building websocket stats, traffic summaries, and broadcast queue work when no dashboard clients are connected.\r\n\r\nFor the write-heavy SQLite path, the app now uses:\r\n\r\n* `journal_mode=WAL`\r\n* `synchronous=NORMAL`\r\n* `temp_store=MEMORY`\r\n\r\nto reduce database overhead under sustained message traffic.\r\n\r\nThis release also improves distribution and deployment support. A GitHub Actions Docker publish workflow is now included, and the published image is documented as:\r\n\r\n`yellowcooln/meshcore-mqtt-dashboard`\r\n\r\nThe README now includes practical examples for:\r\n\r\n* Pulling the published image\r\n* Running with `docker run`\r\n* Using the image in `docker compose`\r\n\r\n---\r\n\r\n## Validation\r\n\r\n* Automated test suite passing\r\n* Added regression coverage for new hot-path guards\r\n\r\n## What's Changed\r\n* Bump cryptography from 46.0.6 to 46.0.7 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-mqtt-dashboard/pull/6\r\n* Bump pytest from 8.3.5 to 9.0.3 by @dependabot[bot] in https://github.com/yellowcooln/meshcore-mqtt-dashboard/pull/7\r\n* Enhance Docker support and optimize MQTT performance by @yellowcooln in https://github.com/yellowcooln/meshcore-mqtt-dashboard/pull/8\r\n\r\n\r\n**Full Changelog**: https://github.com/yellowcooln/meshcore-mqtt-dashboard/compare/v1.3.1...v1.3.2"
  - version: v1.3.1
    name: v1.3.1 - Optional Battery Telemetry Dashboard
    datetime: '2026-03-29T19:53:56Z'
    url: https://github.com/yellowcooln/meshcore-mqtt-dashboard/releases/tag/v1.3.1
    prerelease: false
    notes: "v1.3.1 adds an optional battery telemetry dashboard and the supporting decode pipeline behind it.\r\n\r\nThis release introduces a new public `/batteryinfo` page for decoded channel-based battery reports. It charts retained battery telemetry, shows the latest decoded values per sender, and keeps the page fast by persisting decoded events in SQLite instead of rescanning the full packet table on every load.\r\n\r\nBattery info is fully opt-in. Fresh installs keep it disabled by default, and the page stays hidden unless it is explicitly enabled and configured with a channel key. The feature also has its own retention window and channel display controls, so it can be managed independently from the main packet retention settings.\r\n\r\nThis release also moves battery decoding to the official `@michaelhart/meshcore-decoder` package.\r\n\r\n### Included in v1.3.1\r\n\r\n- New optional public `/batteryinfo` page\r\n- Decoded battery telemetry charts and recent decoded reports\r\n- SQLite-backed `batteryinfo_events` persistence with retained-packet backfill\r\n- Battery-specific environment controls:\r\n  - `BATTERYINFO_ENABLED`\r\n  - `BATTERYINFO_CHANNEL_NAME`\r\n  - `BATTERYINFO_SHOW_CHANNEL_NAME`\r\n  - `BATTERYINFO_RETENTION_SECONDS`\r\n  - `BATTERYINFO_CHANNEL_KEY`\r\n- Default battery feature state set to off in `.env.example`\r\n- Switched battery decoding to official `@michaelhart/meshcore-decoder`\r\n- Added automated tests for battery decode, persistence, and disabled-route behavior\r\n\r\n### Live Example\r\n\r\nA live example can be found at the [Boston MQTT Dashboard.](https://mcmqttdashboard.bostonme.sh/batteryinfo)"
  - version: v1.3.0
    name: v1.3.0 - Traffic Dashboard and Presence Accuracy
    datetime: '2026-03-24T19:23:24Z'
    url: https://github.com/yellowcooln/meshcore-mqtt-dashboard/releases/tag/v1.3.0
    prerelease: false
    notes: "## v1.3.0\r\n\r\nv1.3.0 adds a dedicated traffic dashboard and improves live node accuracy.\r\n\r\nThis release introduces a new public `/traffic` page that shows retained packet activity across the full retention window. It includes route and payload charts, top talkers, and burst detection so operators can see not just who is online, but what the network is actually doing over time.\r\n\r\nTraffic history is now persisted in SQLite and rebuilt from retained packet data when needed, so the page survives restarts without losing context.\r\n\r\nRole inference is also improved. The dashboard now uses MQTT payload hints from `/status` and `/internal` messages before falling back to name-based matching, improving classification for repeaters, observers, room systems, and MQTT-connected infrastructure.\r\n\r\nThis release also fixes a presence bug caused by retained `/internal` MQTT messages. Those retained startup replays no longer create ghost online nodes, resulting in more accurate node counts after reconnects and restarts.\r\n\r\n### Included in v1.3.0\r\n\r\n- New public `/traffic` page\r\n- Retained route and payload traffic charts\r\n- Top talkers and burst detection views\r\n- SQLite-backed traffic history persistence\r\n- Improved role inference from MQTT payload metadata\r\n- Fix for ghost online nodes caused by retained `/internal` messages\r\n- Startup console log showing the running app version"
  - version: v1.2.1
    name: v1.2.1 focuses on deployment cleanup and dashboard presentation improvements.
    datetime: '2026-03-13T17:44:57Z'
    url: https://github.com/yellowcooln/meshcore-mqtt-dashboard/releases/tag/v1.2.1
    prerelease: false
    notes: "## Release Summary\r\n\r\nThis release adds `DASH_BROKER_HOST`, allowing administrators to show a clean public broker label in the dashboard without changing the actual MQTT connection target.\r\n\r\nThe application can still connect to an internal Docker address such as `host.docker.internal`, while the UI displays a public-facing endpoint like `broker.example.net:443`. The override is rendered exactly as provided.\r\n\r\nThis release also simplifies Docker configuration. `docker-compose.yaml` now loads runtime settings from `.env` using `env_file`, instead of duplicating the environment list directly in the Compose file. This reduces configuration drift and makes local overrides easier.\r\n\r\n### Highlights\r\n\r\n- Added `DASH_BROKER_HOST` for display-only broker endpoint overrides\r\n- Simplified `docker-compose.yaml` to load runtime configuration from `.env`\r\n- Updated documentation to reflect the new broker display override and Compose behavior\r\n\r\n### New Environment Variable\r\n\r\n- `DASH_BROKER_HOST` — optional broker endpoint shown in the dashboard UI only\r\n\r\n### Validation\r\n\r\n- Pytest suite passing"
  - version: v1.2.0
    name: v1.2.0
    datetime: '2026-03-09T14:25:13Z'
    url: https://github.com/yellowcooln/meshcore-mqtt-dashboard/releases/tag/v1.2.0
    prerelease: false
    notes: "## v1.2.0 — 2026-03-03\r\n\r\n### Added\r\n\r\n- Server-rendered share/embed metadata on `/` so previews use live configuration values.\r\n- Wired `title`, `og:title`, and `twitter:title` to `DASH_TITLE`.\r\n- Optional favicon support via `DASH_LOGO_URL` (`.png`, `.jpg`, `.jpeg`).\r\n- Optional external header button controlled by environment variables with URL validation.\r\n- Pytest test suite (`tests/`) covering:\r\n  - API authentication\r\n  - index metadata and favicon rendering\r\n  - redaction behavior\r\n- GitHub Actions CI test workflow at `.github/workflows/tests.yml` for PRs and pushes.\r\n- Documentation updates covering:\r\n  - embed behavior\r\n  - external link configuration\r\n  - manual verification steps.\r\n\r\n### Environment Variables\r\n\r\n- `DASH_LOGO_URL`  \r\n  Optional favicon URL or path (`.png`, `.jpg`, `.jpeg`).\r\n\r\n- `DASH_EXTERNAL_URL`  \r\n  Optional external header button URL (must be `http` or `https`).\r\n\r\n- `DASH_EXTERNAL_LABEL`  \r\n  Label for the external header button (default: `External`)."
