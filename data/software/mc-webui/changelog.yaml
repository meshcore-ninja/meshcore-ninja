      ### Fixes


      - **Unread counts stand out in the channel list on a phone.** On a wide screen, a channel with
      unread messages shows the count in a blue badge next to its name. On a narrow screen the
      channel list is a drop-down from the top bar, and there the same number was drawn in plain
