  - version: v2.9.0
    name: mc-webui 2.9.0
    datetime: '2026-08-14T08:52:51Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.9.0
    prerelease: false
    notes: >-
      ### Features


      - **A path can now be set straight to Direct.** The path dialog could send a node's route back
      to **FLOOD**, and it could push one of your configured paths — but the third option the
      firmware supports, *Direct*, had no button. Direct means no repeater at all: the packet goes
      to the node and nowhere else, which is what you want for a neighbour you can reach on your own
      radio, and the only way to stop your traffic from being repeated across the mesh for a node
      sitting on the next hill. Until now, getting there meant clearing the path through the
      Console. A **Set Direct** button now sits next to **Restore FLOOD**, in both places paths are
      managed: the contact info dialog in Direct Messages, and the path dialog under **My
      Repeaters**. Like Restore FLOOD it changes only the path on the device — your configured paths
      are left alone — and it asks before it does it.

      - **You can restart your device from the interface.** Rebooting a node used to mean either
      opening the Console and typing `reboot`, or getting to the hardware and pulling its power —
      awkward when the device sits on a mast or in another room, and awkward for anyone who never
      opens the Console. Open the menu, pick **Device**, and the **Info** tab now has a **Reboot**
      button under the table. It asks first: the device drops off the mesh for a few seconds while
      it restarts, and a message addressed to you in that window can be lost. The firmware sends
      nothing back in reply to the command, so what the app confirms is that the command went out —
      not that the device is back. It will be, on its own, a few seconds later, and mc-webui
      reconnects without any help. The same restart a remote repeater has had all along under **My
      Repeaters → Actions**, now for the node on your own desk.


      ### Fixes


      - **Switching channels on a phone no longer pops the keyboard open.** The channel picker in
      the top bar was a text field you could type into, so every tap on it summoned the on-screen
      keyboard — which on a phone covers half the screen, over a list four or five items long. The
      search was solving a problem nobody has: the firmware caps how many channels a device can
      hold, so there is never enough of them to be worth searching. The picker is now a plain button
      that opens the same list, with the same last-message previews, unread badges and favourites,
      and nothing to type into. On a computer, Enter or Space still opens it, the arrow keys move
      through it, Enter picks and Escape closes.
  - version: v2.8.0
    name: mc-webui 2.8.0
    datetime: '2026-08-13T05:08:00Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.8.0
    prerelease: false
    notes: >-
      ### Features


      - **You can now record what the app receives from the radio, and send that recording to
      whoever is helping you.** Some problems are impossible to diagnose from a screenshot. The
      classic one: you send a message to a channel, and the badge listing the repeaters that heard
      it never appears — while the Analyzer plainly shows the packet travelled onward. Nothing on
      screen can tell you whether nobody in earshot repeated it, or whether the repeat did come back
      over the air and was dropped on the link between your device and mc-webui before the app ever
      saw it. Those two have the same appearance and completely different answers. A new **Settings
      → Diagnostics** tab records the raw material needed to tell them apart: press **Start
      recording**, reproduce the problem, press **Stop and save**, and you get a file. It contains
      every radio frame the app received while recording, what the app decided about each one, what
      it expected to hear back for each message you sent, and — the number that matters most —
      **your device's own count of packets received, taken at the start and at the end**. If the
      device says it heard two hundred packets and the app only ever saw a hundred and twenty,
      frames are being lost on the companion link, and that is now a measurement rather than a
      guess. Recording stops on its own after the time you choose (5 to 60 minutes) or once the file
      reaches 25 MB, whichever comes first, so a recording you forget about cannot fill your disk.
      While one is running, a red **Recording** marker sits in the status bar at the bottom of the
      chat, because it should never be something you leave on by accident.

      - **Sending a recording.** Under the same tab, each saved recording can be downloaded,
      deleted, or — if the person helping you has given you an upload token — sent to them directly
      with one button, which gives you back a link to pass on. Without a token nothing is sent
      anywhere: the download is always there, and you forward the file yourself however you prefer.

      - **Read the privacy notice before you send one.** A recording necessarily contains **the text
      of every message that arrived while it was running**, along with contact names and public
      keys. That is what makes it useful and also what makes it worth thinking about: the tab says
      so plainly, and asks for confirmation before an upload. Only send one to someone you trust.


      ### Fixes


      - **Long routing paths stay readable on a phone.** Under **My Repeaters**, a path through
      several hops is written as `AB→CD→EF` with nothing between the hops, and a browser will not
      break a line in the middle of that — so on a narrow screen the path either ran off the right
      edge of the card or was cut short with an ellipsis, hiding exactly the hops you opened the
      page to read. Paths now wrap onto a second line, breaking after a hop arrow, in all four
      places they appear: the repeater list, the header of a repeater's management page, the picker
      for adding a repeater, and the current-path line in the path dialog. A repeater's coordinates
      also no longer get separated from their pin icon when the line wraps.
  - version: v2.7.0
    name: mc-webui 2.7.0
    datetime: '2026-08-07T14:23:20Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.7.0
    prerelease: false
    notes: >-
      ### Features


      - **The device's Statistics tab now shows everything the device actually reports.** Open the
      menu, pick **Device**, and switch to **Statistics**: until now it listed the battery, an error
      counter, the number of packets sent, and then some counts out of mc-webui's own database —
      while the `stats` command in the Console, reading exactly the same data from exactly the same
      device, printed a good deal more. The reason was a plain mismatch of field names: the tab
      asked the device for "uptime", "queue", "airtime" and "packets received" under names the
      firmware does not use, so those rows quietly disappeared instead of showing up empty, and
      nobody could tell the difference between a value the device withholds and a value the app
      failed to ask for. All of them are back, and with them the ones that were never displayed at
      all — **last RSSI**, **last SNR** and the **noise floor** (worth knowing: how loud the band is
      where your node sits determines what it can still hear), the split of sent and received
      packets into **flood** and **direct**, the count of **RX errors**, and **channel
      utilization**, which is the share of the time since the last reboot that your radio spent
      either transmitting or receiving. The tab is now laid out in four titled groups — System
      Information, Radio Statistics, Packet Statistics and Database — the same grouping, in the same
      order, with the same labels as the status view for a remote repeater under **My Repeaters**,
      so the two read the same way. Airtime is shown as a duration (`8h 31m`) rather than a number
      of minutes. Everything here except the Database group is counted from the last device reboot,
      not for all time.


      ### Fixes


      - **The Path Analyzer map no longer shows raw HTML in its pop-ups.** Click a repeater on the
      map — either a hop on the route or one of the amber candidates the analyzer offers where the
      path is ambiguous — and the pop-up naming it ended the second line with the literal text
      `<code>47</code>` instead of the repeater's hash in a monospaced box. Only the display was
      affected; the hash itself was always correct.

      - **A message you sent no longer loses the list of repeaters that heard it when something else
      goes out at the same moment.** Your own messages find out which repeaters picked them up by
      listening for their own echo coming back off the mesh a few seconds later — and while waiting,
      the app could only keep track of one message at a time. Send a message and then press
      **Resend** on an older one, or send two in quick succession, and the second action took over
      that slot; when the first message's echo finally arrived it was filed as somebody else's
      traffic. The message kept its text but never got its signal badge, its repeater list or its
      **Analyzer** button, and nothing would bring them back. On the test server this affected
      roughly one message in thirty. The app now keeps every recent send in mind at once, and
      listens for five minutes instead of one, because repeats do sometimes arrive minutes after the
      send. **Resend** repairs the damage too: a message with no badge could not be re-armed before
      — re-arming needed exactly the packet identifier that was missing — so it is now recovered
      from the copy of the packet the app keeps at send time. Press Resend on a badge-less message,
      wait for a repeater to pick it up, and the badge appears. One thing this cannot fix: if no
      repeater in range repeated your message at all, or the repeat was lost on the way, there is no
      echo to hear and the badge stays empty — that is the radio, not the app.

      - **Resending an old message now asks first.** **Resend** puts the exact same packet back on
      the air, and repeaters normally recognise it and stay quiet — that is the whole point, it only
      reaches the ones that missed it the first time. But a repeater only remembers packets it saw
      recently, so past a certain age nothing recognises it any more and the message spreads across
      the channel as if it were brand new: everyone sees it again, dated today. 

      …
  - version: v2.6.0
    name: mc-webui 2.6.0
    datetime: '2026-08-03T07:10:36Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.6.0
    prerelease: false
    notes: >-
      ### Features


      - **The Android app can now sign in to a server that asks for a password.** Putting mc-webui
      behind a reverse proxy is what makes publishing it to the internet reasonable, and the usual
      next step is to make that proxy demand a username and password — an **Access List** in Nginx
      Proxy Manager, for instance. The app had no answer for that: it showed the proxy's bare "401
      Authorization Required" page and stopped there, which meant the phone was the one thing you
      could not protect. It now asks for the login the first time it connects and remembers it per
      server address, so later launches go straight in; get it wrong and the same prompt returns
      with the username already filled in. This appears **only** when your server actually asks for
      a password — an instance without one, local `http://` or a proxy with no access control,
      behaves exactly as it always has and never shows this screen. One thing worth knowing: if you
      turn the password on, or change it, while the app is already open, the app cannot notice
      mid-session — close it and open it again. This is **app version 1.3** — install the new `.apk`
      over the one you have; it is signed with the same key, so it goes in as an update and keeps
      your server address. See [android-app.md](android-app.md).

      - **The HTTPS guide now explains how to put a password in front of mc-webui.** The guide
      always mentioned that Nginx Proxy Manager can do this — mc-webui has no accounts of its own —
      but never said how, which made the one step that actually matters for an instance published to
      the internet the one step you had to work out yourself. [https-setup.md](https-setup.md) now
      walks through creating an **Access List** and attaching it to your proxy host, and is clearer
      about a distinction that is easy to miss: requiring a login keeps strangers out, while closing
      port 5000 (`MC_BIND_ADDRESS=127.0.0.1`) stops your own network from reaching the app around
      the proxy — and therefore around the password. Publishing to the internet wants both; a server
      whose testers still use `http://<address>:5000` wants only the first.
  - version: v2.5.0
    name: mc-webui 2.5.0
    datetime: '2026-08-03T05:42:04Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.5.0
    prerelease: false
    notes: >-
      ### Features


      - **You can now reach mc-webui over HTTPS.** Until now the interface was served over plain
      HTTP only, which meant the address bar warned it was not secure, and — less obviously — that
      browsers quietly withheld a set of features they reserve for encrypted connections. There is
      now an optional HTTPS front end you switch on with a single line in `.env`; it starts [Nginx
      Proxy Manager](https://nginxproxymanager.com/) next to the app, and you pick your certificate
      in its web interface rather than editing configuration files. Three routes are covered: a free
      Let's Encrypt certificate for a public domain, a Let's Encrypt certificate via a DNS challenge
      — the one worth knowing about, because it gives a fully trusted certificate on a server that
      is not exposed to the internet at all, with no port forwarding — and a self-signed certificate
      for reaching the server by its IP address. Existing installations are untouched: nothing
      starts and nothing changes unless you ask for it, and updates keep working exactly as before.
      The guide is [https-setup.md](https-setup.md), including which switch to be careful about
      (Websockets Support — leave it off and several open tabs will crawl) and why a self-signed
      certificate cannot work with the Android app.

      - **The interface can be translated, and Polish has started.** mc-webui was written
      English-only, with every label and message baked into the code. There is now a translation
      system behind it, and a **Language** setting at the top of Settings → Appearance. It covers
      the whole interface: the main window — menu, chat, message bubbles, its dialogs and
      **Settings** — every panel that opens in its own window (**System Log**, **Console**, **My
      Repeaters**, **Path Analyzer**, **Contacts**, **Direct Messages**), and the running commentary
      too: the small toasts after every action, the confirmation dialogs, the search results, the
      update flow and the notifications your phone shows when the app is in the background. Error
      text that comes back from the server itself is still English — that is the one part left, and
      it is a separate job. Your choice applies to the browser you set it in and also becomes the
      default for anyone else opening the server without a preference of their own.

      - **You can add a language yourself, without waiting for a release.** A language is a single
      file. Copy `en.json` from `app/translations/`, translate the values, and drop it into a
      `translations` folder inside your config directory — the same place the database lives.
      Refresh the page and it appears in the Language list, named however you named it, with no
      rebuild and no restart. Anything you leave untranslated falls back to English, so a
      half-finished translation is perfectly usable. A file you drop in also overrides one that
      ships with the app, so you can correct the built-in Polish on your own server. English and
      Polish ship in the box; everything else is open to whoever wants to write it. See
      [translations.md](translations.md), which explains the format and — importantly — which words
      to leave alone: mesh terms like flood, hop, advert, RSSI and the repeater roles stay English
      in every language, because that is what the firmware, the CLI and the forums all use. The
      Console and the log lines themselves stay English for the same reason.

      - **Times and dates behave the same in every language.** Only the words are translated —
      "Yesterday" becomes "Wczoraj", "5 min ago" becomes "5 min temu". The clock and the number
      formatting keep following your browser's own settings, so switching the menus to English will
      not suddenly turn your 24-hour clock into "9:53 AM". One display of large numbers on the
      repeater statistics page had been hard-coded to American thousands separators; it now follows
      your locale like everything else.


      ### Fixes


      - **Copy buttons work over plain HTTP again.** Copying a public key, a channel key or a
      routing path did nothing on some pages when mc-webui was open over `http://` on a network
      address — no er

      …
