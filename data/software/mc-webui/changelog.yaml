  - version: v2.6.0
    name: mc-webui 2.6.0
    datetime: '2026-08-03T07:10:36Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.6.0
    prerelease: false
    notes: >-
      ### Features


      - **The Android app can now sign in to a server that asks for a password.** Putting mc-webui
      behind a reverse proxy is what makes publishing it to the internet reasonable, and the usual
      next step is to make that proxy demand a username and password — an **Access List** in Nginx
      Proxy Manager, for instance. The app had no answer for that: it showed the proxy's bare "401
      Authorization Required" page and stopped there, which meant the phone was the one thing you
      could not protect. It now asks for the login the first time it connects and remembers it per
      server address, so later launches go straight in; get it wrong and the same prompt returns
      with the username already filled in. This appears **only** when your server actually asks for
      a password — an instance without one, local `http://` or a proxy with no access control,
      behaves exactly as it always has and never shows this screen. One thing worth knowing: if you
      turn the password on, or change it, while the app is already open, the app cannot notice
      mid-session — close it and open it again. This is **app version 1.3** — install the new `.apk`
      over the one you have; it is signed with the same key, so it goes in as an update and keeps
      your server address. See [android-app.md](android-app.md).

      - **The HTTPS guide now explains how to put a password in front of mc-webui.** The guide
      always mentioned that Nginx Proxy Manager can do this — mc-webui has no accounts of its own —
      but never said how, which made the one step that actually matters for an instance published to
      the internet the one step you had to work out yourself. [https-setup.md](https-setup.md) now
      walks through creating an **Access List** and attaching it to your proxy host, and is clearer
      about a distinction that is easy to miss: requiring a login keeps strangers out, while closing
      port 5000 (`MC_BIND_ADDRESS=127.0.0.1`) stops your own network from reaching the app around
      the proxy — and therefore around the password. Publishing to the internet wants both; a server
      whose testers still use `http://<address>:5000` wants only the first.
  - version: v2.5.0
    name: mc-webui 2.5.0
    datetime: '2026-08-03T05:42:04Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.5.0
    prerelease: false
    notes: >-
      ### Features


      - **You can now reach mc-webui over HTTPS.** Until now the interface was served over plain
      HTTP only, which meant the address bar warned it was not secure, and — less obviously — that
      browsers quietly withheld a set of features they reserve for encrypted connections. There is
      now an optional HTTPS front end you switch on with a single line in `.env`; it starts [Nginx
      Proxy Manager](https://nginxproxymanager.com/) next to the app, and you pick your certificate
      in its web interface rather than editing configuration files. Three routes are covered: a free
      Let's Encrypt certificate for a public domain, a Let's Encrypt certificate via a DNS challenge
      — the one worth knowing about, because it gives a fully trusted certificate on a server that
      is not exposed to the internet at all, with no port forwarding — and a self-signed certificate
      for reaching the server by its IP address. Existing installations are untouched: nothing
      starts and nothing changes unless you ask for it, and updates keep working exactly as before.
      The guide is [https-setup.md](https-setup.md), including which switch to be careful about
      (Websockets Support — leave it off and several open tabs will crawl) and why a self-signed
      certificate cannot work with the Android app.

      - **The interface can be translated, and Polish has started.** mc-webui was written
      English-only, with every label and message baked into the code. There is now a translation
      system behind it, and a **Language** setting at the top of Settings → Appearance. It covers
      the whole interface: the main window — menu, chat, message bubbles, its dialogs and
      **Settings** — every panel that opens in its own window (**System Log**, **Console**, **My
      Repeaters**, **Path Analyzer**, **Contacts**, **Direct Messages**), and the running commentary
      too: the small toasts after every action, the confirmation dialogs, the search results, the
      update flow and the notifications your phone shows when the app is in the background. Error
      text that comes back from the server itself is still English — that is the one part left, and
      it is a separate job. Your choice applies to the browser you set it in and also becomes the
      default for anyone else opening the server without a preference of their own.

      - **You can add a language yourself, without waiting for a release.** A language is a single
      file. Copy `en.json` from `app/translations/`, translate the values, and drop it into a
      `translations` folder inside your config directory — the same place the database lives.
      Refresh the page and it appears in the Language list, named however you named it, with no
      rebuild and no restart. Anything you leave untranslated falls back to English, so a
      half-finished translation is perfectly usable. A file you drop in also overrides one that
      ships with the app, so you can correct the built-in Polish on your own server. English and
      Polish ship in the box; everything else is open to whoever wants to write it. See
      [translations.md](translations.md), which explains the format and — importantly — which words
      to leave alone: mesh terms like flood, hop, advert, RSSI and the repeater roles stay English
      in every language, because that is what the firmware, the CLI and the forums all use. The
      Console and the log lines themselves stay English for the same reason.

      - **Times and dates behave the same in every language.** Only the words are translated —
      "Yesterday" becomes "Wczoraj", "5 min ago" becomes "5 min temu". The clock and the number
      formatting keep following your browser's own settings, so switching the menus to English will
      not suddenly turn your 24-hour clock into "9:53 AM". One display of large numbers on the
      repeater statistics page had been hard-coded to American thousands separators; it now follows
      your locale like everything else.


      ### Fixes


      - **Copy buttons work over plain HTTP again.** Copying a public key, a channel key or a
      routing path did nothing on some pages when mc-webui was open over `http://` on a network
      address — no er

      …
