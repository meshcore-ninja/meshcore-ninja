  - version: v2.4.1
    name: mc-webui 2.4.1
    datetime: '2026-07-31T07:37:31Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.4.1
    prerelease: false
    notes: >-
      ### Fixes


      - **You can keep mc-webui open in several tabs again.** Two or three open windows used to
      bring the whole thing to a crawl — the message list crept, buttons took ten or twenty seconds
      to do anything, and the status could sit on "Connecting…". It looked exactly like an
      overloaded server, and it wasn't: the server was answering in a few thousandths of a second
      the entire time. The live connection that pushes new messages to an open page was running in a
      mode that keeps a browser connection permanently occupied, and a browser only allows six
      connections to one address **shared across every tab**. Three tabs took the lot, so everything
      else — loading messages, marking them read, sending — queued in the browser waiting for a free
      one. That connection now uses a proper WebSocket, which does not come out of that budget.
      Measured with three tabs open: a request that had been taking around 15 seconds now takes
      about 12 milliseconds. The advice to keep only one window open no longer applies. If you run
      mc-webui behind a reverse proxy that isn't set up to pass WebSocket connections through, the
      page quietly falls back to the old behaviour and works exactly as before.

      - **Messages no longer go missing after the app has been in the background.** Coming back to a
      minimised app — or to a phone that had been asleep — could show a chat that quietly stopped at
      whatever message arrived last before the screen went off, with everything since then missing
      until the app was force-stopped and reopened. New messages reach an open page over a live
      connection, and Android tears that connection down while the app sits in the background;
      nothing then went back to ask the server what had been missed. Now every way back from a gap
      re-reads the list: the connection coming back, the app returning to the foreground, and a
      heartbeat that notices when the page has been frozen. The same applies to direct messages, and
      to a browser tab that lost its network for a while.

      - **A Refresh item in the menu.** The browser's pull-to-refresh has no equivalent in the
      Android app, so there is now a **Refresh** entry at the top of the menu that reloads the
      messages from the server on demand — in the app, and everywhere else too.

      - **The connection-status check is about five times cheaper.** Every open page asks the server
      how the mesh device is doing — on load, once a minute after that, and each time you come back
      to a tab you had left. Answering that took roughly a quarter of a second, almost none of it
      spent on the device itself: the server was counting the rows of every table in the database to
      report two numbers, and the row it needed for the "last message" timestamp was found by
      reading the entire message table and sorting it. The heaviest part, counting the radio-echo
      records, was thrown away unused — and that table only ever grows, so the check was getting
      slower the longer an instance had been running. It now asks for exactly the three values it
      needs, in one go. This is a smaller effect than the bundling below and it does not change what
      you see on screen; it does take a recurring cost off the server on every open page.

      - **Far less load on the server while you have messages on screen.** Whenever new radio
      traffic came in, the page asked the server about every message on screen separately — hundreds
      of individual requests at a time, repeated every few seconds, and the same messages over and
      over. On a busy channel that was thousands of requests a minute from a single tab, which left
      the server little room to answer anything else; the worst of it looked like the mesh device
      had dropped off, with the message list stuck on "Loading messages…" and the status on
      "Connecting…", while the device was connected the whole time. Those requests are now bundled
      into one. A page that needed hundreds of requests per update now needs a single one. The
      remaining reason several windows were slow is fixed separately — see the first entry above.
  - version: v2.4.0
    name: mc-webui 2.4.0
    datetime: '2026-07-29T19:16:54Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.4.0
    prerelease: false
    notes: >-
      ### New features


      - **The Android app can send notifications now.** When the app shipped in 2.3.0, notifications
      were the one thing it couldn't do, and the advice was to keep a Chrome "Add to Home Screen"
      install alongside it. That's no longer necessary — turn notifications on in the mc-webui menu
      as usual, allow the permission Android asks for, and new messages and pending contacts arrive
      as ordinary Android notifications. Tapping one reopens the app. Two things are actually better
      here than in the browser: they work over plain `http://` too (Chrome refuses notifications on
      an unencrypted page), and the app shows up in Android's notification settings like any other,
      so you can silence it or change its sound there. The same limit as the browser still applies:
      notifications arrive while the app is open or recently in the background, and stop once
      Android suspends it — reopening the app catches you up. Requires app version **1.1**; see the
      [Android App guide](https://github.com/MarekWo/mc-webui/blob/main/docs/android-app.md) for how
      to update.
  - version: v2.3.0
    name: mc-webui 2.3.0
    datetime: '2026-07-28T19:20:09Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.3.0
    prerelease: false
    notes: >-
      ### New features


      - **There is an Android app now.** A small companion app opens your own instance full screen —
      no address bar, its own icon in the app drawer, and it looks like a proper Android app rather
      than a page in a browser. It holds no mesh logic of its own: on first run it asks for the
      address of your server (`http://192.168.1.100:5000` on the local network, or your `https://`
      hostname behind a reverse proxy), remembers it, and from then on launches straight into
      mc-webui. Everything still runs on your server and your MeshCore device. It is not on Google
      Play, so you download the `.apk` from the repository and install it yourself — the new
      [Android App guide](https://github.com/MarekWo/mc-webui/blob/main/docs/android-app.md) walks
      through that, including the "unknown sources" permission and the Play Protect notice Android
      shows for any app that didn't come from the Play Store. Scanning contact QR codes works (on
      `https://` instances — over plain `http://` the camera is blocked by the same browser rule
      that applies in Chrome), and database backups download to the phone's Downloads folder. One
      thing stays with the browser: **notifications**, which the app has no access to — if you rely
      on them, keep the Chrome "Add to Home Screen" install alongside it, the two work happily side
      by side. The app's [source](https://github.com/MarekWo/mc-webui/tree/main/android/src) sits
      next to the
      [`.apk`](https://github.com/MarekWo/mc-webui/raw/main/android/mc-webui-wrapper.apk), so you
      can read what you are installing or build it yourself.
  - version: v2.2.0
    name: mc-webui 2.2.0
    datetime: '2026-07-27T10:12:52Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.2.0
    prerelease: false
    notes: >-
      ### New features


      - **Quotes now use the `>` convention everyone else already uses.** Quoting a message used to
      wrap it in guillemets — `@[Daniel] »Hejka« Cześć!` — a shape mc-webui invented back when it
      couldn't send multi-line messages. It now puts the quote on its own line behind a `>` and
      drops the cursor underneath it, so a reply reads as a quote in the standard MeshCore app and
      every other client too, not just here:

        ```
        @[Daniel] >Are we still on for tonight?
        Yes, 8pm works.
        ```

        Quotes you type by hand get the same italic, tinted styling, so `>` written manually now looks like a proper quote as well. Nothing you received earlier changes: the old `»…«` form is still recognised and still displayed exactly as before.
  - version: v2.1.0
    name: mc-webui 2.1.0
    datetime: '2026-07-26T17:23:48Z'
    url: https://github.com/MarekWo/mc-webui/releases/tag/v2.1.0
    prerelease: false
    notes: >-
      ### New features


      - **Releases now have version numbers.** This is the first numbered release: the menu shows
      **2.1.0** with the exact build (date and commit) underneath, so "which version are you on?"
      has a short answer, and the build is still there when a problem needs pinning down. Each
      release is tagged on GitHub with these notes attached, so you can see what changed without
      digging through the commit history.

      - **The Path Analyzer map starts on the route you asked for.** The map used to plot every
      located repeater on top of your route, which buried the path you actually wanted to see. It
      now opens showing just that route, and two checkboxes in the map's top corner add the rest
      back when you want it: **All repeaters** brings back the purple dots of uninvolved repeaters,
      and **Alternative paths** draws the other copies of the same message your node overheard. Both
      start off, and switching them never moves or re-zooms the map, so you keep the view you panned
      to.

      - **See where a message's routes actually differ.** With **Alternative paths** on, each of the
      message's other routes gets its own light colour, matched by a coloured dot next to it in the
      side list, so you can tell the lines apart — tap one to see its hops and SNR. Copies of one
      message usually travel most of the same way, so only the stretches where an alternative really
      diverges are drawn, plus a dot marking where it ends. Often that's the last hop alone, which
      used to be invisible under the main route.

      - **The Path Analyzer remembers your filters.** Time range, hop and hash-size filters, the
      text searches, and the Routes segment length are kept between visits, so a working set like
      "Last 1 day + 2/3-byte" no longer has to be set up every single time. **Clear** resets and
      forgets them. Opening the analyzer from a chat route ignores your saved filters for that
      visit, so they can't hide the message you tapped through to. The settings are stored by your
      browser, not on the device — each browser or phone keeps its own.

      - **Jump from a chat route straight to the map.** Tapping a route under a channel message used
      to just copy it to the clipboard. Now it opens the **Path Analyzer** on its map view with that
      message selected and that exact route already drawn — the quickest way to see where a message
      physically travelled. Copying isn't gone: each route in the popup keeps a small clipboard icon
      for pasting into the console's `change_path`.


      ### Reliability & polish


      - **Your own sent channel messages no longer show a route that isn't theirs.** A bug could
      attach a stranger's overheard packet to your just-sent message, so the delivery badge and the
      Path Analyzer occasionally displayed a repeater hash and a physically impossible path that
      were never part of your message. Sent-message echoes are now matched exactly, so the route you
      see is really yours.
