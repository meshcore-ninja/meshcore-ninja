    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **53**\r\nLast official release: **v6.4.0** (schema **52**)\r\n\r\n## Database schema upgrade: 52 → 53\r\n\r\nInstalling and launching this build will upgrade the local SQLite database. You **cannot downgrade** to an older Mesh-Client that only supports the previous schema while keeping the same database.\r\n\r\nOn first launch, Mesh-Client shows a **Quit / Upgrade** dialog before changing the database.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n---\r\n\r\n## mesh-client v6.5.0\r\n\r\n> [!WARNING]\r\n> **Existing users — screenshot settings before you update.**\r\n>\r\n> Mesh Client 6.5.0 modernizes the app (new secure renderer origin) and unlocks new features.\r\n>\r\n> We have worked to keep your settings intact, but please **note or screenshot** device settings, MQTT settings, and open RRC hubs **before you update** — and re-check them after.\r\n>\r\n> If something looks reset, restore from your notes; chat and keys should still be present.\r\n>\r\n> Details: [COI migration and before-you-update notes](https://gist.github.com/rinchen/2d334111171380d0c4cd5a8e16767344)\r\n\r\n### Highlights\r\n- **Cross-origin isolation (COI) renderer:** Built/installed apps load `mesh-client://renderer` after a verified `file://` → custom-origin migration. Credentials and preferences are recovered across upgrades; failed migration keeps the legacy origin. See **Before you update** below.\r\n- **COI-powered features:** Worker-pool topology/diagnostics, renderer memory trends on App → Support, and AudioWorklet voice capture (with sync/ScriptProcessor fallbacks when isolation is unavailable) (#1313).\r\n- **Catch-up summaries (opt-in):** Summarize unread, recent, or loaded traffic on Meshtastic/MeshCore channels and DMs, MeshCore rooms, and Reticulum DMs/RRC. AI stays off until you pick an engine/model; never auto-posts. Warns when the bundled WASM thread budget is low (#1325).\r\n- **TAK messaging:** Channels as ATAK contacts, ATAK ↔ companion DMs (Meshtastic/MeshCore), delivery receipts / \"Not confirmed\", Reticulum LXMF peers as ATAK contacts, optional per-channel callsign prefix, separate repeater / room-server icons with GeoOps presets, and reply/reaction context shown in ATAK (#1324).\r\n- **MeshCore companion CLI (firmware v1.18):** Companion settings, local CLI, reboot-reconnect (protocol ≥ 14), remote CLI (`0x10`), telemetry push with lease renew/reconnect, and WiFi / BLE PIN redaction.\r\n- **Meshtastic 2.8 config parity:** Mesh Beacon and Status Message modules, declarative extra Radio/Security/Module fields, remaining portnum labels, and related remote-admin / apply / search fixes.\r\n- **Send signal report:** One-click reply on Meshtastic, MeshCore, and verified Reticulum receptions without wiping the composer draft.\r\n- **Reticulum:** Slow-RF announce filter (default on); PN Sync link hops scaled so Auto cascade continues instead of false `NoLinkProof` stops; rsReticulum / rsLXMF v1.3.0.\r\n- **Desktop UX:** Close-to-tray follows every live radio (not only Meshtastic), faster protocol switching, unified settings section chrome (collapsed-by-default), and default Appearance theme **Slate + Sky**.\r\n- **GPS privacy:** Share my location gates host lookup and mesh/RMAP/chat send only — radio GPS and saved/static pins still drive local map position and distance (#1326).\r\n- **Nix flake:** `nix run` for NixOS, Linux (x86_64/ARM64), and Apple-silicon macOS.\r\n\r\n### Before you update (settings migration)\r\n\r\n**6.5.0** modernizes the packaged renderer onto a secure COI origin and migrates settings automatically. Chat history and keys should come along; preferences are carried forward with recovery/repair paths.\r\n\r\nAs a precaution, **before updating** note or screenshot:\r\n\r\n1. Device / connection settings (and remembered devices)\r\n2. MQTT settings (omit passwords from screenshots if you prefer)\r\n3. Open RRC hubs\r\n\r\n**After updating**, re-check those same places. If something looks reset, restore from your notes\n…"
