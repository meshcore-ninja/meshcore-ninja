    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.28.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.29.0] - 2026-08-21\r\n\r\n**Video:** [https://www.youtube.com/watch?v=J0gTTdRBkzU](https://www.youtube.com/watch?v=J0gTTdRBkzU)\r\n\r\n### Highlights\r\n- **Reticulum:** Ratspeak-parity LXMF voice memos in DMs; hub TCP lockout / PN sync recovery UX; RRC WELCOME and reconnect thrash fixed.\r\n- **Meshtastic / MQTT:** Channel selection survives reconnect; MQTT→RF uses real channel hash (and correct default PSK expand); configure replay no longer marks the whole NodeDB as just heard.\r\n- **MeshCore / Connection:** BLE MAC on Radio Connection picker; sorted device pickers and Repeaters & Rooms columns; advert names stick; BLE reconnect / missing-services recovery hardened.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n---\r\n\r\n### Meshtastic\r\n* Chat stays on the selected channel after reconnect to the same node (#858)\r\n* Configure / NodeDB replay no longer stamps every node as just heard (#878)\r\n* MQTT encrypted publish stamps `MeshPacket.channel` with the real channel hash (not the local slot index); default PSK shorthand expands to firmware’s real key so MQTT→RF downlinks work (#876)\r\n* Post-configure `getMetadata` deferred so NodeDB flood is less likely to starve wifi/ethernet probes (#880)\r\n\r\n### MeshCore\r\n* Contacts show full long names (less aggressive truncation) (#877)\r\n* Live Room/Companion advert names persist (no rollback after path-updated / offload / MQTT placeholders) (#875, #877)\r\n* Repeaters & Rooms list fills leftover window height; columns sort (#875, #873)\r\n* BLE missing-services / reconnect recovery hardened; stale remembered BLE targets cleared (#877)\r\n* `meshcore.js` bumped to 1.15.0 (local patch rebased) (#882)\r\n\r\n### Reticulum\r\n* LXMF voice memos (record/play in DMs; Direct-only when too large for PN) (#869)\r\n* Hub TCP lockout explained; auto stack restart no longer worsens an IP block (#871)\r\n* PN sync stops cascading on NoLinkProof; Announce / Retry recovery UI (#881)\r\n* Ratspeak overlays rebased / regenerated; pathless-Link overlay sunset after upstream fail-closed Links (#870, #879)\r\n\r\n### RRC (Reticulum chat)\r\n* WELCOME can arrive (LinkSession initiator bind); dead-hub auto-join backs off; reconnect thrash reduced (#880)\r\n\r\n### App-wide / Connection\r\n* Radio Connection picker shows Bluetooth MAC (helps tell identical-labeled radios apart) (#874)\r\n* BLE/serial device pickers sort by signal / name (#873)\r\n\r\n### Full Changelog\r\n[`v5.28.0...v5.29.0`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.28.0...v5.29.0)"
