    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **52**\r\nLast official release: **v6.1.0** (schema **52**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n---\r\n\r\n## mesh-client v6.2.0\r\n\r\n### Highlights\r\n\r\n- **F1–F12 chat macros:** every composer (channels, DMs, MeshCore Rooms, RRC) gets 12 macro slots, triggered by F-keys or a collapsible macro bar, with an Edit macros dialog.\r\n- **Weather forecasts on the map:** posts from senders you've marked as weather bots now appear as forecast circles on the Meshtastic, MeshCore and Reticulum maps. Places are resolved offline from a bundled city list, with optional online lookup.\r\n- **Channel history follows the channel:** when you switch radios, history is shown by channel identity instead of slot number, so messages no longer land under the wrong channel.\r\n- **Structured chat cards:** RRC hub reconnect banners collapse into one row. rncp control lines, drone Remote ID reports and ping-bot replies get compact cards.\r\n- **Reliability:** Meshtastic TCP/serial links no longer go silent after configure. Windows connects to bonded MeshCore radios, and Reticulum hub errors no longer flood the log.\r\n\r\n---\r\n\r\n### Meshtastic\r\n\r\n**Bug Fixes**\r\n\r\n- Fixed TCP and serial links that went silent after configure. The stream framer dropped or mis-synced valid frames, so links stalled until the watchdog reconnected about every 4 minutes (#1156)\r\n- Firmware 2.8 renumbering now retries after a refusal during the quiet window instead of never migrating. The migration also leaves shared MeshCore contact-group tables alone (#1170)\r\n- LoRa Apply no longer treats the last session's region, preset and frequency as loaded after a reconnect. Apply writes nothing until this session's LoRa config arrives (#1170)\r\n- Bandwidth and spreading-factor labels are translated (#1170)\r\n- The Store & Forward history profile now saves to the database and survives database export and import (#1171)\r\n\r\n### MeshCore\r\n\r\n**Bug Fixes**\r\n\r\n- Windows now connects to bonded or OS-connected MeshCore radios. These radios stop advertising while another device holds the link, so the scan-only lookup used to fail after in-app pairing (#1156)\r\n- Contact dump retries wait for the stalled attempt to finish, so two dumps never overlap on one connection (#1174)\r\n- Rooms: a logged-out room with a saved password can turn auto-login back on from the login card (#1158). Turning auto-login on while connected now logs in right away (#1168)\r\n- Radio CLI: `set cad on` and the FEM TX gain commands now ask for confirmation before sending (#1168)\r\n\r\n### LoRa BLE (Meshtastic + MeshCore)\r\n\r\n**Bug Fixes**\r\n\r\n- Windows auto-reconnect checks pair state first. Unpaired or blocked radios show the PIN prompt or Remove & Re-pair instead of retrying a doomed connection. Connection-status probes no longer overlap an in-flight pairing call (#1174)\r\n- A radio that never answers now gets a plain timeout instead of \"Bluetooth stack unresponsive\" (#1156)\r\n\r\n### Reticulum\r\n\r\n**Bug Fixes**\r\n\r\n- A TCP hub that resets every connection, such as `rmap.world:4242`, no longer floods the log. Read errors are rate-limited to one warning per interface per minute with a suppressed count, and the warning names the hub. The reset-by-peer alert now identifies the hub (#1162, #1167)\r\n- Sidecar warnings, errors and Bluetooth connect-timing lines appear in `mesh-client.log` again on every platform (#1156)\r\n\r\n### Chat\r\n\r\n**Features**\r\n\r\n- F1–F12 macro bar (#1163):\r\n  - The bar starts collapsed behind a \"Show macros\" chip and remembers whether it is open. F-keys work either way.\r\n  - Using a macro inserts its text at the cursor. The optional **Send now** mode only sends when the message box is empty, so a half-written draft is never sent or lost.\r\n  - Comes in three sizes: Small, Medium and Large. Narrow windows move extra buttons into a \"More\" menu. On touchscreens the default size is Large.\r\n  - The Edit \n…"
