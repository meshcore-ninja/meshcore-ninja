    prerelease: false
    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.33.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.34.0] - 2026-09-04\r\n\r\n### Highlights\r\n- **Updater (experimental):** Packaged updates download automatically in the background; when ready, the footer control becomes a clear green **Restart** so install stays user-triggered and radio sessions are not interrupted.\r\n- **Reticulum:** RF-only / direct sends no longer show a false **Delivered** check on local submit — outbox drain waits for a terminal receipt (`acked` / `failed`), with an **Awaiting peer receipt** status while waiting.\r\n- **Deps:** Docs tooling floors `mkdocs-material` for a search XSS CVE, plus routine npm pin bumps and regenerated third-party license tables.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **48** — unchanged from v5.33.0. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## Updater (experimental)\r\n\r\n* Packaged app updates now **download automatically** after the existing startup and periodic checks (macOS, Windows, and Linux). This auto-download path is **experimental**. (#936)\r\n* When a download finishes, the footer update control becomes a green **Restart** button; install still runs only when you choose restart (`quitAndInstall`), so active radio sessions are not cut off mid-air. (#936)\r\n* Packaged **macOS** updates download in-app via electron-updater instead of bouncing users to the GitHub release page. (#936)\r\n\r\n## Reticulum\r\n\r\n* **False Delivered on RF-only outbox** — queued sends were cleared (and shown delivered) as soon as the local submit succeeded, before any peer receipt. Drain now waits for a terminal outbound status (`acked` / `failed`) before removing the row. (#939)\r\n* Direct sends show **Awaiting peer receipt** while in flight; timeout without a receipt marks the message failed with an error. (#939)\r\n* Outbox completion is bound to the optimistic row / send-attempt id (following pending→hash rekey), so a later same-text resend cannot mark the wrong queued message delivered or failed. (#939)\r\n\r\n## Dependencies / security\r\n\r\n* Floor `mkdocs-material` to `>=9.7.7` for GHSA-xvg9-69gf-fjrf (CVE-2026-73295 DOM XSS in docs search suggestions). (#940)\r\n* Bump `@zip.js/zip.js`, `i18next`, `systeminformation`, `@types/react-dom`, and related lockfile pins. (#940)\r\n* Regenerate `docs/third-party-licenses.md` after the dependency changes. (#941)\r\n\r\n## Release tooling\r\n\r\n* **Cut release** rebases onto `origin/main` (retag tip, retry up to 5 times) when `main` advances during the long preflight, so a rejected push no longer leaves the version tag missing on the remote. (#942)\r\n\r\n### Full Changelog\r\n[`v5.33.0...v5.34.0`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.33.0...v5.34.0)"
  - version: v5.33.0
