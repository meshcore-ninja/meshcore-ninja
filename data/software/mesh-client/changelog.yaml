    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **52**\r\nLast official release: **v6.3.0** (schema **52**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n---\r\n\r\n## mesh-client v6.4.0\r\n\r\n### Highlights\r\n\r\n- **Live traffic map:** Meshtastic and MeshCore Map panels can show packets moving along observed routes. Use local radio traffic, or opt into read-only public Beacon / CoreScope feeds with region selection, filters, pause, and packet inspection. The basemap is locally styled OpenStreetMap (no CARTO API key).\r\n- **TAK replies onto the mesh:** ATAK (or any TAK client) can send GeoChat into bridged Meshtastic / MeshCore channels when you opt in per channel. Send-enabled rooms appear as TAK contacts so replies reach the mesh. Relayed unit styles can also filter by node type and protocol, and repeaters / room servers can use a custom icon-set path.\r\n- **Channel scopes and MECP compose:** Saved flood-scope regions, clear Unscoped / inherited labels beside Send, and queued messages that use the destination channel’s scope. MECP now has separate Request / report and Response compose actions with role-specific shortcuts.\r\n- **Chat bot and report chips:** Place-period weather forecasts, hop / client-ack reports, MeshCore Health Check codes, and Colorado-Mesh meshcore-bot-firmware replies are recognized in the chat UI.\r\n- **MeshCore repeater admin:** Configure shows the repeater’s region tree and flood permissions; missing radio contacts are restored on login; direct routes no longer force an unnecessary Ping from a stale hop count.\r\n- **Updates without auto-download:** **App → Updates → Download updates automatically** (on by default). Turn it off to check for versions without downloading until you press **Download**.\r\n- **Security hardening:** Application secrets move into OS-backed encrypted storage; the Reticulum sidecar API requires a per-process token; remote link previews need consent before network fetch; inbound MQTT, CoT, RNCP, Micron, and several release / supply-chain boundaries were tightened.\r\n\r\n---\r\n\r\n### Map\r\n\r\n**Features**\r\n\r\n- Live traffic view for MeshCore and Meshtastic (#1237, #1249):\r\n  - Packets animate along observed route branches; repeated observer reports group into one row in a movable packet window.\r\n  - Local radio traffic plus optional public Beacon / CoreScope feeds, server-region selection, filters, pause, and packet inspection.\r\n  - Map-area filter is **All traffic** / **Current map area** with a worldwide default (not Colorado-only presets). Beacon / CoreScope regions still come from the configured server.\r\n  - Locally styled OpenStreetMap basemap; Reticulum keeps its existing map.\r\n- Docs: [Live Traffic Map](https://colorado-mesh.github.io/mesh-client/live-traffic-map/) guide.\r\n\r\n### TAK\r\n\r\n**Features**\r\n\r\n- Opt-in **TAK can send** per bridged channel so GeoChat from local TAK clients goes onto Meshtastic or MeshCore as `[CALLSIGN] text` (rate-limited; off by default) (#1242)\r\n- Send-enabled rooms are announced to TAK clients as contacts (named after the room) so ATAK can address replies; receive-only bridges still appear as GeoChat rooms (#1253)\r\n- Relayed unit styles can filter by node type and protocol (#1238)\r\n- Optional icon-set icon path for relayed repeaters, routers, room servers, and interfaces (#1213)\r\n\r\n**Bug Fixes**\r\n\r\n- Bound inbound CoT frame sizes (#1223)\r\n\r\n### Chat / MECP\r\n\r\n**Features**\r\n\r\n- Channel flood scopes (#1212):\r\n  - Offline saved-region list and effective scope shown beside Send (including Unscoped and inherited radio defaults).\r\n  - Queued sends use the destination channel’s saved scope; inherited sends restore the radio default afterward.\r\n  - MeshCore room / repeater Configure exposes default flood scope with firmware readback.\r\n- MECP compose split into red **Request / report** and blue **Response**, with role-specific standard-code shortcuts (#1212)\r\n- Weather, hop reports, client ac\n…"
  - version: v6.3.0
    name: 6.3.0
    datetime: '2026-10-09T23:09:12Z'
    url: https://github.com/Colorado-Mesh/mesh-client/releases/tag/v6.3.0
    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **52**\r\nLast official release: **v6.2.0** (schema **52**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n---\r\n\r\n## mesh-client v6.3.0\r\n\r\n### Highlights\r\n\r\n- **Offline chat translation:** Chat, MeshCore Rooms and RRC messages get a **Translate** action. Translation runs on your machine with downloadable language packs. It is off by default, and you can optionally use a LibreTranslate server instead.\r\n- **MeshCore repeater and room configuration:** a new **Configure** panel lets you read and edit identity, location, radio, routing and room access settings without typing CLI commands.\r\n- **Delivery you can trust:** MECP emergency reports keep retrying until the mesh acknowledges them, not just until the radio accepts them. Failed chat messages are resent automatically up to 3 times.\r\n- **EMCOMM monitoring stations:** an opt-in standing alert for unseen MAYDAY/URGENT reports, an incident event timeline, JSON/CSV incident log export, and tools to block emergency spam.\r\n- **TAK:** richer relayed CoT, unit filters, `!MT1` trackers, MeshCore and Meshtastic channels mirrored into GeoChat, and several fixes that make ATAK connect and stay connected.\r\n- **Reticulum:** mesh-client no longer attaches to another app's shared instance. Instead it can share its own instance with Sideband, NomadNet and MeshChatX.\r\n\r\n---\r\n\r\n### Meshtastic\r\n\r\n**Bug Fixes**\r\n\r\n- A failed Store & Forward history request is no longer treated as a failed chat message. Previously it could mark an unrelated message as failed and request node info for the wrong node (#1186)\r\n- Removed the burst of about 250 \"Received Node Info packet\" log lines on every connect (#1186)\r\n\r\n### MeshCore\r\n\r\n**Features**\r\n\r\n- Repeater and room configuration panel (#1187, #1190):\r\n  - **Configure** in the repeater and room row menus, and from **Rooms → Manage**.\r\n  - Edit identity and location, radio parameters, and routing/adverts. Rooms also get guest access and ACL controls. Advanced settings stay in the CLI.\r\n  - Edits are validated before sending. Only changed settings are written, and each one is checked by reading it back. A rejected or interrupted save keeps your edits. Radio changes show a reboot notice, and rebooting stays an explicit, confirmed action.\r\n  - Each section has a description, edited fields are marked, and section headers show how many changes are pending. Passwords and private keys are hidden in the CLI history.\r\n\r\n**Bug Fixes**\r\n\r\n- A rebooted repeater no longer jumps to \"220d ago / Offline\" while it is being heard live. \"Last heard\" now uses the time the packet was received, and an older timestamp never overwrites a newer one (#1194)\r\n- Connecting no longer stalls for minutes when contact loading hangs. The stall is detected and the connection retried about 35 seconds sooner (#1186)\r\n- MeshCore MQTT no longer gets stuck reconnecting at \"attempt 1/3\" when the broker drops before the connection is confirmed (#1198)\r\n\r\n### LoRa BLE (Meshtastic + MeshCore)\r\n\r\n**Bug Fixes**\r\n\r\n- Linux: a MeshCore BLE connect timeout from the Bluetooth stack is now retried once and shows the BLE timeout guidance instead of a raw `connect_timeout` error (#1180)\r\n\r\n### Reticulum\r\n\r\n**Features**\r\n\r\n- Shared instance handling (#1182):\r\n  - mesh-client never joins another app's Reticulum instance (such as a system `rnsd`), because its routing and BLE features need mesh-client to own the transport.\r\n  - If another app already holds the shared port, mesh-client runs standalone and explains why. The explanation appears in a Connection banner, a Diagnostics row, the setup guide and the Share toggle.\r\n  - The setup guide warns when another Reticulum app is running and lists the serial ports it is configured to use.\r\n  - **Network → Show settings for other apps** gives a copyable `[reticulum]` snippet so Sideband, NomadNet and MeshChatX can attach to mesh-client.\r\n\n…"
