    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **54**\r\nLast official release: **v6.7.0** (schema **54**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.7.1\r\n\r\n### Highlights\r\n\r\n- **Protocol-scoped logs.** App logs and Analyze keep Meshtastic / MeshCore / Reticulum lines on the matching tab in dual-radio setups (shared GATT/BLE and DB failures stay visible everywhere).\r\n- **MeshCore Room Status reliability.** Status restores a missing Room contact and retries like Room Ping, with hops recomputed on the send path.\r\n- **Tray unread pip is red again.** Linux/Windows tray overlay uses BGRA channel order; macOS keeps a colored (non-template) unread badge.\r\n- **Electron 45.3.2.** Flatpak Electron pin and dependency refresh (`@zip.js/zip.js`, `systeminformation`, `ws`, and related).\r\n\r\n### What's Changed\r\n\r\n#### MeshCore\r\n\r\n- Room **Status** uses the same `NOT_FOUND` contact restore + retry path as Room Ping\r\n- Recompute admin Status hops after restore; Room Ping `hops_away` comes from the Status send path\r\n- Stale / superseded Room Status sessions no longer feed `meshcoreStatusErrors`\r\n\r\n#### Logs / Analyze\r\n\r\n- Log panel and analyzer segregate entries by protocol (optional on-disk `[proto=…]`; ignored-other-protocol count in Analyze)\r\n- MQTT analyzer categories scoped to Meshtastic / MeshCore (not Reticulum)\r\n- Prepare Analyze entries only while the Analyze modal is open\r\n- Suppress known Analyze noise (unpackaged Electron security warnings; unmatched Meshtastic SDK `NO_RESPONSE` / packet timeouts)\r\n\r\n#### Chat / shell\r\n\r\n- Local-delete message action uses a trash icon (same confirm flow and “Delete locally” accessibility text)\r\n- Tray unread overlay paints in BGRA so the pip renders red with a light contrast halo\r\n\r\n#### App / platform\r\n\r\n- Electron **45.3.2** with matching Flatpak linux x64/arm64 archives and checksums\r\n- Dependency / MECP watch refresh after `pnpm run update`; third-party licenses doc update\r\n- Picker-pin apply scripts detect pre-clippy overlays and migrate `is_picker_pinned_path` in place\r\n- Ignore local CodeGraph index directory\r\n\r\n### Bug Fixes\r\n\r\n#### MeshCore\r\n\r\n- Room Status no longer hangs without contact restore when the Room is missing from the radio list\r\n- Room Ping hop display matches the Status request that was actually sent\r\n\r\n#### App / platform\r\n\r\n- Dual-radio: transport / Connection stack lines from one protocol no longer appear in another tab’s App log or Analyze\r\n- Tray unread badge no longer shows blue (`#4444EF`) from RGBA-into-BGRA channel swap\r\n- Log Analyze no longer eagerly processes the full buffer when the modal is closed\r\n\r\n### Breaking Changes\r\n\r\n*(None)*\r\n\r\n### Full Changelog\r\n\r\n[`v6.7.0...v6.7.1`](https://github.com/Colorado-Mesh/mesh-client/compare/v6.7.0...v6.7.1)\r\n\r\n<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 45).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://colorado-mesh.github.io/mesh-client/troubleshooting/#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->"
