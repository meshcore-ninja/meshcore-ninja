    prerelease: false
    notes: "Notice: There is a \"bug\" with the AppImage BLE companion connection in this build. Older systems (like Ubuntu and PopOS 22.x) use an older glibc, while we build for more modern systems.  If you are using AppImage on an older system, do not upgrade to this release.\r\n----\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **54**\r\nLast official release: **v6.8.0** (schema **54**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.9.0\r\n\r\n### Highlights\r\n\r\n- **Friends, Rooms split & Chat composer.** Cross-protocol Friends shortlist with partitioned unread; MeshCore Chat Rooms vs Network Room servers; markdown toolbar in the composer (scales with Appearance text size); shared stars across Chat, Rooms, and inbox.\r\n- **Ratspeak 1.5.** Sidecar on rsReticulum/rsLXMF **v1.5.0**; Network → Stack toggles for enable/enforce stamps and link MTU discovery; TCP interop harness + `docs/interop.md`.\r\n- **MeshCore owner.info + MECP 1.4.0.** Repeater/Room/Sensor node detail shows cached owner.info; MECP freetext adherence through **1.4.0** (R03 first-by-position, ETA pack text, envelope strip).\r\n- **Denser meshes stay usable.** Coalesced LoRa NodeDB writes + batched `db:saveNodes` for multi-radio reconnect into ~1000-node meshes; new free OSM community basemaps (OpenTopoMap, HOT, CyclOSM, ÖPNVKarte — view-cache only).\r\n- **MeshCore DM / Contacts reliability.** Contact-capacity ceiling no longer false-alarms; off-radio contact restore; pubkey resolution for Quick DM; Contacts defaults to Chat users; room auto-login survives radio refusals.\r\n\r\n### What's Changed\r\n\r\n#### Chat / Rooms / Friends\r\n\r\n- Friends tab with cross-protocol shortlist and partitioned unread badges\r\n- MeshCore Rooms: joined Chat Rooms vs Network Room servers directory; dismiss back to discovery\r\n- Shared star list across Chat, Rooms, and unified inbox\r\n- Markdown toolbar moved into the composer; shrinks and scales with Appearance text size\r\n- Room F-macro text apply; Jump-to-room target preserved when toggling Message\r\n- Room auto-login kept on radio refusals; room post send fixes\r\n\r\n#### Reticulum / Ratspeak\r\n\r\n- Ratspeak stack bump (rsReticulum/rsLXMF **v1.5.0**, rsLXST **v0.4.0**)\r\n- Network → Stack: enable stamping, enforce stamps, link MTU discovery (soft-restart)\r\n- Interop coverage matrix (`docs/interop.md`) and dual-stack TCP harness\r\n\r\n#### MeshCore\r\n\r\n- `owner.info` on Repeater/Room/Sensor node detail (CLI fetch, cached per connection)\r\n- Treat `maxContacts` 510 as protocol ceiling (not live radio max)\r\n- DM send: pubkey resolution from store/registry/session; off-radio restore on `ERR_NOT_FOUND`\r\n- Contacts type filter defaults to Chat; Rooms/Friends UX polish\r\n\r\n#### MECP\r\n\r\n- Protocol adherence through **1.4.0** (re-vendored freetext + language packs)\r\n\r\n#### Map / performance\r\n\r\n- Coalesced RF node writes + batched `db:saveNodes` for dense multi-protocol reconnect\r\n- Basemaps: OpenTopoMap, Humanitarian (HOT), CyclOSM, ÖPNVKarte (view-cache; no region download)\r\n- Chat-traffic renderer perf; ChatSurface avoids duplicate message derivation on keep-alive panels\r\n\r\n#### Device / Meshtastic / MQTT\r\n\r\n- Env Telemetry “All nodes”: scrollable legend so plot area stays visible\r\n- Serial module UX: RXD/TXD unset copy; block unsupported console overrides; LOG/LOGTEXT warning\r\n- Superseded attach no longer tears down the live Meshtastic session (serial/GATT/TCP/HTTP)\r\n- MQTT: treat `EADDRNOTAVAIL` as transient reconnect\r\n\r\n#### App / platform / CI\r\n\r\n- Windows notification tones restored\r\n- Ignore console write `EPIPE` on closed stdio\r\n- Packaging launch smoke + sidecar arch guards; PR tests that name changed files by path\r\n- Electron / recharts bump; MECP freetext re-vendor; third-party licenses update\r\n\r\n### Bug Fixes\r\n\r\n- MeshCore DM send / friends / rooms cascade (v6.8.0 audit follow-ups)\r\n- Meshtastic superseded-attach race and coalesced node persist integrity\r\n- Env charts \n…"
