    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **49**\r\nLast official release: **v5.36.0** (schema **49**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.37.0] - 2026-09-18\r\n\r\n### Highlights\r\n- **LoRa BLE (Meshtastic + MeshCore):** All platforms now use the Reticulum sidecar **btleplug** GATT stack — Noble and Linux Web Bluetooth LoRa are gone. Three protocols can share the adapter concurrently; the old periodic BLE restart nudge is removed. Fixes [#1009](https://github.com/Colorado-Mesh/mesh-client/issues/1009).\r\n- **Reticulum:** **Backbone** interface CRUD + RMAP publish allowlist aligned with upstream (RNode / KISS / AX.25 KISS / I2P / Backbone); discovering interfaces usable from Map and stack settings.\r\n- **RRC:** New default **Connected** hub tab lists live / in-flight sessions; Ratspeak `/list` sidebar and silent `/who` drops fixed.\r\n- **Reticulum / Nomad:** Page cache expanded to 128 entries and an in-memory `/media` image LRU (up to **2 MiB** base64) so revisited pages and large banners skip mesh re-fetches; Clear caches / Close viewer drop both.\r\n- **Stability:** Discovery no longer rewrites the whole stack JSON on every announce (deferred background save); fewer false renderer hang warnings when the window is occluded. Thanks **[M3SHGH0ST](https://github.com/cj-vana)**.\r\n- **BLE reconnect:** Power-cycled radios no longer leave a stuck MAC reservation (`mac_conflict` / “another protocol”) — cleanup is bounded and same-profile reconnect reclaims orphans.\r\n- **Windows auto-update:** NSIS Setup artifact names match `latest.yml` / GitHub so updates no longer 404 and crash the updater.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **49** — unchanged from v5.36.0. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## LoRa BLE (shared Meshtastic + MeshCore)\r\n\r\nUnified transport is the main user-facing change this cycle. Meshtastic and MeshCore BLE now go through reticulum-sidecar GATT (`gatt:*` IPC → `/api/v1/gatt/*`) on **macOS, Linux, and Windows**.\r\n\r\n* **One BLE backend** — drops Noble, Linux Web Bluetooth LoRa, cross-stack yield, and the 4-day BLE restart prompt. (#1010)\r\n* **Concurrent protocols** — Meshtastic, MeshCore, and Reticulum RNode/Peer can share the adapter (separate centrals in one sidecar process). Same MAC/UUID across protocols is still rejected. (#1010)\r\n* **BLE-light sidecar** — connecting LoRa over BLE starts an HTTP/GATT-only sidecar without requiring Reticulum **Start**. Explicit Reticulum Start attaches RNS to that same process and **keeps** LoRa GATT sessions. **Restart stack** soft-reloads RNS in-process so Meshtastic/MeshCore stay linked; **Stop** / Quit still terminate the process. (#1010)\r\n* **Framing** — each complete Meshtastic protobuf or MeshCore command is one GATT write (up to 512 bytes); write mode follows the characteristic. (#1010)\r\n* **Saved devices** — after the Noble UUID cutover, connect scans when the peripheral is not cached and matches ids by normalized hex (including radios that omit NUS in advertisements). (#1010)\r\n* **Meshtastic configure** — drains FromRadio until empty on GATT link; lengthens configure stall timeout; seeds/polls host RSSI for Connection meters. (#1010)\r\n* **Disconnect / Qu\n…"
