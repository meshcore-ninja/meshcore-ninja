    notes: "# Call to Action: Help Shape the New UI\r\nWe're thinking through what the new UI should look like. Review and comment on our mock-ups at https://github.com/Colorado-Mesh/mesh-client/issues/1062\r\n\r\n----\r\n\r\n<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **49**\r\nLast official release: **v5.39.0** (schema **49**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.39.1] - 2026-09-25\r\n\r\n### Highlights\r\n- **Local TAK + EUDs:** Server certificates now include DNS + LAN IP in the Subject Alternative Name so iTAK / WinTAK / newer ATAK no longer reject data-package TLS as “certificate invalid.” Re-download the package after upgrading. (#1070)\r\n- **Language picker:** Scrolling the language list no longer dismisses the menu. (#1069)\r\n- **MECP Chat shortcuts removed:** One-tap MAYDAY, Quick Status presets, and roll-call above Chat (shipped in 5.39.0) are removed as unused; MECP compose and Incident Command remain. (#1069)\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **49** — unchanged from v5.39.0. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## TAK\r\n\r\n* **Server cert SAN** — Local TAK server certs include DNS name and LAN IPv4 in SAN; sticky certs auto-heal when identity drifts. Data packages still dial the LAN IP. (#1070)\r\n* **After upgrade** — Generate a new data package and re-import on EUDs that previously failed TLS. See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md). (#1070)\r\n\r\n---\r\n\r\n## App / MECP\r\n\r\n* **Language menu** — Wheel/trackpad scroll inside the portaled language list no longer closes the picker; scrolling outside still dismisses. (#1069)\r\n* **Removed Chat MECP shortcuts** — MAYDAY button, Quick Status bar, and roll-call helpers (plus related settings/docs) removed; MECP compose when enabled and Incident flows are unchanged. (#1069)\r\n\r\n### Full Changelog\r\n[`v5.39.0...v5.39.1`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.39.0...v5.39.1)"
