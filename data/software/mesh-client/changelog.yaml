      Last official release: **v5.38.0** (schema **49**)


      No schema bump vs last official release.

      <!-- mesh-client-schema-compare -->


      ## [v5.39.0] - 2026-09-25


      ### Highlights

      - **EMCOMM / Incident Command:** New Incident sidebar tab, emergency outbox priority, honest
      MECP ACK/beacon lifecycle, field ops alerts, quick-status / roll-call / optional Chat MAYDAY,
      after-action export, and SAR map helpers (MGRS, measure, USGS Topo). (#1050, #1057)

      - **TAK everywhere + remote relay:** TAK panel and CoT on MeshCore and Reticulum (not just
      Meshtastic MQTT); replicate live positions from all three protocols; optional mutual-TLS relay
      to OpenTAKServer / FreeTAKServer / TAK Server. (#1060)

      - **Offline readiness:** Quiet update/GPS behavior when WAN is down; durable `mesh-tiles:`
      OSM/Carto cache with Layers → Offline maps region download; sharper MECP SAFETY / MAYDAY
      tones. (#1048)

      - **MeshCore DM delivery:** Bubbles stay Sending… until hop ACK (event 130), not merely radio
      accept — missed ACKs can fail instead of false “Delivered.” (#1058)

      - **Dead code cleanup:** Unused exports, Reticulum/RRC helpers, Linux Web Bluetooth picker
      stub, and unread MECP language-pack fields removed (no behavior change). (#1053–#1056)


      ### Breaking Changes

      *(None)*


      ### Database schema

      Schema **49** — unchanged from v5.38.0. No migration runs on upgrade.


      ---


      ## EMCOMM / Incident Command


      * **Incident tab** — Common operating picture across Meshtastic, MeshCore, and Reticulum;
      merges MECP by fingerprint; severity escalates; open MAYDAY/URGENT badge the tab. Map overlays
      on LoRa Map and Reticulum Map (Layers → Emergency incidents). (#1050)

      * **Emergency outbox** — `priority: 'emergency'` skips normal age/attempt drains; soft-caps
      never delete distress rows; used by MECP compose and Incident ACK/Confirm. (#1050)

      * **ACK / beacon** — R01 general ACK vs B01/B02/B03 beacon lifecycle; counts are
      network-heard, not read receipts. Originator **Cancel beacon** sends MECP B03 so other
      stations clear the active beacon. (#1050, #1057)

      * **Ops alerts** — Watched-node silence, battery low, unexpected link-down (not manual
      disconnect / mid-reconnect); new notification sounds. (#1050)

      * **Field UX** — Quick-status presets + roll-call above Chat; separate App → MECP opt-ins for
      Chat MECP and Chat MAYDAY (both default off). (#1050)

      * **Exports / SAR** — After-action report assembler; MGRS grid + measure tool; USGS Topo
      basemap allowlisted. (#1050)


      ---


      ## TAK


      * **Multi-protocol CoT** — TAK tab on MeshCore and Reticulum; per-protocol CoT uid prefixes
      (`MESH-` / `MC-` / `RN-`); node cache keyed by `protocol:node_id`. ATAK plugin list remains
      Meshtastic-only. (#1060)

      * **Live positions** — Replicator feeds all three node maps (Reticulum: RMAP interfaces + app
      GPS); stale windows per protocol; 5‑minute refresh / throttled deltas. (#1060)

      * **Remote TAK server relay** — Mutual TLS to a remote TAK server with imported
      PEM/DER/PKCS#12 credentials; runs with or without the local TAK server; panel controls for add

