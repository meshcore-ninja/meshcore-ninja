    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **49**\r\nLast official release: **v5.35.0** (schema **49**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.36.0] - 2026-09-13\r\n\r\n### Highlights\r\n- **Cleanup:** Large subtractive pass — unused renderer hooks/stores/lib extracts, unused Reticulum renderer + sidecar leftovers, orphan scripts — then the active tab reads Connection / queue / panel from one `useProtocolFacade` (one ConnectionPanel, shared MeshCore/Meshtastic TCP bridge).\r\n- **Reticulum / Nomad:** NomadNet 1.4.1 micron media (in-page images, collapsibles, `rrc://` links), LXMF image/multi-file attachments, Interface profiles, and much faster Nomad `/media` over TCP (reused Links, skip Resource slow-start).\r\n- **RRC:** Composer honors hub WELCOME byte limits (counters + multi-part send); reconnect failovers a stale hub path after link-proof timeout instead of looping on a dead via.\r\n- **MeshCore:** Silent-bulk waiting-message circuit stays open after incremental drain — no more timeout loop until reconnect.\r\n- **App-wide:** Opt-in crash report dialog opens a pre-filled GitHub issue; chat keeps your reading position; macOS Dock unread badges initialize.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **49** — unchanged from v5.35.0. No migration runs on upgrade.\r\n\r\n### First-time contributor\r\n- Welcome **[M0Rf30](https://github.com/M0Rf30)** — Flatpak Electron packaging. Added to [credits](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/credits.md). (#998)\r\n\r\n---\r\n\r\n## Internals / cleanup\r\n\r\nThis cycle deleted a lot of leftover surface and collapsed the App wiring so the active protocol is one facade, not three copied ConnectionPanels.\r\n\r\n### Dead code (subtractive)\r\n* Unused renderer **hooks and store APIs** after the identity-store work: `useMeshcoreRoomAuth`, unused `useConnectionStatus`, `mirrorMqttStatusToConnection`, unused packet/peer/announce helpers, plus the i18n keys only the deleted hook referenced. (#979)\r\n* Unwired renderer **lib extracts**: firmware URL helper, RRC whisper aliases, MeshCore advert/trace/pubkey wrappers, unused BLE-yield reconnect nudge. (#980)\r\n* Unused **Reticulum renderer exports**: deprecated RMAP/BLE-busy aliases, unused interface/voice/topology wrappers, always-not-ready RRC path helper. (#981)\r\n* Unused **Reticulum sidecar** leftovers (`#[allow(dead_code)]`): unused sync-progress / packet-event emitters, superseded sent-via resolvers, empty RRC hub seed, unread identity fields. Packet tap stays HTTP-buffer poll. (#982)\r\n* Unreachable Linux Web Bluetooth `ipcMain.on('bluetooth-device-cancelled')` (Cancel is invoke-only). (#985)\r\n* Orphan one-shot scripts and the `reticulum:sidecar:test:full` alias. (#986)\r\n* Stale docs, comments, and misplaced tests brought in line with live APIs. (#993)\r\n\r\n### Protocol facade (behavior-preserving)\r\n* Facade exposes identity IDs and capabilities. (#995)\r\n* App `activeRuntime` is typed as `ProtocolRuntime`. (#996)\r\n* **One `<ConnectionPanel>`** from `activeFacade.connection` (capability-gated firmware / MeshCore MQTT identity / Reticulum stack extras). (#997)\r\n* Coordinators use `useAllProtocolConnectionActions` instead of three hand-wired maps. (#9\n…"
