    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.27.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.27.1] - 2026-08-11\r\n\r\n### Highlights\r\n- **MeshCore / Meshtastic:** Graph hop filters actually apply (Max hops, Show distant, unknown hops), and the leftover “Auto-reconnect in progress…” banner no longer sticks after the radio is already up.\r\n- **MeshCore:** Room auto-login no longer stampedes on every advert; waiting-message drain falls back after repeated timeouts.\r\n- **Reticulum:** Topology hop filters + a new **RF only** checkbox; RRC auto `/who` no longer dumps member lists into chat when you leave and come back.\r\n- **Packaging:** Windows NSIS builds succeed again when schema is not bumped; release CI no longer races duplicate drafts.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n---\r\n\r\n### Meshtastic\r\n* Hide leftover “Auto-reconnect in progress…” once the radio is already configured/connected (dual-radio primary gate now settles on TCP/HTTP/serial/BLE success, not only skip/failure) (#841)\r\n* Graph: **Max hops** works with Show distant off; unknown hops are no longer treated as 1-hop neighbors; layout budget is 400 after hop filters so real nearby peers are not dropped (#839)\r\n* TCP writes with no socket fail in the renderer (no silent drop / replay on a later socket); quieter expected reconnect and ResizeObserver log noise (#839)\r\n\r\n### MeshCore\r\n* Hide leftover “Auto-reconnect in progress…” once the radio is already configured/connected (#841)\r\n* Room auto-login is single-flight: one `pathSync`/login wave instead of one per advert; disconnect cannot `SendLogin` on the new connection (#839)\r\n* Silent bulk `getWaitingMessages` circuit-opens after two consecutive timeouts and skips bulk until reconnect/success (#839)\r\n* Graph: same hop-filter and 400-node layout fixes as Meshtastic (#839)\r\n\r\n### Reticulum\r\n* Topology hop filters match Graph (numeric Max hops always applies; unknown hops only with All hops + Show distant; 400-node cap after filters) (#839)\r\n* New Topology **RF only** filter: keep RNode / KISS / LoRa / BLE spokes; drop TCP / I2P / Auto hubs (exact name/id, applied before the ingest slice) (#839)\r\n* RRC: auto `/who` is once-per-join on the hub session (survives leaving the tab); first roster may appear in the room, later snapshots update the nicklist only; unscoped hub notices go to `[hub]` (#839)\r\n\r\n### App-wide / packaging / security\r\n* Windows packaging: keep a no-op NSIS schema-upgrade stub so `dist:win` succeeds when schema is not bumped (#840)\r\n* Release CI: prepare job is the sole GitHub draft creator; matrix/Flatpak upload by `release_id` (no competing drafts) (#837)\r\n* Schema compare recovers untagged published releases (e.g. 5.27.0) instead of warning against an older tagged build (#838)\r\n* CodeQL: release id rebuild + `gh api --input` uploads; schema-note PATCH uses the create response instead of re-listing (#838, #837)\r\n\r\n### Full Changelog\r\n[`v5.27.0...v5.27.1`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.27.0...v5.27.1)"
