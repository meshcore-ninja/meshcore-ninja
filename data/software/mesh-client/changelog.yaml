    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **52**\r\nLast official release: **v6.0.0** (schema **49**)\r\n\r\n## Database schema upgrade: 49 → 52\r\n\r\nInstalling and launching this build will upgrade the local SQLite database. You **cannot downgrade** to an older Mesh-Client that only supports the previous schema while keeping the same database.\r\n\r\nOn first launch, Mesh-Client shows a **Quit / Upgrade** dialog before changing the database.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n---\r\n\r\n## mesh-client v6.1.0\r\n\r\n### Highlights\r\n\r\n- **Meshtastic firmware 2.7/2.8 parity:** inbound data keeps flowing on 2.8, LoRa Apply is safer, and the app adds 24-byte long names, region presets and node renumbering.\r\n- **Weather and sensor data:** sensor history is saved, with a sensor map layer, per-node sparklines, a Weather chat view and named Meshtastic MQTT profiles.\r\n- **Saved locations:** save named places such as Home or EOC and confirm them at launch. Distance diagnostics now pause until a trusted position exists.\r\n- **TAK:** inbound CoT from ATAK clients and the TAK server appears on the map, with a combined TAK status, a plain TCP relay and certificate enrollment.\r\n- **Nomad identity controls:** browsing is anonymous by default. A per-node identify toggle, page access lists and a URL-bar favourite star are new.\r\n- **Settings search:** press Ctrl/Cmd+K to find any setting and jump straight to it.\r\n- **Disable unused protocols** from the App panel. They stay fully stopped, including across sleep and wake.\r\n- **Windows BLE reliability:** LoRa radios pair in-app, a wedged Bluetooth stack is explained, and `fromRadio` reads keep flowing.\r\n- **Better translations:** untranslated text was filled in across all 15 non-English languages.\r\n\r\n### Behavior changes\r\n\r\n- **Nomad browsing is now anonymous by default.** Nodes no longer receive your Reticulum identity unless you turn on identify for that node. Turning it off later can't take back an identity you already sent.\r\n- **IP-based locations no longer count as device GPS.** Diagnostics skips distance checks such as Impossible hop and Hop goblin until there is a radio GPS fix or a confirmed saved location. MeshCore advert coordinates are not treated as GPS either.\r\n\r\n---\r\n\r\n### Meshtastic\r\n\r\n**Features**\r\n\r\n- Firmware 2.7/2.8 parity (#1148):\r\n  - LoRa Apply stays disabled until the device config loads, so defaults can never overwrite the radio.\r\n  - Enforces the 24-byte long-name limit.\r\n  - Honors the firmware's region preset maps.\r\n  - Sends wire-coded bandwidths.\r\n  - Follows nodes across firmware 2.8 renumbers by public key. A renumber is verified against the crc32 of the public key and is never merged into a row with a different key.\r\n  - Own-node history is kept per radio, so switching radios can't mix identities.\r\n- Named Meshtastic MQTT profiles: save and apply broker, topic and TLS settings (#1120)\r\n\r\n**Bug Fixes**\r\n\r\n- Keep inbound data flowing with firmware 2.8. Node-status packets (port 36) were silently ending all inbound data until the watchdog reconnected. Any pipe failure now reconnects immediately (fixes #1142) (#1146)\r\n- Keep BLE `fromRadio` reads flowing on Windows by bounding reads, polling when notifications stall and reconnecting within seconds (#1145)\r\n- MQTT telemetry no longer drops device metrics such as battery (#1120)\r\n- No more redundant metadata retry and false failure logs after configure. Firmware check timeouts are now quiet (#1143)\r\n\r\n### MeshCore\r\n\r\n**Features**\r\n\r\n- Radio CLI quick pills for MeshCore 1.17 on repeaters and room servers: rx boosted gain, FEM rx/tx gain, hardware CAD and `pwrmgt.bootreason` (#1149)\r\n- Contact auto-offload now fires on the app-side contact count, on a full table during import or route push, and on overwrite-oldest evictions, not only on the rare `CONTACTS_FULL` event. The capacity badge in node details updates live (#1130)\r\n\r\n**Bug Fixes**\r\n\r\n- Recover stalled contact dumps by retryin\n…"
