      ### macOS install


      - Requires **macOS 13 Ventura** or later (Electron 44).

      - **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.

      - If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` —
      **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash
      at launch with `Library not loaded: Squirrel.framework`.

      - See
      [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract)
      if the app will not open after a ZIP extract.

