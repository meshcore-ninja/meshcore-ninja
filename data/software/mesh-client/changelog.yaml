    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **49**\r\nLast official release: **v5.34.0** (schema **48**)\r\n\r\n## Database schema upgrade: 48 → 49\r\n\r\nInstalling and launching this build will upgrade the local SQLite database. You **cannot downgrade** to an older Mesh-Client that only supports the previous schema while keeping the same database.\r\n\r\nOn first launch, Mesh-Client shows a **Quit / Upgrade** dialog before changing the database.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.35.0] - 2026-09-08\r\n\r\n### Highlights\r\n- **Reticulum:** First-time setup guide on Connection (identity → network → first message), reopenable from Network after Hide guide.\r\n- **MeshCore:** Add **private channels** from Chat with a supplied 16-byte hex key (hashtag-derived keys remain the default).\r\n- **macOS:** Official releases ship **Intel x64 and Apple silicon arm64** packages (DMG + ZIP), with signing/notarization CI hardened for dual-arch.\r\n- **Support:** Log analysis expands findings with timestamped evidence and a richer **Copy troubleshooting report**.\r\n- **Schema 49:** One-way SQLite upgrade for Reticulum identity-activity indexing (Peer announced destinations). Confirm the Quit / Upgrade dialog on first launch after install.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **49** (was **48** in v5.34.0). First launch after upgrade prompts to confirm the migration; quitting leaves the database unchanged.\r\n\r\n---\r\n\r\n## Reticulum\r\n\r\n* First-time **setup guide** on Connection walks through starting the service, naming/saving recovery words for a new identity, choosing a public hub or RNode path, and sending a first message. Existing identities and private interface settings are preserved. (#960)\r\n* **Hide guide** dismisses the full guide (not just the banner) and remembers that choice across restarts. **Network → Open setup guide** reopens it without clearing dismissal. (#961)\r\n* Chat DMs always target **`lxmf.delivery`**: Peers → Message (and related send paths) remap telephony/path-table hashes to the peer’s LXMF destination, or refuse send when no LXMF announce is known. Existing telephony-keyed DM tabs fold onto LXMF when available. (#947)\r\n* **RF Q** badge stays visible whenever an online RNode reports queue stats (parity with MeshCore/Meshtastic). (#947)\r\n* Peer details lists **announced destinations** for the identity (Chat, Voice, Nomad, RRC, Propagation) with copy controls; identity-activity index is schema v49. (#951)\r\n* MeshChat default Material person/people icons no longer replace **LXMFace**; only explicit overrides (star / heart / shield / People picker) do. (#952)\r\n\r\n## MeshCore\r\n\r\n* Chat → Add Channel supports **Private channel (enter key)**: keep the trimmed name and supply a nonzero 16-byte key as 32 hex characters. Hashtag mode stays the default. Matching uses name + key; a full radio is never overwritten. (#962)\r\n* Incoming replies refresh a **stale quote parent** when live ingest has a firmware-seconds (or ms) key that conflicts with a newer message from the same sender. (#943)\r\n* Rooms: fewer **Unknown** authors on new posts, and more resilient **auto-login** retries for transient session failures. (#950)\r\n\r\n## Support / diagnostics\r\n\r\n* Log analyzer recommendations hono\n…"
