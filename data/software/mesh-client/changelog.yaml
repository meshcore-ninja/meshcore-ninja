    notes: "## [v5.27.0] - 2026-08-10\r\n\r\n### Highlights\r\n- **Reticulum:** Propagation Sync can retrieve store-and-forward mail into Chat; Games, LXST voice, paper messages, and IRC-style RRC land in this release.\r\n- **MeshCore:** OpenHop/TCP reconnect and chat TX are much more reliable; MQTT gains a preset picker and four new device-signing brokers; outbound chat is now single-packet only (see Breaking Changes).\r\n- **Meshtastic:** TCP auto-connect on launch, a safer live-session link meter, and several chat/reconnect reliability fixes.\r\n- **App-wide:** Customizable Chat message-action colors, stronger RF reconnect ownership, packaging/schema-upgrade warnings, and dependency security floors.\r\n\r\n### Breaking Changes\r\n* **MeshCore: multi-part / multi-split outbound messages removed.** On a busy mesh, half-duplex repeaters often drop some parts of a multi-part `[i/N]` send, so recipients can get a silently incomplete message with no obvious error. mesh-client therefore no longer auto-splits long MeshCore channel, DM, or room messages — over-limit text is blocked in the composer; shorten the message or send multiple shorter messages. Meshtastic multi-split (up to 9 parts) is unchanged. Inbound multi-part from other MeshCore clients is still merged. (#823)\r\n\r\n### Thanks\r\n* **WB3IHY** — extensive help and troubleshooting throughout this release\r\n* **Runr** and **W0RMT** — extensive testing of Reticulum features\r\n* **N7EAL** — creating an OpenHop test bed\r\n* **FuzzyChaos** — donating for new test equipment\r\n\r\n---\r\n\r\n### Meshtastic\r\n* Auto-connect remembered TCP links on launch (#806; fixes #805)\r\n* Live-session TCP host-link meter — measures the existing session instead of probing a second TCP connection that could RST the radio (#814; supersedes #811)\r\n* Customizable Chat message-action bar and hover colors under App → Appearance → Colors (#801)\r\n* MQTT network presets use a shared dropdown picker (replacing the old button row), shared with MeshCore (#821)\r\n* Health column header on the node list (#829)\r\n* Stronger TCP reconnect (error-before-close ownership, mid-init unstick, NODELAY/keepalive) (#792, #795, #803)\r\n* Single-owner RF reconnect; cancel deferred BLE auto-connect when you start TCP/serial manually (#798, #806, #821)\r\n* Auto-request recipient NODEINFO/key when a PKI DM fails for a missing public key (#827, #828)\r\n* Unmatched TIMEOUT / MAX_RETRANSMIT / NO_RESPONSE no longer steal chat “WiFi no ACK” from an unrelated in-flight send; clearer mesh-ACK tooltip (#836)\r\n* Quieter Meshtastic SDK / heartbeat logging; false “Packet does not exist” heartbeat errors suppressed (#827, #828)\r\n* Private-IP connect failures no longer suggest Bonjour / `meshtastic.local` (#786)\r\n* MQTT channel map re-sync reliability (#785)\r\n* Linux: long-session Noble health snapshot no longer throws after ~24h on the Web Bluetooth path (#834)\r\n\r\n### MeshCore\r\n* **Breaking:** single-packet outbound chat for channels, DMs, and Rooms — no more auto `[i/N]` splits (avoids silently incomplete deliveries when repeaters drop parts); soft fast-send advisory; inbound multi-part from other clients still merges (#823)\r\n* Auto-connect remembered HTTP/OpenHop links on launch (#806; fixes #805)\r\n* OpenHop/TCP reconnect and chat TX hardened: peer FIN mid-setup, dead-bridge reopen for user sends without double-send, quiet reopen without disconnect flicker (#792, #796, #803, #806, #808, #812, #816)\r\n* SoftAP naming replaced with **OpenHop** across UI, logs, and docs (#816)\r\n* MQTT preset picker: shared dropdown (replacing the button row) plus new device-signing brokers **Waev**, **Meshat.se**, **MeshCore.CA** (Primary/Backup), and **EastMesh**, alongside LetsMesh / MeshMapper / Colorado (#821)\r\n* Per-channel Chat flood scopes (Default / Unscoped / named) so Public and metro-style channels do not share scope (#785)\r\n* MeshCore + app QR interop: emit/ingest `meshcore://contact/add` and `meshcore://channel/add` (#784)\r\n* Contacts: offline public-key lookup, inline key icon (ID column \n…"
