    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **55**\r\nLast official release: **v6.10.0** (schema **54**)\r\n\r\n## Database schema upgrade: 54 → 55\r\n\r\nInstalling and launching this build will upgrade the local SQLite database. You **cannot downgrade** to an older Mesh-Client that only supports the previous schema while keeping the same database.\r\n\r\nOn first launch, Mesh-Client shows a **Quit / Upgrade** dialog before changing the database.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.11.0\r\n\r\n### Highlights\r\n\r\n- **MeshCom (CM) — new amateur radio mesh protocol.** Initial support for ICSSW [MeshCom 4.0](https://icssw.org/en/meshcom/), a licensed amateur-radio callsign LoRa mesh, as a fourth RF stack alongside Meshtastic, MeshCore, and Reticulum. It is **hidden by default** — enable it in the first-run wizard, or later under **App → Protocols** if you skipped that step. This is an early implementation; please report bugs via [GitHub Issues](https://github.com/Colorado-Mesh/mesh-client/issues) or [Discord](https://discord.com/invite/McChKR5NpS).\r\n- **First-run protocol picker and setup tour.** Fresh installs choose which protocols to enable before the shell opens, then walk Connection for each selection (same setting as App → Protocols).\r\n- **Ratspeak 1.5.1 compatibility.** Reticulum stack pins and overlays updated for rsReticulum / rsLXMF 1.5.1 (path-medium, TX-queue, slow-RF).\r\n- **MECP 1.4.1 compliance.** Emergency text parsing aligned with MECP 1.4.1 (including rejection of unit-bearing durations after a decimal mark).\r\n\r\n### What's Changed\r\n\r\n#### MeshCom (new)\r\n\r\n- First-class **CM** protocol: EXTUDP (UDP 1799), KISS/TCP (8001), USB serial, and BLE (NUS phone framing)\r\n- Callsign identity, ALL / GRC group chat, DMs, digipeater hop path, Contacts, Map, Telemetry / MHEARD\r\n- Radio → Device Configuration via ICSSW `--` commands (Serial/BLE); country profiles (`--setctry`); MeshMap link + Send POS\r\n- GRC catalog / listen UX, DM ACK, Graph callsigns, wire limits, MeshCom RM / kocel device commands\r\n- Callsign watchlist notifications; firmware update check against [MeshCom-Firmware](https://github.com/icssw-org/MeshCom-Firmware/releases) (no in-app USB flasher yet)\r\n- Custom MQTT brokers only (no Meshtastic / MeshCore network presets)\r\n\r\n#### Shared / App\r\n\r\n- First-run **Choose your protocols** picker + setup tour (Connection per selected protocol); same setting as App → Protocols\r\n- **Saved devices** history on Connection (Reconnect / Delete) across BLE, serial, HTTP, TCP, UDP\r\n- Drag channel chips in Chat to reorder (same store as Order chats)\r\n- Dual CP2105 serial: ambiguous Standard/Enhanced match opens the port picker instead of hanging Configure\r\n- Cross-protocol USB yield / serial zombie recovery; Semgrep security hardening\r\n\r\n#### MeshCore\r\n\r\n- Region discovery via passwordless companion `ANON_REQ`; owner.info / remote clock on node detail\r\n- Path-hash badge on incoming chat (1/2/3-byte on-air width)\r\n- Windows BLE GATT discovery recovery after pair; path-hash mode on fork firmware that reports it\r\n- Copy route on trace results\r\n\r\n#### Meshtastic\r\n\r\n- Path-hash / fork-firmware path mode when the device reports it\r\n- Shared Connection saved-device history and Dual CP2105 serial picker fix\r\n- Chat Order chats usable before `myNodeNum` resolves; right-click Copy on selected text\r\n\r\n#### Reticulum\r\n\r\n- Ratspeak **1.5.1** (rsReticulum / rsLXMF pin bump, path-medium / TX-queue / slow-RF overlays)\r\n- Voice interop: dual-TCP telephony discovery seeds the dialer from inbound `lxst.telephony` announces\r\n- Nomad: Link REQUEST data as msgpack map (not Binary); re-ensure Nomad path between Link queries\r\n\r\n#### MECP / Incident\r\n\r\n- MECP **1.4.1** compliance (unit-bearing durations after a decimal mark rejected); Incident copy clarifies unresolved reports\r\n\r\n#### CI / packaging\r\n\r\n- Windows/Flatpak artifact download fixes; Semgrep on release preflight; PyYAML 3.15 wheels; pac\n…"
  - version: v6.10.0
    name: 6.10.0
