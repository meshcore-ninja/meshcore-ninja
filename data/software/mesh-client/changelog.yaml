    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **55**\r\nLast official release: **v6.11.1** (schema **55**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.12.0\r\n\r\n### Highlights\r\n\r\n- **MeshCore: When a reply is missed.** Per-repeater / room choice of Auto (flood retry), Direct only, or Zero-hop instead of always clearing the route and flooding after a missed reply.\r\n- **MeshCom NET Console & KISS auth.** Optional HMAC password for KISS/TCP, NET Console on `:2323`, device `--kiss auth` / `--netconsole` / `--passwd`, and longer chat splits into up to nine `[i/N]` parts.\r\n- **MeshCom GRC hide + RF/GW badges.** Remove GRC group pills via `--setgrc`, and show text RF vs GW transport badges from how the message arrived.\r\n- **MeshCore empty channels on connect.** Re-reads the channel table when a concurrent connect RPC falsely truncates the first snapshot to empty, so Chat pills and Radio → Channels come back without a manual sync.\r\n- **MeshCom chat after restart / live ALL.** ALL history and destinations survive restart (no hex DM pills for channel traffic); outbound ALL bubbles stay visible when firmware msg ids collide with hydrated history.\r\n\r\n### What's Changed\r\n\r\n#### MeshCore\r\n\r\n- Per-repeater **When a reply is missed** route mode (Auto / Direct only / Zero-hop), with a small badge for non-Auto choices (#1568 / #1566)\r\n- Shared Menu radio groups and safer overflow placement for the route-mode menu\r\n- Retry channel fetch when the connect snapshot is empty so channels are not dropped by a race (#1576)\r\n- Keep Chat → Rooms mounted across protocol switches so the open room and list state survive (#1577)\r\n- LoRa Frequency (MHz) field keeps typed digits instead of fighting the user mid-edit; out-of-range values show an alert and block Apply (#1569)\r\n- After a successful path reset, Auto flood retry still runs even if the connect ref changes mid-await (#1578)\r\n- Windows BLE: warm WinRT GATT cache before MeshCore discover, bound first discovery, and abort stuck connect tasks so “Bluetooth stack unresponsive” clears quickly (#1573 / #1571)\r\n\r\n#### MeshCom\r\n\r\n- NET Console (`:2323`) with optional password auth, chat via `::`, and device `--` commands (#1567)\r\n- Optional HMAC auth for KISS/TCP; Radio Device Configuration for `--kiss auth`, `--netconsole`, `--passwd`\r\n- Multi-part MeshCom composer splits (up to 9); collapsed empty MQTT section with gateway hint\r\n- Hide / unbook GRC groups from the pill row (`--setgrc`); RF and GW transport badges on received messages (#1578)\r\n- Restore ALL / GRC history after restart; stop hex DM tabs for channel traffic; prefer callsign labels (#1572)\r\n- Keep live ALL sends when wire packet ids collide with hydrated history; stop stuck provisional `sending` rows (#1575)\r\n\r\n#### Diagnostics / Maps / packaging / quality\r\n\r\n- Keep the diagnostics analysis worker free of UI imports so COI offload no longer dies with `window is not defined` and floods the console (#1580)\r\n- Offline maps: stop unbounded tile-cache eviction when disk stats are stale, so region downloads no longer hang (#1579)\r\n- Large fallow cleanup: dead code, import cycles, and hotspot decomposition; complexity metrics advisory by policy; cached pre-push checks (#1570)\r\n- Restore electron-builder `beforePack` / `beforeBuild` default exports so Windows packaging no longer fails with `handler is not a function` (#1574)\r\n\r\n### Bug Fixes\r\n\r\n* keep the analysis worker graph free of UI imports (#1580)\r\n* stop tile-cache eviction looping on stale stats (#1579)\r\n* let the radio frequency field be typed into (#1569)\r\n* keep Rooms panel mounted across protocol switches (#1577)\r\n* re-read channels when the connect snapshot is empty (#1576)\r\n* keep live ALL sends when wire ids collide with history (#1575)\r\n* restore electron-builder beforePack/beforeBuild defaults (#1574)\r\n* warm WinRT cache before MeshCore discover hang (#1571) (#1573)\r\n* restore ALL\n…"
  - version: v6.11.1
