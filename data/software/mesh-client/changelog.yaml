    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **54**\r\nLast official release: **v6.7.1** (schema **54**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.8.0\r\n\r\n### Highlights\r\n\r\n- **Environment telemetry charts.** Device → Telemetry keeps identity-scoped history with node selector, 1h/24h/7d windows, expanded sensors, and MeshCore Cayenne LPP → env readings (Reticulum remains unsupported).\r\n- **Geofenced waypoints + MeshCore 1.18 companion gaps.** Radius/bbox/notify waypoints on the map; companion notify/retry CLI, cancel pending DM ACK, forget last advert; Heltec V4 flash; MECP outbox shows real severity.\r\n- **MECP 1.3.0.** Freetext decode/encode adherence (durations, callsigns, tags); compose accents match request/response; Incident rail badge counts all open rows including drills.\r\n- **Room-jump macros & denser schedules.** F1–F12 slots can jump to MeshCore/RRC rooms; scheduled broadcasts gain every 4/8/12 hour intervals.\r\n- **QR scan everywhere (MeshCore).** Contacts toolbar, launcher Scan, channel manager, and Radio dual-scan; paste image/link works; contacts refresh immediately on import.\r\n- **Live traffic hop tones & simpler topology filters.** Optional harmonic hop audio by distance; “Show all” includes multi-hop peers without a separate distant-peers toggle.\r\n\r\n### What's Changed\r\n\r\n#### Environment / Device\r\n\r\n- Store-backed env telemetry charts with node selector and time windows\r\n- Expanded sensor fields; Map Sensors / CSV / sparklines coverage\r\n- Cayenne LPP readings project into env history (MeshCore push/pull)\r\n- History scoped by `identity_id` (legacy claim on first use)\r\n- App → Danger Zone → Clear Environment History\r\n- Chart overlays capped/downsampled for “All nodes”; clear waits for DB success\r\n\r\n#### Meshtastic / MeshCore firmware & radio\r\n\r\n- Geofenced waypoints (radius, bbox, enter/exit/favorites notify) with map overlay\r\n- MQTT waypoint lat/lon range checks and geofence wire normalization\r\n- MeshCore companion CLI: Notifications + Message retries (v1.18+)\r\n- Cancel pending DM ACK; Node detail → Forget last advert\r\n- Heltec V4 USB flash for Meshtastic and MeshCore\r\n- Chat macros toolbar expanded by default\r\n- MeshCore DM hop-ACK wait floored at hop-scaled 45s\r\n- Companion self-telemetry LPP GPS treated as device fix\r\n\r\n#### MECP / EMCOMM\r\n\r\n- MECP protocol adherence through **1.3.0** (encode strict; decode accepts spaced durations)\r\n- Emergency outbox badges/tones use real severity (not always “Emergency”)\r\n- Compose: request=red / response=blue accents; equal-size category grid\r\n- Incident tab badge counts every open incident (including SAFETY/ROUTINE/drills); quit warning still MAYDAY/URGENT only\r\n\r\n#### Chat / macros / schedules\r\n\r\n- F-key macros: jump to MeshCore room or RRC hub+room from any tab\r\n- Scheduled broadcasts: every 4 / 8 / 12 hours (DST-safe); airtime warning for frequent multi-target schedules\r\n- MeshCore contact QR scan discoverability + offline import + paste fix\r\n- Meshtastic channel QR scan moved to top of Channels for parity\r\n\r\n#### Map / topology\r\n\r\n- Optional Live traffic hop tones (harmonic pitch by great-circle distance)\r\n- Topology hop filters simplified; Show all includes multi-hop peers\r\n\r\n#### App / platform\r\n\r\n- Persist Danger Zone delete-nodes age across restarts (strict integer coerce)\r\n- Main-bundle pre-commit gate (`check:main-bundle`) with AI remediation text\r\n- Panel-matrix Playwright E2E + path-filtered `e2e-panels` CI; coverage hotspots / threshold ratchet\r\n- Credits: M3SHGH0ST → Authors; Beacon / CoreScope credit\r\n- Third-party licenses update\r\n\r\n### Bug Fixes\r\n\r\n- Env charts: per-node downsample budgets; history clear integrity; i18n for env + danger zone\r\n- MQTT waypoints: invalid lat/lon rejected; geofence normalized before uplink\r\n- MeshCore: QR camera release when disabled; reject second deferred channel QR; Scan dialog `aria-modal`\r\n- Scheduled-broadcast\n…"
