    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **54**\r\nLast official release: **v6.9.0** (schema **54**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.10.0\r\n\r\n### Highlights\r\n\r\n- **Chat orders by when this app received messages.** Across Meshtastic, MeshCore, and Reticulum, history, unread, DM list, Rooms, search, and the unified inbox use arrival time (`received_at`) instead of the sender/radio stamp — so skewed clocks no longer bury new traffic or inflate read marks. Bubbles still show the stamped time (with the arrival date when it differs).\r\n- **Linux AppImage BLE / Reticulum fixed for older glibc.** Release sidecars are built with `cargo zigbuild` to **glibc 2.35**, so Ubuntu / Pop!_OS 22.x–24.04 no longer fail BLE scan or Reticulum start with a bare `fetch failed`. Sidecar crashes now surface the real exit / loader error.\r\n- **Local noise floor on Monitor → RF.** Meshtastic and MeshCore show a live floor card and estimated distribution histogram (firmware-reported when available; RSSI−SNR median fallback otherwise).\r\n- **Protocol switching stays snappy after idle.** Optimistic rail selection plus throttled Reticulum background work when another protocol is visible, so MT/MC ↔ RN no longer feels stalled after a long idle session.\r\n\r\n### What's Changed\r\n\r\n#### Chat / receive order\r\n\r\n- Order messages by first receive/send time (`received_at`); keep first-arrival position on re-delivery\r\n- Unread counts, New messages divider, Mark unread, Catch up “since last read”, DM History, Rooms Last post, and global search follow arrival order\r\n- Backfill NULL `received_at` on Meshtastic / MeshCore SQLite updates without overwriting existing values\r\n- MeshCore hydration and `db:getMeshcoreMessages` rank with `COALESCE(received_at, timestamp)` (parity with Meshtastic)\r\n- Stable local-id tie-break when receive times match; wrap bubble headers when dated times need room\r\n\r\n#### Monitor / RF\r\n\r\n- Local noise floor card + estimated noise-floor histogram for Meshtastic and MeshCore\r\n- Guard firmware `0` / out-of-band floors; fall back to labelled RSSI − SNR median when missing\r\n- Corrected noise-floor i18n strings (ja, ru, es, zh, id, tr, uk)\r\n\r\n#### Linux / packaging\r\n\r\n- AppImage Reticulum sidecar GLIBC floor via zigbuild (`…-gnu.2.35`); CI glibc gate + smoke\r\n- Clearer sidecar start failures (exit code / loader stderr instead of undici `fetch failed`)\r\n\r\n#### Reticulum / renderer\r\n\r\n- Decouple optimistic protocol rail selection from full shell render\r\n- Throttle Reticulum peer/interface/diagnostics polls when hidden or off-protocol; resume refresh on focus\r\n- Support snapshot breadcrumbs for long tasks and protocol-switch timings\r\n\r\n#### CI / tests\r\n\r\n- CodeQL Swift scan only when Swift / AI-helper inputs change (skip dep-only / unrelated workflow PRs)\r\n- AppPanel Danger Zone age tests avoid AccName timeouts\r\n\r\n### Bug Fixes\r\n\r\n- Chat order / unread driven by receive time instead of remote clocks (#1493, #1518)\r\n- AppImage BLE + Reticulum on glibc < 2.43 hosts (#1516)\r\n- Idle protocol-switch stall with Reticulum stack running (#1517)\r\n- Noise-floor locale mistranslations; MeshCore receive-order hydration parity (#1518)\r\n\r\n### Breaking Changes\r\n\r\n*(None)*\r\n\r\n### Full Changelog\r\n\r\n[`v6.9.0...v6.10.0`](https://github.com/Colorado-Mesh/mesh-client/compare/v6.9.0...v6.10.0)\r\n\r\n<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 45).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://colorado-mesh.github.io/mesh-client/troubleshooting/#macos-library-not-loaded-squirrelframe\n…"
