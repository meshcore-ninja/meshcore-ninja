    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **54**\r\nLast official release: **v6.6.0** (schema **54**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.7.0\r\n\r\n### Highlights\r\n\r\n- **Scheduled Broadcasts.** Chat → Broadcasts schedules up to 12 recurring one-packet sends to channels, MeshCore rooms, and RRC rooms — skip-missed (no catch-up flood), channel-key remap when radios reorder, Send now.\r\n- **Contact Cards & Team Roster.** Network hub linking Meshtastic / MeshCore / Reticulum devices per person; event roster with per-device selection and fan-out team DMs.\r\n- **Word filter for chat.** Hide matching messages across Meshtastic, MeshCore, and Reticulum (MECP / emergency bypass; filtered rows don’t drive unread or notification sound).\r\n- **Richer maps.** Opt-in Internet weather (forecast, temp/wind, RainViewer / NEXRAD), terrain LOS / Fresnel profiles, and local KML / KMZ / GeoJSON overlays.\r\n- **Catch up Ask + speedy Apple Silicon MLX.** Follow-up Q&A grounded in the transcript; richer large summaries; fast on-device MLX on Apple Silicon (Qwen2.5 remains the lighter option).\r\n- **Reticulum Ratspeak 1.4.** Multi-file LXMF attachments, resumable outbound, Games updates; oversized legacy PN stores quarantine so live RNS / RRC can attach again.\r\n- **MeshCore repeater / Rooms reliability.** Faster bounded admin waits, path escalation, Room Ping via Status (not TRACE), multi-hop ping path-hash fixes, noise-floor trend chart.\r\n- **Faster cold launch.** Batched identity hydration, active protocol first; Chat stays mounted across protocol switches so idle tab changes stay snappy.\r\n\r\n### What's Changed\r\n\r\n#### Meshtastic\r\n\r\n- Scheduled Broadcasts to channels (Chat → Broadcasts)\r\n- Contact Cards / Team Roster with Meshtastic device links and team DM fan-out\r\n- **Word filter**; sanitized chat markdown + composer toolbar; mark unread; local delete\r\n- Delivery-proof / SF++ status on message badges; channel security badges (open / weak PSK styling)\r\n- Hop-count hover shows the route a message took\r\n- Map: Internet weather, terrain LOS / Fresnel, KML/KMZ/GeoJSON overlays, waypoint create/edit, traceroute show-on-map\r\n- Diagnostics: durable CU history and PDR-proxy metrics; opt-in error-severity desktop alerts\r\n- Catch up Ask / richer large summaries on channels and DMs; speedy Apple Silicon MLX\r\n- Faster cold hydration (batched IPC; active protocol first)\r\n- Outbox rows scoped by identity so pending sends survive radio-down / identity switches\r\n- Live traffic quiet-mesh empty copy (vs “connect a radio”)\r\n\r\n#### MeshCore\r\n\r\n- Scheduled Broadcasts to channels and known rooms (labels show channel / room names)\r\n- Contact Cards / Team Roster with MeshCore device links and team DM fan-out\r\n- **Word filter**; chat markdown; mark unread; local delete; channel security badges; hop route on hover\r\n- Map: Internet weather, LOS profiles, imported overlays, waypoints\r\n- **Noise-floor trend** chart on selected-node detail (visibility-gated Status sampling)\r\n- Repeater admin: bounded reply waits, soft settle, one-shot flood retry on stale direct routes, CLI requires admin password\r\n- Multi-hop ping at 1-, 2-, and 3-byte path hashes; TRACE hop sizing matches firmware / radio path-hash mode\r\n- Room Ping uses Status (Rooms don’t answer TRACE); restore contact once on `NOT_FOUND` and retry\r\n- Ping direct repeaters that still hold an old route; retry zero-hop requests by flood\r\n- Quiet channel history hydrates outside the global window (and stays quiet after prune)\r\n- DM RX: same-second rows stay separate; hop corrections and sender names match the right packet\r\n- Diagnostics CU / PDR-proxy + opt-in alerts; Catch up Ask on channels, DMs, and rooms\r\n- Faster cold hydration; Chat keep-alive across protocol switches\r\n- Live traffic quiet-mesh empty copy\r\n\r\n#### Reticulum\r\n\r\n- Scheduled Broadcasts to RRC rooms\r\n- Contact Cards / Team Roster with Reticulum pee\n…"
  - version: v6.6.0
