    prerelease: false
    notes: "## [v5.26.0] - 2026-08-03\r\n\r\n### Highlights\r\n- Reticulum peers get LXMFace avatars, History/Contacts, multi-path routing, BLE RNode RSSI, and more reliable Nomad/LXMF over TCP.\r\n- Connection host-link strength for BLE and WiFi/TCP, plus LoRa BLE reconnect hardening across Meshtastic and MeshCore.\r\n- Chat wire-byte budgeting, MeshCore hop pills restored, MQTT/MeshMapper fixes, and 24-hour clock persistence.\r\n\r\n### What's Changed\r\n\r\n### Features\r\n* mirror hub warnings and attribute announce-bus pressure (#779)\r\n* BLE RNode RSSI, regional backbones, muted interfaces, and bulk delete (#777)\r\n* LXMFace, History/Contacts split, and LoRa DM History (#774)\r\n* host-link strength meter for BLE and WiFi/TCP (#769)\r\n* ranked multi-path slots with RF/network medium preference (#762)\r\n* add Playwright Electron smoke suite (#753)\r\n\r\n### Bug Fixes\r\n* bump brace-expansion override to 5.0.9 for GHSA-rgw5-rvv9-x895\r\n* pre-release ghost hears, 24h clock hydrate, and i18n accuracy (#782)\r\n* MeshMapper host, MQTT channel map, and MeshCore BLE ghost nodes (#781)\r\n* stop false Failed to apply setting on Remote Off (#780)\r\n* use24HourTime persist and softer reticulum proxy restart errors (#778)\r\n* backfill Linux reconnect peripheral id and widen loss detection (#776)\r\n* harden BLE teardown and reconnect against stream races (#775)\r\n* pre-release audit hardening and deps bump (#771)\r\n* budget real wire bytes and pace meshtastic multi-part sends (#770)\r\n* unstick connect cleanup hang and warn on weak RSSI (#767)\r\n* exhaust alternate paths for Nomad and LXMF Direct (#766)\r\n* unstick LoRa Noble reconnect at edge of range (#765)\r\n* reliable TCP loads, paste-and-go, and bundled Micron fonts (#764)\r\n* restore chat hop pills for packed pathLen and late RF (#761)\r\n* make TCP Nomad page loads reliable after #756/#757 (#759)\r\n* force-path refresh on TCP Nomad link_timeout (#757)\r\n* make Nomad page loads reliable over TCP hubs (#756)\r\n* detect pnpm and MSVC on Windows CI runners (#755)\r\n* run CI env check after pnpm is available (#754)\r\n\r\n### Other Changes\r\n* gitignore local reticulum sidecar config/storage dir (#772)\r\n* add cross-platform clean:build and clean:build:full (#768)\r\n* document remote I2P SAM via Advanced config (#763)\r\n* note GitHub releases and gitworkshop source mirror (#760)\r\n* prepare Vite/Vitest configs for native configLoader (#743) (#752)\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Full Changelog\r\n[`v5.25.0...v5.26.0`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.25.0...v5.26.0)"
