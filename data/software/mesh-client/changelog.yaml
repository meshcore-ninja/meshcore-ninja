    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **49**\r\nLast official release: **v5.39.1** (schema **49**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n# Mesh-Client 6.0 — A Whole New Look\r\n\r\nMesh-Client 6.0 is the biggest visual change in the app's history. Every screen has been rebuilt on a new navigation shell and a real design system, so the app is easier to learn and easier to read. Your data, settings, radios and panels all carry over. Only the way you get around has changed.\r\n\r\nThank you to everyone who reviewed the mock-ups and voted in [#1062](https://github.com/Colorado-Mesh/mesh-client/issues/1062). This release is the result of that conversation.\r\n\r\n## Thank you, M3SHGH0ST and ashortgrayble\r\n\r\n**[M3SHGH0ST](https://github.com/cj-vana) built the v6 redesign.** He rebuilt the app panel by panel ([#1078](https://github.com/Colorado-Mesh/mesh-client/pull/1078)): the new rail, section tabs, launcher, status bar, phone layout, themes, and the shared controls that every settings screen now uses. He brought ashortgrayble's style guide into the app, documented how to apply it in `docs/style-guide.md`, added the source-policy rules that keep the UI consistent with it, and recaptured the screenshot gallery for v6 ([#1099](https://github.com/Colorado-Mesh/mesh-client/pull/1099)). He also shipped MeshCore channel management from chat ([#1096](https://github.com/Colorado-Mesh/mesh-client/pull/1096)), the zero-hop advert button ([#1101](https://github.com/Colorado-Mesh/mesh-client/pull/1101)), and a dismissible firmware update toast ([#1102](https://github.com/Colorado-Mesh/mesh-client/pull/1102)). He is this release's top contributor by a wide margin.\r\n\r\n**[ashortgrayble](https://github.com/ashortgrayble), our new designer,** wrote the Colorado Mesh style guide that v6 is built on: the color scales, type system, radius and elevation. The default look you see in 6.0 comes straight from that guide.\r\n\r\n---\r\n\r\n## Highlights\r\n\r\n- **New navigation.** A slim rail replaces the sidebar, each section has its own tabs, and a status bar along the bottom shows link health at a glance.\r\n- **Launcher (Ctrl+K / Cmd+K).** Jump to any panel, contact or channel by typing. Pin up to four favorites to the rail and open them with Ctrl/Cmd+1 to 4.\r\n- **The Colorado Mesh style guide as the default look.** New Midnight neutrals, per-protocol color scales, IBM Plex type (bundled for offline use), and consistent radius and elevation.\r\n- **Themes.** Pick a surface and an accent in one click each, including a **High contrast** surface. Slate with Classic green gives you the pre-v6 look.\r\n- **Easier to read.** Readable text is 12px or larger, **Text size** now scales the entire UI, and **Reduce motion** stops decorative animation app-wide.\r\n- **Works on narrow windows and touch.** Below 768px wide the app switches to a phone layout with a bottom bar. This is groundwork for the iOS and Android apps.\r\n\r\n### Breaking changes\r\n\r\n- **Navigation has moved.** The sidebar is gone. Every panel is still there, but it lives under one of the new rail sections (see the map below). Press **Ctrl+K** (or **Cmd+K** on macOS) and start typing if you can't find something.\r\n- **Quit has moved.** The Connec\n…"
