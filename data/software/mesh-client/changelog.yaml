    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.30.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.31.0] - 2026-08-27\r\n\r\n### Highlights\r\n- **Privacy:** Cross-protocol **Share my location** toggle (keeps local map coords; Client Mute auto-suppresses Meshtastic GPS).\r\n- **Reticulum:** Identity hash in Network → Reticulum Identity; RRC stick-to-bottom / unread / nicklist fixes; BLE FC READY + path rediscovery.\r\n- **Meshtastic:** RAK4631 serial configure drops fixed; wedged serial recovery; Short Name UTF-8 byte limit.\r\n- **MeshCore:** Faster TCP MsgWaiting drain; live advert Long Name kept after path updates; room sender / emoji tapback repairs; **Heard by N** restored for flood relays (#908).\r\n- **macOS:** Prefer the **`.dmg`**; ZIP extract with 7-Zip/Archive Utility can break `Squirrel.framework`.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n---\r\n\r\n### App-wide / Privacy / BLE\r\n* **Share my location** privacy toggle — stop app-initiated location sharing while keeping local map coordinates; Client Mute auto-disables Meshtastic GPS broadcasts (#894)\r\n* Day-4 Noble BLE restart nudge on macOS/Windows (banner + OS cues + safe relaunch) to reduce long-session native crash risk (#890)\r\n* macOS install: prefer **`.dmg`**; document Keka/`ditto` for ZIP — avoid 7-Zip / Finder Archive Utility (`Squirrel.framework` DYLD crash) (#903)\r\n\r\n### Meshtastic\r\n* Stop RAK4631 serial drop during configure handshake — configure before SQLite hydrate, PhoneAPI disconnect on teardown, ignore stale `configCompleteId` (#895, #896)\r\n* Recover from wedged serial read-pipe loss (`device has been lost` → transport-loss reconnect + configure stall parity) (#898)\r\n* Enforce Short Name **4 UTF-8 bytes** (not JS string length) so multi-emoji names cannot silently fail on apply (#893, #894)\r\n\r\n### MeshCore\r\n* Prioritize MsgWaiting drain over post-connect telemetry on TCP; fix false TX queue badge (`RESP_CODE_STATS` padding) (#889)\r\n* Keep live advert Long Name after path-updated rebuild / waiting-drain flush (#891)\r\n* Repair Unknown room senders and emoji tapback strip (SignedPlain prefixes, whitespace-padded “Unknown”) (#902)\r\n* Restore **Heard by N** flood relay coverage — credit flood-path forwarders during a 120s window (named + unidentified hashes); bind payload identity from own-TX / empty-path echo so foreign GRP_TXT cannot lock the window (#908; supersedes the broken self-origin gate from #888)\r\n\r\n### Reticulum\r\n* Show identity hash (copy) in Network → Reticulum Identity (#900, #901)\r\n* Gate RRC connect on viable paths; idle TX queue UI; force path refresh / scaled TCP hops (#894)\r\n* BLE FC READY timeout (no longer freezes host TX) + RRC path rediscovery after idle empty slots (#898)\r\n* Harden propagation sync establish on dual-TCP paths (interface failover, cached paths, LRPROOF errors) (#892)\r\n* Games session refresh when sidecar API becomes ready (#887)\r\n* Avoid msgpack false-positives when loading raw identity keys (#898)\r\n\r\n### RRC (Reticulum chat)\r\n* Stick-to-bottom when pinned at chat end; follow pinned scroll when history is at cap (#902)\r\n* Clear unread badges when caught up at bottom; reactive active-room message subscription (#904)\r\n* Nicklist parity when hub `/who` exceeds Lin\n…"
