    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.28.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.29.0] - 2026-08-21\r\n\r\n**Video:** [https://www.youtube.com/watch?v=J0gTTdRBkzU](https://www.youtube.com/watch?v=J0gTTdRBkzU)\r\n\r\n### Highlights\r\n- **Reticulum:** Ratspeak-parity LXMF voice memos in DMs; hub TCP lockout / PN sync recovery UX; RRC WELCOME and reconnect thrash fixed.\r\n- **Meshtastic / MQTT:** Channel selection survives reconnect; MQTT→RF uses real channel hash (and correct default PSK expand); configure replay no longer marks the whole NodeDB as just heard.\r\n- **MeshCore / Connection:** BLE MAC on Radio Connection picker; sorted device pickers and Repeaters & Rooms columns; advert names stick; BLE reconnect / missing-services recovery hardened.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n---\r\n\r\n### Meshtastic\r\n* Chat stays on the selected channel after reconnect to the same node (#858)\r\n* Configure / NodeDB replay no longer stamps every node as just heard (#878)\r\n* MQTT encrypted publish stamps `MeshPacket.channel` with the real channel hash (not the local slot index); default PSK shorthand expands to firmware’s real key so MQTT→RF downlinks work (#876)\r\n* Post-configure `getMetadata` deferred so NodeDB flood is less likely to starve wifi/ethernet probes (#880)\r\n\r\n### MeshCore\r\n* Contacts show full long names (less aggressive truncation) (#877)\r\n* Live Room/Companion advert names persist (no rollback after path-updated / offload / MQTT placeholders) (#875, #877)\r\n* Repeaters & Rooms list fills leftover window height; columns sort (#875, #873)\r\n* BLE missing-services / reconnect recovery hardened; stale remembered BLE targets cleared (#877)\r\n* `meshcore.js` bumped to 1.15.0 (local patch rebased) (#882)\r\n\r\n### Reticulum\r\n* LXMF voice memos (record/play in DMs; Direct-only when too large for PN) (#869)\r\n* Hub TCP lockout explained; auto stack restart no longer worsens an IP block (#871)\r\n* PN sync stops cascading on NoLinkProof; Announce / Retry recovery UI (#881)\r\n* Ratspeak overlays rebased / regenerated; pathless-Link overlay sunset after upstream fail-closed Links (#870, #879)\r\n\r\n### RRC (Reticulum chat)\r\n* WELCOME can arrive (LinkSession initiator bind); dead-hub auto-join backs off; reconnect thrash reduced (#880)\r\n\r\n### App-wide / Connection\r\n* Radio Connection picker shows Bluetooth MAC (helps tell identical-labeled radios apart) (#874)\r\n* BLE/serial device pickers sort by signal / name (#873)\r\n\r\n### Full Changelog\r\n[`v5.28.0...v5.29.0`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.28.0...v5.29.0)"
  - version: v5.28.0
    name: 5.28.0
    datetime: '2026-08-16T20:04:22Z'
    url: https://github.com/Colorado-Mesh/mesh-client/releases/tag/v5.28.0
    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.27.1** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.28.0] - 2026-08-16\r\n\r\n### Highlights\r\n- **MeshCore:** Repeaters & Rooms ops in one place (CLI, ACL, admin passwords); room login/ACL/history catch-up fixed; Device User **Apply** works for MeshCore.\r\n- **Reticulum:** Real Ratspeak `.rsi` + raw identity backup/restore; live **Q** TX-queue header; RNode no longer flooded by link/announce rebroadcasts during PN Sync.\r\n- **RRC:** IRC-style slash commands inject the current room; optional all-room unread/sounds; unread badges respect whether RRC is actually focused.\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n---\r\n\r\n### Meshtastic\r\n* Quieter app logs: drop high-volume “encrypted data packet, ignoring” DEBUG spam on busy meshes (#844)\r\n* Radio → Device User / Identity **Apply** still uses Meshtastic `setOwner` (shared Apply path with MeshCore) (#861)\r\n\r\n### MeshCore\r\n* **Repeaters** is now **Repeaters & Rooms**: manage repeaters and room servers together (CLI, ACL `setperm`, Open room / Manage jump); Rooms tab stays BBS-only (#859)\r\n* Room CLI needs the saved **room admin** password (guest BBS login is not enough); separate admin secrets for repeaters vs rooms (#859)\r\n* Repeater/room CLI is more reliable under waiting-message drain contention (timeouts, reply correlation, cancel/coalesce races) (#859)\r\n* Firmware **clock cannot go backwards** surfaces as a toast; `clkreboot` stays behind a danger confirm (#859)\r\n* MeshCore **Open wire** / path-hash toggles live under **Radio** (so App settings saves no longer overwrite them) (#859)\r\n* Blank guest login sends a blank password (read-only when allowed), not a silent substitute of `\"hello\"`; clearer reject copy for blank vs `hello` vs other (#861)\r\n* LoginSuccess ACL uses the real `permissions` byte on companion v7+ (guest stays read-only even if you typed `hello`) (#861)\r\n* Cancel aborts the whole room login (path resolve, TX spacing, SendLogin)—not just the LoginSuccess wait (#861)\r\n* Sticky multi-hop UI no longer blocks real 0-hop SendLogin; first login catches up recent room history from the ring buffer (#861)\r\n* Radio → Device User / Identity **Apply** sets the MeshCore advert name (`setAdvertName`) (#861 / #860)\r\n* Live RF adverts show on-air names instead of `Node-XXXX` / pubkey-hash labels; tombstoned contacts revive when heard again (#861)\r\n\r\n### Reticulum\r\n* **Identity backup that actually restores keys:** Ratspeak-compatible encrypted `.rsi` export/import + official raw 64-byte identity export/import (legacy metadata-only backups rejected) (#843)\r\n* Identity export PIN errors show next to the PIN fields; raw export goes straight to save after a valid PIN (#845)\r\n* Header shows live local-RF TX queue **Q:used/max** (plus buffering spinner); BLE TX-drop alerts read as congestion/backpressure, not a broken link (#857)\r\n* PN Sync and other Link traffic no longer flood the RNode host TX queue (link packets stay on the proof/attached interface; pathless Link broadcasts skip RF) (#863, #864)\r\n* Mesh announce rebroadcasts skip flow-controlled RF sinks so overnight TCP announce storms don’t fill the RNode TX queue; local discovery announces still go out on RNode (#866)\r\n* Full / Roaming / Boundary with RMAP publish keeps the configured mode (`ignore_config_warnings`); **Effective: Access Point** badge when live runtime still diverges (#861)\r\n* Nomad page requests encode via upstream `nomad-core` (#865)\r\n* Ratspeak overlays rebased so release packaging applies cleanly on floated `origin/main` (#848)\r\n\r\n### RRC (Reticulum chat)\r\n* **App → Notifications → RRC unread for all room messages** (default on); turn off for IRC-style DMs/`@nick` only—hub notices never alert (#847)\r\n* Unread for the “active” room only suppresses when the RRC panel is actually focused (leaving RRC or switching protocol badges \n…"
