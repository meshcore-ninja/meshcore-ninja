    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n## [v5.37.1] - 2026-09-22\r\n\r\n### Highlights\r\n- **Reticulum (macOS BLE RNode):** Recover LTK / “Peer removed pairing information” desync without a false System Settings **Paired** state — OS unbond when possible, clearer Forget guidance, Admin Bluetooth focus, and Quit-safe exclusive GATT hold. (#1034)\r\n- **BLE coexistence:** Exclusive LoRa GATT pause is only for real bond recovery — a healthy online RNode no longer blocks MeshCore/Meshtastic BLE. (#1036)\r\n- **Meshtastic MQTT:** LongFast (and other public MQTT) stays on the correct Chat channel while RF channel configs stream in after a radio cycle. (#1035)\r\n- **Reticulum Chat:** Warn when a DM targets a stale MeshChatX-era LXMF instead of the current mesh-client identity. (#1033)\r\n- **Chat / MeshCore:** Jump to Latest clears when you reach the bottom; newly sent MeshCore messages match incoming replies/reactions. (#1029, #1028)\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **49** — unchanged from v5.37.0. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## Reticulum\r\n\r\n* **macOS LTK desync recovery** — classify Peer-removed / LTK errors; dispose the cached CoreBluetooth central during exclusive recovery; attempt OS unbond (`blueutil` on macOS by name/MAC; Windows UnpairAsync; Linux best-effort); clear sticky bond banners when the RNode comes online again; **Open Admin Bluetooth** scrolls to pairing controls. (#1034)\r\n* **Exclusive GATT hold** — only while bond recovery owns the adapter; healthy online RNode must not keep LoRa BLE paused (`rnode_bond_recovery`). (#1036)\r\n* **Stale MeshChatX LXMF** — surface LXMF/identity hashes on DM headers and a dismissible banner / toast when Chat would target an alternate dest from an older MeshChatX favorite. (#1033)\r\n\r\n---\r\n\r\n## Meshtastic\r\n\r\n* **MQTT channel keys** — merge-safe topic→index updates during partial channel-config streams so LongFast does not fall back to slot 0 (e.g. OnTrail); debounce renderer re-pushes while configs arrive. (#1035)\r\n\r\n---\r\n\r\n## MeshCore / Chat\r\n\r\n* **Reply matching** — keep the resolved MeshCore sender name on the optimistic live message so `@Name` replies and reactions find newly sent messages. (#1028)\r\n* **Jump to Latest** — use live scroll distance (and refresh after a no-op jump) so the button clears when the list is already at the bottom. (#1029)\r\n\r\n---\r\n\r\n## App-wide / packaging / CI\r\n\r\n* Ratspeak reviewed-ref **v1.0.32** (no Games API delta); routine npm dependency bumps. (#1037)\r\n* Third-party license table refreshed. (#1038)\r\n* Packaging sidecar Cargo dependency cache (~faster Windows x64 staging). (#1030)\r\n* Sidecar stale-binary regression tests use `Buffer.equals` so coverage CI does not time out. (#1032)\r\n\r\n### Full Changelog\r\n[`v5.37.0...v5.37.1`](https://github.com/Colorado-Mesh/mesh-client/compare/v5.37.0...v5.37.1)"
