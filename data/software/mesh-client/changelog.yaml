    url: https://github.com/Colorado-Mesh/mesh-client/releases/tag/v5.33.0
    prerelease: false
    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.32.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.33.0] - 2026-09-03\r\n\r\n### Highlights\r\n- **Meshtastic:** Catch up to **protobufs 2.8.0** — region / modem preset / role lists now come from the wire enums (this fixes writing the wrong preset or role to the radio), plus new telemetry fields, lockdown UI, and key-verification badges.\r\n- **MeshCore:** Add **channels from Chat**, send a **flood advert** from the header, and handle radio **contacts-full / contact-deleted** pushes (with optional auto-offload when the contact table is full).\r\n- **Reticulum:** Disabling or deleting an interface no longer leaves dead next-hop routes in the peer table; Noble BLE yield no longer resets MeshCore reconnect forever after the sidecar holds the adapter.\r\n- **Platform:** **Electron 44**, Flatpak launch/retry fixes for hardened Linux hosts, and **macOS 13 Ventura+** as the supported minimum.\r\n- **License:** Application source moves from MIT to **GPL-3.0-or-later** because the bundled Meshtastic libraries require it (details below).\r\n\r\n### Breaking Changes\r\n- **macOS 13 (Ventura) or newer** is required. Older macOS releases are no longer supported after the Electron 44 bump. (#926)\r\n- **License change (required by Meshtastic libraries):** mesh-client application source is relicensed from **MIT** to **GPL-3.0-or-later**.\r\n\r\n  We did not choose this for ideology alone. The Electron renderer bundles GPL-3.0-only `@meshtastic/*` packages (notably `@meshtastic/core`). Shipping those libraries under an MIT-licensed app was a license incompatibility. Relicensing the application source to **GPL-3.0-or-later** resolves that conflict and also aligns with the existing AGPL-3.0 Reticulum sidecar architecture. Written courtesy consent was recorded from all notified contributors (closes #933). Downstream redistributors and modifiers should treat the project as GPL going forward. (#937)\r\n\r\n### Database schema\r\nSchema **48** — unchanged from v5.32.0. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## License\r\n\r\n* Relicense application source **MIT → GPL-3.0-or-later** so the Electron shell matches the GPL-3.0-only `@meshtastic/*` stack bundled into the renderer. Docs, About UI, Flatpak `project_license`, CONTRIBUTING, Debian `copyright`, and the licenses checker were updated; AppStream `metadata_license` remains MIT. Contributor consent is documented in the PR. (#937)\r\n\r\n## Meshtastic\r\n\r\n* **Protobufs 2.8.0 catch-up** — region, modem preset, device role, rebroadcast mode, OLED type, and display unit lists are derived from generated enum descriptors instead of hardcoded tables that had drifted from the wire format.\r\n  - Selecting **Short Fast** previously wrote **`MEDIUM_SLOW`** to the radio.\r\n  - Role **4** was labeled “Client Base” but is the deprecated **`REPEATER`** slot; real **`CLIENT_BASE`** is 12 and **`ROUTER_LATE`** is 11.\r\n  - Region / preset ranges were short of the current proto (regions through 37, presets through 16).\r\n  - Translations are re-keyed by enum name, with a drift test that fails when a future bump adds an enum value without UI or i18n coverage. Hardware model names \n…"
