    notes: "## [v5.25.0] - 2026-07-31\r\n\r\n### Highlights\r\n- **Reticulum at scale:** local LXMF PN hosting, Direct→remote-PN delivery fallback, inbound LXMF recovery under announce/`wire_packet` storms, IFAC private networks, RMAP/RNCP hardening, and peer ceilings toward **100k**.\r\n- **Chat & App UX:** inline image embeds + YouTube previews, always-visible message actions, color save/restore, 24-hour clocks, Nomad page identity fixes and retries.\r\n- **Architecture:** Meshtastic/MeshCore packet ingress is PacketRouter-only with identity-store writes; pnpm 11 + Flatpak offline packaging; broad audit/security/i18n follow-ups.\r\n- **Polish:** RMAP **X of Y** publish status, RNCP unreachable-dest blocking + pending-offer UX, Linux Web Bluetooth chooser fix for AppImage/deb/rpm.\r\n- **Release tooling:** Safer pnpm 11 / hoisted-dedupe release path, MetaInfo version from `package.json`, and `pnpm run release --finish` recovery.\r\n\r\n### What's Changed\r\n\r\n### Reticulum — messaging & propagation\r\n- **Local PN hosting** — Announce, `/offer`/`/get`, autopeer, and persisted peering policy under Network → **Advanced PN hosting**, with enable/danger-zone confirms and TS↔Rust policy drift checks ([#731](https://github.com/Colorado-Mesh/mesh-client/pull/731))\r\n- **Direct→PN fallback** — One-shot deposit via preferred **remote** PN when Direct fails; Chat shows **Stored at propagation node**; link-timeout no longer races fallback to Failed; manual Retry reuses the failed bubble and keeps Completes green ([#725](https://github.com/Colorado-Mesh/mesh-client/pull/725), [#731](https://github.com/Colorado-Mesh/mesh-client/pull/731))\r\n- **Propagation sync reliability** — Pin PN identity during sync; LXMF delivery announce (+ settle / path refresh) before remote Sync; Establishing stall ~45s; auto-sync from last success with failure cooldown; clearer `NoLinkProof` / establish errors; mid-sync refresh keeps active attempt stamps ([#718](https://github.com/Colorado-Mesh/mesh-client/pull/718), [#720](https://github.com/Colorado-Mesh/mesh-client/pull/720), [#723](https://github.com/Colorado-Mesh/mesh-client/pull/723), [#731](https://github.com/Colorado-Mesh/mesh-client/pull/731))\r\n- **Discovered PNs** — Opt-in UI from `lxmf.propagation` announces (Add / Add & prefer); persist/rehydrate discovered public keys ([#718](https://github.com/Colorado-Mesh/mesh-client/pull/718), [#720](https://github.com/Colorado-Mesh/mesh-client/pull/720))\r\n- **Inbound LXMF under large meshes** — Stop live `wire_packet` WS flood; buffer + `GET /api/v1/lxmf/recent` catch-up on connect/reconnect/`events_lagged`; coalesce `announce.received` storms; Diagnostics `reticulum/announce-bus-pressure`; poll packets while Sniffer/Stats open ([#738](https://github.com/Colorado-Mesh/mesh-client/pull/738), [#739](https://github.com/Colorado-Mesh/mesh-client/pull/739))\r\n- **Large-mesh peers** — Toward 100k peer/destination caps; longer mega-mesh refresh; skip warm dumps; larger WS added batches; Probe/Path no longer force full path-table dumps; Peers panel cheaper prepares; shared `reticulum:proxy` cap 120→300/min with expected rate-limit backoff ([#745](https://github.com/Colorado-Mesh/mesh-client/pull/745))\r\n\r\n### Reticulum — interfaces, map, BLE, Remote, RRC\r\n- **IFAC private networks** — `network_name` / `passphrase` on add/edit; Advanced key=value editor; preserve unknown INI keys via `extra_config`; live stats merge keeps IFAC/seed fields for edit forms ([#722](https://github.com/Colorado-Mesh/mesh-client/pull/722), [#724](https://github.com/Colorado-Mesh/mesh-client/pull/724))\r\n- **Interface modes** — Docs for rnsd modes + in-UI `modeDescriptions` under Connection → Interfaces ([#708](https://github.com/Colorado-Mesh/mesh-client/pull/708))\r\n- **RMAP** — Discovery announce egress overlay so Boundary hubs (e.g. rmap.world) receive announces; Interfaces RMAP checkbox uses the same restart confirm as Network publish; persist announce interval / reachable / height prefs to SQLite; **X of Y** publishing covera\n…"
