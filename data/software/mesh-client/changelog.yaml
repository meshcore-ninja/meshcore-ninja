    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **54**\r\nLast official release: **v6.5.0** (schema **53**)\r\n\r\n## Database schema upgrade: 53 → 54\r\n\r\nInstalling and launching this build will upgrade the local SQLite database. You **cannot downgrade** to an older Mesh-Client that only supports the previous schema while keeping the same database.\r\n\r\nOn first launch, Mesh-Client shows a **Quit / Upgrade** dialog before changing the database.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.6.0\r\n\r\n### Highlights\r\n\r\n- **Find messages and stay organized.** Search across chat history, browse a unified inbox, pin or archive conversations, and schedule sends for when the radio is ready — on Meshtastic, MeshCore, and Reticulum.\r\n- **Richer maps.** Add your own XYZ basemaps or import MBTiles. Pop Live traffic out into its own window (Meshtastic and MeshCore can each keep one).\r\n- **Flash companion firmware from Admin** over USB for Meshtastic and MeshCore. Reticulum still uses the RNode flasher.\r\n- **Reticulum gets emoji reactions in RRC** (rooms and DMs), matching how reactions already work elsewhere — plus native LXMF file and photo attachments with progress and cancel.\r\n- **Quieter notifications.** Choose Mentions and direct messages instead of every message, and mute channels, DMs, MeshCore Rooms, or RRC rooms without hiding the history.\r\n- **TAK / MECP for field ops.** MECP reports show up as readable text in ATAK, open incidents appear as map markers, MAYDAY can sound ATAK’s emergency alarm, and MeshCore channel replies from ATAK use `@[Name]` form.\r\n- **Less memory growth on long sessions.** Live message ingest is capped so RF, MQTT, and LXMF traffic cannot keep growing past the load limit (memory-leak fix).\r\n\r\n### What's Changed\r\n\r\n#### Meshtastic\r\n\r\n- Global search, unified inbox, pin/archive, and scheduled send\r\n- Key verification dialog (firmware 2.7+), Cayenne LPP telemetry charts, and remote shell\r\n- Flash companion firmware from Admin over USB\r\n- Pop Live traffic out to a separate window\r\n- Mentions-only alerts and per-conversation mutes\r\n- Clearer “why is this unavailable?” hints on gated Admin actions\r\n- Pick LXMF / RRC rebroadcast targets for MECP when the Reticulum stack is running\r\n- TAK: readable MECP text, incident markers on the ATAK map, optional MAYDAY alarm\r\n- Reorder conversations by drag, keyboard, or A–Z\r\n- Docs links in Chat, Map, Settings, Connection, TAK, and firmware flash\r\n- Layers panel scrolls so custom map sources stay reachable\r\n\r\n#### MeshCore\r\n\r\n- Global search, unified inbox, pin/archive, and scheduled send\r\n- Flash companion firmware from Admin over USB\r\n- Pop Live traffic out to a separate window\r\n- **Keep open after adding** when batching new channels\r\n- **Sync chats from radio** to pull channels/contacts without wiping local history\r\n- BLE discovery even when a companion omits the NUS UUID from its advertisement\r\n- Mentions-only alerts and mutes (channels, DMs, Rooms)\r\n- Confirm before leaving a room; Rooms docs link in the list\r\n- TAK: typed `@Name` / `@@` replies from ATAK become MeshCore `@[Name]` replies; MECP text, incident markers, optional MAYDAY alarm\r\n- Docs links for Connection, MQTT auth, Rooms, and the rest of the shared panels\r\n- Conversation ordering shared with the other protocols\r\n\r\n#### Reticulum\r\n\r\n- Global search, unified inbox, pin/archive, and scheduled send\r\n- Emoji reactions in RRC rooms and RRC DMs (LXMF DMs already supported reactions)\r\n- Send files and photos over LXMF with progress and cancel\r\n- Nomad My Pages: visitor counts, plus an opt-in **Allow executable pages** switch (off by default; Unix only, unavailable on Windows)\r\n- Mentions-only alerts and mutes for DMs and RRC rooms (mutes follow destination remaps)\r\n- MECP rebroadcast to an LXMF peer or RRC room\r\n- Docs / troubleshooting links on the stack panel\r\n- Conversation ordering for LXMF and RRC lists\r\n- TAK: MECP text, incident markers, optional MAYDAY \n…"
