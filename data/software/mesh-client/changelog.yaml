    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **48**\r\nLast official release: **v5.31.0** (schema **48**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.32.0] - 2026-08-29\r\n\r\n### Highlights\r\n- **Reticulum:** In-app **Micron page editor** for Nomad My Pages, three new interface types (**Serial**, **AX.25 KISS**, **Local**) driven by a shared catalog, path-table clear, and blocklist import/export.\r\n- **RRC:** Reticulum page addresses and LXMF hashes are clickable, and the nicklist now resolves hashes to real names — cached in SQLite so they survive restarts and history clears.\r\n- **Games:** **Four in a Row** is playable end to end (board + challenge menus); previously these sessions rendered through a truncated Tic-Tac-Toe board.\r\n- **Meshtastic / MeshCore:** Radio settings no longer overwrite edits while you type, Apply results appear inline under the section you applied, and TCP heartbeat rejections are now diagnosable from a log alone.\r\n- **CI:** New **Buttonmash** renderer chaos-testing workflow, plus PR tests scoped to merge-base paths so pull-request runs are faster and narrower.\r\n- **Accessibility:** Adjustable **UI font size** in Appearance settings, applied across chat and RRC.\r\n- **Stability:** BLE connect can no longer wedge for the process lifetime, the app always quits after BLE shutdown, and stale MQTT clients can't tear down a healthy connection.\r\n\r\n### First-time contributor\r\n- Welcome **[M3SHGH0ST](https://github.com/cj-vana)** — first contributions to mesh-client, on the CI side: the Buttonmash renderer chaos-testing workflow (#910), scoping PR tests to merge-base paths with parallelized checks (#911), and fixing the renderer findings chaos testing surfaced (#913). Added to [credits](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/credits.md).\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **48** — unchanged from v5.31.0. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## Reticulum\r\n\r\n### Nomad\r\n* **In-app Micron page editor for My Pages** — hosting a Nomad site previously meant editing `.mu` files on disk in an external editor. My Pages now offers New / Edit / Delete on the hosted-page list, opening a split pane with raw Micron source plus a formatting toolbar on the left and a live preview on the right. Saves write into the watched folder, so the existing FS watcher re-indexes them. Authoring is gated on a configured content source rather than on active serving, since page mutations only need a live stack and resolved roots. File uploads and a local-files list remain intentionally absent. (#912)\r\n* Editor preview now renders through the same `nomad-micron-page` path as the Nomad browser, so previewed pages match what visitors see (#912)\r\n* **Security:** Micron page text is sanitized at the `innerHTML` sink rather than in a later whole-document pass — the three markup-building writes (text spans, style-run spans, link labels) route through `setSanitizedHtml`, closing CodeQL `js/xss-through-dom` for editor-sourced content (#912)\r\n* Sidecar `NomadError` values map to stable snake_case codes (`page_too_large`, `page_not_found`, `invalid_page_path`, `page_io_error`, `page_not_utf8`, `page_write_failed`) instead of stringified English prose, so write failures are translat\n…"
