    notes: >-
      ## Highlights


      A major reliability and parity release: virtualized chat scroll is stable on Windows/Linux,
      Windows on ARM gets dedicated installers and CI smoke tests, Meshtastic/MeshCore feature gaps
      close (MQTT proxy gateway, per-node key backup, flood scope), and identity-scoped stores no
      longer leave chat stuck after reconnect.


      ## Features


      ### Per-node key backup (#520, #521)

      - Encrypted backup/restore for **full public + private key pairs**, indexed per Meshtastic
      `nodeNum` and MeshCore `nodeId` (replaces single app-wide Meshtastic slot).

      - Shared **Key Backup / Restore** UI with **Restore from backup…** picker for factory reset /
      node-id changes; legacy `mesh-client:key-backup` migrates on first Security tab open.

      - MeshCore Security tab enabled for backup/restore, sign, export/import; restore syncs active
      MQTT identity.


      ### Meshtastic / MeshCore parity (#532)

      - **Meshtastic MQTT proxy gateway** — `MqttClientProxyMessage` bridge over local radio, broker
      `publishProxy` IPC, module-config auto-connect, Map Report module section, XMODEM on Radio
      tab, module debug status panels.

      - **MeshCore parity** — Regional flood scope (collapsible Radio section), TX Power with
      firmware max clamp, zero-hop advert + App auto-flood type, waiting-messages Chat badge,
      Sniffer transport/route legend.

      - **Remote-admin UI gating** — Hide local-only controls (XMODEM, MQTT proxy hint,
      DFU/OTA/factory reset) when **Configure node** targets a remote radio.

      - **Sniffer expand-row parity** — Meshtastic Raw Packet Log rows show legend hints and decoded
      `MeshPacket` details above hex, matching MeshCore.

      - **Chat transport badges** — Hybrid RF+MQTT messages show Wi‑Fi and globe icons side-by-side.


      ### UI & notifications (#522, #542, #549)

      - **Animated Lucide icons** (~140 inline SVGs → `lucide-react-motion`) with shared icon
      modules; **App → Appearance → Reduce motion** toggle suppresses decorative animation while
      keeping functional spinners and connection pulses.

      - **Identity-aware boot sequence** — Terminal-style splash on connect reflecting active
      identity, hardware, channels, and node sync before the protocol one-liner.

      - **Typed chat notification sounds** — Channel = single 880 Hz pulse; DM/reply = dual-tone
      chord; batch priority reply > dm > channel; App vs ChatPanel split avoids double beeps when
      backgrounded.


      ### MeshCore UX (#531)

      - Contact offload progress UI with cancel support during save/remove/reconcile.

      - RSSI/SNR metrics in node list and detail panel (capability-gated).

      - Rooms panel compact header toolbar; **Log in all** only targets rooms with saved passwords;
      per-view mute respected for background toasts/sounds.


      ## Bug fixes


      ### Chat scroll & virtualization (#535, #537, #539, #545–#547, #552, #562)

      - TanStack Virtual end-anchored chat/rooms with shared `chatScrollUtils` helpers; fixes
      Windows/Linux wheel jitter, unread-divider snap, virtual row overlap, and tab-return scroll
      jumps.

      - ResizeObserver 0×0 measurements on hidden tabs no longer corrupt row height cache.

      - Decoupled virtualizer scroll-end threshold (30px) from UI pin threshold (200px) to stop
      Windows bounce after dynamic content grows.

      - Scroll position restored on tab re-entry; pinned-to-bottom auto-scroll preserved.


      ### Identity & data integrity (#544, #561)

      - Startup DB repairs: stuck MeshCore room `sending` rows, orphan duplicates, MeshCore contact
      labels purged from Meshtastic node table, null inbound message status set to `acked`.

      - **Stuck chat after reconnect** — Live ingress vs offline identity bucket mismatch fixed;
      offline store slices merge on connect; **Copy Debug Snapshot** in App panel for support.

      - Meshtastic ingest skips saving MeshCore contact-type labels; shared
      `meshcoreContactHwLabels` constants.


      ### Windows packaging (#519, #534, #538, #550, #555–#560)

      - **Separate x64 and arm64 NSIS installers** (`Mesh-client Setup {version}.exe` and
      `-arm64.exe`) instead of broken universal installer.

      - NSIS payloads switched from 7z to **zip** for reliable

