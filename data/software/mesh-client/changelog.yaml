    notes: "<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://github.com/Colorado-Mesh/mesh-client/blob/main/docs/troubleshooting.md#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->\r\n\r\n<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **49**\r\nLast official release: **v5.37.1** (schema **49**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## [v5.38.0] - 2026-09-24\r\n\r\n### Highlights\r\n- **MECP (Mesh Emergency Communication Protocol):** Native compose, decode, severity alerts, durable audit log, and opt-in Meshtastic ↔ MeshCore RF rebroadcast. MAYDAY/URGENT siren bypasses mutes; drills never alert. (#1039)\r\n- **Notification tones:** App → Notifications → Notification tones — presets or import a short audio file per chat/MECP event, with preview, volume, and per-event reset. (#1042)\r\n- **Updater:** GitHub releases fetch no longer fails when responses arrive still gzip-framed (“Update check failed — check network connection”). (#1043)\r\n- **Flatpak:** MeshCore BLE works again — Reticulum sidecar execute bits are preserved so GATT scan/connect no longer hits `EACCES` / missing-project errors. (#1044, #1045)\r\n\r\n### Breaking Changes\r\n*(None)*\r\n\r\n### Database schema\r\nSchema **49** — unchanged from v5.37.1. No migration runs on upgrade.\r\n\r\n---\r\n\r\n## MECP\r\n\r\nEnd-to-end support for the upstream [MECP](https://mecp.radio/) wire format `MECP/<severity>/<codes> [freetext]` (vendored engine + language packs).\r\n\r\n* **Ingest** — Meshtastic RF/MQTT (including **`ALERT_APP` port 11**), MeshCore, and Reticulum messages are parsed in chat; history hydration does **not** re-siren or spam the audit log. (#1039)\r\n* **Alerts** — Severity **0** MAYDAY / **1** URGENT: loud siren + emergency toast (**bypass** global and conversation mute). **2** SAFETY / **3** ROUTINE: softer tone when unmuted. Drill codes (`D01`/`D02`) never alert; still audited when valid. (#1039)\r\n* **Compose** — App → MECP can show a Chat **MECP** button (default off) → severity + codes modal → send as normal channel/DM text (`TEXT_MESSAGE_APP`). (#1039)\r\n* **Audit log** — Durable `mecp-received.log` under app userData (rotated `.1`); **Export MECP log** from App → MECP; included in support bundles. (#1039)\r\n* **RF rebroadcast** — Opt-in rules (default **off**): Meshtastic ↔ MeshCore channel pairs, A→B by default, optional bidirectional; skips own / drill / MQTT-only / history; fingerprint TTL blocks ping-pong. No Reticulum bridge endpoints. (#1039)\r\n* **Reticulum (incidental)** — Stale MeshChatX alternate-LXMF banner dismiss persists across remounts and restarts. (#1039)\r\n\r\n---\r\n\r\n## Notifications\r\n\r\n* **Per-event tones** — Channel, DM, reply/mention, and all four MECP severities: choose a preset or import a short file (≤2 MiB / ≤10 s), preview, set volume, reset independently. Defaults stay the original tones. (#1042)\r\n* **Policy preserved** — Focus, mute, drill suppression, and dedup unchanged; MAYDAY/URGENT still bypass mutes (with a volume floor). Imports are copied into the profile so deleting the source file does not break alerts. (#1042)\r\n* **Platform chooser** — Native file dialog; macOS AIFF → WAV via `afconvert`; Linux WAV/MP3/Ogg/FLAC; macOS/Windows also AAC/M4A. (#1042)\r\n\r\n---\r\n\r\n## App-wide / packaging\r\n\r\n* **Updater** — Prefer identity encoding for GitHub release lists; detect leftover gzip magic and decompress before JSON parse. (#1043)\r\n* **Flatpak** — Preserve sidecar `+x` through \n…"
