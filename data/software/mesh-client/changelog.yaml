    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **52**\r\nLast official release: **v6.2.0** (schema **52**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n---\r\n\r\n## mesh-client v6.3.0\r\n\r\n### Highlights\r\n\r\n- **Offline chat translation:** Chat, MeshCore Rooms and RRC messages get a **Translate** action. Translation runs on your machine with downloadable language packs. It is off by default, and you can optionally use a LibreTranslate server instead.\r\n- **MeshCore repeater and room configuration:** a new **Configure** panel lets you read and edit identity, location, radio, routing and room access settings without typing CLI commands.\r\n- **Delivery you can trust:** MECP emergency reports keep retrying until the mesh acknowledges them, not just until the radio accepts them. Failed chat messages are resent automatically up to 3 times.\r\n- **EMCOMM monitoring stations:** an opt-in standing alert for unseen MAYDAY/URGENT reports, an incident event timeline, JSON/CSV incident log export, and tools to block emergency spam.\r\n- **TAK:** richer relayed CoT, unit filters, `!MT1` trackers, MeshCore and Meshtastic channels mirrored into GeoChat, and several fixes that make ATAK connect and stay connected.\r\n- **Reticulum:** mesh-client no longer attaches to another app's shared instance. Instead it can share its own instance with Sideband, NomadNet and MeshChatX.\r\n\r\n---\r\n\r\n### Meshtastic\r\n\r\n**Bug Fixes**\r\n\r\n- A failed Store & Forward history request is no longer treated as a failed chat message. Previously it could mark an unrelated message as failed and request node info for the wrong node (#1186)\r\n- Removed the burst of about 250 \"Received Node Info packet\" log lines on every connect (#1186)\r\n\r\n### MeshCore\r\n\r\n**Features**\r\n\r\n- Repeater and room configuration panel (#1187, #1190):\r\n  - **Configure** in the repeater and room row menus, and from **Rooms → Manage**.\r\n  - Edit identity and location, radio parameters, and routing/adverts. Rooms also get guest access and ACL controls. Advanced settings stay in the CLI.\r\n  - Edits are validated before sending. Only changed settings are written, and each one is checked by reading it back. A rejected or interrupted save keeps your edits. Radio changes show a reboot notice, and rebooting stays an explicit, confirmed action.\r\n  - Each section has a description, edited fields are marked, and section headers show how many changes are pending. Passwords and private keys are hidden in the CLI history.\r\n\r\n**Bug Fixes**\r\n\r\n- A rebooted repeater no longer jumps to \"220d ago / Offline\" while it is being heard live. \"Last heard\" now uses the time the packet was received, and an older timestamp never overwrites a newer one (#1194)\r\n- Connecting no longer stalls for minutes when contact loading hangs. The stall is detected and the connection retried about 35 seconds sooner (#1186)\r\n- MeshCore MQTT no longer gets stuck reconnecting at \"attempt 1/3\" when the broker drops before the connection is confirmed (#1198)\r\n\r\n### LoRa BLE (Meshtastic + MeshCore)\r\n\r\n**Bug Fixes**\r\n\r\n- Linux: a MeshCore BLE connect timeout from the Bluetooth stack is now retried once and shows the BLE timeout guidance instead of a raw `connect_timeout` error (#1180)\r\n\r\n### Reticulum\r\n\r\n**Features**\r\n\r\n- Shared instance handling (#1182):\r\n  - mesh-client never joins another app's Reticulum instance (such as a system `rnsd`), because its routing and BLE features need mesh-client to own the transport.\r\n  - If another app already holds the shared port, mesh-client runs standalone and explains why. The explanation appears in a Connection banner, a Diagnostics row, the setup guide and the Share toggle.\r\n  - The setup guide warns when another Reticulum app is running and lists the serial ports it is configured to use.\r\n  - **Network → Show settings for other apps** gives a copyable `[reticulum]` snippet so Sideband, NomadNet and MeshChatX can attach to mesh-client.\r\n\n…"
  - version: v6.2.0
