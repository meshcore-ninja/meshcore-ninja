    prerelease: false
    notes: "<!-- mesh-client-schema-compare -->\r\n# Release build — database schema check\r\n\r\nThis build schema: **55**\r\nLast official release: **v6.11.0** (schema **55**)\r\n\r\nNo schema bump vs last official release.\r\n<!-- mesh-client-schema-compare -->\r\n\r\n## mesh-client v6.11.1\r\n\r\n### Highlights\r\n\r\n- **MeshCom chat identity & echoes.** Own outbound messages stay under your callsign (not Node 0 / `\"00\"`) when identity arrives after the first send, and local TX echoes are no longer shown as a second inbound bubble. The map no longer shows a Node-0 self ghost before identity is known.\r\n- **MeshCom Serial connect.** When no MeshCom-scoped port matches, the Web Serial chooser opens instead of failing with `SERIAL_NO_MATCH` (fixes empty MeshCom history after a shared/global last port from another protocol).\r\n- **Chat focus polish.** Selecting a channel pill focuses the composer for typing; MeshCore Add Channel with Keep open keeps the Name field focused after Save.\r\n\r\n### What's Changed\r\n\r\n#### MeshCom\r\n\r\n- Stamp early outbound self and persist chat under offline identity so the first send is not left as `from:0` / `\"00\"`\r\n- Filter own TX echoes so channel sends show a single outbound bubble\r\n- Sync `myNodeNum` from owner/callsign; skip Map self-fallback while still Node 0\r\n- Open the Web Serial port chooser when MeshCom has no matching saved port (#1561 / #1562)\r\n\r\n#### Chat / MeshCore\r\n\r\n- Focus the message composer after selecting a channel pill (all protocols) (#1562)\r\n- Keep Add Channel Name focused after keep-open Save (#1564)\r\n\r\n#### Security / CI\r\n\r\n- Sanitize e2e radio fixture socket errors for CodeQL (#1563)\r\n\r\n### Bug Fixes\r\n\r\n* stamp early outbound self and persist chat under offline identity\r\n* keep Add Channel focused after keep-open Save (#1564)\r\n* sanitize e2e radio fixture socket errors for CodeQL (#1563)\r\n* serial chooser, TX echo filter, and channel composer focus (#1562)\r\n\r\n### Breaking Changes\r\n\r\n*(None)*\r\n\r\n### Full Changelog\r\n\r\n[`v6.11.0...v6.11.1`](https://github.com/Colorado-Mesh/mesh-client/compare/v6.11.0...v6.11.1)\r\n\r\n<!-- mesh-client-macos-install -->\r\n### macOS install\r\n\r\n- Requires **macOS 13 Ventura** or later (Electron 44).\r\n- **Recommended:** open the **`.dmg`** and drag **Mesh-client** to **Applications**.\r\n- If you use the **`.zip`**: extract with **[Keka](https://www.keka.io/en/)** or `ditto -xk` — **do not use 7-Zip** (or Finder Archive Utility); they break framework symlinks and can crash at launch with `Library not loaded: Squirrel.framework`.\r\n- See [troubleshooting](https://colorado-mesh.github.io/mesh-client/troubleshooting/#macos-library-not-loaded-squirrelframework-after-zip-extract) if the app will not open after a ZIP extract.\r\n<!-- mesh-client-macos-install -->"
