      # MeshMonitor v4.15.0


      A large feature release with **no breaking changes**. MeshMonitor 4.15 reaches past Meshtastic
      and MeshCore to a third network, adds tools to plan and survey RF coverage, and tells you far
      more about what happened to every message you send. Reticulum joins as a first-class monitored
      network — LXMF messaging, position and telemetry, own-mode radio, and full topology / remote
      monitoring. A new predictive RF coverage model and Site Planner estimate a node's reach from a
      Fresnel-zone + path-loss model, while a passive network survey derives reach, neighbours, and
      hop distribution from traffic you already received. Click any message for Delivery Details:
      the exact routing result, a per-message event timeline, and a Heard-By correlation of which
      nodes relayed it. Maps gain 3D terrain across every surface with markers that match the 2D
      view, a GNSS satellite overlay, and a hybrid satellite tile. Rounding it out: a Prometheus
      metrics endpoint, Node Status Messages, telemetry CSV export, completed MeshBeacon + XEdDSA
      support, and a long list of fixes.


      Full notes live in the
      [CHANGELOG](https://github.com/Yeraze/meshmonitor/blob/main/CHANGELOG.md).


      ## Features


      - **Reticulum network support** — LXMF messaging, position/telemetry, own-mode radio, and
      topology / remote monitoring (#3960)

      - **Predictive RF coverage & Site Planner** — Fresnel-zone + path-loss model, sweep, API, and
      map layer (#4727, #4741, #4746)

      - **Passive network survey** — reach, neighbours, and hop distribution from received traffic
      (#4726, #4737)

      - **Message Delivery Details** — RoutingError codes, per-message timeline, Heard-By
      correlation (#4816, #4837, #4839, #4841, #4842, #4855)

      - **3D maps** — terrain on all map surfaces + 2D-matching node markers with clickable popups
      (#4704, #4808)

      - **GNSS satellite constellation overlay** — sky plot + DOP map (#4729)

      - **Satellite + labels (hybrid) map tiles** (#4728)

      - **Prometheus metrics endpoint** (#4757)

      - **Node Status Messages** — receive + display (#4818)

      - **MeshBeacon** — completed MeshBeacon + XEdDSA, invitation card, broadcast interval /
      transmit region config (#4689, #4723, #4735, #4802)

      - **Telemetry graph CSV export** (#4771)

      - **Automation additions** — Run Now, waypoint-anchored geofence, triggering message in the
      run log (#4827, #4722, #4716)

      - **Map & node-list** — non-linear age filter, Uptime sort, incomplete-NodeInfo badge (#4770,
