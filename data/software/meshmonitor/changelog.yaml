      # MeshMonitor v4.17.2-rc8


      > ⚠️ **Pre-release (release candidate).** For testing only — do not point a production
      deployment at this build. Please report anything that looks off.


      This eighth release candidate for 4.17.2 adds a few MeshCore and Reticulum conveniences on top
      of the security and reliability work from the earlier RCs. MeshCore repeaters get a one-click
      **discover.neighbors** button in Remote Admin (repeater-only, receive-only gated). The
      Automation Engine can now **send and reply over Reticulum (LXMF)**, including replying to the
      triggering message, with clear skips where a send doesn't apply. A **TX-safety regression is
      fixed**: a receive-only radio no longer reads as transmit-enabled after a reconnect, so a LoRa
      save can't silently re-enable TX. Proxy-signed-in users are now recognized on the very first
      auth-status request. MeshCore no longer crashes on room posts arriving from serial or TCP
      radios. Reticulum also gains an RNode interface-status panel, a position-free Connections
      topology view, a Pin sidebar control, and the Unified map can now colour node markers by
      source. Rounded out with the usual translation and dependency updates (including croner 11).


      ## Features

      - **MeshCore:** `discover.neighbors` quick-action button in Remote Admin for repeaters (#6146,
      closes #3351)

      - **Reticulum:** send and reply over Reticulum (LXMF) from the Automation Engine (#6145,
      closes #6143)

      - **Reticulum:** RNode interface status on the Info page + battery/Ch/Air in the header
      (#6131, closes #6120)

      - **Reticulum:** position-free Connections topology view on the Map page (#6130, closes #6119)

      - **Reticulum:** Pin sidebar control in the main nav (#6126, closes #6118)

      - **Map:** colour node markers by source on the Unified / Map Analysis map (#6129, closes
      #6125)


      ## Bug Fixes

      - **meshtastic:** default `lora.txEnabled` to false when a device config omits it — fixes a
      receive-only radio reading as TX-enabled and a LoRa save re-enabling TX (#6144, closes #6142)

      - **auth:** recognize proxy-signed-in users on the first `/auth/status` request (#6031)

      - **meshcore:** stop crashing on room posts delivered from serial and TCP radios (#6122)

      - **messages:** unread DMs sort to top of the conversation dropdown, stable while open; fixes
      iOS scroll jump (#6128, closes #6115, #6116)

      - **meshcore:** channel auto-scroll to new messages + scroll expanded repeater list into view
      (#6127, closes #6124)


      ## Docs

      - Blog post previewing the 4.17.2 security hardening and reliability fixes (#6117)


      ## Dependencies

      - croner 10 → 11 (#6141), react-i18next (#6139), lucide-react (#6138), maplibre-gl (#6137),
      @tanstack/react-query (#6135) + devtools (#6140), rollup platform binaries (#6134, #6136),
      @types/node (#6132), production-dependencies group — 8 updates (#6133)


      ## Translations

      - Hosted Weblate update (#6020)


      ## Issues Resolved

      #3351, #6143, #6142, #6125, #6124, #6120, #6119, #6118, #6116, #6115


      ## Contributors

      Thanks to external contributors this cycle: @enricolorenzoni59 (first contribution — #6122)
      and @geirgp (#6031).


