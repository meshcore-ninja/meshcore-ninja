      # MeshMonitor v4.18.1-rc4


      > ⚠️ **Pre-release.** This is a release candidate for testing. Don't run it in production
      unless you're ready to report problems.


      This release candidate adds firmware tracking (#4943). Each source now has its own release
      channel and custom URL. MeshCore sources may use stable or alpha only. A new admin-only
      **Firmware Status** report under Analysis & Reports compares each radio's firmware with the
      newest release, including MeshCore companion, repeater and room-server releases. MeshCore
      repeaters and room servers get a guided **Start OTA mode** button in remote admin. It sends
      `start ota` only after the typed-name confirmation, then explains the next steps for ESP32
