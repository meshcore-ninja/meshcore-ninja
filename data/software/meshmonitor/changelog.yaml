      **stale local node number** (spawning an unpurgeable phantom duplicate and breaking MQTT),
      three mobile/PWA/desktop **map & modal CSS quirks**, and a **MQTT device-telemetry**
      node-metrics refresh. Rounded out with dependency bumps (`pg`, `lucide-react`, dev tooling),
      the mesh-impact checklist added to contributor guidance, and updated translations. No database
      migrations or schema changes.


