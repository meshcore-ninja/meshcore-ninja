      # MeshMonitor v4.18.1-rc3


      > ⚠️ **Pre-release.** This is a release candidate for testing. Don't run it in production
      unless you're willing to report issues.


      ## Summary


      MQTT source cards now show an icon for the direction traffic flows: monitor only, uplink,
      downlink, both ways, local only, or a node's client proxy. Hover the icon for a plain-language
      explanation. The source unread badge can optionally count channel replies and tapbacks.
      MeshMonitor now refuses to save an `mqtt_broker` source with a missing port, credentials or
      gateway identity, because the broker would crash on start with that config. On SQLite, read
      state is stored per user again, so one user reading a message no longer stops other users from
      marking it read. The LXC `meshmonitor-update` script no longer leaves the app down when an
      update fails, and its build now checks available memory.


      ## Features

      - MQTT source cards show a traffic-direction icon (#5794 Phase 2) #6510

      - Unread indicator can count channel replies and tapbacks (#5254) #6504


      ## Bug Fixes

      - Refuse an `mqtt_broker` config the broker can't start with #6511

      - SQLite read rows are per user, so one user's read no longer blocks others (#6505) #6508

      - LXC: `meshmonitor-update` never leaves the app down; the build checks available memory #6503
      (thanks @BeerMan81)


      ## Documentation

      - Add MeshRadio Online to the Site Gallery (#6506) #6507 #6509


      ## Issues Resolved

      - #6505 SQLite read_messages keyed by message_id alone: one user's read blocks every other
      user's mark-read

      - #5254 Unread indicator: optionally count channel replies and tapbacks

      - #6506 Site Gallery Submission


      **Full Changelog**: https://github.com/Yeraze/meshmonitor/compare/v4.18.1-rc2...v4.18.1-rc3


