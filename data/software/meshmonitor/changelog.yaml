    notes: >-
      # MeshMonitor 4.16.1


      A patch release in name, a substantial one in content: 50 changes since 4.16.0, across six
      release candidates.


      It closes a **cross-source message leak** — three message endpoints checked permissions
      without a source id, so a read grant on any one source returned another source's messages. If
      you run a multi-source install with per-source permissions, upgrade. Alongside that, firmware
      can now be flashed from a `.bin` on disk or a custom URL, settings gained a search that spans
      every page, waypoints can raise arrival alerts, and the Scripts gallery reports which of your
      installed scripts have a newer release. MeshCore gets a run of reliability fixes: retries no
      longer read as duplicate messages, `lastHeard` only moves forward, and a stuck radio op can no
      longer park the operation chain.


      ## ⚠️ Security


      **Cross-source message leak (#5225, #5227).** `GET /api/messages`, `GET
      /api/messages/channel/:channel` and `GET /api/messages/unread-counts` checked permissions with
      **no source id at all**, then answered for the caller-supplied `?sourceId=`. A `messages:read`
      grant on any one source therefore returned another source's messages — bodies included on the
      first two, counts on the third. All three now scope the check to the requested source.


      This affects deployments that use per-source permissions to separate what different users can
      read. A single-source install, or one where every user can read every source, is not exposed.
      No credentials or keys were involved.


      ## Features


      - Configuration search, within a page and across all of them (#5182, #5226)

      - Waypoint arrival alerts with a configurable radius and dedupe (#4750, #5228)

      - Flash a `.bin` uploaded from disk (#5249, #5252), and make a custom firmware URL an actual
      install target (#5011, #5257)

      - Script update checks — versions read from the author's `mm_meta`, with install-on-request
      (#5255, #5272, #5274)

      - `@` mention autocomplete and chips in conversations (#5276, #5280)

