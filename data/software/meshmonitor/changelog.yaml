      # MeshMonitor v4.15.2-rc9


      > ⚠️ **Pre-release** — this is a release candidate. Please test in a non-production
      environment first and report issues.


      ## Summary


      This RC focuses on the Mesh Issues report and key-security correctness. The report page gets a
      full reorganization — a dashboard-style landing, sortable per-type tables, a by-node view, and
      bulk actions — plus a new test-reference doc explaining every A1/B2/C3 designator. Node
      references in findings are now clickable everywhere they appear (headers, member chips,
      "shared with" lists), open the DM thread on the right source, and a source picker fires when a
      node exists on multiple sources. B1 Router Cluster is tightened twice: it now requires the
      members' non-cluster clients to overlap significantly (a well-sited backbone stops flagging as
      redundant), and edges must be within the configurable distance guard so MQTT can't glue
      routers 100+ km apart into one finding. On the C1 side, source-blind reads in the key-mismatch
      path were producing false-positive `keyMismatchDetected` warnings and leaving old flags stuck
      forever; both are fixed, and migration 155 cleans up the stale rows. The 2.8-firmware renumber
      suppressor now also fires on a temporal-handoff signal, catching the MQTT-replay case where a
      gateway keeps rebroadcasting a node's pre-2.8 identity. Long free-text cells in the report now
      wrap at 28rem instead of stretching the table into horizontal scroll. Elsewhere: MQTT
      violations no longer false-positive on private brokers, MeshCore neighbours show a real "last
      heard" age, map-analysis trails render cleaner and autozoom correctly, measuring distance no
      longer intercepts map panning, and Indonesian joins the language picker.


      ## Features


      - feat(i18n): ship the Indonesian translation and offer it in the picker (#5003)

      - feat(mesh-issues): clickable node references with source picker + Details-column wrap + 2.8
