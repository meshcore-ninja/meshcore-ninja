      # MeshMonitor v4.18.1-rc5


      > [!WARNING]

      > This is a pre-release for testing. It may contain bugs; don't run it on a production
      instance you can't roll back.


      ## Summary


      This RC finishes the MeshCore parity follow-ups (#6341) and adds two MQTT-observer features.
      New-node alerts now cover MQTT feeds: Meshtastic MQTT bridge/broker sources (previously
      uncapped) and MeshCore MQTT feeds both use the existing 48 h learning window and
      10-alerts-per-hour cap, and MeshCore feeds alert only on adverts whose signature verifies.
      Reticulum sources get a Notifications tab with DM mutes and click-through, capped
      new-destination alerts and bridge connection-lost alerts. MeshCore "Send as" names now work on
      timers, Auto Responder, Auto Announce, the Automation Engine and the channel composer.
      Clock-out-of-sync detection now covers Meshtastic nodes (live LoRa packets) and MeshCore MQTT
      feeds (when two observers agree). The device and MQTT paths for MeshCore channel messages now
      share one store. On the fix side, a MeshCore channel reorder now carries notification
      preferences with it, and MySQL databases could store only one notification-preference row per
      user across all sources; migration 243 fixes that. MeshCore status-bar controls are hidden
      from viewers without `connection:write`, and the MQTT ingest page scrolls again.


      ## Features

      - feat(notifications): gated new-node alerts for MQTT feeds (#6536)

      - feat(reticulum): Notifications tab, bridge link alerts, gated new-destination alerts (#6537)

      - feat(meshcore): 'Send as' on automated sends and the channel composer (#6538)

      - feat(clock): out-of-sync samples for Meshtastic and MeshCore MQTT feeds (#6539)

      - feat(meshcore-mqtt): observer battery/uptime history and location override for ingest
      sources (#6533)

      - feat(meshcore-mqtt): mark one observer as "My node" on an ingest/broker source (#6534)


      ## Bug Fixes

      - fix(meshcore): channel reorder moves notification prefs; MySQL per-source prefs (#6535)

      - fix(meshcore): hide status-bar controls from viewers without connection:write (#6525)

      - fix(meshcore): let the MQTT ingest source page scroll (#6530)


      ## Refactoring

      - refactor(meshcore): one channel-text store for device and MQTT feeds (#6540)


      ## Issues Resolved

      - #6341 MeshCore parity: deferred follow-ups from #6226

      - #4943 OTA Firmware Manager for Meshtastic & MeshCore (phases 1 and 2 shipped in earlier RCs)

      - #6532 MeshCore MQTT ingest/broker: mark one observer as "my node"

      - #6531 MeshCore MQTT observers: battery telemetry history and a manual position

      - #6527 MeshCore MQTT ingest source page: tabs cannot scroll vertically

      - #6524 MeshCore action buttons visible to unauthenticated guests


      ## Upgrade notes

      - **New alerts after upgrade.** New-node alerts default on. Existing MeshCore MQTT feeds start
      alerting on new keys right away (max 10/hour per source). Reticulum users whose mesh-wide
      default has new-node alerts on start getting capped destination alerts. Turn either off per
      source in the Notifications tab.

      - **Meshtastic MQTT new-node alerts are now capped** at 10/hour per source; over-cap alerts
      are dropped and the next one ends with "(+N more new nodes since the last alert)". Meshtastic
      TCP sources are unchanged.

      - **Automations on MeshCore MQTT feeds** now skip messages from this install's own radio names
      or recent "Send as" names unless "include self" is on.

      - **MySQL:** migration 243 drops a leftover single-column unique index on
      `user_notification_preferences.userId`.


      **Full Changelog**: https://github.com/Yeraze/meshmonitor/compare/v4.18.1-rc4...v4.18.1-rc5


