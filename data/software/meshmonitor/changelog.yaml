      - #5493 [BUG] Web Push subscription state leaks across sources (subscribe indicator +
      unsubscribe delete)

      - #5496 MeshCore repeater Configuration page shows defaults for TX power / preset /
      coordinates

      - #5498 [BUG] MeshCore telemetry duration selector hidden when current window has no data


      Partially addressed: #5248 (AEAD channels): Phase 1 ships here; Phase 2 waits for a firmware
      2.8.1 build.


