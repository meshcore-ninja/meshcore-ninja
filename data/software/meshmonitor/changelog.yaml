      # MeshMonitor v4.17.0


      ## Summary


      v4.17.0 is the full release after nine release candidates: 64 features and 64 fixes since
      v4.16.2. MeshMonitor now works out when several of your sources heard the same packet, and
      uses that for "heard here" map edges, merged rows and an **All Channels** view in Unified
      Messages, and one notification per packet. MeshCore gains **Trace SNR history** with full
      charts, a **Mentions** notification, a server-side channel database, and Repeater sources that
      fill Nodes, Packet Monitor and channel Messages. Scheduled automations can carry a start, an
      end and a time zone, with a five-minute minimum interval. **Reliable PKI**, **Avoid PKI**,
      "Proven receipt" and a Protection Level picker extend key handling. The **Docker image is
      hardened**: every process runs as `node`, development packages no longer ship, and the image
      is a third smaller. **Per-source permissions are now checked on every route**, and system
      backup download is admin only. Migrations 183 to 202 run on first start.


      Read more: [release post](https://meshmonitor.org/blog/2026-10-12-v4.17.0-release) · [security
      post](https://meshmonitor.org/blog/2026-10-12-docker-image-hardening) ·
      [CHANGELOG](https://github.com/Yeraze/meshmonitor/blob/main/CHANGELOG.md)


      ## Upgrade Notes


      - **Back up first.** Migrations 183 to 202 run on first start.

      - **Docker.** The first start fixes the ownership of `/data` once. A root start with
      `cap_drop: [ALL]` now fails: set `user: "1000:1000"` as well. With `user:`, serial devices
      need `group_add`. `RUN_AS_ROOT=true` restores the old process users for troubleshooting.

      - **Non-admin users may lose access.** A user needs the grant on the source a request acts on.
      Grant it on that source under Users. For a public map with route lines, grant
      `traceroute:read` to the anonymous account.

      - **Backups** now hold channel keys and password hashes. Only an admin can download one.

      - **Notifications.** A source you never saved settings for notifies for direct messages only,
      with Apprise off until you add URLs. New-node and traceroute alerts default to off.

      - **Automations.** A scheduled rule faster than every 5 minutes keeps running but must be
      slowed before it can be saved again (scheduled MeshCore path traces are exempt). A send whose
      text renders empty is skipped.

      - **Auto-Acknowledge** on a channel answers 5 to 30 seconds late, and not at all once two
      other nodes have answered.

