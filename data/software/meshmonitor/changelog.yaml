      - node-notifier 11.0.0 → 12.1.0 #6297

      - production-dependencies group (8 updates) #6325

      - jsdom 30.1.3 → 31.0.0 #6294

      - i18next-browser-languagedetector 8.2.3 → 8.3.0 #6299

      - @tanstack/react-query 5.105.0 → 5.107.1 #6301

      - docker/login-action 4.7.0 → 4.8.0 #6290


      ## Issues Resolved

      #6226, #6265, #6267, #6271, #6272, #6273, #6274, #6278, #6282, #6287, #6303, #6304, #6308,
