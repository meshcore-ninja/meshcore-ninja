    notes: >-
      # MeshMonitor v4.13.0


      MeshMonitor 4.13.0 is the largest release of the 4.x line, stabilized through three release
      candidates. The headline is the **Map Consolidation epic**: every map surface — Dashboard,
      Nodes, Map Analysis, MeshCore, Unified, and embeds — now shares one rendering core, one layer
      library, and one popup family, so features and fixes land everywhere at once. On top of that
      come node selection and Follow mode, a distance-measurement tool, a polar grid overlay, and a
      long list of map interaction fixes. MeshCore gains message delete/purge, automatic send
      retries, Auto-Pathfinding target filtering, a configurable CLI timeout, and a completed
      Virtual Node command surface. Automations pick up multi-channel triggers, a scheduled
      device-reboot action, and per-source tapback routing. The long-standing "low-battery alerts
      silently never fire" bug — reported five separate times — is fixed at its root. Under the
      hood, a major architecture remediation unified the source-manager registry, moved fresh
      installs to migration-replay bootstrap, and deleted the legacy synchronous database API. Three
      deliberate breaking changes ship in this release: auto-upgrade is retired, `TRUST_PROXY`
      defaults to `false`, and source-scoped API endpoints require an explicit `sourceId` — see
      Upgrade Notes below. Docker users: `:latest` now only moves on stable releases like this one;
      RCs publish to `:dev`.


      📖 [Release
      announcement](https://yeraze.github.io/meshmonitor/blog/2026-07-15-v4.13.0-release) · [Full
      changelog](https://github.com/Yeraze/meshmonitor/blob/main/CHANGELOG.md)


      ## Features


      **Maps**

      - Map Consolidation epic: shared BaseMap shell, layer library, unified node-marker factory,
      one popup family, canonical traceroute rendering on all maps including embeds — #4049, #4051,
      #4057, #4060, #4064, #4065, #4066, #4067, #4068 (epic #4047)

      - Node selection, emphasis & Follow mode with auto-zoom on Map Analysis — #4010, #4012 (#3788)

      - Node-to-node line-of-sight distance measurement tool on all maps — #4013 (#3636)

      - Polar grid overlay (Map Analysis, Unified, MeshCore) — #3983, #4071 (#3971)

      - Pan/zoom/spiderfy interaction polish: zoom clamp, scaled animations, zoom-gated spiderfy —
      #4072 (#4046)


