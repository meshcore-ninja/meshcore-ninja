      (#5300), emoji-picker-react 4.22.2 (#5297)

      - docker/build-push-action 7.4.0 (#5307), docker/setup-buildx-action 4.4.1 (#5306),
      docker/setup-qemu-action 4.4.0 (#5305), codeql-action group (#5304)

      - Dev dependencies: puppeteer 25.11.0 (#5298), vitest group (#5294),
      @tanstack/react-query-devtools (#5302), production and development dependency groups (#5296,
