      # MeshMonitor v4.13.3-rc3


      > ⚠️ **Pre-release.** This is a release candidate for testing. It does not carry the `:latest`
      Docker tag. Run it in production only if you are ready to report bugs.


      ## Summary


      This candidate closes out two epics and sweeps up the defects they exposed. The traceroute
      epic gains a **statistical route view**: route segments now aggregate across many traceroutes,
      a union layout engine draws the merged graph, and the result renders in the Node Details
      strip. The strip also picks up interactive node popups, link tooltips, Copy
      Forward/Return/Both text links, and a participation picker that finally brings the strip to
      MQTT sources. The **per-source settings** epic (#4412) lands in three phases — backend
      foundation, per-source reads, then the frontend — and ends with MeshCore node-age filtering
      built on top of it.


      That second epic uncovered a cluster of permission bugs worth calling out. Two divergent
      source-scoped resource lists meant per-source scoping was silently ignored for `settings`,
      `dashboard`, `info`, `audit`, and `security` (#4416), and new-user default grants were written
      globally when four of six are per-source resources, leaving them inert (#4448). Both are
      fixed. On the data side, Meshtastic 2.8's periodic rebroadcast of cached packets was inflating
      node "Last Heard" (#4192), and nodes without a real fix were appearing on the map — position
      estimates built from a single anchor are now excluded by default (#4450). MeshCore gets guards
      against overlapping auto-pathfinding calls and a DM permission leak to anonymous users.


      ## Features


      - Statistical route aggregation + union layout engine (traceroute epic phase 1) — #4444

      - Statistical route view in the Node Details strip (phase 2) — #4451

      - Interactive strip: node popup More Details action + link tooltips — #4424

      - Participation picker on all sources, bringing the strip to MQTT — #4427

      - Copy Forward/Return/Both text links, with an insecure-context fallback — #4429

      - Per-source settings foundation and guardrails (#4412 phase 1) — #4417

      - Read Node Display settings per-source (phase 2) — #4425

      - Per-source Node Display frontend (phase 3) — #4431

      - MeshCore per-source node-age filtering and Node Display settings — #4433


