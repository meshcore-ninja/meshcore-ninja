      # MeshMonitor v4.14.2-rc7


      > ⚠️ **Pre-release (release candidate).** For testing ahead of the 4.14.2 final. No `:latest`
      Docker tags are published for this build.


      Release candidate focused on message **Delivery Details** diagnostics and finishing 3D-map
      parity. A new clickable Delivery Details view surfaces per-message protocol, route, hop, and
      heard-by data — built up across five phases (diagnostics UI, exact RoutingError persistence, a
      per-message event timeline, Meshtastic Heard-By correlation, and a user guide). The 3D terrain
      map reaches visual parity with the 2D map: node markers now carry hop color, node-type glyphs,
      and age dimming; neighbor/traceroute lines are gated to visible nodes; markers open the same
      node popup; and MeshCore edge + MapAnalysis coloring follow-ups landed. This RC also adds
      received node **Status Messages** (decode + display), a MeshBeacon broadcast-interval/region
      control, an automation "Run Now" action, and an Uptime sort for the node list. Fixes include
      the rc6 3D-marker regression (MapLibre v6 worker), the Traffic Management firmware gate (now
      2.8.0), MeshCore telemetry temperature units, packet-monitor and NodeDB-sync deduplication,
      invisible message links, and sign-in reachability on permission-scoped source pages.


      ## Features

      - **Message Delivery Details** (#4816): clickable delivery-status diagnostics (#4837), persist
      exact Meshtastic RoutingError code (#4839), per-message event timeline (#4841), Meshtastic
      Heard-By correlation (#4842), user guide + honest-labeling audit (#4843)

      - Receive + display node **Status Messages** (#4834, closes #4818)

      - 3D map parity with 2D — marker color/glyphs/age dimming (#4815), visible-node line gating
      (#4817), click-to-open node popups (#4825), MeshCore edge gating + MapAnalysis coloring
      (#4830) (#4808)

      - MeshBeacon broadcast interval + transmit region / broadcast targets (#4804, closes #4802)

      - Automation: **Run Now** to fire an automation's actions immediately (#4833, closes #4827)

      - Uptime sort option in the map-view node list (#4820, closes #4814)

      - Airtime: count CLIENT_BASE as infrastructure for neighbor averaging (#4831, closes #4822)


      ## Bug Fixes

      - 3D terrain showed no node markers — load the MapLibre v6 worker (#4806, closes #4800 rc6
      regression)

      - Traffic Management firmware gate too low → require 2.8.0 (#4807, closes #4792)

      - MeshCore telemetry: honor the user's temperature unit (#4805, closes #3659)

      - Keep sign-in reachable on a source without connection permission (#4829, closes #4828)

