      # MeshMonitor v4.17.0-rc3


      > [!WARNING]

      > This is a **pre-release** for testing. It is not tagged `latest`. Use it on a test install
      or with a recent backup.


      ## Summary


      This release candidate adds cross-source correlation: when one of your radios is heard by
      another of your sources, MeshMonitor now says so. The Unified Packet Monitor tags those
      packets and can filter on them, the Coverage Report marks fixes sent by your own sources, and
      both maps gain an opt-in **Show Cross-Source Links** layer. MeshCore repeaters attached over
      serial now turn the adverts they hear into Nodes and decrypt channel messages with keys you
      already hold; a message is shown only to users who can read a channel with that key. The
      Channel Database stores MeshCore channel secrets next to Meshtastic keys, with a one-time
      import from a MeshCore device. Message Forwarding gets a per-source master switch, a **FWD**
      pill on the source card, and an automation action. A new **Live Mesh Activity** dashboard
      widget lists the remote nodes a source heard in the last few minutes.


      LoRa modem presets are corrected and extended: LONG_TURBO shows CR 4/8, the TINY presets and
      new regions are listed, firmware 2.8 per-region preset rules are enforced, and a LongModTurbo
      recipe is offered for custom settings. Fixes cover appearance settings changing on their own,
      CARTO keys on report maps, the map repeating the world when zoomed out, 3-byte MeshCore Define
      Path, and coverage survey conflicts.


      ## Features

      - Cross-source correlation: Unified Packet Monitor tags and filter, Coverage Report flags
      (#5573)

      - Map: cross-source "heard here" links layer on both maps (#5575)

      - MeshCore: repeater RAW ingest — adverts to Nodes, channel messages to gated Messages (#5574)

      - MeshCore: virtual channels in the Channel Database, with import from a device (#5576)

      - Forwarding: source-level master switch, sidebar FWD pill, automation action (#5572)

      - Dashboard: Live Mesh Activity widget (#5570)


      ## Bug Fixes

      - LoRa: correct modem preset tables, add TINY presets, firmware 2.8 region rules, LongModTurbo
      recipe (#5571)

      - Settings: appearance and UI preferences are global-only (#5569)

      - MeshCore: 3-byte Define Path, shared telemetry labels, local-node favorites (#5566)

      - Map: CARTO key on report maps, one-world clamp, coverage overlap chooser (#5565)

      - Coverage: select the blocking live survey on `SURVEY_ALREADY_LIVE` (#5562)


      ## Issues Resolved

      #5537, #5543, #5544, #5546, #5547, #5548, #5549, #5550, #5551, #5552, #5553, #5554, #5555,
      #5556, #5557, #5558, #5559, #5560, #5561


      ## Upgrade Notes

      - Migrations 189–193 run on first start. 189 removes per-source copies of appearance and UI
      preferences; if a source held a value that differed from the global one, the promotion rule in
      #5569 decides which is kept.

      - Cross-source map links start filling after the upgrade; there is no backfill.

      - New MeshCore entries in the Channel Database start with no user access. Grant it under
      Users.


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.17.0-rc2...v4.17.0-rc3


