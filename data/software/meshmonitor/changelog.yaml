      # MeshMonitor v4.17.1-rc6


      > [!WARNING]

      > This is a **pre-release** for testing. Do not use it in production unless you want to help
      test.


      ## Summary


      This RC fixes slow PostgreSQL and MySQL instances. Database Maintenance now shows and runs on
      every backend, not just SQLite. It now prunes `audit_log` (90 days by default), and a new
      migration adds a channel-list index and tunes Postgres autovacuum. MeshCore Companions on
      firmware 1.18.0 gain a real text CLI: the local console uses the radio's native CLI, the
      quick-action catalog grows, and you can run commands on a remote Companion and grant or revoke
      its remote-CLI permission. Channels now support AEAD (AES-CCM): the server decrypts them, and
      you can edit AEAD on device channels. Node Details shows a node's name history. Unified
      Messages remembers your last channel. MQTT forwarders now show their own uplinked packets, and
      push subscriptions renew correctly after rotation.


      ## Features

      - feat(meshcore): Companion text CLI on fw 1.18.0 (local, catalog, remote) (#5866, #5867,
      #5868) #5869

      - feat(nodes): track node renames and show them in Node Details (#5862) #5865

      - feat(channels): decrypt AEAD (AES-CCM) channels server-side (#5248 Phase 2a) #5860

      - feat(channels): edit AEAD on device channels (#5248 Phase 2b) #5861

      - feat(unified-messages): remember the last selected channel per browser #5793
      (@goodprogrammist)


      ## Bug Fixes

      - fix(db): run maintenance on PostgreSQL/MySQL, prune audit_log, tune PG (#5870) #5871

      - fix(push): renew a rotated push subscription on its sources (#5863) #5864

      - fix(mqtt): show a forwarder's own uplinked packets on its source (#5858) #5859


      ## Translations

      - Translations update from Hosted Weblate #5676


      ## Issues Resolved

      - #5870 Production DB performance: unused indexes, index bloat, no audit_log retention,
      autovacuum lag

      - #5868 MeshCore Local Console: expand Companion quick-action catalog for fw ≥ 1.18.0

      - #5867 MeshCore Companion: UI for remote-CLI permission bit (fw ≥ 1.18.0)

      - #5866 MeshCore Companion native CLI (fw ≥ 1.18.0)

      - #5863 Service worker pushsubscriptionchange renewal silently fails: missing sourceId

      - #5862 Track node name history with a log view in node details

      - #5858 MQTT forwarder source does not display user's own outbound messages

      - #5792 Unified Messages: configurable default channel

      - #5013 MQTT Channel Messages Not Received Unless Relayed by Nearby LoRa Node


      ## New Contributors

      Thanks to @goodprogrammist for their first contribution (#5793)!


      ## Upgrade Notes

      - **PostgreSQL/MySQL users:** Database Maintenance is now visible on your backend but stays
      off until you enable it. Open **Settings → Database Maintenance**, turn it on, and click **Run
      Maintenance Now**. The first run may take a while on a large database.

      - Large Postgres instances should also run the one-off `REINDEX TABLE CONCURRENTLY` / `VACUUM
      (ANALYZE)` steps and review the memory settings in `docs/development/database.md`.

      - Migration 210 runs on startup: it adds an index on `messages(sourceId, channel, timestamp)`
      and, on Postgres, sets per-table autovacuum thresholds.


