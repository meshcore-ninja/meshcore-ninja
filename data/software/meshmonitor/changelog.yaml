      # MeshMonitor v4.14.2-rc5


      > ⚠️ **Pre-release (release candidate).** Not tagged `:latest`. For testing ahead of the
      4.14.2 final.


      This candidate rolls up 19 commits since rc4. The headline is the **maplibre-gl 5 → 6**
      upgrade — its lone blocker (the leaflet adapter's lack of v6 support) cleared upstream, and
      the 3D terrain map was validated rendering correctly under software WebGL. On the feature
      side, the map **age filter** gains non-linear steps reaching 30 days, telemetry graphs
      **export to CSV**, and a **Prometheus `/api/v1/metrics`** endpoint exposes mesh health for
      Grafana/alerting. Fixes include the long-standing Virtual Node bug where it advertised a
      **stale local node number** (spawning an unpurgeable phantom duplicate and breaking MQTT),
      three mobile/PWA/desktop **map & modal CSS quirks**, and a **MQTT device-telemetry**
      node-metrics refresh. Rounded out with dependency bumps (`pg`, `lucide-react`, dev tooling),
      the mesh-impact checklist added to contributor guidance, and updated translations. No database
      migrations or schema changes.


      ## Features

      - maplibre-gl 5 → 6 upgrade; 3D render validated under SwiftShader WebGL (#4650)

      - Non-linear map age filter with week/month reach, 720h cap (#4770)

      - Export telemetry graphs as CSV (#4771)

      - Prometheus `/api/v1/metrics` endpoint for mesh monitoring (#4757)


      ## Bug Fixes

      - Virtual Node stops advertising a stale local node number (#1390)

      - Three mobile/map CSS quirks: search modal, iOS PWA offset, desktop popup scrollbar (#4774,
      #4772, #4758)

      - Refresh MQTT device-telemetry node metrics (#4755)


      ## Dependencies / Docs / i18n

      - `pg` + `@types/pg`, `lucide-react` 1.31.0, and several dev-dependency + CI-action bumps

      - Mesh-impact checklist added to agent guidance (#4778)

      - Weblate translations update (#4709)


      ## Issues Resolved

      - #1390 — V-Node creates its own ID (stale node number)

      - #4650 — Deferred maplibre-gl 5 → 6 upgrade

