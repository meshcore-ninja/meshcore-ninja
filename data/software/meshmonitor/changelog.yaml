      a marker on the map at the corresponding geographic point along the link (#4170)

      - **Smarter obscured-node decluttering** — the within-cell offset for low-`precision_bits`
      markers now only spreads nodes that actually share an accuracy cell; a lone node stays at its
      reported center (#4164, closes #4155)

      - **Discard invalid positions** — a new global Map setting to control whether Null Island /
      invalid GPS fixes are discarded on ingest (default on = current behavior) (#4158)

      - **Icon toolbar for Map Analysis** — action and layer buttons are now icons with the text as
      tooltip/aria-label, decluttering the top bar (#4171)


