      # MeshMonitor v4.15.2-rc4


      > ⚠️ **Pre-release / Release Candidate.** For testing ahead of the 4.15.2 stable release.
      Docker `:latest` is not updated by this build.


      Continues the 4.15.2 line with a UI-consolidation focus. The floating map control panels
      across every map surface (Dashboard, Nodes, Map Analysis, MeshCore) are now unified into a
      single collapsible right-edge sidebar (#4909). The header is tidier: the Disconnect/Reconnect
      controls moved into the System Status popup (#4908), and the "Connected" badge now cycles
      through connection status, battery, and airtime for the local node (#4917). Nodes gain
      per-node coloring using the official Meshtastic app algorithm for both pins and lists (#4880),
      with a follow-up pass ensuring text stays legible on every generated background across the
      Nodes tab, DM list, and chat bubbles (#4924). A MeshCore USB unplug/replug now reconnects on
      its own instead of holding the serial port until a container restart (#4922). Map Analysis is
      fully theme-aware (no more hardcoded dark) (#4910/#4911), and a self-targeted `deviceReboot`
      on a BLE-connected device is now handled as a local reboot (#4847).


      ### Features

      - Unified, collapsible map controls sidebar across all four map surfaces — #4914, #4919,
      #4920, #4921 (epic #4909)

      - Cycling connection badge (status → battery → airtime) — #4927 (#4917)

      - Per-node colors (Meshtastic app algorithm) for pins + node lists — #4924 (#4880)

      - Header: Disconnect/Reconnect moved into the System Status popup — #4912 (#4908)


      ### Bug Fixes

      - Keep node text legible on per-node colored rows (Nodes tab, DM list, chat bubbles) — #4928
      (#4924)

      - MeshCore: release the serial fd on a failed connect so a USB replug reconnects — #4923
      (#4922)

      - Map Analysis: theme via semantic tokens instead of hardcoded dark — #4913 (#4910/#4911)

      - Automation: treat a self-targeted `deviceReboot` as a local reboot — #4915 (#4847)


      ### CI / Release

      - chore(release): 4.15.2-rc4 — #4931


      ### Issues Resolved

      - #4922 MeshCore node USB problems

      - #4917 Local node battery voltage / percentage / power info

      - #4911 Map Analysis toolbar icons unidentifiable on mobile

      - #4910 Map Analysis view ignores light mode theme

      - #4909 Consolidate floating map panels into unified sidebar

      - #4908 Consolidate duplicate node name + connect/disconnect toggle

      - #4847 Automation deviceReboot fails for BLE-connected device


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.15.2-rc3...v4.15.2-rc4


