      # MeshMonitor v4.13.1-rc3


      > ⚠️ **Pre-release (release candidate).** Rolls up 13 PRs merged since rc2 — position-quality
      & Map Analysis refinements plus a cluster of messaging correctness fixes. Please test and
      report issues before the stable 4.13.1.


      ## Highlights


      This RC sharpens **position quality and node identity**. Node popups now show position
      accuracy and GPS location source; the "Discard invalid positions" toggle is honored on the
      render side (not just ingest); and the obscured-node precision offset is occupancy-scaled and
      distance-capped. On the messaging side it fixes several real correctness bugs: compose drafts
      no longer leak across conversations (a message meant for one node could be sent to another),
      MeshCore own-node messages show the node's name instead of a raw public key, and message
      senders now display their short name alongside the long name. Rounding it out: automations can
      now target a remote node for admin reboot, unmessageable nodes get a "Message anyway"
      override, traceroute no longer fails with NO_CHANNEL on a disabled channel slot, and the v1
      `default` source alias scopes correctly.


      ## Features

      - **#4188** — Position accuracy + location source in node popups (chat & map), migration 124

      - **#4187** — "Message anyway" override for unmessageable-node DM banner

      - **#4186** — Automation: remote-admin reboot target for the device-reboot action

      - **#4196** — Show short name alongside long name on message senders (Unified Messages)

      - **#4182** — Honor the "Discard invalid positions" toggle on the render side

      - **#4181** — Occupancy-log-scaled, distance-capped precision offset for obscured nodes


      ## Bug Fixes

      - **#4197** — MeshCore: own node's messages show the name, not a public key

      - **#4191** — v1 `default` source alias deep-scopes by the resolved id (mergeParams
      re-derivation)

      - **#4185** — Scope the compose draft per-conversation (prevents wrong-recipient sends)

      - **#4184** — Keep router short-name visible in the Official pin style

      - **#4180** — Traceroute no longer sends on a DISABLED channel slot (NO_CHANNEL)

      - **#4175** — Drop heatmap/coverage density for deleted nodes


      ## Docs

      - **#4179** — Meshview Link Responder added to the User Scripts Gallery


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.13.1-rc2...v4.13.1-rc3

