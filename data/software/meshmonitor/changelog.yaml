    notes: >-
      # MeshMonitor v4.18.0


      MeshMonitor 4.18.0 adds support for Meshtastic's new **`is_automation`** flag. Every packet
      MeshMonitor sends for an automation now sets bit 2 of `Data.bitfield`, and MeshMonitor reads
      the flag from every other client. Flagged messages show a bot icon, and Packet Monitor shows
      the flag in its own column. Auto-Ack and Auto-Responder ignore automated messages by default,
      so two bots can't answer each other forever. Automation Engine message rules gain a **Sent
      by** filter, and new rules start at "People only". The release also adds public-instance mode,
      an embedded MeshCore MQTT broker source, Meshtastic sends over MQTT with no radio, mesh-wide
      notification defaults, Direct RF Contacts history, verified remote config saves, a security
      digest Preview, and owner/email claims for the Analyzer Observer. Fixes cover MeshCore
      telemetry, maps and repeater names, the Virtual Node, the MT↔MC bridge, MQTT config saves and
      server-side PKI DM decryption. Upgrading runs migrations 233 to 239 automatically. **Read the
      upgrade notes below before you update.**


      📰 **Read the blog post:** [Bots Now Say They Are
      Bots](https://meshmonitor.org/blog/2026-11-17-v4.18.0-is-automation)


      ## Upgrade notes

      - **Migrations 233 to 239** run on start on SQLite, PostgreSQL and MySQL.

      - **Auto-Ack and Auto-Responder skip automated messages by default.** A message flagged
      `is_automation` gets no reply unless you tick **Respond to automated messages**. A MeshMonitor
      bot that answered another bot will stop.

      - **Automation sends set the `is_automation` bit.** There is no setting to turn it off.

      - **New Automation Engine message rules** default to **People only**. Existing rules are
      unchanged.

      - **MeshCore Companion heartbeat:** existing Companion sources with no stored heartbeat get 60
      seconds. That includes sources where you turned it off under the old form, which stored
      nothing for off. Set it to 0 to turn it off again.

      - **Notifications:** push subscriptions collapse to one per browser. Per-source settings keep
      working until you edit them. Push rows with no user, and the anonymous account, get every
      source the anonymous account can read. Apprise and desktop alerts arrive up to 5 seconds
      later.

      - **Public-instance mode, hide-declined-MQTT nodes, MQTT sends with no radio and broker
      forwarding are all off by default.** With public-instance mode on, the CoT/TAK feed is not
      trimmed; Settings warns about it.

      - **The MeshCore MQTT broker** listens on 1884 by default. Docker and Helm do not expose it;
      map the port yourself.

      - **MQTT config saves** wait up to 5 seconds for a refusal. A refused MQTT restore now fails
      instead of passing.

      - **Exchange Position** no longer sends your position to the far node.

      - **Room Sync:** rooms with auto-sync on that this radio logged in to before get one
      blank-password login after each connect, at most one per source per minute, skipped when a
      login ran in the last hour.


