      # MeshMonitor v4.17.2


      MeshMonitor 4.17.2 is a large reliability-and-security release that promotes the 4.17.2 RC
      series (rc1–rc8) plus a handful of follow-ups. The headline is a full security-hardening pass
      (findings C1–C9 and more): script-engine RCE holes closed, remote argv-injection via OTA node
      names blocked, SSRF holes closed with admin-gated global settings, a nonce-based CSP that
      drops `unsafe-inline`/`unsafe-eval`, channel-PSK and backup authorization tightened,
      per-source authorization enforced on automation run-now, and stored-XSS escaped in map popups.
      It adds first-class **Reticulum (LXMF)** support — automation send/reply, an RNode
      interface-status panel, a position-free Connections topology view, a Pin sidebar control, and
      persisted announce. MeshCore gains Rooms sort/custom-order, a `discover.neighbors` repeater
      button, a ducting overlay, receipt-time message ordering, and a room-post crash fix.
      Meshtastic gains a free-form remote-admin CLI console, `DeviceMetadata.ble_address`
      decode/display, an `add_contact`-before-`set_favorite_node` fix for remote favorites, a
      receive-only TX-safety fix, and first-request proxy auth. The map picks up live packet
      traffic, per-source and per-role markers, and a unified Map tab, alongside a 13-PR performance
      sweep (delta polls, socket coalescing, on-demand bundle loading, response compression).
      Rounded out with dependency updates (including croner 11) and translations.


      ## Security

      - Close script-engine RCE holes — C1 (#6089)

      - Prevent remote argv injection via OTA node names in script runner (#6090)

      - Nonce-based CSP; drop `unsafe-inline`/`unsafe-eval` from `script-src` (#6092)

      - Close SSRF holes and admin-gate global settings — C7 (#6098)

      - Harden auth/session/DB surfaces — C9 (#6097)

      - Enforce per-source authz on automation run-now — C8/AUTHZ-07 (#6095)

      - Gate channel PSK exposure + channel-db ownership — C4 (#6093)

      - Confine backup file paths and tighten backup authz — C3 (#6094)

      - Gate per-source forwarding toggle on automation enable (#6096)

      - Escape GeoJSON popup/tooltip HTML to kill stored XSS (#6065)

      - Context-encode analytics values and admin-gate analytics settings (#6091)

      - Validate API token before skipping CSRF (#6088)


      ## Features

      - **Reticulum:** send and reply over Reticulum (LXMF) from the Automation Engine (#6145)

      - **Reticulum:** RNode interface status on the Info page + battery/Ch/Air header (#6131)

      - **Reticulum:** position-free Connections topology view on the Map page (#6130)

      - **Reticulum:** Pin sidebar control in the main nav (#6126)

      - **Reticulum:** persisted LXMF display name, Announce now, periodic announce (#6013)

      - **Virtual Node:** replay missed text messages when a client reconnects, so an Android app
