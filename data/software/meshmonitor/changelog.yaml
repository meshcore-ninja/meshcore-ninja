      and MeshCore to a third network, adds tools to plan and survey RF coverage, and tells you far
      more about what happened to every message you send. Reticulum joins as a first-class monitored
      network — LXMF messaging, position and telemetry, own-mode radio, and full topology / remote
      monitoring. A new predictive RF coverage model and Site Planner estimate a node's reach from a
      Fresnel-zone + path-loss model, while a passive network survey derives reach, neighbours, and
      hop distribution from traffic you already received. Click any message for Delivery Details:
      the exact routing result, a per-message event timeline, and a Heard-By correlation of which
      nodes relayed it. Maps gain 3D terrain across every surface with markers that match the 2D
      view, a GNSS satellite overlay, and a hybrid satellite tile. Rounding it out: a Prometheus
      metrics endpoint, Node Status Messages, telemetry CSV export, completed MeshBeacon + XEdDSA
      support, and a long list of fixes.


      Full notes live in the
