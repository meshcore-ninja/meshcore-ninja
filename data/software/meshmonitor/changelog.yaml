    notes: >-
      # MeshMonitor v4.17.1


      This release rolls up ten release candidates. MeshCore gains reactions, a native Companion
      text CLI for firmware 1.18.0, saved remote-admin sessions, stored CLI history, and route hops
      resolved from other sources. Auto Responder, Timer Triggers, Auto Acknowledge and channel
      editing now share one workflow and one trigger syntax across Meshtastic and MeshCore, and
      trigger patterns accept emoji. Local accounts can sign in with a passkey. The Map tab and
      Dashboard map gain a tropospheric ducting overlay, waypoints round-trip the firmware's
      geofence fields, and the ADS-B layer adds OpenSky as a feed. Meshtastic channels can use AEAD
      (AES-CCM), and admins can set, clear and lock a node's channel by hand. Unified Telemetry
      gains a cross-source dashboard, Node Details shows rename history, and node battery icons show
      the charge level. Many MQTT fixes stop bridges from echoing each other, and the Packet Monitor
      now drops firmware 2.8 NodeDB replays. A security fix scopes traceroute history and unified
      telemetry to the sources a user may read. Database maintenance now runs on PostgreSQL and
      MySQL, and the Docker image moves to Node.js 24.22.1.


      ## Features


      ### MeshCore

      - **Reactions** (epic #5759): codec for the MeshCore One and meshcore-open formats (#5771),
      inbound reaction chips (#5775), sending reactions and automation tapbacks (#5776), and chips
      in Unified Messages plus CSV columns and an opt-in automation trigger (#5778)

      - Companion text CLI on firmware 1.18.0: local console, quick-action catalog and remote CLI
      (#5869)

      - Remember and resume remote-admin sessions (#5798)

      - Store CLI command history (#5897)

      - Resolve unknown route hops from other sources (#5911)

      - Radio contact list: auto-add mode and type filters, max hops, replace the oldest
      non-favourite when full, and "Remove non-favourite contacts from the radio" (#5783)

      - Override a contact's location (#5848)

      - Edit the Observer in MeshCore Configuration; quick configure joins the save (#5840)

      - Search and section buttons on MeshCore Configuration and Automations (#5855)


      ### Automation and messaging

      - One Auto-Responder trigger syntax for Meshtastic and MeshCore, with Pattern and Regex modes
      and emoji support (#5930)

      - One Auto Responder workflow for Meshtastic and MeshCore (#5811)

      - One Timer Triggers workflow for Meshtastic and MeshCore (#5814)

      - Same field groups for Auto Acknowledge and Auto Announce on both protocols (#5817)

      - Shared config section shell for automation sections (#5809)

      - Auto Acknowledge: nearer nodes answer a channel message first (#5789)

      - Separate IP (MQTT/UDP) row in the Auto-Ack matrix (#5854)

      - Choose the 0-hop and MQTT tapback glyphs (#5894)

      - Draw SPIP1 pixel-image messages as images (#5945), thanks @maxhayim

      - Unified Messages remembers the last selected channel per browser (#5793), thanks
      @goodprogrammist

      - Remember Show MQTT/Bridge Messages per source (#5844)

      - Status Message: opt-in, per-source "Re-apply after a reboot" (#5784)


      ### Maps, nodes and telemetry

      - Tropospheric ducting overlay on the Map tab and Dashboard map (#5875, #5913)

      - Round-trip firmware waypoint geofence fields (#5925)

      - ADS-B: add OpenSky Network as a feed (#5906)

      - ADS-B: re-check aircraft flight matches as the node moves (#5905)

      - Set, clear and lock a node's channel by hand (#5941)

      - Track node renames and show them in Node Details (#5865)

      - Battery icons show the charge level (#5947)

      - Cross-source Telemetry Dashboard on Unified Telemetry (#5907)


      ### Channels, security and configuration

      - Decrypt AEAD (AES-CCM) channels server-side (#5860) and edit AEAD on device channels (#5861)

      - One channel editing model for Meshtastic and MeshCore (#5838)

      - Passkey sign-in for local accounts (#5841): storage (#5849), sign-in (#5850), passkey-only
      accounts, recovery codes and admin revoke (#5851), user guide (#5853) and design spec (#5847)

