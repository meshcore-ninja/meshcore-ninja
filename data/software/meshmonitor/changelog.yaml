      A security-led candidate. Four API endpoints checked permissions without a source id and then
      answered for whatever source the caller named in `?sourceId=`, so an account holding a grant
      on any one source could read another source's data — DM counts, oldest-unread timestamps, and
      in the worst two cases the message bodies themselves. All four are fixed and each carries a
      regression test that was verified to fail without its fix. Alongside that, configuration
      search arrives across every settings page, waypoints can now raise an arrival alert with a
      radius and deduplication, and the Sources sidebar gains a "Mark all read" action that clears
      every source's unread DM badge in one request. On the build side the armv7 Docker image now
      compiles its JavaScript natively instead of under QEMU, cutting that leg by about 42%, and a
      new Retag workflow can re-point `:dev` at an already-built version in a minute rather than a
      forty-minute rebuild. A long-standing `react-leaflet` mock gap that had been failing CI
      intermittently for days is also closed. Eleven dependency bumps land too, including React
      19.3.0 — now grouped in Dependabot so `react` and `react-dom` can never again be split into
      two PRs that neither merge.


      ## Security


      Four cross-source permission leaks, all the same shape — `hasPermission` called with no
      `sourceId` while the handler answered for a caller-supplied `?sourceId=`:


      | PR | Endpoint | Exposed |

      |---|---|---|

      | **#5227** | `GET /api/messages` | direct-message **bodies** |

      | **#5227** | `GET /api/messages/channel/:channel` | channel message bodies |

      | **#5225** | `GET /api/messages/unread-counts` | unread DM counts |

      | **#5225** | `GET /api/messages/first-unread` | oldest-unread timestamps |


      Reproduced against a real install before fixing. Scoping these gates locks nobody out:
      `messages` is a per-source resource, so a global (`sourceId = NULL`) grant never authorized
      anything through that path anyway.


      ## Features


      - **#5226** — per-page and cross-page configuration search (#5182)

      - **#5228** — waypoint arrival alerts with a radius trigger and deduplication (#4750)

      - **#5224** — "Mark all read" in the Sources sidebar, clearing every source's unread DM badge
      in one request (#5197). Added *beside* the existing visibility toggle rather than replacing it
      — that toggle is its own only control and also gates the 15-second poll.


      ## Bug Fixes


      - **#5203** — MeshCore DM and channel retries reuse the original `senderTimestamp` instead of
      minting a fresh one, so a retransmit is no longer delivered as a duplicate message (#5202).
      Also stops a `NO_CHANNEL` routing-error flood: the device push was addressed on the donor
      row's channel, which for an MQTT donor is a virtual channel number, not a radio slot.

      - **#5219** — `DashboardMap.test.tsx` mocked `react-leaflet` without a `GeoJSON` export while
      the test renders a visible coverage layer, so the overlay threw asynchronously and tore down
      the React tree. It surfaced as an unrelated-looking "Unable to find a label with the text of:
      3D Terrain" and had been failing CI intermittently for days.


      ## CI / Build


      - **#5207** — the armv7 image builds its JavaScript natively instead of under QEMU. Vite and
      tsc emit platform-independent output, so emulating them bought nothing; measured locally,
