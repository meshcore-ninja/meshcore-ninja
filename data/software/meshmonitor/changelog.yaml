      # MeshMonitor v4.16.2


      The full release of the 4.16.2 line, after six release candidates. It adds a passive
      **Coverage Report** that replaces the Range Test module firmware 2.8 removed,
      **likely-aircraft detection** with age-out, flight trails and optional ADS-B flight matching,
      and **asset tracking** with full-history trails and timeline playback. Nodes, messages, route
      records and traffic charts now split by transport (RF, UDP, MQTT), and a per-source option
      corrects sign-flipped positions without changing stored data. Per-source **Message
      Forwarding** sits next to the Auto-Responder, and MeshCore gains client-side Ignore and Block,
      channel sorting and slot reordering, and remote logins that retry and can be cancelled. CARTO
      vector basemaps, a quick age filter and Group by Role on the Nodes tab, and adding a node from
      a contact URL round out the UI. Firmware OTA now runs on the selected source with its own TCP
      port and a board map that matches Meshtastic's release names. A security fix stops an MQTT
      broker source's Info and Device Config tabs from showing, or writing to, the primary TCP node.
      Many MeshCore, MQTT, mobile and iOS 27 fixes land as well.


      **Release post:** https://meshmonitor.org/blog/2026-09-29-v4.16.2-release


      ## Upgrade notes


      - **MeshCore adverts default to zero-hop**, and automated flood adverts are limited to one per
      hour per source. Saved configs with no mode set keep flooding but fall under the hourly limit.

      - **MQTT and MeshCore sources no longer use the primary Meshtastic radio.** Sends, device
      config and remote admin from those sources are refused with `SOURCE_NOT_MESHTASTIC`.

      - **Longest Active and Record Holder cards need `traceroute:read`** on the source, and Clear
