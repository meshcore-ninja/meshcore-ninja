      # MeshMonitor v4.17.1-rc10


      > ⚠️ **Pre-release.** This is a release candidate for testing. Use a stable release in
      production.


      Admins can now set, clear and lock a node's channel by hand from Node Details. A locked
      channel stays put when new packets arrive. The MeshCore Virtual Node answers reads of empty
      channel slots with an empty ChannelInfo, as real firmware does, so pipelined clients such as
      MeshCore One no longer stall on each empty slot. The Virtual Node also sends MQTT uplink
      frames only to the MQTT proxy client, not to other clients that connect after it. The MeshCore
      Nodes list header now uses two rows, so the Discover button no longer gets clipped in the
      320px pane. The Docker image moves to Node.js 24.22.1 for the October 21 security release.
      This release also includes new Weblate translations.


