      map-consolidation and MeshCore work ahead of the stable release. Not recommended for
      production; back up your database before upgrading.


      This release candidate builds on rc2 with a focused round of map interaction fixes and a
      MeshCore Virtual Node correctness fix. The map work resolves several regressions from the
      map-consolidation epic: click-to-pan now targets the actual node marker instead of the raw
      center, user gestures (zoom/pan) correctly cancel node-centering instead of snapping back and
      freezing, and raster tile layers no longer remount and flicker when the tileset changes. Null
      Island (0,0) coordinates are now filtered from both markers and line endpoints, and
      out-of-range/invalid node positions are detected and trimmed. Pan/zoom/spiderfy behavior was
      polished with a zoom clamp, scaled animations, and zoom-gated spiderfy. ROUTER_LATE nodes
      again render as repeater-tower icons on the NodesTab and Dashboard maps. On MeshCore, the
      Virtual Node login now relays the admin flag and firmware level, and the mobile node list is
      collapsible so the map is reachable without selecting a node. This candidate also folds in a
      large batch of dependency updates and a translations refresh.


