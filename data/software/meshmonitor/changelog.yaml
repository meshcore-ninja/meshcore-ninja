      # MeshMonitor v4.14.2-rc3


      > ⚠️ **Pre-release.** This is a release candidate for testing. It is not tagged `:latest` and
      is not recommended for unattended production use.


      Nine changes since rc2, dominated by a mobile-freeze fix and two new terrain/RF surfaces.
      Opening a node with a large estimated-position history could lock the UI for about a minute on
      mobile — that is fixed, and the fix bounds both halves of the cause rather than the one that
      was reported. Predictive RF coverage arrives as a Fresnel + path-loss model with a radial
      terrain sweep and a map layer, deliberately drawn to look unlike measured coverage so a
      prediction is never mistaken for a measurement; note its control surface is not wired up yet,
      so the layer is present but not reachable from the UI in this build. A passive network survey
      now reports what a radio can actually hear — direct neighbours, signal, and reach by hop count
      — generating no radio traffic to do it. MeshBeacon offers (firmware 2.8+) become actionable
      invitation cards, with an explicit confirmation before any channel is written to a radio. Two
      protocol-level bugs are fixed: MeshCore's implicit Public channel was being displaced when
      adding a channel, and MeshBeacon module config failed to load with "Unknown config type".
      Traditional Chinese joins the language selector — it was already the most complete translation
      in the repository and simply had never been offered.


      ## Features


      - **Predictive RF coverage** — Fresnel + path-loss model, radial terrain sweep, API and map
      layer (#4741, refs #4727)

      - **Passive network survey** — reach, direct neighbours and hop distribution (#4737, closes
      #4726)

      - **Actionable MeshBeacon invitation card** — add / dismiss, with confirmation before any
      device write (#4735, closes #4723)

      - **Waypoint-anchored geofences** for enter/exit alerts (#4732, closes #4722)

      - **Incomplete-NodeInfo badge** on nodes missing name or hardware info (#4730, closes #4720)

      - **Traditional Chinese** in the language selector (#4742)


      ## Bug Fixes


      - **Map froze for ~1 minute** when opening a node with a large estimated-position history
      (#4744, closes #4743)

      - **MeshBeacon config load failed** with "Unknown config type: meshbeacon" (#4740, closes
      #4739)

      - **MeshCore Public channel displaced** when adding a new channel (#4734, closes #4733)

      - **Automation Runs log** now shows the captured triggering message (#4716, closes #4711)


      ## Issues Resolved


      #4743, #4739, #4733, #4726, #4723, #4722, #4720, #4711


      ## New Contributors


      - @rncchen made their first contribution in #4742 — Traditional Chinese language support


      ## Notes


      - **Predictive RF coverage has no UI entry point in this build.** The model, sweep, API and
      map layer are complete and tested; the site-planner control panel that drives them is still to
      come, so #4727 stays open.

      - Coverage predictions are modelled from terrain only — they account for free-space loss,
      earth curvature and diffraction, but not buildings, foliage or multipath. Treat them as
      planning aids, not measurements.

      - Very dense position histories are now drawn simplified; the trail's reported time span
      remains exact.


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.14.2-rc2...v4.14.2-rc3


