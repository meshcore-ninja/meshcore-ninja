    notes: >-
      # MeshMonitor v4.17.1-rc1


      > ⚠️ **Pre-release.** This is the first release candidate of the 4.17.1 cycle. It is for
      testing; it does not move the `latest` Docker tag. Back up before you upgrade a production
      install.


      ## Summary


      The main change is **MeshCore emoji reactions**. MeshMonitor now reads the reactions that
      MeshCore One and meshcore-open send, shows them as chips under the message they answer, and
      can send its own in MeshCore One format. Reactions also show in Unified Messages, export to
      CSV, and can fire an automation when a rule opts in. A companion radio's **contact list** gets
      its auto-add options (mode, types, max hops, replace-oldest) and a bulk remove of
      non-favourite contacts, for radios that fill up. Three MeshCore bugs are fixed: telemetry
      sharing modes that silently reverted, room posts whose author never matched a contact, and a
      misleading observer field label. On Meshtastic, a new opt-in setting re-applies the Status
      Message when a node reboots and comes back without it, and the rebroadcast mode descriptions
      now match what firmware does. Upgrading runs migration 203 automatically.


      ## Features


      - **MeshCore reactions** (epic #5759)
        - Reaction codec for the MeshCore One and meshcore-open formats (#5771)
        - Inbound reactions as chips, with a dim line for a reaction to a message this source never heard (#5775)
        - Send reactions: react button, emoji picker, your own chips marked, automation tapback on MeshCore (#5776)
        - Chips in Unified Messages, `reaction` and `reply_to_id` CSV columns, opt-in automation trigger (#5778)
      - **MeshCore radio contact list**: auto-add mode and type filters, max hops, replace the
      oldest non-favourite when full, and "Remove non-favourite contacts from the radio" (#5783)

      - **Status Message**: opt-in, per-source "Re-apply after a reboot" (#5784)


      ## Bug Fixes


      - MeshCore: all three telemetry sharing modes now persist; saving them together used to keep
      only one (#5781)

      - MeshCore: room post authors resolve to the right contact; the author key was corrupted for
      keys with high bytes (#5782)

      - MeshCore: the observer field "Region (IATA)" is now "Observer location (IATA)", with help
      text that says what it is (#5781)

      - Meshtastic: rebroadcast mode descriptions follow firmware behaviour, not the stale protobuf
      comments (#5780)


      ## Dependencies


      - maplibre-gl 6.11.2 → 6.13.0 (#5752)

      - lucide-react 1.49.0 → 1.54.0 (#5754)

      - vite-plugin-pwa 1.3.0 → 2.0.0 (#5751)

      - @rollup/rollup-linux-arm64-musl 4.63.6 → 4.64.3 (#5756), @rollup/rollup-linux-arm-gnueabihf
