      - **Compressed responses and long-lived caching of built files** (#6025). API JSON is now
      gzip-compressed, and hashed JS/CSS files are cached for good.

      - **Dashboard loads its data once** (#6026). It waits for login to finish instead of fetching
      once before and once after.

      - **Smaller dashboard data** (#6028). The 37 node fields the dashboard n

