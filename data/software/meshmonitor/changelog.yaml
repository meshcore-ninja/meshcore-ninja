      excluded (#6018)

      - Sources: configurable default Meshtastic source (#6021)


      ## Bug Fixes

      - MeshCore: clear Trace SNR history per link instead of per contact (#6015)

      - MeshCore: keep unread markers on one receipt clock (#6019), thanks @temalo

      - Reticulum: radio config Apply uses PUT, leaves out blank fields, and sends Radio on as a
      boolean (#6017)


