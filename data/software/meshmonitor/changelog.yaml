      # MeshMonitor v4.13.0-rc2


      > ⚠️ **Pre-release** — release candidate for testing; not recommended for production
      deployments. Docker images are not tagged `:latest`.


      ## Summary


      This release candidate lands the **Map Consolidation epic (#4047)**: MeshMonitor's ten
      independent Leaflet map implementations are now one shared `BaseMap` shell, one composable
      layer library, one popup family, and one marker-icon factory. Traceroutes render identically
      on every surface — one canonical 4-band SNR color scale (previously three different scales),
      unified MQTT dashing and coloring, and the Dashboard finally renders return legs. Node
      markers, popups, neighbor links, and accuracy regions are likewise single-sourced, so future
      fixes apply to every map at once, and public embed maps now show the same canonical traceroute
      visuals as the app. The epic also surfaced and fixed several latent bugs, including a
      hidden-node position leak in the public embed traceroutes endpoint and Dashboard coloring
      segments with unscaled SNR values. On top of the epic, this RC brings map interaction polish
      (#4046): center-on-node never zooms out and its target zoom is user-configurable, pan/zoom
      animations scale with distance, clicking a marker at low zoom now zooms in instead of
      exploding a giant spiderfy fan, and open fans survive zoom changes. Live testing fixes include
      restored wheel/double-click zoom, correct zoom-to-node for one-way traceroutes, loading
      indicators on initial map data fetch, a polar grid for MeshCore maps, and a self-healing
