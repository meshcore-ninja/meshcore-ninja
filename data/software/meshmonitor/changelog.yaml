      # MeshMonitor v4.15.2


      MeshMonitor 4.15.2 lands the Mesh Issues Analysis report — a scheduled, passive health scan of
      the mesh that turns telemetry, RF adjacency, and per-node flags into a triaged list of
      findings you can act on. This release also finishes the unified map controls sidebar across
      every map surface, expands the Automation Engine with five new device-health triggers plus a
      one-click template, adds a portnum filter and content search to the Packet Monitor, and gives
      the MeshCore side per-source path-hash defaults, an autopoll-neighbours scheduler, and a
      separate infrastructure age timeout. Backup Restore is now a one-click button. The header
      cycles the connection badge through status, battery, and airtime. Nodes render in their
      Meshtastic-app color scheme. Site Planner explains when its coverage circle stops matching
      terrain. B1 Router Cluster is tightened twice, first with a configurable distance guard so
      MQTT can't glue routers 100 km apart into one finding, and again with a client-overlap
      requirement so a well-sited backbone stops flagging as redundant. Key-security detection gains
      proper per-source scoping, and migration 155 clears the false-positive `keyMismatchDetected`
      rows that the old bug left behind. Indonesian joins the language picker.


