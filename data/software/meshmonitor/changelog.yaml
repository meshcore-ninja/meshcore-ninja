    notes: >-
      # MeshMonitor v4.18.1-rc1


      > ⚠️ **Pre-release.** This is a release candidate for testing. It is published to the `:dev`
      image tag, not `:latest`. Run it on a test instance or back up first.


      ## Summary


      This release adds a Script Secrets store, so an admin can save API keys once and every user
      script gets them as environment variables, encrypted at rest. The Automation Engine now
      respects each source's airtime cutoff, and the built-in automations point users toward it.
      Several schedulers no longer lose their timing when you save settings or restart. Auto
      Traceroute and Auto Remote LocalStats no longer send an extra request on a save, reconnect or
      restart. The remote admin scanner, Auto Time Sync and Auto Key Repair no longer get pushed
      back by each save. Saving only a Time Sync interval no longer turns Time Sync off. The Helm
      chart and Compose files no longer fill in a fake node IP. Swagger UI's "Try it out" now works
      behind a public IP or domain. The documentation site was reviewed end to end, with
      restructured MeshCore, automation and FAQ pages.


      ## Upgrade notes


      - **Helm / Docker Compose (#6467):** the chart and Compose files no longer set a placeholder
      node IP, and the retired upgrade and TLS settings are gone. If you relied on the old default,
      set `MESHTASTIC_NODE_IP` yourself, or add a source from the sidebar after first start.


      ## Features


      - Script Secrets store for user-script API keys (#6477)

      - Automation Engine honors the per-source airtime cutoff (#6476)

      - Built-in automations point users to the Automation Engine (#6475)

      - Support LoRa `FEM_LNA_Mode` AUTO (3) and keep unknown values (#6461)


      ## Bug Fixes


      - Saves and restarts keep the Auto Traceroute interval (#6479)

      - Treat an unsaved Auto Traceroute interval as off everywhere (#6474)

      - Saves and restarts keep the Auto Remote LocalStats interval (#6482)

      - Saves no longer re-time the remote admin scan, Time Sync and Key Repair (#6483)

      - Stop leaking the local LocalStats first-request timer (#6484)

      - An interval-only save no longer turns Time Sync off (#6485)

      - Send `add_contact` before `set_favorite_node` from Admin Commands (#6460)

      - Swagger UI derives its server URL from the request (#6463)

      - Keep Script Secret names on one line (#6480)

      - Helm and Compose: stop seeding a fake node IP; drop retired upgrade/TLS settings (#6467)

      - Default the compose configurator to plain HTTP production mode (#6473)


      ## Documentation


      - Fix leaked internal pages, a broken logo, dead anchors and wrong claims (#6464)

      - Fix login, backup, merge, permission and stale UI answers in the FAQ (#6465)

      - Fix install and onboarding facts against the code (#6466)

      - New "Choosing a database" page (#6468), linked from the FAQ (#6472)

