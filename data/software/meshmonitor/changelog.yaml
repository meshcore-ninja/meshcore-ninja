      # MeshMonitor v4.18.1-rc8


      > ⚠️ **Pre-release.** This is a release candidate for testing. Do not use it in production
      without a backup.


      This candidate adds **Walkabout coverage** (#5891).


      **Walkabout capture and map**

      - Carry the radio MeshMonitor is connected to, keep the web UI open on your phone, and the
      phone's GPS becomes the receiver position.

      - Every packet the radio hears is credited to the last-hop node.

      - Sessions show on an H3 hex map, coloured by the best signal heard in each hex, with the
      walker's track.

      - Browser location needs HTTPS or localhost.


      **Coverage import**

      - The Coverage Report can now import its own CSV/GeoJSON exports into any source you can
      write.

      - Imports are deduplicated, shown dashed on the map, and kept until you delete them.


      **Repeaters only chip**

      - A new chip on all three maps hides everything but repeaters.


      **Fixes**

      - Direct RF Contacts no longer counts relayed packets as direct.

      - `{LAST_HOP}` and the Packet Monitor no longer drop real repeaters from their relay guesses.

      - Nodes with hwModel IDs 144–154 now show their hardware name.


      **LXC template**

      - Smaller, with a pre-built release mode and a configurable backup count.


      Migrations 248 and 249 run on start.


      ## Features

      - feat(coverage): walkabout capture and storage (#5891 P1) #6570

      - feat(coverage): walkabout H3 hex map (#5891 P2) #6572

      - feat(coverage): import Coverage Report CSV/GeoJSON (#5891 P3) #6574

      - feat(map): Repeaters only chip on all map panels (#5891 P4) #6576

      - feat(lxc): release mode for meshmonitor-update with a pre-built runtime (#6558) #6565

      - feat(lxc): prune build-only dependencies; configurable BACKUP_KEEP with free-space check
      (#6558) #6564


      ## Bug Fixes

      - fix(direct-rf): don't count 0-hop relayed copies as direct contacts #6569

      - fix(automation): treat role 1, not 4, as CLIENT_MUTE in last-hop resolution (also the Packet
      Monitor) #6568

      - fix(hardware): name hwModel IDs 144-154 (#6559) #6563


      ## Translations

      - Translations update from Hosted Weblate #6486


      ## Release

      - chore(release): v4.18.1-rc8 #6578


      ## Issues Resolved

      - #5891 Phone-position walkabout coverage + coverage data import

      - #6558 Shrink/optimize required disk space

      - #6559 hwModel map missing IDs 144-153 (incl. MESHNOLOGY_W15)


      ## Upgrade notes

      - **Database:** migrations 248 (walkabout tables) and 249 (`coverage_imports` plus
      `coverage_receptions.importId`) run automatically on all three database backends.

      - **HTTPS for walkabout:** the walkabout capture needs the web UI over HTTPS (or localhost) on
      the phone.

      - **Follow-ups:** #6571 (per-source SNR bands) and #6573 (walkabout session export/import).


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.18.1-rc7...v4.18.1-rc8


