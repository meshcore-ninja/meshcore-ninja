      # MeshMonitor v4.15.2-rc2


      > ⚠️ **Release candidate.** For testing ahead of the 4.15.2 stable release.


      First RC since 4.15.1. Bundles the **Device Health** automation epic (#4558) plus the map and
      messages fixes merged since.


      ## Added


      - **Device Health automation triggers + template** (#4558) — five new Automation Engine
      triggers built on data MeshMonitor already receives: **node silent** (heartbeat lost), **node
      online** (recovery), **node rebooted** (uptime reset), **node power changed** (external power
      lost/restored), and **battery declining** (a "not charging" trend proxy) — plus a selectable
      **noise floor** telemetry field, and a **Device Health** starter template that quick-creates
      the notifications (pick a source/node, toggle any of ten alerts with thresholds). All passive
      (zero mesh airtime) and restart-safe. Caveats surfaced in the UI: noise floor is
      local-node-only on Meshtastic; power/charging are heuristics; MeshCore reboot/power/trend
      deferred. (#4873, #4874, #4876, #4877, #4878, #4881)

      - **MeshCore neighbour autopoll** — per-node retrieval scheduler. (#4618)

      - **Reception Heard column shows seconds** on the Unified Messages page. (#4869)

      - **Unread bell in the mobile channel dropdown**. (#4660)


      ## Fixed


      - **3D node markers keep their role glyph across zoom** (#4863)

      - **ESRI satellite basemap** — damped synthetic water-blue + fixed white halo on node labels.
      (#4860)


