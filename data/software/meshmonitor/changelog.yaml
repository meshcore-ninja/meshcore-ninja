      # MeshMonitor v4.13.1-rc1


      > ⚠️ **Pre-release / Release Candidate.** This build is for testing. It ships no `:latest`
      Docker tags. Please report any issues before the final 4.13.1 release.


      ## Summary


      This release resolves the long-running #4115 investigation where specific nodes produced zero
      data over MQTT: the geo filter is rearchitected from a fail-closed membership gate (which
      permanently blackholed GPS-less nodes and froze on encrypted feeds) to a fail-open, per-source
      ignore-list model with retroactive purge, automatic reappearance when a node comes back
      in-bounds, and a start/config-change sweep — shipped across four phases (#4123, #4131, #4132,
      #4136). A new MQTT Packet Monitor lands (per-gateway reception capture backend #4127 plus a
      gateway-aware UI #4138). Map and node UX improvements include lat/lon/elevation shown as text
      in Node Info/Details (#4134), Show RF/UDP/MQTT transport toggles in Map Analysis (#4135),
      per-theme light/dark map tilesets (#4118), and a backend elevation service for upcoming
      terrain link profiles (#4143). Two reported bugs are fixed: nodes can now be reliably
      un-hidden from the map across sources (#4141), and the Conversation page explains why the DM
      composer is hidden for unmessageable nodes (#4140). Also fixed: a Default Map Center
      regression on the Unified/Dashboard map (#4128), MeshCore-only installs whose global
      schedulers never started (#4146), and a stale-config Docker armv7 build (#4122). Finally, two
      latent cross-platform bugs surfaced during release validation were fixed: a directory
      case-collision that broke the macOS/Windows desktop build (#4144), and a MySQL 8 collation
      mismatch that aborted a migration on MySQL deployments (#4145).


      ## Features


      - **MQTT geo-ignore rearchitecture (fixes #4115):** fail-open ingestion with a per-source
      ignore list, retroactive purge, and auto-reappearance — #4123 (data layer), #4131 (fail-open
