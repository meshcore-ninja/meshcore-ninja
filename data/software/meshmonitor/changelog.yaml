      # MeshMonitor v4.16.0-rc5


      > ⚠️ **Pre-release.** This is a release candidate for 4.16.0. It does not carry the `:latest`
      Docker tag. Please report anything you hit against the 4.16.0 milestone.


      Nine issues fixed since rc4, weighted heavily toward MeshCore stability. The headline is a
      crash: a `code=142` frame from a native MeshCore source could reject with no argument, and the
      resulting `TypeError` inside the `catch` block became an unhandled rejection that terminated
      the whole process — supervised restarts made it look like nothing more than a brief 503.
      MeshCore also gains two RepeaterStats counters the pinned library had been silently
      truncating, a corrected Companion queue depth (it had been reading the low byte of the error
      counter), and an end to false "inactive node" alerts for nodes that answer telemetry polls but
      rarely advert. Two `meshcore_mqtt` regressions are fixed: those sources were excluded from
      dashboard nodes and rendered the Meshtastic app shell instead of a MeshCore page. On the
      Meshtastic side, Traffic Management is rebuilt on the 2.8 non-zero-enables schema — nine
      controls that silently did nothing against 2.8 firmware are gone, and the settings that remain
      are documented as "0 disables". The Helm chart repository is repaired: every previously
      released archive it advertised had been 404ing, and older releases are downloadable again.
      Rounding out the release, chart panels no longer overflow the viewport in portrait on mobile,
      and received MeshBeacon offers now warn when the advertised region and preset are regulatorily
      non-compliant.


      ## Bug Fixes


