    notes: >-
      # MeshMonitor v4.17.2-rc4


      > [!WARNING]

      > This is a pre-release for testing. Use it on production systems at your own risk.


      Maps now mark node roles. ROUTER_LATE and CLIENT_BASE get their own infrastructure markers,
      and small corner badges show trackers, Lost & Found, sensors, TAK and Client Mute nodes; the
      map legends list them all. Reticulum sources can set an LXMF display name that persists across
      restarts, announce on demand (once a minute at most), or announce on a 1-24 hour schedule that
      is off by default. The airtime cutoff can now average infrastructure nodes you pick by hand,
      takes 3-5 samples, ignores nodes heard over MQTT, and uses local Channel Utilization when it
      reads higher than too few qualifying routers. A new Global Settings option picks the default
      Meshtastic source for requests that name no source. MeshCore Trace SNR history now clears one
      link at a time, and MeshCore channels no longer show as unread right after you read them. The
      Reticulum radio configuration Apply button works again.


      ## Features

      - Map: distinct markers and corner badges for each node role, with legend entries (#6014)

      - Reticulum: persisted LXMF display name, Announce now, and periodic announce (#6016)

      - Automation: airtime cutoff manual infrastructure picks, 3-5 samples, MQTT-heard nodes
      excluded (#6018)

      - Sources: configurable default Meshtastic source (#6021)


      ## Bug Fixes

      - MeshCore: clear Trace SNR history per link instead of per contact (#6015)

      - MeshCore: keep unread markers on one receipt clock (#6019), thanks @temalo

      - Reticulum: radio config Apply uses PUT, leaves out blank fields, and sends Radio on as a
      boolean (#6017)


      ## Translations

      - Hosted Weblate update (#5997)


      ## CI/DevOps

      - Version bump to 4.17.2-rc4 (#6022)


      ## Upgrade notes

      - **Airtime cutoff** can pause automations sooner than before: MQTT-heard nodes no longer
      count, and when fewer routers qualify than the sample count it uses the higher of local ChUtil
      and the router average. With no qualifying routers it now uses local ChUtil instead of never
      tripping. Existing installs stay in Auto mode with 3 samples.

      - **Reticulum display name** changes now need `configuration:write` on the source instead of
      `messages:write`.

      - **Trace SNR history**: the contact-wide clear button and its `DELETE ?publicKey=` route from
      rc3 are replaced by a per-link clear (`DELETE /api/sources/:id/meshcore/hop-snr?from=&to=`).


      ## Issues Resolved

      #5245, #5970, #6007, #6008, #6011, #6013


      **Full Changelog**: https://github.com/Yeraze/meshmonitor/compare/v4.17.2-rc3...v4.17.2-rc4


