      # MeshMonitor v4.16.0-rc4


      > **Pre-release.** A release candidate for 4.16.0. Not tagged `latest`, and no `:latest`
      Docker tags. Please report anything odd.


      This RC is mostly repair work, and three of the fixes were quietly destroying or wasting
      things rather than merely looking wrong. The telemetry retention purge read two **per-source**
      settings with their un-namespaced keys, found nothing on every 4.x install, and fell through
      to the ordinary seven-day cutoff — so it had been deleting favourited nodes' history hourly,
      which is precisely the history that setting exists to protect. Reset Traceroutes tripped a
      source-scope guard and showed an error, but only after its unguarded sibling had already wiped
      every source's traceroutes; the same defect meant a global node purge wiped them silently,
      with no error at all. And a single dropped MQTT connection could start a reconnect loop that
      outlived the original fault, rebuilding sockets against a third-party broker indefinitely —
      measured at 216 rebuilds in ten minutes where there should have been one.


      The rest is the mobile-landscape family. Five separately reported bugs shared one cause:
      mobile CSS gated on `max-width` alone silently switches off when a phone rotates, because a
      landscape phone is *wider* than the 768px breakpoint. That single mistake was hiding the
      Sources drawer's close control, collapsing the bottom nav to a 48px stub with two tabs
      unreachable, leaving the map frozen at the wrong size until reload, stranding the map sidebar
      as a cramped floating panel, and giving the Device config form a 94px strip to render in. Also
      fixed: the Network Survey panel had never requested its own endpoint correctly, Remote Admin's
      Save Security Config button could never enable, and channel/room names were near-invisible in
      High Contrast Dark.


      ## Bug Fixes


      - Telemetry retention purge read favourites from the wrong settings namespace (#5082)

      - Scope traceroute purges, and guard the sibling that never did (#5089)

      - Stop the upstream MQTT broker connection storm (#5081)

      - Request the network survey under `/api` so it reaches the API router (#5086)

      - Stamp the security load gate from the per-section load too (#5091)

      - Offset content by the header's real height, not a constant (#5075)

      - Give the Device config form the screen in landscape (#5073)

      - Re-flow the map on landscape rotation and back (#5057)

      - Give MapSidebar a real landscape treatment (#5067)

      - Unbury the Sources drawer close control and the header chrome (#5058)

      - Stop a long source name from running into the connection dot (#5074)

      - Scope the non-scrollable-page rule to the channels tab (#5084)

      - Use theme text color for channel/room row buttons (#5072)


      ## Features


      - MeshCore observer device stats from the `/status` topic, Phase 5 (#5076)

      - MeshCore shared read surfaces see an MQTT ingest source, Phase 5.5 (#5083)

      - Persist MeshCore observer noise floor as telemetry (#5090)


      ## Documentation


      - Document the MeshCore MQTT ingest source (#5085)


      ## Issues Resolved


      - #5051 Animated connection badge overflows/clips Sources button

      - #5052 Map zoom control renders above Sources sidebar

