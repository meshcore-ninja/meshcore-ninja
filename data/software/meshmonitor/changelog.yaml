      # MeshMonitor v4.17.2-rc5


      > [!WARNING]

      > This is a **pre-release** for testing. Don't run it in production unless you're ready to
      report issues.


      ## Summary


      This release is a performance pass: the app, and the frontend most of all, felt slow, and the
      cause was mostly data volume. The dashboard used to download its node data twice per visit,
      uncompressed, about 35 MB each time. It now downloads it once, compressed, at about 0.23 MB.
      Every tab's code used to load up front; now each tab loads its code when you open it. The
      server no longer loads every node to answer small questions like unread counts. Background
      polling sends only what changed since the last poll, and MQTT node updates now come over the
      live socket. Typing a message no longer redraws the whole app, and long MeshCore lists draw
      only the rows on screen. This release also fixes telemetry automation triggers, which never
      fired before. They now fire, with a per-node hourly limit and a guard against loops.
      Automation cooldowns and rate limits are now kept across restarts and saves.


      ## Measured: rc4 vs rc5


      Both builds were measured one after the other on the same server and database (8 sources, ~930
      Meshtastic and ~300 MeshCore nodes). "Phone" means a phone-sized screen with the CPU slowed
      4×. Page loads and the Info tab are the median of 3 runs; API times are the median of 5.


      ### Network


      | | rc4 | rc5 | change |

      |---|---:|---:|---:|

      | Dashboard page, first load | 75.3 MB | 1.56 MB | −98% |

      | Nodes page, first load | 7.7 MB | 1.5 MB | −80% |

      | Messages page, first load | 7.6 MB | 1.1 MB | −85% |

      | Info page, first load | 8.6 MB | 1.3 MB | −85% |

      | JavaScript on first load (Nodes page) | 5.1 MB | 0.96 MB | −81% |

      | Dashboard data on the wire | 35.6 MB ×2 | 0.23 MB ×1 | −99.7% |

      | Idle page, data per minute | 1,867 KB | 12.9 KB | −99.3% |

      | `/api/poll`, steady state | 924 KB | 0.2 KB | −99.9% |


      ### Server


      | | rc4 | rc5 | change |

      |---|---:|---:|---:|

      | Dashboard response time (p50) | 611 ms | 209 ms | −66% |

      | Dashboard requests served in 20 s | 32 | 96 | +200% |

      | Health-check p95 while dashboard is busy | 630 ms | 158 ms | −75% |

      | Unread counts (p50) | 88 ms | 6.6 ms | −93% |

      | First unread (p50) | 87 ms | 6.0 ms | −93% |

      | Unified messages (p50) | 255 ms | 31 ms | −88% |

      | Aircraft trails (p50) | 320 ms | 96 ms | −70% |


      ### Browser (desktop / phone)


      | | rc4 | rc5 | change |

      |---|---:|---:|---:|

      | Dashboard: total blocking time | 1,299 / 2,981 ms | 252 / 1,187 ms | −81% / −60% |

      | Dashboard: first map marker | 3.7 / 4.8 s | 1.0 / 2.2 s | −72% / −54% |

      | Nodes: total blocking time | 451 / 594 ms | 111 / 421 ms | −75% / −29% |

      | Info tab: all charts drawn | 1.9 / 6.2 s | 0.7 / 2.0 s | −64% / −68% |

      | Info tab: total blocking time | 1,535 / 5,786 ms | 446 / 2,310 ms | −71% / −60% |

      | Typing 20 characters: components redrawn | 74,920 / 4,310 | 120 / 120 | −99.8% / −97% |

      | Typing 20 characters: script time | 645 / 550 ms | 59 / 68 ms | −91% / −88% |

      | Map pan ×5: components redrawn | 7,553 / 2,230 | 2,418 / 7 | −68% / −99.7% |

      | MeshCore node list (297 nodes): page elements | 7,869 | 1,768 | −78% |

      | MeshCore contacts list: page elements | 3,463 | 545 | −84% |


      **Trade-offs we know about:**

      - Opening a tab for the first time can take 15–75 ms longer, because that tab's code now
      downloads on first open. After that the browser serves it from cache.

      - An idle page redraws a little more often (about 36 a minute, up from 27), because live
      socket updates now replace the heavy polling.

      - The `/api/poll` change saves bytes, not server time: each poll still takes about 140 ms on
      the server.


      ## What changed


