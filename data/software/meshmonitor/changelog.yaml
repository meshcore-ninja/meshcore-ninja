      # MeshMonitor v4.16.2-rc1


      > **Pre-release.** Docker images are tagged `4.16.2-rc1` only — `:latest` still points at
      v4.16.1.


      A fix-driven RC. MQTT-only deployments now show their own data instead of an empty dashboard,
      and large node sets are usable again: the node list is virtualized and map markers cluster at
      low zoom, so a mesh fed from a public broker no longer drags scrolling and panning to a crawl.
      Three iOS 27 mobile layout bugs are fixed — the header title no longer renders inside the
      system status-bar blur, the collapsed node-list arrow no longer overlaps the Map controls
      sheet, a long custom POSIX timezone stays inside its field, and MeshCore source pages use the
      mobile layout in landscape. Map Analysis hop shading now counts only traceroutes the local
      node took part in, so remote nodes stop rendering as 0-hop. A node's position is picked by the
      freshest observation rather than the newest `lastHeard`, which also reconciles manual
      position-request responses across sources. MeshCore MULTIPART and CONTROL payloads are decoded
      rather than shown as unknown types. The rest is dependency maintenance.


      ## Features

      - feat(meshcore): decode MULTIPART and CONTROL payloads (#5308), building on the payload types
      added in #5285


      ## Bug Fixes

      - fix(mqtt): let MQTT-only deployments see their own data (#5283)

      - perf: make large node sets usable — virtualized node list, clustered map markers, one
      `/api/poll` fetch at mount (#5284)

      - fix(analysis): count hops only from traceroutes the local node took part in (#5290)

      - fix(nodes): pick the unified position by observation, not by lastHeard (#5314)

      - fix(header): keep top-bar text below iOS 27's home-screen status-bar blur (#5309)

      - fix(mobile): hide the node-list arrow under the map sheet, contain long timezones (#5313)

      - fix(meshcore): match the shell's bottom-bar query so landscape lays out (#5312)


