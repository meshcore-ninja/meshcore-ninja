      # MeshMonitor v4.17.2-rc3


      > [!WARNING]

      > This is a pre-release for testing. Use it on production systems at your own risk.


      Headless installs can now be set up from env vars on first boot. `ADMIN_PASSWORD` sets the
      first admin's password, `ENABLE_VIRTUAL_NODE` and `VIRTUAL_NODE_PORT` turn on the Virtual Node
      for the Meshtastic default source, and the new `MESHCORE_*` vars create a MeshCore default
      source over TCP or serial, with its own optional Virtual Node. These vars apply only when the
      default sources are first created. MeshCore channels now list every repeater that relayed a
      message, with its hop count, and switching channels lands on the newest messages. MeshCore DMs
      and channel messages are ordered by when they arrived, and show the sender's clock offset.
      Embed maps now show MeshCore nodes, and the per-source MeshCore map gains the ducting overlay.
      A passive Meshtastic reconnect now asks only for config, and MeshMonitor warns when another
      client holds the node's TCP slot.


      ## Features

      - First-boot env vars for headless installs: `ADMIN_PASSWORD`, `ENABLE_VIRTUAL_NODE`,
      `VIRTUAL_NODE_PORT` (#5998)

      - MeshCore default source from `MESHCORE_*` env vars; the default-password warning honours
      `ADMIN_USERNAME`; docs on the Default source corrected (#6004)

      - MeshCore: order and show DMs and channel messages by receipt time, with the sender's clock
      offset (#5996)

      - MeshCore: clear Trace SNR history per contact (#5995)

      - MeshCore: ducting overlay on the per-source MeshCore map (#5993)


      ## Bug Fixes

      - MeshCore: heard repeaters lists every relaying repeater, with hop count (#6001)

      - MeshCore: land on newest messages when switching channels (#6002)

      - Embed maps show MeshCore nodes (#6003)

      - Meshtastic: passive reconnect asks for config only; warn on TCP slot contention (#5994)


      ## Documentation

      - Funk-Itzehoe added to the Site Gallery (#5992)


      ## Translations

      - Hosted Weblate update (#5940)


      ## CI/DevOps

      - Version bump to 4.17.2-rc3 (#6006)


      ## Upgrade notes

      - Migration 218 adds a nullable `hops` column to `meshcore_heard_repeaters`.

      - The new env vars act only on first boot. Adding them to an install that already has sources
      creates nothing.


