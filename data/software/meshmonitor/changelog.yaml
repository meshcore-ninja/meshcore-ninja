    notes: >-
      ### Added

      - **MeshCore Virtual Node: configure the physical node from a companion app** — Config/admin
      commands sent from a companion app connected to a MeshCore Virtual Node are now forwarded to
      the real node (gated on the source's **Allow admin commands** setting), instead of being
      silently dropped with an `unhandled frame: code=142`. Covers node rename, radio params, TX
      power, advertised position, channel setup, and the "other params" bundle (telemetry-visibility
      modes, advert location policy, manual-add-contacts). When the flag is off, the app now
      receives an explicit rejection rather than a hang. Also adds the previously-missing **Allow
      admin commands** checkbox to the MeshCore Edit Source dialog (it was absent and hardcoded off,
      so the setting could never be enabled from the web UI). (#3904, #3905, #3906, #3907, #3910)

      - **Map: fade node markers by age instead of a hard cutoff** — On both the Dashboard map and
      Map Analysis, node markers now fade smoothly toward transparent as they age instead of popping
      in/out at the max-age threshold (Dashboard) or ignoring the time slider entirely (Map
      Analysis). Favorites stay fully opaque. (#3886, #3903)

      - **MeshCore: node-type filter on the Node Details contact list** — A compact "Filter by node
      type" dropdown next to the search/sort controls lets users with many repeaters/sensors narrow
      the list to just their companions (or any node type). (#3890, #3897)

      - **MeshCore: explicit "Unscoped" button when composing a channel message** — The channel
      "Send scope" control gains a discoverable one-click **Unscoped** option to send a channel
      message with no region scope. (#3888, #3898)

      - **MeshCore: unread red-dot indicators on Channels + Node Details** — The MeshCore
      sub-toolbar now shows the unread red-dot on its Channels and Node Details icons (matching
      Meshtastic), and gains unread tracking for direct messages, which it previously lacked
      entirely. (#3891, #3895)

      - **Automation: consolidated token reference block + MeshCore Auto-Responder token parity** —
      Each source's expansion tokens are consolidated into a single grouped reference block near the
      top of the Automation page (instead of drifting per-field legends), and MeshCore
      Auto-Responder can now expand reply-context tokens like `{HOPS}`/`{ROUTE}` that it previously
      couldn't. (#3892, #3894)


      ### Fixed

      - **MeshCore: local companion node showed blank battery** — `getAllNodes()` pushed the live
      in-memory `get_self_info` node (which has no battery field) over the DB-persisted row instead
      of merging onto it, so the Node Info panel and dashboard saw the companion's own
      `batteryMv`/`uptimeSecs` as blank even though the telemetry poller was persisting them. The
      persisted row is now merged as a base, and the poller stamps `isLocalNode: true` so the flag
      reflects reality. Adds low-battery diagnostics. (#3884, #3896)

      - **MeshCore: "Notify on Low Battery" never fired for Apprise-only / companion setups** —
      Closes two concrete gaps found by tracing the low-battery scan-and-deliver pipeline
      end-to-end, including making companion battery persistence observable and covering the
