      Docker tags are published for this build.


      Release candidate focused on message **Delivery Details** diagnostics and finishing 3D-map
      parity. A new clickable Delivery Details view surfaces per-message protocol, route, hop, and
      heard-by data — built up across five phases (diagnostics UI, exact RoutingError persistence, a
      per-message event timeline, Meshtastic Heard-By correlation, and a user guide). The 3D terrain
      map reaches visual parity with the 2D map: node markers now carry hop color, node-type glyphs,
      and age dimming; neighbor/traceroute lines are gated to visible nodes; markers open the same
      node popup; and MeshCore edge + MapAnalysis coloring follow-ups landed. This RC also adds
      received node **Status Messages** (decode + display), a MeshBeacon broadcast-interval/region
      control, an automation "Run Now" action, and an Uptime sort for the node list. Fixes include
      the rc6 3D-marker regression (MapLibre v6 worker), the Traffic Management firmware gate (now
      2.8.0), MeshCore telemetry temperature units, packet-monitor and NodeDB-sync deduplication,
      invisible message links, and sign-in reachability on permission-scoped source pages.


