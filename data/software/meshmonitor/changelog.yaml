      # MeshMonitor v4.16.2-rc6


      > ⚠️ **Pre-release.** This is a release candidate for testing. Back up your database before
      upgrading.


      ## Summary

      rc6 adds simple per-source **Message Forwarding** next to the Auto-Responder on both
      Meshtastic and MeshCore, with hard limits of 5 forwards per minute per rule and built-in loop
      guards. MeshCore gains client-side **Ignore and Block** for nodes and text patterns, since the
      firmware has none. The Automation Engine can now enable, disable or toggle another automation
      with `action.setAutomationEnabled`, and the map picker adds CARTO vector basemaps plus a
      bundled **CARTO Voyager Dark** style. MeshCore contacts corrupted by dropped serial bytes are
      now rejected and their names cleaned, and Last Heard uses the companion's own clock. The
      Packet Monitor no longer logs firmware 2.8's NodeDB replay burst as fresh receptions. A long
      run of UI fixes makes the Automation, Configuration and Settings pages fit a phone, makes
      Geofence fields commit on blur, and keeps embedded maps under the sticky nav. Server-side
      timers driven by user settings are now clamped, so an oversized interval can no longer fire
      every millisecond. This release adds migration 182.



      ### Added

      - **Message Forwarding**, per source, next to the Auto-Responder on both Meshtastic and
      MeshCore. Each rule copies a matching incoming message (DM or channel, optionally filtered by
      sender or regex) to one node or another channel on the same source, with an optional `{from}`
      / `{channel}` prefix. Each rule is hard-capped at 5 forwards per 60 s, at most 20 rules per
      source, sends never retry, and NodeDB replays are never forwarded. Channel targets show an
      airtime warning; receive-only and MQTT sources show the rules read-only. (#5446, #5455)

      - **MeshCore Ignore and Block**, for nodes and text patterns. MeshCore firmware has no block
      or mute, so MeshMonitor filters in the client. Ignore stores the message but skips
      notifications, automations, auto-ack, auto-responder, forwarding and Virtual Node relay, and
      folds runs into an "N ignored messages" row; Block drops the message on receipt. Text rules
      match exact, wildcard or regex against the sender name, body or both. Controls sit under the
      contact detail panel and in two new sections of the MeshCore source's Settings, each with hit
      counts. Migration 182. (#5408, #5469)

      - **`action.setAutomationEnabled`** in the Automation Engine enables, disables or toggles an
      automation by id (literal or `{{ }}` template), replacing the `runScript` + `curl` + API token
      workaround. (#5445, #5454)

      - **CARTO vector basemaps** (Voyager, Positron, Dark Matter) in 2D, plus a bundled **CARTO
      Voyager Dark** style: a dark map that keeps land-use colour. A CARTO key, when set, is added
      to CARTO requests only. 3D and raster-only views use each preset's matching raster tiles.
      (#5448, #5453)


      ### Changed

      - **The dev tileserver is opt-in**, and `tiles/` is a real directory again. A symlink
      committed by accident left fresh clones with a dangling `tiles` link and crash-looped the dev
      tileserver; `lint:ci` now rejects tracked symlinks. (#5470)

