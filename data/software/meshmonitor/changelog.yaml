      # MeshMonitor v4.15.1


      A patch release fixing the **Site Planner** (predictive RF coverage), which shipped broken in
      4.15.0.


      ## Bug Fixes


      - **Site Planner no longer fails with a JSON parse error** — the predictive RF coverage
      request was sent to `/rf/coverage` instead of `/api/rf/coverage`, so it fell through to the
      single-page app and returned HTML, which the frontend then tried to parse as JSON (`Unexpected
      token '<', "<!doctype "... is not valid JSON`). The request path now includes the `/api`
      prefix like every other API call, and the regression test was corrected (it had asserted the
      buggy path). (#4862)


