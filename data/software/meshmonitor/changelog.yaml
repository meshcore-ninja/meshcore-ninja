      - **Meshtastic:** free-form remote-admin CLI console (#6156)

      - **Meshtastic:** decode and show `DeviceMetadata.ble_address` (#6158)

      - **Meshtastic:** send `add_contact` before `set_favorite_node` so remote favorites stick
      (#6155)

      - **Meshtastic:** configurable default source (#6021)

      - **MeshCore:** Rooms list sort dropdown + custom order, and click-to-deselect (#6152)

      - **MeshCore:** `discover.neighbors` quick-action button for repeaters (#6146)

      - **MeshCore:** ducting overlay on the per-source map (#5993)

      - **MeshCore:** order DMs/channel messages by receipt time (#5994)

      - **MeshCore:** purge non-favourite nodes from device config (#6110)

      - **MeshCore:** clear Trace SNR history per contact (#5995)

      - **MeshCore:** Auto Ping for Companion sources (#5962)

      - **Map:** live packet traffic on the map (#5971)

      - **Map:** colour node markers by source on the Unified map (#6129)

