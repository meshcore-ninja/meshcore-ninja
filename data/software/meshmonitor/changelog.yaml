      # MeshMonitor v4.16.2-rc2


      > **Pre-release.** Docker images are tagged `4.16.2-rc2` only — `:latest` still points at
      v4.16.1.


      Two features and two fixes on top of rc1. You can now add a node straight from a Meshtastic
      contact link and message it before it has ever been heard on the mesh; such nodes carry an
      "Imported" badge until they are. NodeInfo Enrichment's "Fix All" can now run on a schedule
      from Settings → Auto-Enrichment — it ships **off**, schedules are floored at one hour, and the
      optional push to the device NodeDB is capped at 25 NodeInfo requests per run, 30 s apart. The
      LoRa Radio Configuration panel reports the correct frequency for every preset that is not 250
      kHz wide, where it previously used a stale bandwidth field, and shows presets 9–16 by name
      instead of `Unknown (9)`. On iOS home-screen apps the node list now fills the phone, and the
      status-bar blur gap from rc1 applies more reliably.


      ## Features

      - feat(nodes): add a node from a Meshtastic contact URL (#5318) — closes #5317

      - feat(enrichment): run NodeInfo Enrichment Fix All on a schedule (#5322) — closes #5287


      ## Bug Fixes

      - fix(lora): follow use_preset for bandwidth, and name presets 9-16 (#5321) — closes #5320

      - fix(mobile): node list fills the phone; blur gap without Version/NN (#5319) — #5316, #5286


      ## Issues Resolved

      - #5317 — add nodes using their contact URLs

      - #5287 — schedule NodeInfo Enrichment Fix All

      - #5320 — presets above SHORT_TURBO show "Unknown (N)" and report the wrong frequency

      - #5316 — node list does not fill the phone in the iOS home-screen app


      ## Thanks

      - @zaepho for #5320/#5321 — a precise report, a bench-radio correction that changed the fix,
      and the fix itself

      - @ogarcia for the contact-URL request (#5317)

      - NullVoid (`null_v0id` on Discord) for the scheduled-enrichment request and continued iOS 27
      testing


      ## Upgrade notes

      - **Migration 168** adds `nodes.importedAt` on all three backends. Nullable, no backfill.

      - **Auto-Enrichment is disabled by default.** Enabling it does not run immediately; the first
      run lands one full period later, or use **Run now**.

      - A device backup of a node on a preset above `SHORT_TURBO` now records the preset name
      instead of a bare number, and restores it correctly.


      ## Please test on iOS 27

      - **Home-screen app layout** (#5316, #5310): the node list and bottom nav bar should now reach
      the bottom of the screen on per-source pages.

      - **Header blur** (#5286, reopened): the top bar should read sharply in the home-screen app,
      including on devices whose user agent lacks a `Version/NN` token. The issue stays open until
      confirmed on a device.


      **Full Changelog**: https://github.com/Yeraze/meshmonitor/compare/v4.16.2-rc1...v4.16.2-rc2


