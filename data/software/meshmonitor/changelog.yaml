      # MeshMonitor v4.17.3-rc4


      > [!WARNING]

      > This is a **pre-release** for testing. It adds three database migrations (225–227) and
      several permission and notification changes, listed under **Upgrade notes**. Back up your
      database before upgrading.


      This release brings MeshCore up to parity with Meshtastic across most of the app, using one
      shared implementation for both protocols wherever they overlap. MeshCore gains Repeater and
      Room Server settings forms (local and remote), message, server-event and trace notifications,
      a Security view with packet-rate and clock-offset checks, per-source device-config backups,
      and MeshCore traces in the Traceroute Explorer. Mesh Issues gains node-health rules (stale, no
      position, low battery, bad position) for both protocols, and MeshCore MQTT region feeds get
      their own Notifications tab with broker-link alerts. Settings, messaging, node and DM lists,
      the Packet Monitor, maps, dashboard widgets, the v1 API and Prometheus now cover MeshCore too.
      It also closes a security hole where a user with configuration read access on one source could
      download another source's device backup (including channel keys), and writes backup files
      readable only by the server. Notifications now honour per-DM mutes for push and Apprise on
      Meshtastic as well, and desktop-only installs receive message alerts.


      ## Upgrade notes

      - **Migrations 225–227** run on start (MeshCore trace attempt log, per-source backup history,
      MeshCore security flags) on SQLite, PostgreSQL and MySQL.

      - **Device backups:** downloading or creating a backup now needs `configuration:write` on the
      source (was read). Backups and their schedule are per source; the old global schedule moves to
      the primary Meshtastic source and other sources start with backups off. Pre-upgrade files go
      to the only Meshtastic source if there is exactly one, otherwise they are admin-only. Files
      are now saved with mode 0600 (existing files are tightened on first start) and named `mt-…` /
      `mc-…` in UTC.

      - **Meshtastic backups no longer include the node's private key.** Older backup files are
      unchanged; delete them if that matters to you.

      - **Security digests:** the digest settings saved in the Security tab were never read before,
      so the digest reported "No Apprise URL configured". They are now saved per source with a
      fallback to the global value, so **installs with a global Apprise URL start receiving MeshCore
      security digests** (one per MeshCore source per day, only when there are issues).

      - **Security permissions:** the Security issues, export and key-mismatch reads now need
      `nodes:read` on the source, for Meshtastic too.

      - **v1 API:** for MeshCore Companion sources, `/api/v1/traceroutes` (and `/network`,
      `/network/topology`) reported `toNodeId` equal to `fromNodeId`. Traces are now a round trip:
      `fromNode*` is your radio, `toNode*` is the target or turnaround hop, and
      `routeBack`/`snrBack` hold the return leg.

      - **MeshCore DM alerts:** saved MeshCore notification settings already had "Direct messages"
      on (the control was hidden), so existing MeshCore push subscribers start receiving DM and
      room-post alerts. Turn **Direct messages and room posts** off on that source's Notifications
      tab if you don't want them.

      - **Repeater new-node alerts:** Repeater sources whose "Newly Found Nodes" toggle was saved as
      on start alerting after a 48 h learning period (an existing Repeater that has logged longer
      alerts from the first new node), capped at 10 per hour per source.

      - **Meshtastic DM mute:** muting a DM now also silences its push and Apprise alerts (it
      previously only affected the unread badge).


      ## Features

      - MeshCore Security P7b: packet rates, clock offset, scanner, digest, export, draft
      notification DM (#6281) #6314

      - Per-source, protocol-aware device backups (Meshtastic and MeshCore Companion) (#6285) #6313

      - Notifications tab for MeshCore MQTT region feeds, broker-link alerts for MeshCore MQTT and
      Meshtastic MQTT bridges (#6307) #6312

      - MeshCore traces in the Traceroute Exp

