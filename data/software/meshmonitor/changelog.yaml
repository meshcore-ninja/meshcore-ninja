      # MeshMonitor v4.17.0-rc2


      > [!WARNING]

      > This is a **pre-release** for testing. It is not tagged `latest`. Use it on a test install
      or with a recent backup.


      ## Summary


      This release brings inline message translation, contributed by @Crim. Translations are cached,
      so a phrase is sent to the provider once and every viewer sees the stored result. MeshCore
      repeaters attached over USB or serial now fill in their Nodes list, Packet Monitor and local
      health telemetry from the serial CLI. Automations gain working **Node discovered** triggers on
      both protocols and MeshCore **Node updated** triggers, plus new `packetId` and `packetHash`
      tokens. The MeshCore channel list adds message-count sorting and last-message times. Other
      MeshCore additions:

      - resend for channel messages that no repeater echoed

      - Discover Path feedback

      - favoriting from Node Details

      - a clearer contact auto-add view


      Other new features:

      - a Traceroute Explorer report

      - a filtered CSV export for messages

      - a one-click shortcut from a node's Remote Admin badge into Admin Commands


      Fixes cover channel mutes on multi-source installs, vector basemaps crashing with clustering,
      MeshCore message search in the v1 API, and migrations on shared MySQL/PostgreSQL servers. The
      main JS bundle is split into lazy-loaded routes, and a new CI budget keeps it from growing
      back.


      ## Features

      - Inline translation of messages (#5480), by @Crim

      - Translation cache + stored translations for every viewer (#5527)

      - MeshCore: populate a repeater source's Nodes and Packet Monitor from its serial CLI (#5505)

      - MeshCore: local telemetry for directly-attached repeaters (#5539)

      - MeshCore: message count sort and last-message times in the channel list (#5506)

      - MeshCore: Discover Path countdown and response / no-response feedback (#5509)

      - MeshCore: favorite a node from Node Details (#5510)

      - MeshCore: show auto-add state, push contacts to the radio, explain the mismatch (#5513)

      - MeshCore: resend channel messages no repeater echoed (#5525)

      - Automations: node discovered/updated triggers for both protocols + packet tokens (#5540)

      - Reports: Traceroute Explorer report card (#5514)

      - Messages: filtered CSV export + search fixes (#5523)

      - Notifications: per-source channel mute fix + MeshCore channel mute (#5522)

      - Nodes: remote admin shortcut from node details (#5541)


      ## Bug Fixes

      - Map: vector basemaps crash with node clustering (#5521)

      - Notifications: partial preference saves so the Notifications tab can't drop mutes (#5528)

      - API: v1 message search reads MeshCore history from the database (#5529)

      - DB: scope migration information_schema checks to the current database (#5531)

      - Messages: enforce the 2-character search minimum on the server (#5536)


      ## Performance / Build / CI

      - Split the main bundle (#5530)

      - Raise service-worker precache cap to 6 MiB (#5524)

      - Track JS bundle size budgets in CI (#5538)

      - Bump version to 4.17.0-rc2 (#5542)


