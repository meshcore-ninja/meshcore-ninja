      # MeshMonitor v4.18.0-rc1


      > [!WARNING]

      > This is a **pre-release** for testing. It adds database migrations (235, 236). Back up your
      database before upgrading, and don't run it in production unless you are helping test.


      ## Summary


      4.18.0 adds two new ways to connect without a radio. A new **MeshCore MQTT broker** source
      runs an MQTT broker inside MeshMonitor. MeshCore observers connect to it with token auth and
      an allowlist, and you can opt in to forwarding traffic upstream. Meshtastic sources can now
      **send messages over MQTT with no radio attached**, and a PKI nonce fix restores server-side
      decryption of PKI DMs. Notifications gain **mesh-wide defaults with per-source overrides**,
      and the same event heard on several sources now notifies you only once. A new **Direct RF
      Contacts** history lists nodes heard at 0 hops over RF, for both Meshtastic and MeshCore.
      Anonymous viewers no longer see nodes that have not consented to MQTT. Smaller additions: a
      warning when LoRa transparent mode is on, the nRF52 bootloader version, and gateway names on
      the map. Fixes cover position requests, which now carry an empty Position. They also cover
      MeshCore Cayenne-LPP telemetry losing sensors after an altitude record, and neighbor info
      mixing data across sources.


      ## Features

      - Embedded MeshCore MQTT broker source with upstream forwarding (#6400)

      - Send Meshtastic messages over MQTT with no radio; fix PKI nonce layout (#6395)

      - Mesh-wide notification defaults, per-source overrides, cross-source dedup (#6394)

      - Hide no-MQTT-consent nodes from anonymous viewers (#6393)

      - Warn on LoRa transparent mode; show nRF52 bootloader version (#6392)

      - Direct RF Contacts history for Meshtastic and MeshCore (#6388)

      - Gateway names in the map's gateway legend and popup chips (#6387)


      ## Bug Fixes

