      # MeshMonitor v4.17.2-rc2


      > [!WARNING]

      > This is a pre-release for testing. Use it on production systems at your own risk.


      The map can now show live packet traffic. Turn on **Live packet traffic** in Map Features, and
      each packet a source hears flies as a dot to the node that heard it, then a ring pulses out
      from that node. It works for Meshtastic, MQTT and MeshCore sources on the source Map tab, the
      Dashboard and the MeshCore map. It needs Packet Monitor read access, works with packet logging
      off, stores nothing and sends nothing on the mesh. A slider caps the dots per second, and a
      readout counts the last minute's packets: received, drawn, skipped for no position, and over
      the limit. Every source type now calls its map tab **Map**, and MeshCore opens on the map on
      phones. This RC also takes a round of dependency updates, including i18next 26.5 with the type
      fixes it needs.


      ## Features

