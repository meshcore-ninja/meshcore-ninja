      # MeshMonitor v4.17.3-rc5


      > [!WARNING]

      > This is a pre-release for testing. Do not use it in production.


      ## Summary


      This RC finishes the Meshtastic ↔ MeshCore parity audit (#6226). Auto Responder, Timer
      Triggers, Auto Announce and automations now split long MeshCore messages, and Meshtastic uses
      the same splitter. MeshCore message length caps now match firmware. A new MQTT root topic
      finder samples a broker (subscribe-only) and suggests roots near you. It names your state and
      city offline, can find MeshCore IATA regions, and admins can opt in to a daily refresh of the
      community topic list. The server now rejects an invalid MQTT root topic when you change it.
      New MeshCore alerts cover a repeater clock out of sync and a confirmed new neighbour. API
      callers can send MeshCore channel messages under an allowed sender name. Rooms show stored
      posts read-only without a live login, and you can change a room's Auto-sync without logging
      in. Notification services get a configurable message text length.


      ## Features

      - MeshCore: split long messages in Auto Responder, Timer Triggers, Auto Announce and
      automations (#6316) #6329

      - Automation: Meshtastic long-message split through the shared splitter (#6330) #6339

      - MQTT: root topic finder, a subscribe-only broker sample (#6287) #6328

      - MeshCore: IATA region finder for MeshCore MQTT ingest (#6335) #6343

      - MQTT: offline geocoder for root finder state and city rows (#6336) #6345

      - MQTT: opt-in live refresh of the root finder's community directory (#6337) #6346

      - MeshCore: clock-out-of-sync alert from passive advert sampling (#6273) #6327

      - Automation: MeshCore confirmed new-neighbour alert (#6274) #6334

      - MeshCore: optional senderName for API channel sends, per-source allowlist (#6282) #6331

      - MeshCore: show stored room posts read-only without a live login (#6332) #6333

      - Notifications: configurable message text length per service (#6278) #6326

      - MeshCore: Packet Monitor origin column never guesses, gates names on nodes:read, adds a
      TX/RX marker (#6265) #6324


      ## Bug Fixes

      - MQTT: reject invalid MQTT root topics server-side on save (#6338) #6344

      - MeshCore: message length caps match firmware (#6303, #6304) #6323

      - MeshCore: change room Auto-sync from the login card without logging in (#6267) #6320

      - Automations: Template Gallery node picker and multi-automation naming (#6271, #6272) #6322

      - MeshCore: key-gate MQTT feed channel messages by filing them under their key (#6308) #6318


      ## CI/DevOps

      - Desktop: macOS x64 release build on macos-latest #6317


      ## Translations

      - Translations update from Hosted Weblate #6222


      ## Dependencies

      - i18next 26.5.11 → 27.0.0 #6298

      - @noble/curves 1.9.7 → 2.4.0 #6300

      - leaflet.heat 0.2.0 → 1.0.0 #6296

      - vitest group #6291

