      # MeshMonitor v4.16.0-rc3


      > **Pre-release.** This is a release candidate for 4.16.0. It is not tagged `latest` and does
      not publish `:latest` Docker tags. Run it on a mesh you can afford to have misbehave, and
      please report anything odd.


      This RC is dominated by two threads. The first is **adapting to Meshtastic 2.8**, whose
      behavioral changes break assumptions MeshMonitor had baked in: node numbers are now derived
      from a node's public key rather than its MAC, so an upgrading node reappears as a stranger
      with its history orphaned; position and telemetry broadcast became opt-in, so previously
      chatty nodes go quiet; and Range Test was removed from every 2.8 build. MeshMonitor now
      detects key-verified identity changes and offers an operator-initiated history merge with a
      dry-run preview and an undo journal, explains a silent 2.8 node instead of leaving you to
      guess, and disables Range Test with a notice rather than failing quietly. The second thread is
      **mobile landscape**, where five separate reports turned out to share one root cause: mobile
      CSS gated on `max-width` alone silently switches off when a phone rotates, because a landscape
      phone is wider than the 768px breakpoint. That single mistake was hiding the Sources drawer's
      close control, misrendering the bottom nav, leaving the map frozen at the wrong size until
      reload, and stranding the map sidebar as a cramped floating panel.


      Also here: MeshBeacon transmit configuration is corrected twice over — once for a stale
      module-config cache that made saves appear to revert, and once for firmware field removals
      that made them genuinely impossible — the MeshCore MQTT ingest epic advances through four
      phases, and a firmware-sourced audit corrects a batch of config help text that had been
      quietly lying about firmware limits.


