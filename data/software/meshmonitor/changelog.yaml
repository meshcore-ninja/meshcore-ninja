      ## Summary


      rc3 replaces rc2, whose Docker build ran past its 40-minute limit three times and never
      published images. It carries all of rc2 (see the [rc2
      notes](https://github.com/Yeraze/meshmonitor/releases/tag/v4.17.1-rc2)) plus two changes. The
      Packet Monitor and packet counters now spot firmware 2.8 NodeDB replays by their packet id, so
      the burst of fake "LoRa" rows on each reconnect is gone again, even for nodes heard a minute
      ago. The Docker release build now has 70 minutes to finish.


      ## Bug Fixes


      - **Packet Monitor: recognise firmware 2.8 NodeDB replays by packet id** (#5803, refs #5426).
      Firmware 2.8.0+ stamps a replay with the node's last-heard time, so an age check let it
      through. MeshMonitor now recomputes the firmware's replay id from the sender and `rx_time`,
      and also drops RF rows that carry neither RSSI nor a usable `rx_time`.


      ## CI/DevOps


      - **Docker: raise the amd64/arm64 release build timeout to 70 minutes** (#5804)

      - Version bump to 4.17.1-rc3 (#5806)


