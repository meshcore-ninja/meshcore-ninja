      or with a recent backup.


      ## Summary


      This release candidate fixes the Windows desktop app, whose landing page loaded white on a
      cold start: the Windows build shipped without its theme styles. System backups now cover every
      table and stream the export, so large databases back up again; a backup is now a secret and
      its download is admin-only. Message notifications get a user-set format with the source shown
      once, each source keeps its own notification settings, and the Notifications page follows the
      light theme. MeshCore gains plaintext for channel packets in the Packet Monitor, split or
      truncated long auto-acknowledge replies, a serial health probe for repeaters, a faster-failing
      Trace Path, and merged rows in Unified Messages when several sources hear one message.
      Translation providers each keep their own API key, and OpenAI-compatible base URLs resolve
      correctly. Traceroutes now read the same way everywhere, and source connection details no
      longer reach viewers who lack the right grant.


