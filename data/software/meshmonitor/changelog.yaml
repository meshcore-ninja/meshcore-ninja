      # MeshMonitor v4.14.2-rc4


      > ⚠️ **Pre-release (release candidate).** Not tagged `:latest`. For testing ahead of the
      4.14.2 final.


      This release candidate rolls up six changes on top of rc3. On the feature side, the RF **site
      planner UI** makes predictive coverage reachable — a Fresnel + path-loss tool with a dedicated
      panel for estimating reach from a node or a map-click origin. Public-key mismatches now come
      with a clear explanation instead of a bare assertion. Waypoint scheduled rebroadcasts keep
      their off-by-default behavior and gain a warning about Android notification spam when you do
      enable them. On the fix side, firmware region names now resolve correctly and MeshMonitor no
      longer writes `UNSET` back to radios, Polish is offered as a UI language (with CI now failing
      when a ready translation isn't listed), and messages that mention `areyoumeshingwith.us` no
      longer vanish from the chat view. No database migrations or schema changes are included.


      ## Features

      - RF site planner UI — predictive coverage becomes reachable (#4727)

      - Explain a public-key mismatch instead of asserting one (#4738)

      - Warn about Android notification spam when enabling waypoint rebroadcast; still off by
      default (#4752)


      ## Bug Fixes

      - Resolve every firmware region name; stop writing `UNSET` back to radios (#4749)

      - Offer Polish, and fail CI when a ready translation is not listed (#4748)

      - Stop hiding real messages that mention `areyoumeshingwith.us` when link previews are off
      (#4751)


      ## Issues Resolved

      - #4751 — Messages with URLs vanish from chat when link previews disabled

      - #4752 — Scheduled waypoint rebroadcasts: keep, default off, warn about Android notifications

      - #4749 — Firmware region name resolution / UNSET write-back


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.14.2-rc3...v4.14.2-rc4


