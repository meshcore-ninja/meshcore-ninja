    notes: >-
      # MeshMonitor v4.17.1-rc9


      > ⚠️ **Pre-release.** This is a release candidate for testing. Use a stable release in
      production.


      This release candidate adds an overlay for tropospheric ducting on the Map tab and the
      Dashboard map. It also round-trips the firmware's waypoint geofence fields (radius, bounding
      box and enter/exit alerts). You can draw and edit them in the waypoint editor, and the map
      shows them. Auto-Responder triggers now have a Pattern or Regex match mode on both Meshtastic
      and MeshCore, and both source types share one matcher. Triggers now accept emoji and any
      printable Unicode text. MeshCore pattern triggers gain `{param}` capture and
      lookalike-character normalisation. The MeshCore Virtual Node sends a firmware-v3 DeviceInfo
      frame, so MeshCore One and other apps read its capacities correctly. MeshCore traces to
      direct-neighbour repeaters now route through the repeater's own hash. The Configuration tab
      now refetches channels after Reload Config on Device. A node's channel is now recorded only
      from its own key-decoded traffic, not from PKI, spoofed or replayed packets.


      ## Features

      - feat(map): tropospheric ducting overlay UI on the Map tab and Dashboard map (#5913)

      - feat(waypoints): round-trip firmware waypoint geofence fields (#5925)

      - feat(automation): one Auto-Responder trigger syntax for Meshtastic and MeshCore (#5930)


      ## Bug Fixes

      - fix(meshcore): trace direct-neighbour repeaters through their own hash (#5915)

      - fix(meshcore): send a firmware-v3 DeviceInfo from the Virtual Node (#5917)

      - fix(config): refetch channels after Reload Config on Device (#5920)

      - fix(nodes): record a node's channel only from its own key-decoded traffic (#5926)


      ## Chores

      - chore: bump version to 4.17.1-rc9 (#5932)


      ## Issues Resolved

      #5734, #5914, #5916, #5919, #5922, #5923, #5924


      ## Upgrade notes

      - Migration 216 adds the waypoint geofence columns. It runs automatically.

      - Forwarding-rule and MeshCore Auto-Acknowledge regexes now accept emoji and other non-ASCII
      printable text. They still reject control characters, and the 100-character cap and ReDoS
      checks still apply.


      **Full Changelog**: https://github.com/Yeraze/meshmonitor/compare/v4.17.1-rc8...v4.17.1-rc9


