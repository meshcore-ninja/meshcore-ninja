      ## Summary


      This release candidate adds **passkey sign-in** for local accounts. You can sign in with a
      device fingerprint, face or PIN, turn password sign-in off for a passkey-only account, and get
      back in with one-time recovery codes. Admins can see and revoke a user's passkeys from the
      Users page. Passkeys need HTTPS (or `http://localhost`) and bind to the hostname where you add
      them; the optional `WEBAUTHN_RP_ID` and `WEBAUTHN_ORIGINS` settings cover reverse proxies and
      multiple hostnames. Auto-Acknowledge gains a separate **IP (MQTT / UDP)** row, so messages
      that arrived over the internet no longer use the 0-hop or multi-hop settings; the new row
      starts **off**. MeshCore contacts can now take a manual location override, as Meshtastic nodes
      already could. The MeshCore Configuration and Automations pages get the same search box and
      section buttons as the Meshtastic pages. Show MQTT/Bridge Messages is now remembered per
      source, and tapping a node in Traceroute mode draws its newest answered run again.


