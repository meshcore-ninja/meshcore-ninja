      # MeshMonitor v4.13.1-rc4


      > ⚠️ **Pre-release (release candidate).** This build is for testing ahead of the v4.13.1
      stable release. Not recommended for production deployments.


      This fourth release candidate continues the Meshtastic 2.8 readiness work and lands a mix of
      node-detail and map improvements on top of rc3. It adds a `noIndexEnabled` privacy toggle so a
      publicly-exposed dashboard can serve `X-Robots-Tag: noindex, nofollow` headers plus a
      disallow-all `/robots.txt` (belt-and-suspenders for Cloudflare-tunnel setups that strip custom
      headers). On the 2.8 front, it decodes `MESH_BEACON_APP` with firmware-verified preset channel
      names, pins the 2.8-preview protobufs with a 2.7 TrafficManagement compat shim, adds an XEdDSA
      signature shield in the Packet Monitor, and ships the MEDIUM_TURBO preset with 2.8 opt-in
      docs. Node detail gains a derived signal-trend / link-attenuation badge and a Noise Floor
      quick-stat. Two bug fixes round it out: chat from unsynced-clock nodes no longer renders at
      ~1970, and cluster spiderfy no longer opens the popup for a nearby unrelated node.


      ## Features

      - **Privacy:** `noIndexEnabled` toggle serving `X-Robots-Tag: noindex, nofollow` +
      disallow-all `/robots.txt` (#4212, closes #4202)

      - **2.8 / Packet Monitor:** XEdDSA signature shield for firmware 2.8 packets (#4209)

      - **2.8 / MeshBeacon:** decode `MESH_BEACON_APP` + firmware-verified preset channel names
      (#4207)

      - **2.8 / Protobufs:** pin 2.8-preview `develop@ba16bfc` with 2.7 TrafficManagement compat
      shim (#4205)

      - **Nodes:** derived signal-trend / link-attenuation badge per node (#4204, closes #4110)

      - **Nodes:** show Noise Floor on the Node Detail quick-stats card (#4201, closes #4109)

      - **2.8:** MEDIUM_TURBO preset, `MESH_BEACON_APP` portnum, traffic-management & 2.8 opt-in
      docs (#4200)


      ## Bug Fixes

      - **Messages:** stop unsynced-RTC nodes rendering chat at ~1970 (rxTime now clamped to receipt
      time) (#4208, closes #4206)

      - **Map:** spiderfy no longer selects a nearby unrelated node instead of fanning the cluster
      (#4203, closes #4199)


      ## Issues Resolved

      - #4202 — [FEAT] Robots.txt / X-Robots-Tag toggle to discourage crawlers/bots

      - #4206 — [BUG] Chat from unsynced-clock nodes renders at ~1970

      - #4199 — [BUG] Spiderfy click opens popup for wrong nearby node

      - #4109 — [FEAT] Show Noise Floor on Node Detail quick-stats card

      - #4110 — [FEAT] Derived signal-trend / link-attenuation indicator per node

      - #4074 — Modem preset tables missing MEDIUM_TURBO (enum 16)

      - #3999 — [2.8 tracking] Position & telemetry broadcast now opt-in by default

      - #3547 — Docs: Traffic Management module documentation


      **Full changelog:** https://github.com/Yeraze/meshmonitor/compare/v4.13.1-rc3...v4.13.1-rc4


