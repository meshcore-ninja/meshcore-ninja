      row, which starts off on every install. If you relied on the multi-hop (or 0-hop) row to
      answer MQTT/UDP messages, turn on the IP row under Automation → Auto Acknowledge.

      - **Passkeys** are optional. Nothing changes until a user adds one. See the [Passkeys
