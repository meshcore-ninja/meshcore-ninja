    notes: >-
      # MeshMonitor v4.16.1-rc3


      > ⚠️ **Pre-release.** This is a release candidate for testing. Docker images are published
      without the `:latest` tag. Report anything you find on
      [Discord](https://discord.gg/JVR3VBETQE) or as a GitHub issue.


      A security-led candidate. Four API endpoints checked permissions without a source id and then
      answered for whatever source the caller named in `?sourceId=`, so an account holding a grant
      on any one source could read another source's data — DM counts, oldest-unread timestamps, and
      in the worst two cases the message bodies themselves. All four are fixed and each carries a
      regression test that was verified to fail without its fix. Alongside that, configuration
      search arrives across every settings page, waypoints can now raise an arrival alert with a
      radius and deduplication, and the Sources sidebar gains a "Mark all read" action that clears
      every source's unread DM badge in one request. On the build side the armv7 Docker image now
      compiles its JavaScript natively instead of under QEMU, cutting that leg by about 42%, and a
      new Retag workflow can re-point `:dev` at an already-built version in a minute rather than a
      forty-minute rebuild. A long-standing `react-leaflet` mock gap that had been failing CI
      intermittently for days is also closed. Eleven dependency bumps land too, including React
      19.3.0 — now grouped in Dependabot so `react` and `react-dom` can never again be split into
