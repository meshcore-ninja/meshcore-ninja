      # MeshMonitor v4.13.2


      This release finishes the **ATAK / CoT** work, teaches MeshMonitor to respect a node that
      cannot transmit, adds a **3D terrain view**, and catches gateways that uplink traffic their
      senders asked to keep off MQTT.


      **If you run PostgreSQL or MySQL, take this release.** Those two backends re-ran every
      migration on each boot, and migration 030 rebuilds `route_segments` from scratch — 865k rows
      deleted and reinserted on every restart for one reporting install. SQLite was never affected.


      See the [release blog post](https://meshmonitor.org/blog/2026-07-27-v4.13.2-release) for the
      narrative walkthrough, and the
      [CHANGELOG](https://github.com/Yeraze/meshmonitor/blob/main/CHANGELOG.md) for all 49 entries.


      ## Fix first: PostgreSQL / MySQL migration ledger


      - The `settingsKey` idempotency guard was SQLite-only, so PostgreSQL and MySQL replayed all
      128 migrations at every start. Both backends now record applied migrations in a ledger.
      (#4233)


      ## ATAK / CoT


      - **Packet decoding** for ATAK plugin portnum 72 (`TAKPacket`) and portnum 78 (`TAKPacketV2`,
      zstd-compressed against the vendored TAKPacket-SDK dictionaries) — position, GeoChat, markers,
      routes, CASEVAC, emergency. GeoChat messages persist into Messages. (#3691 Phase 1, #4317)

      - **ATAK contacts on every map** — team-colored callsign markers with a `Show ATAK Contacts`
      toggle, STALE badge after 15 minutes, purge after 24 hours. (#3691 Phase 2)

      - **CoT TCP feed** for ATAK / WinTAK — settings-gated, streams Cursor-on-Target XML covering
      ATAK contacts plus every positioned Meshtastic and MeshCore node from every source. No
      authentication or encryption; trusted-network only. (#3691 Phase 3)


      ## Receive-only nodes


      - MeshMonitor now honors `lora.tx_enabled`. A central server-side guard rejects every transmit
      path, the UI disables transmit-dependent controls with an explanation instead of failing at
      the radio, and config import reads live remote LoRa config so it cannot flip TX back on by
      accident. New [Receive-only mode](https://meshmonitor.org/features/receive-only-mode) guide.
      (#4294, #4315)


      ## MQTT


      - **ok_to_mqtt violation detection** — flags gateways that uplink packets from nodes that
      opted out, with 90 days of history and an **ok_to_mqtt Violations** report (per-gateway and
      per-packet views, node names, CSV export, SQL-side paging). (#4114, #4330, #4343)

      - **Configurable downlink hop-limit override** (0–7) on the embedded broker, replacing the
      zero-hop toggle. (#4081)

      - **Auto-delete-by-distance applies at ingest**, so an out-of-radius node never reaches the
      map. (#3900)


      ## Maps


      - **3D terrain view** on Map Analysis (MapLibre + server-side DEM proxy), with node markers,
      neighbor links, and traceroute paths in 3D and a clean fallback without WebGL. (#3826)

      - **Terrain Link Profile refinements** — antenna AGL seeded from node altitude, clickable thin
      neighbor links, terrain analysis on route segments. (#4253, #4254)

      - `ROUTER_LATE` is distinguishable from `ROUTER`, unmessageable nodes show a badge, and the
      Nodes tab is now called **Map**. (#4295, #4325)


