      # MeshMonitor v4.18.1-rc7


      > [!WARNING]

      > This is a pre-release for testing. It may contain bugs; don't run it on a production
      instance you can't roll back.


      ## Summary


      This RC rebuilds Solar Monitoring (#6523). Each node now gets its own sunlight curve:
      MeshMonitor fetches hourly shortwave radiation and cloud cover from Open-Meteo for every
      active node's grid cell and draws it behind that node's telemetry, on the Dashboard and in the
      Analysis report, whose forecast now runs per node. forecast.solar and its single-location
      settings are gone. An admin picks a grid cell size and a refresh interval, and the settings
      page estimates calls per day for the mesh; without an API key MeshMonitor stays under 9,000
      calls a day, counted in the database so restarts don't reset it. Only cell centres are sent,
      never exact or private positions. Telemetry charts now show times in the node's own time zone,
      looked up on the server from its position, with a per-node override and a caption naming the
      zone. MeshCore's Message Route modal shows last-hop SNR/RSSI. The rest is dependency updates.


      ## Features

      - feat(solar): per-node Open-Meteo sunlight + cloud cover backend (#6554)

      - feat(solar): Open-Meteo settings, per-node chart overlay and Analysis report; remove
      forecast.solar (#6555)

      - feat(timezone): per-node time zone for telemetry charts (#6556)

      - feat(timezone): node zone on Unified Telemetry, packet-rate, transport and trace SNR charts
      (#6560)

      - feat(meshcore): show last-hop SNR/RSSI in the Message Route modal (#6552)


      ## Bug Fixes

      - fix(solar): request forecast.solar timestamps in UTC (#6553)


      ## Documentation

      - docs(blog): solar monitoring rebuilt per node, with upgrade notes (#6561)


      ## Chores

      - chore: bump version to 4.18.1-rc7 (#6562)


      ## Dependencies

      - bump the production-dependencies group (10 updates) (#6543)

      - bump @simplewebauthn/server 14.0.3 → 14.1.0 (#6544)

      - bump openid-client 6.8.9 → 6.9.0 (#6545)

      - bump @typescript-eslint/eslint-plugin (#6546)

      - bump lucide-react 1.65.0 → 1.77.0 (#6547)

      - bump i18next 27.0.0 → 27.2.2 (#6548)

      - bump @testing-library/jest-dom 7.0.1 → 8.0.0 (#6549)

      - bump i18next-http-backend 4.0.10 → 4.1.0 (#6550)

      - bump the development-dependencies group (3 updates) (#6542)

      - bump the vitest group (3 updates) (#6541)


      ## Issues Resolved

      - #6523 Per-node solar estimates from node GPS + fix forecast.solar timezone parsing

      - #6551 MeshCore: show last-hop SNR/RSSI in Message Route modal


      ## Upgrade notes

      See the [Solar Monitoring blog
      post](https://meshmonitor.org/blog/2026-11-24-solar-monitoring-per-node) for the full
      checklist.

      - **Solar settings replaced.** Latitude, longitude, azimuth and declination are removed. The
      on/off toggle carries over: if Solar Monitoring was on, MeshMonitor starts calling Open-Meteo
      within the hour. Review grid size and refresh interval in Global Settings → Solar Monitoring
      first.

      - **Open-Meteo free tier is non-commercial.** Leave the API key blank for the free tier;
      commercial use needs a paid key.

      - **Old solar data deleted.** Migrations 244/246 purge and drop `solar_estimates`; per-node
      history builds up after the first pass.

      - **Outbound access:** allow HTTPS to `api.open-meteo.com` (`customer-api.open-meteo.com` with
      a key).

      - **Time zones:** nodes with no position use the container's `TZ`.

      - **Breaking API changes:** `/api/v1/solar` and `/api/v1/solar/range` →
      `/api/v1/sources/:sourceId/solar`; `/api/solar/estimates*` → `/api/solar/irradiance`; `POST
      /api/solar/trigger` → `POST /api/solar/refresh`; `/api/analysis/solar-forecast` response is
      now per node.

      - New migrations: 244–247 (247 adds `timezoneOverride` to `nodes` and `meshcore_nodes`).


      **Full Changelog**: https://github.com/Yeraze/meshmonitor/compare/v4.18.1-rc5...v4.18.1-rc7


