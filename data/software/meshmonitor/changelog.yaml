      or with a recent backup.


      ## Summary


      This release candidate is mostly a permissions release. Until now, many routes checked a
      per-source permission on *any* source, so a grant on one source could read, change or transmit
      on another. Every such route now checks the source it acts on: device configuration, mesh
      requests, messages, channels, nodes, settings, the poll, the v1 API, public embeds and the
      live WebSocket feed. Admins are unaffected apart from a few replies that now name one source
      instead of all of them; users with limited grants will see less than before, by design. On the
      feature side, every number field can now be cleared while editing, the sender's name in a
      channel or DM opens the node popup with its status, TAK team and role are configurable, and
      the Reticulum source page works on phones. Saving a config section no longer turns a node's
      "firmware default" position interval into a 32-second broadcast.


