      firmware has none. The Automation Engine can now enable, disable or toggle another automation
      with `action.setAutomationEnabled`, and the map picker adds CARTO vector basemaps plus a
      bundled **CARTO Voyager Dark** style. MeshCore contacts corrupted by dropped serial bytes are
