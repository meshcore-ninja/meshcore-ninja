    prerelease: true
    notes: >-
      Release candidate 5 for 4.13.3. Twelve changes since rc4.


      ## Remote administration no longer blocks on the mesh


      Issue #4482 — a single remote admin action could legitimately hold a browser HTTP request open
      for up to **75 seconds** (up to 45s acquiring the session passkey, plus up to 30s awaiting a
      routing ACK). Behind a reverse proxy or CDN that surfaced as an upstream 502 with an unhelpful
      "Request failed".


      Remote admin commands, session-passkey acquisition, and remote config import now return `202
      Accepted` with an operation id and complete in the background, polled via `GET
      /api/admin/operations/:id`. Local-node commands stay synchronous — they have no passkey step
      and no ACK wait.


      - **Remote ignore/unignore now confirm.** They wait for the routing ACK exactly as favorites
      do, so a remote ignore can be verified rather than "succeeding" instantly with no way to
      check.

      - **Partial config imports report what failed**, not just what landed — "1 channel" is now
      distinguishable from "1 of 2 channels".


      (#4485, #4486; documented in #4490)


      ## Admin messages honor the configured hop limit


      Admin packets were built with a hardcoded `hopLimit: 3` — the firmware default, not the user's
      setting. Anyone who raised their node's LoRa hop limit to reach a deeper mesh still had every
      remote admin command expire 3 hops out, with no indication why. They now use the node's
      configured value, matching how the Meshtastic Python client behaves. (#4479)


      ## Fixes


      - `GET /stats` returned 500 whenever `sourceId` was omitted — the cross-source aggregate path
      had never worked (#4470)

      - MeshCore: anon auth banner, channel-sync data loss, reply/trigger ordering (#4491)

      - MeshCore: channel view now opens at the top, and Delete no longer appears to do nothing
      (#4488)

      - MeshCore: hop/route/scope info preserved in channel message history (#4475)

      - Older-message loads no longer force-scroll the view to the bottom (#4477)

      - Restored the send-message button icon (#4480)


      ## Navigation


      - Unified Meshtastic/MeshCore per-source navigation (#4481)

      - Meshtastic phone navigation moved to the shared bottom bar (#4484)


      ## Validation


      Full system-test suite passed on hardware — all 12 legs, including **Configuration Import**,
      which exercises the newly-async `/api/admin/import-config` path and the hop-limit change
      against a real device. This is the first build to put the async remote-admin work in front of
      hardware; it shipped on unit and route coverage alone.

