      the whole table instead of stopping at 10. OTA firmware updates now use the selected source
      and its custom TCP port, find binaries in 2.8.0's platform folders, and match the board list
      to the real release names, refusing boards that share several builds. The Helm chart can
      expose Virtual Node ports and pin a LoadBalancer IP. This release adds migrations 180 and 181.



      ### Added

      - **Asset tracking.** Flag a node as an asset in Node Details → Asset tracking to keep its
      telemetry for 1–365 days (default 90) on every source, always draw its trail, and exempt it
      from automated cleanups. The Nodes map draws the asset's whole retained history, thinned to
      keep its shape, and a playback bar replays the trip with a moving marker at 60×/600×/3600×.
      Migration 181. (#5354, #5411, #5419, #5422)

      - **ADS-B flight matching for likely aircraft**, off by default. When a node becomes a likely
      aircraft, MeshMonitor asks a community ADS-B feed (adsb.lol or adsb.fi) which flight is there,
      at most twice per flagging, and shows the match in the popup and details. Migration 180.
      (#5374, #5410)

      - **Sign-flipped position correction**, off by default, per source. A node whose latitude or
      longitude sign was entered wrong is shown at its mirror point when exactly one mirror lands
      within range (default 500 km) of the source's own node or a set point, with a notice showing
      the reported coordinates. Stored data never changes. Distance auto-delete, MQTT geo-ignore,
      automation geofences, traceroute snapshots and MeshCore contacts all use the corrected point.
      (#5363, #5409, #5412)

      - **Drop automation traffic at the MQTT bridge uplink**, a per-bridge option, off by default.
      MeshMonitor's own automated sends (auto-ack, responders, announce, timers, geofences,
      Automation Engine actions, auto-ping and similar) never reach the upstream broker; manual
      sends still do. A drop counter shows beside the ok_to_mqtt counter. (#5414, #5418)

      - **Map clustering toggle** in Settings → Map, separate from the Map Click Zoom Gate. On by
      default. (#5404, #5407)

      - **Helm: expose Virtual Node ports** with `service.extraPorts`, pin a LoadBalancer IP with
      `service.annotations` (MetalLB, kube-vip, Cilium) or `loadBalancerIP`, and optionally put the
      Virtual Node on its own `virtualNodeService` so the web UI can stay behind an Ingress. (#5416,
      #5417)


      ### Changed

      - **MeshCore remote logins wait longer and retry.** Each attempt waits the longer of twice the
      firmware's estimate or 10 s, and the admin buttons try up to 3 times on silence (never on a
      refused password). Every login screen shows live progress and a Cancel button. Behind a
      reverse proxy, a worst-case login can now take about 34 s. (#5400, #5405)

      - **MeshCore neighbour lists show the whole table.** The repeater sends at most 10 neighbours
      per reply, so the Contact Details button and "Poll Neighbours" now fetch up to 5 pages, each
      spaced by the 60 s radio gap, with live progress and Cancel. The scheduled autopoll stays at 1
      page (strongest first) and merges into the stored list instead of shrinking it. (#5413, #5425)

      - **OTA firmware updates run on the selected source.** Disconnect, reconnect, verify, retry
      and cancel act on the source the update was started from, not the primary radio, and use its
      custom TCP port. (#5424, #5428, #5432)

