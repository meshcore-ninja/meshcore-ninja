  - version: v2.4.0+build.24
    name: MeshApp v2.4.0+build.24
    datetime: '2026-11-14T10:00:28Z'
    url: https://github.com/smikme/meshapp/releases/tag/v2.4.0%2Bbuild.24
    prerelease: false
    notes: "# MeshApp v2.4.0+build.24\r\n\r\nChanges since **v2.3.10**, the previous stable release.\r\n\r\n- **Expanded MeshCore Companion support.** You can now edit radio settings, manage contacts and channels, share links and QR codes, request telemetry, and run remote commands. Synchronization, message history, delivery acknowledgements, and retries have also been reworked.\r\n- **Updated MeshCore KISS mode.** Added radio and transmit power settings, raw packet transmission, and handling of transmission results.\r\n- **Updated Meshtastic support to the 2.8.2 Alpha protocol definitions.** Added AES-CCM channel settings, authentication checks for MQTT packets, and a separate status for cryptographically verified delivery acknowledgements. AES-CCM requires firmware 2.8.1 or later.\r\n- **More telemetry data.** Added readings from eight ADC channels and eight 1-Wire sensors, lightning data, particulate sensor status, and soil and water measurements. The new data is available in the telemetry log, through RPC, and in Lua.\r\n- **Improved Mesh Beacon support.** Beacon messages now appear in chat. Updated frequency slot settings and validation for the 60-byte UTF-8 message limit.\r\n- **Reworked chat history loading.** Messages load in batches for better performance in long conversations. Fixed scroll jumps, restored scroll positions, and handling of delayed responses when switching chats.\r\n- **Better message editing.** Added undo and redo, plus offline spell checking for Russian, English, and German. Fixed text selection, pasting, and scrolling.\r\n- **Updated chat suggestions.** Type `@` to find a node by name or address, or `/` at the start of a message to browse bot commands.\r\n- **Images now upload through Meshpic.** You can paste images directly from the clipboard. Supported formats are JPG, PNG, GIF, and WebP, up to 10 MiB. Chat now shows image expiration times and upload errors. Images are stored for 24 hours by default.\r\n- **Optional byte savings for Cyrillic text.** A new setting replaces some Russian letters with similar-looking Latin characters, leaving room for more text in a message. It is off by default; substitutions can affect searching and copying text.\r\n- **Updated MeshAppStore.** Scripts now load from the main GitHub repository without an account. Added Battleship for two players over a direct mesh chat.\r\n- **Improved MeshApp IDE.** Added standard editing commands and plain-text pasting. Fixed Lua scripts ending too early when a device responds quickly, and stale node selections being handled after a bot restarts.\r\n- **Fixed notifications and system tray behavior.** Notifications now work correctly when the window is hidden or minimized. Fixed closing, minimizing, and restoring the window.\r\n- **Fixed node information exchange.** Information requests no longer send empty user data that could erase your node’s name on another device. Also fixed RPC timeout handling and BLE event processing on Windows.\r\n- **Added Linux ARM64 builds:** DEB, AppImage, and Flatpak. The DEB and AppImage builds require glibc 2.38 or later, such as Ubuntu 24.04.\r\n- **Updated releases and app updates.** Packages have moved to GitHub Releases, with separate stable and unstable update channels. The updater now tracks build numbers and supports updates between builds of the same version. Diagnostic reports are saved locally so you can attach them to a GitHub issue yourself.\r\n\r\n**Upgrading from v2.3.10 requires a manual installation from [GitHub Releases](https://github.com/smikme/meshapp/releases).** Older clients use the previous update URL and signing key. Flatpak installations also need to be installed and updated using the downloaded `.flatpak` file.\r\n\r\nMeshCore support targets Companion protocol 14; full testing on physical radios is still pending. Custom TCP/Serial bridges that send bare payloads need to switch to the official framing format.\r\n\r\n[Full changelog](https://github.com/smikme/meshapp/compare/v2.3.10...v2.4.0%2Bbuild.24)"
