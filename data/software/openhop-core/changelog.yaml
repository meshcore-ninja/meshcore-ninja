 by @zindello in https://github.com/openhop-dev/openhop_core/pull/81\r\n* Speed up KISS RX reader to reduce serial backpressure by @agessaman in https://github.com/openhop-dev/openhop_core/pull/84\r\n* fix(companion): resolve contact ambiguity by using public key for proxy retrieval by @agessaman in https://github.com/openhop-dev/openhop_core/pull/86\r\n* refactor(companion): fix node discovery and advert handling by @agessaman in https://github.com/openhop-dev/openhop_core/pull/87\r\n* fix(ack): firmware-compatible ACK format + multi-ack support by @agessaman in https://github.com/openhop-dev/openhop_core/pull/88\r\n* feat(companion): add support for explicit message timestamps by @agessaman in https://github.com/openhop-dev/openhop_core/pull/89\r\n* Refactor rename to openhop by @rightup in https://github.com/openhop-dev/openhop_core/pull/90\r\n* Fix gpod boards by @rightup in https://github.com/openhop-dev/openhop_core/pull/94\r\n* Refactor/companion housekeeping by @agessaman in https://github.com/openhop-dev/openhop_core/pull/95\r\n* Preserve app-supplied timestamp for channel messages by @etienn01 in https://github.com/openhop-dev/openhop_core/pull/93\r\n* fix: align flood scope, channel/DM error codes, and group text cap with firmware semantics by @agessaman in https://github.com/openhop-dev/openhop_core/pull/97\r\n* Stop FLOODing RESPONSE for 0 hop cached paths by @etienn01 in https://github.com/openhop-dev/openhop_core/pull/96\r\n* fix(handlers): return HandlerResult so callers forward prefix collisions by @agessaman in https://github.com/openhop-dev/openhop_core/pull/98\r\n* fix(radio): stage TX FIFO write only after standby to prevent RX over… by @zindello in https://github.com/openhop-dev/openhop_core/pull/99\r\n* Fix/all the things core by @rightup in https://github.com/openhop-dev/openhop_core/pull/101\r\n* fix(modem): support CAD symbol counts over TCP and USB by @yellowcooln in https://github.com/openhop-dev/openhop_core/pull/102\r\n* Return-path tea