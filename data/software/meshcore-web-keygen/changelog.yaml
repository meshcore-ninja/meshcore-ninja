  - version: v0.5
    name: v0.5
    datetime: '2026-09-22T23:53:15Z'
    url: https://github.com/agessaman/meshcore-web-keygen/releases/tag/v0.5
    prerelease: false
    notes: >-
      Faster vanity search. WASM workers use a custom Ed25519 field and Edwards implementation, run
      on every CPU core, and take larger batches. Measured about 12.3 million keys/sec on an M4 Pro,
      with clearer speed and time estimates in the page. Pure JavaScript remains the fallback when
      WASM is unavailable.


      Also includes the WASM generator added on main since v0.4.
  - version: v0.4
