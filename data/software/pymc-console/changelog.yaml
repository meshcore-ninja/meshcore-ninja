    notes: >-
      ### Changed

      - **The update module is a proper instrument.** The notice in What's new is now a fastened
      plate: a lit band with a NEW lamp, an annunciator that reads UPDATE READY, INSTALLING,
      RELOADING, FAILED or STILL WORKING, and a version window; a screen that names the release in
      the reading face; and two keys in one well, NOTES to open the release and UPDATE to install
      it. While it installs, the screen lists the three steps with a clock beside the one in
      progress, and when the repeater streams its installer's output (a change proposed to openHop
      Repeater, pull request 445) the last five lines print under the steps as they arrive.

      - **A slow install is no longer called a failure.** The console now waits as long as the
      repeater does for an install, fifteen minutes rather than three. If it still runs out of
      patience the module says STILL WORKING with an amber lamp and offers to reload the page, and
      if the repeater's stream is open and reports the install finished, the page reloads on its
      own.

      ### Fixed

      - **Bold lead-ins and code in the release notes render as such**, and pip's indentation is
      kept in the installer's lines.



