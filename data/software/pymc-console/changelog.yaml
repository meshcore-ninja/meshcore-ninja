    prerelease: false
    notes: >-
      ### Added

      - **Every console learns about its own update.** The plugin build is recognised by how it was
      built, so a repeater that serves it as its main page at the root now checks the plugin
      catalogue and installs from What's new like any other plugin install. The standalone install,
      put in place with manage.sh, now reads the console's public release feed from your browser
      once a minute after start and every half hour; when a newer release is out, the version pill
      turns yellow and What's new names the release with a NOTES key and says that manage.sh upgrade
      on the repeater is the way to get it. A browser without internet sees nothing.

      ### Changed

      - **The plugin card's keys are in two gangs.** What moves a plugin forward, install, update,
      open, restart, stands at the left; disable or enable and remove share one well at the right
      under MANAGE. The update key is blue with a download glyph that breathes in the cap's own
      light until it is pressed, and the console's own card no longer offers Open, since that page
      is the one you are reading. Wells are exactly as wide as their keys.

      - **A blinking keycap legend breathes** over a slow 2.8-second cycle instead of flashing every
      half second.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/Treehouse-00/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
