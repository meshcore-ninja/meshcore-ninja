    prerelease: false
    notes: >-
      ### Changed

      - A channel message now tells you whether the mesh has carried it. Once your radio has sent it
      but no repeater has repeated it yet, the row shows a single yellow check; hovering it reads
      "sent, not yet heard by any repeater". The first time a repeater repeats it, the mark turns
      into the green double check and the repeat count appears. Before this, a sent message with no
      repeats looked the same as one that had been carried, which read as a failed send. Direct
      messages are unchanged: their double check still means the other side acknowledged.

      - In light mode, the labels on the path map (the node prefixes over the map, and the counter
      in the corner) were dark text on dark glass. They now sit on light glass with dark text; your
      own node's cell and the map pin stay dark with white text.


      ### Compatibility

      - No repeater database change and no schema migration.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/Treehouse-00/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
