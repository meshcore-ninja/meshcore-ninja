    prerelease: false
    notes: >-
      ### Changed

      - The reading print is the companion screens' only voice. It shipped a release ago as a
      parallel mode behind an ABC key; the key is gone, the pixel voice with it, and every screen
      prints in GC Basic Inktrap Mono, light for copy and medium for names, with no grain or lamps
      behind the text. The old toggle's saved setting is cleared on start.


      ### Compatibility

      - No repeater database change and no schema migration.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/Treehouse-00/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
