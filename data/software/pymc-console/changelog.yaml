  - version: v0.9.350
    name: Release v0.9.350
    datetime: '2026-08-18T18:40:14Z'
    url: https://github.com/Treehouse-00/pymc_console-dist/releases/tag/v0.9.350
    prerelease: false
    notes: >-
      ### Added

      - In-app release notes: tap the version badge in the sidebar or mobile header for "What's new"
      — the current release's notes plus full collapsible history, bundled with the build so it
      works offline. A small dot marks unread notes after an upgrade.

      - GitHub releases now publish each version's changelog section as the release notes, and
      CHANGELOG.md ships with the distribution. Bots can follow `releases.atom`, the
      `releases/latest` API, or the raw changelog — see "Following releases" in the README.

      ### Changed

      - The release pipeline guarantees a changelog entry for every release (auto-generated from the
      release note when none is hand-written) and verifies the published tree before every push.



