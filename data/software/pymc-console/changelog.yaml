    prerelease: false
    notes: >-
      ### Added

      - **The console can hand the repeater's front door to the plugin.** Configuration → Web
      Frontend now lists every interface the repeater can serve at its root: the repeater's own, the
      hand-installed copy under /opt, and the waev:outpost plugin, each with its version. Pick one
      and the repeater switches at once, no restart. On a repeater that cannot list them yet, the
      two older choices remain.

      - **One question after installing the plugin.** When the waev:outpost plugin finishes
      installing from the Plugins page, a small plate asks whether to make it your default
      experience. Yes makes the repeater serve it at the root and takes you there; No leaves things
      as they are. The choice stays under Configuration → Web Frontend.

      ### Changed

      - **The hand-installed copy is marked as retiring.** Its row in Web Frontend carries an amber
      DEPRECATED tag and says plainly that the files under /opt and the pymc_console-dist repository
      will stop receiving releases, and that the plugin is the way forward.

      - **The README leads with the plugin.** Install from the repeater's Plugins page in three
      presses, and let it update itself; the hand install is documented as the fallback.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/Treehouse-00/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
