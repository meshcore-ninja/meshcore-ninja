    prerelease: false
    notes: >-
      ### Added

      - Channel headers now have a Regions button for adding, editing, removing, and selecting an
      outgoing region override. A green outline and checkmark indicate an enabled, supported
      override.

      - Scoped outgoing messages show their original `#region` before the repeat counter and a green
      bubble outline. Local annotations survive reloads in both Frame and Companion API modes.


      ### Fixed

      - Removing the selected region can be saved to return to the companion default, and edit
      cancellation is clearly separate from canceling the whole dialog.

      - Region sends preserve their original scope on safe retries and never silently fall back to
      an ordinary send. Uncertain Frame sends are not automatically retried.

      - Outgoing Companion API channel messages retain text before a colon instead of treating it as
      a sender prefix.


      ### Compatibility

      - Per-message regions require a backend that explicitly advertises support. Frame support is
      proposed in [openHop Repeater PR
      #417](https://github.com/openhop-dev/openhop_repeater/pull/417); the Companion API fork
      includes the corresponding scoped endpoint. Ordinary sends remain compatible with older
      backends.

      - Region choices and annotations are local to this browser. History without original region
      metadata remains unmarked. No repeater database migration or shared radio-setting change is
      required.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/dmduran12/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
