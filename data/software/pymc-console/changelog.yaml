    prerelease: false
    notes: >-
      ### Fixed

      - When the repeater is set to use the waev:outpost plugin as its main web interface, the page
      came up blank at the root address; only the longer `/plugins/waev.outpost/` address worked.
      The console now works at both, and deep links such as `/system/logs` work at both too. Nothing
      about the plugin package's layout or the repeater's settings changed.


      ### Compatibility

      - No repeater database change and no schema migration.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/Treehouse-00/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
