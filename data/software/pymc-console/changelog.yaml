    prerelease: false
    notes: >-
      ### Changed

      - The channels, chat and contacts screens have their glass back. It was dropped with the pixel
      voice in 0.9.370 and never returned: a matte pane over each screen with a faint reflection of
      the room and the small lamps along the edge that show the panel is on. The reflection is a
      little stronger than before (a tenth of the room rather than a twentieth), and every LED
      screen in the console shares it.

      - In the contacts list, a long name pushed the row's three-dot options key out of the row, so
      only contacts with short names could be right-clicked or opened for options. Long names now
      shorten with an ellipsis and the key stays at the right edge on every row.


      ### Compatibility

      - No repeater database change and no schema migration.



