    prerelease: false
    notes: >-
      ### Fixed

      - **The packet detail's byte breakdown is back.** Newer repeater builds no longer include a
      packet's raw bytes in the packet lists, so a packet that arrived while the console was on
      another page opened to an empty left column. The console now fetches the bytes for any packet
      it opens without them, once per packet, and says so plainly if the repeater no longer has them
      either.

      - **Packet history keeps its decoders.** The console asks the repeater's packet lists to
      include each packet's raw bytes, which restores sender resolution for adverts, trace signal
      paths and channel decryption on history loaded after a page reload. A repeater without that
      option answers once and is not asked again, so older builds lose nothing. This pairs with a
      change proposed to openHop Repeater (pull request 444); until it is installed the console
      behaves as before.



