    prerelease: false
    notes: >-
      ### Fixed

      - **The console notices its own update.** The repeater's plugin manager keeps a ten-minute
      copy of the catalogue, and the console's timed checks were reading that copy, so a new release
      only showed after pressing refresh on the Plugins page. Every check now asks for a fresh
      catalogue, so the yellow pill and What's new light up on their own within a few seconds of the
      console settling and every half hour after.

      - **The page reloads when the install finishes.** The console used to wait for its own request
      to answer before reloading, and on a real repeater that answer could arrive late or not at
      all. It now reloads the moment the repeater's progress stream reports the install complete,
      whatever the request is doing.



