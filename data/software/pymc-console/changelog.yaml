    notes: >-
      ### Added

      - The map is now a hardware instrument. The screen sits in a machined faceplate with a
      silkscreen identity and pilot lamps, a key cluster beside it, and a readout bank below, and
      each breakpoint gets its own plate rather than a reflowed copy of the desktop one.

      - Selecting a node opens a shelf inside the screen instead of a panel floating over the map.
      It switches on in place like a tube rather than sliding in, and moving to another node
      rehydrates it instead of closing and reopening.

      - Display modes and class filters are banded across the top edge of the screen in the
      display's own amber-on-glass voice. On a handheld the five class keys share a single row.

      - The key is rooted to the bottom edge, collapses when you want the map back, and never runs
      past two rows. It lists only what the map can actually show — each class appears once there is
      one on screen.

      - Zero-hop edges follow the class filter: with RPTR, COMP, ROOM or HUB selected, only that
      class's direct edges are drawn. ALL is unchanged.

      - The screen wears real glass — four graduated light passes taken from the design file, edge
      backlight lamps shared with the I/O scope, and a CRT vignette. The whole reflection is baked
      to a single image, so it costs nothing while the map is panned.

      - Basemap place names read in the display's own ink: keycap red on the dark map, Casio LCD
      grey on the light one.


      ### Changed

      - Keys latch. The master key is a red cap, the view cluster is square, and toggles behave as
      push-push hardware instead of momentary buttons.

      - Everything inside the screen speaks one pixel voice — hop, repeater, backbone and room chips
      included. Node markers are square dies, and the key reads as a readout rather than a caption.

      - The node shelf and the edge-hover reading share one readout grid, so a link and a node are
      measured on the same rule.

      - The screen's corner rounding matches the rail directly above it.


      ### Fixed

      - Live Trace renders again.

      - Every hub wears its ring, including hubs that have gone stale.

      - The readout bank takes a real track in the instrument panel, the handheld plate holds
      together, and the deck plate's lower row no longer leaves a dead gap.

      - The 3D key can be switched off again.

      - Scalability benchmarks no longer flake under suite load.


      ### Removed

      - The deprecated wardriving coverage overlay, along with the map controls that drove it.



