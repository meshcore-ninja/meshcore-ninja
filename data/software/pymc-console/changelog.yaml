  - version: v0.9.354
    name: Release v0.9.354
    datetime: '2026-08-19T06:30:21Z'
    url: https://github.com/Treehouse-00/pymc_console-dist/releases/tag/v0.9.354
    prerelease: false
    notes: >-
      ### Fixed

      - First taps land reliably on touch devices. Packet History rows in duplicate groups or
      carrying trace tags — and chart legend entries — previously swallowed the first tap on
      iPhone/iPad (Safari consumed it as hover intent), needing a second tap to act. Hover-driven
      highlighting is now mouse/trackpad only, so every tap counts.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/dmduran12/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
  - version: v0.9.353
    name: Release v0.9.353
    datetime: '2026-08-18T22:59:45Z'
    url: https://github.com/Treehouse-00/pymc_console-dist/releases/tag/v0.9.353
    prerelease: false
    notes: >-
      ### Added

      - Configuration at a glance: every module is a collapsible bar that summarizes its key values
      while closed, grouped under Device / Network / Access & Security / This Console headings, with
      Expand all / Collapse all and a desktop section rail that follows your scroll. On phones,
      modules start collapsed so the page opens as a table of contents.

      - Find a setting: press `/` and type — matching rows light up while everything else dims
      (nothing hides), matching modules open themselves, and Esc clears. Related settings cross-link
      with a jump-and-flash locator.

      - Tap the bunny in the mobile header. Go on, tap it.

      ### Changed

      - Module editing commits from a bar at the module's bottom edge that stays on screen while you
      scroll a tall module — Save and Cancel never clip at any width.

      - Node Info shows each identity as its own two-line row (name, then role and full-width ID)
      and scrolls internally past five rows, so large fleets never stretch the page.

      - API access (CORS) moved out of App Settings into its own module under Access & Security.

      - The header bunny faces right now.



      ---

      Full history:
