  - version: v0.9.352
    name: Release v0.9.352
    datetime: '2026-08-18T20:36:15Z'
    url: https://github.com/Treehouse-00/pymc_console-dist/releases/tag/v0.9.352
    prerelease: false
    notes: >-
      ### Changed

      - The time-range selector has one persistent home: the top-right corner of the page title, on
      every page and at every screen size (compact on phones). Dashboard, Statistics, Packet
      History, RF Health, and Map & Contacts each return a full row to content.

      - Packet History's filters are now a collapsible bar on the Filters card itself — collapsed by
      default on phones with the Transport/V2 quick-toggles still usable, expanded by default on
      larger screens (and collapsible there for the first time). The floating filter button is gone.



