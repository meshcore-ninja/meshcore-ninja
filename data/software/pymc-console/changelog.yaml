    notes: >-
      ### Changed

      - The hue fader is three knobs. HUE, SAT and LUM sit as one gang on the companion plate's
      foot, each a knurled cap on a spindle sweeping between two end dots; the cap turns under a
      light that stays in the room, and a push button at the foot's right returns the board to
      amber. HUE and SAT set the display ink every readout on the board shares, in OKLCH at the
      amber's own lightness: hue once around the wheel, saturation from grey to the most colour the
      display can show there, measured against the widest colour Display P3 carries so every setting
      reaches the screen as written, wide-gamut where the display allows and never mapped toward
      grey. LUM is the screens' brightness: the white, the coloured outlines, the emoji and the ink
      dim together as one lit surface, down to a dim screen you can still read and never to black.
      The three settings persist across sessions and follow you to every page; at the amber they
      ship at, the board's own amber stands.

      - The companion screen's glass tint is a quarter dimmer.

      - The parts kit gains the knob and the push button, and loses the fader.


      ### Compatibility

      - No repeater database change and no schema migration.



