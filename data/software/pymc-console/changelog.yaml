    notes: >-
      ### Changed

      - **The screens ship in phosphor green.** The display ink's default moves from the warm
      near-white to a green at hue 141, half saturation, brightness 94. If you never touched the
      three colour knobs on the Messages page, your screens follow the new default; if you only
      dimmed them, the dimming is kept and the ink changes; if you turned the hue or saturation by
      even one step, nothing changes for you. The reset key returns to the green.

      - **A newer console is announced in yellow.** The version pill in the header turns the
      indicator yellow with a pulsing lamp when a newer waev:outpost is in the repeater's catalogue.
      Green read as a go; a pending update is a warning.

      ### Fixed

      - **The console's own update check waits a minute after startup** and is skipped while the tab
      is hidden, so on a repeater without internet the thirty-second catalogue timeout never sits
      inside the first burst of requests that loads a page.



