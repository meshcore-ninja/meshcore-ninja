    prerelease: false
    notes: >-
      ### Fixed

      - The installer wires the dashboard in on a Repeater that still runs the pyMC-era layout.
      `manage.sh` detected `/opt/pymc_repeater` and the `pymc-repeater` service but patched,
      reported and hinted at `/etc/openhop_repeater/config.yaml` only, so on a system upstream had
      not migrated the dashboard was installed and never reached, and the manual fix it printed
      named a file the running service does not read. The config file is now resolved the way the
      service already was: the openHop path first, then `/etc/pymc_repeater/config.yaml`, and when
      neither exists the expected path follows whichever Repeater is installed.

      - `manage.sh uninstall` clears `web.web_path` when it still points at the dashboard, so the
      Repeater falls back to its own UI instead of serving a directory that no longer exists. A
      value set by hand to something else is left alone and named. Without `yq`, the exact command
      is printed.

      - The installer and the publishing workflow address the distribution repository by its current
      owner rather than through a redirect.


      ### Changed

      - The installer is now under test: fifteen contract tests run it against a sandboxed
      filesystem in every Repeater layout, with the real `tar` and `yq`, on every push. Nothing in
      the dashboard itself changed in this release.


      ### Compatibility

      - No repeater database change and no schema migration. Existing installs pick up the new
      installer on their next `manage.sh upgrade`, which refreshes the script before it does
      anything else.



      ---

      Full history:
      [CHANGELOG.md](https://github.com/Treehouse-00/pymc_console-dist/blob/main/CHANGELOG.md)


      ## Installation

      ```bash

      sudo ./manage.sh install

      ```


      ## Upgrade

      ```bash

      sudo ./manage.sh upgrade

      ```
