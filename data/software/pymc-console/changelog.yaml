    prerelease: false
    notes: >-
      ### Fixed

      - Adding a companion works again. Opening companion configuration replaced the page with "Page
      failed to render", so the main way into the feature has been unusable since dual transports
      landed in 0.9.347.

      - A single unreadable companion catalog reply no longer ends the session. One bad response
      read as "this companion was removed": the connection dropped, cached contacts and history were
      discarded, the saved selection was deleted, and getting back required picking the companion
      again by hand. A missing entry now has to be confirmed by a second reading, while a changed
      identity key still fails closed at once.

      - Legacy Frame explains its failures instead of swallowing them. Eleven actions — status,
      telemetry, repeater login and logout, path reset, contact removal, channel changes, ping and
      others — said what went wrong on Companion API and failed in silence on Frame.

      - "Set Path" in the contact menu opens the path editor. It used to select the contact and
      stop, leaving the one control named after the action as the only route that did not reach it.
      It now appears only on a connection that can set a path.

      - The chat archive no longer claims a message was delivered when it never found out. A channel
      message interrupted by a reload came back wearing a delivery tick; a direct message came back
      spinning forever. Both now read as unconfirmed, which is what the record actually supports.

      - "Connect anyway" takes the Frame listener only when Frame is the connection in use.
      Answering it from a Companion API session used to move you onto the listener you had chosen to
      leave free.

      - A malformed reply from the repeater is reported as a mismatch rather than as "temporarily
      unreachable" and retried forever.


      ### Changed

      - Repeat counts on Companion API come from the repeater's own tally and the message's exact
      packet hash. The console previously inferred them by matching a message to a capture on its
      text and a thirty-second window, and kept doing so even on a connection that could answer
      exactly.

      - Both connections describe a failure in the same words and say which kind it is: refused,
      outcome unknown, connection dropped, or unsupported here. Anything whose outcome is unknown is
      never repeated on its own, and a read that times out reports a dropped connection rather than
      an uncertain result.

      - The per-channel region check runs only while a channel conversation is open and asks a given
      connection once. It previously ran on every visit to the page and every reconnect, whether or
      not a channel was ever opened.


      ### Compatibility

      - No repeater database change and no schema migration. Legacy Frame and Companion API v1
      behave as before apart from the corrections above, and saved per-companion connection choices
      are unaffected.



