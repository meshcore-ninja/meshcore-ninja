    prerelease: false
    notes: >-
      ### Added

      - **The link scope shows one link at a time when you ask.** Choose a link and the scope draws
      that link alone, its ray and its peer, with everything else hidden. Press the same marker
      again, press empty glass, press anywhere on the plate that is not a control, or press the
      CLEAR key that appears at the right end of the scope's head band, and every link comes back.

      - **Keys press down.** Every key in the console, keycaps, toggle keys and the round push
      buttons, drops one pixel in its frame as its face darkens under the finger and comes back up
      on release.


      ### Changed

      - **The scope is centred on its glass.** Its head band no longer takes a row of the screen, so
      the drawing sits at the glass's middle instead of hanging low.

      - **The glass falls off on every edge.** The tube's darkening at the left and right edges of
      reflective screens is half again as strong, and the top and bottom now fall off the same way,
      so the map, the terminal, the scope and the history strip read as a tube turning away on all
      four sides.


      ### Fixed

      - **A hard line inside every screen edge is gone.** The room reflection every screen carries
      had a transparent margin and then an abrupt step a few pixels in from each edge, which
      stretched onto the glass as a visible line. The reflection now stretches from inside that
      border, so it meets the edge smoothly and keeps its soft dark rim.


      ### Under the hood

      - Catalogue proposals for the openHop plugin catalogue are published through a scoped,
      short-lived GitHub App token instead of a personal token, attributed to the publishing bot,
      and opened ready for the catalogue's own certification to decide merging (contributed by
      yellowcooln).


      ### Compatibility

      - No repeater database change and no schema migration.



