name: openHop Console
also_known_as:
  - pyMC Console
kind: monitoring
status: active
maturity: beta
description: >-
  Web dashboard for [[software:pymc-repeater|openHop Repeater]] with live packet inspection, topology and
  path analysis, RF statistics, terrain mapping, link-quality radar, system
  monitoring and an interactive repeater terminal.

image: openhop-logo.svg
screenshots:
  - file: topology.png
    caption: Deep topology analysis and terrain mapping
  - file: link-quality.png
    caption: Directional link-quality radar
  - file: statistics.png
    caption: RF and airtime statistics
  - file: terminal.png
    caption: Repeater terminal, logs and themes

maintainers:
  - name: Treehouse-00
    url: https://github.com/Treehouse-00

# Public distribution repository (verified 2026-08-13).
repository: https://github.com/Treehouse-00/pymc_console-dist
documentation: https://github.com/Treehouse-00/pymc_console-dist#readme
changelog:
  source: github
  repo: Treehouse-00/pymc_console-dist
license: MIT

languages:
  - javascript
  - typescript
  - shell

platforms:
  - linux
  - raspberry-pi
  - web
interfaces:
  - web
connections:
  - http
  - websocket
node_roles:
  - repeater
capabilities:
  - node-configuration
  - remote-administration
  - monitoring
  - telemetry
  - packet-analysis
  - mapping

install:
  - type: github-release
    package: pymc-ui-latest.tar.gz
    url: https://github.com/Treehouse-00/pymc_console-dist/releases
  - type: manual
    url: https://github.com/Treehouse-00/pymc_console-dist#install
    command: sudo bash manage.sh install
verification:
  sourceAvailable: true
  releasesAvailable: true
  signedReleases: false
  ciBuilds: true
  hasDocumentation: true
  lastChecked: 2026-07-03
  notes:
    - "Requires an existing openHop Repeater installation and replaces only its web dashboard assets."
    - "Repeater service lifecycle and radio configuration remain owned by openHop Repeater."
    - "Developed and maintained by Treehouse-00 as the Console application for openHop Repeater."
    - "Public release assets and installation information are published from Treehouse-00/pymc_console-dist."

tags:
  - repeater
  - topology
  - rf-analysis
  - raspberry-pi
  - dashboard

last_reviewed: 2026-07-03
