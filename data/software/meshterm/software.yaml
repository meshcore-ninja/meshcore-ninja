# Source: https://github.com/jpmartineau/MeshTerm (verified 2026-10-07)
# Source: https://meshterm.net/
name: MeshTerm
kind: client
status: active
maturity: beta
description: >-
  Full-featured TUI MeshCore client for desktop terminals and for handhelds like
  the ClockworkPi PicoCalc and uConsole. Chat, room servers, a live dashboard,
  an offline map, per-hop route traces, and a long-term SQLite record of every
  packet heard, with a scriptable CLI that prints JSON.

maintainers:
  - name: jpmartineau
    url: https://github.com/jpmartineau

