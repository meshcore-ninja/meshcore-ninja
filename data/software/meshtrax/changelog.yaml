  - version: v1.7.12
    name: Release v1.7.12
    datetime: '2026-07-31T23:56:26Z'
    url: https://github.com/venamartin/meshtrax/releases/tag/v1.7.12
    prerelease: false
    notes: "## What's new\r\n\r\n### Mention notifications\r\nWhen someone @mentions you or replies to you in a channel, you now get a\r\nnotification titled **\"Mention in <channel>\"** — even if that channel is muted.\r\nTapping it opens the channel anchored on the exact message. Enabled by default;\r\ntoggle it in App Settings → Notifications. Mentioning yourself stays silent,\r\nand you never get a double notification — on unmuted channels the mention\r\nreplaces the regular channel notification.\r\n\r\n### Debug log upgrades\r\nFilter the App Debug Log by All / Warnings / Errors, save it to a text file\r\nvia the system save dialog, and every entry now shows a full date + time.\r\n\r\n### Fixes\r\n- Messages your companion collected while the app was away now keep their real\r\n  send times instead of all being stamped with the connection time. Ordering\r\n  remains by arrival, so nothing shuffles.\r\n- Offline-queued messages no longer claim they arrived \"Direct\" — they show\r\n  their true hop count, including a fix for 2-byte path-hash networks where\r\n  hop counts displayed halved.\r\n- Contacts discovered from over-the-air adverts now decode their path header\r\n  correctly (paths were stored corrupted on 2-byte-hash networks).\r\n- The Add Channel dialog's Create/Add button is pinned next to Close, where the\r\n  keyboard can't cover it — and the keyboard's ✓ key submits.\r\n- The @ mention picker no longer truncates the contact list; emoji-named\r\n  contacts appear at the top (they drop out as soon as you type a letter).\r\n\r\n**Full Changelog**: https://github.com/venamartin/meshtrax/compare/v1.7.10...v1.7.12"
  - version: v1.7.10
    name: Release v1.7.10
    datetime: '2026-07-30T20:44:58Z'
    url: https://github.com/venamartin/meshtrax/releases/tag/v1.7.10
    prerelease: false
    notes: "## What's Changed since v1.7.7\r\n\r\n### Interoperability with other MeshCore apps\r\n* **Reactions and replies from MeshCore One now display properly.** Their reactions (`❤️@[Name]` + hash) render as reaction pills on the target message, and their replies render as quote bubbles — in channels and DMs. Anything that can't be matched is shown as a normal message rather than dropped.\r\n* **Replies are now sent in a universally readable quote format** (`@[Name]` + `>quoted snippet..`). Clients that don't parse it still show a legible quote; MeshTrax keeps reading the old `re:` format from earlier versions. Reactions still use the compact 9-byte `r:` format (meshcore-open standard).\r\n\r\n### New\r\n* **Reactions show who reacted** — chips are larger, overlap the bubble like other messengers, and tapping one lists the people behind each emoji.\r\n* **Quick mentions** — swipe right on a message (reply stays swipe left) or long-press → *Mention* to insert `@[name]` at your cursor.\r\n* **Zoom level setting** — chat text scale is adjustable in App Settings below Theme (0.80x–1.80x, default now 1.20x). Pinch-to-zoom and double-tap-to-reset still work and stay in sync.\r\n* **Conversations sort by arrival** — chats and unread ordering now use when your radio actually received a message, so a sender with a wrong clock can no longer bury a conversation in the past (or pin it to the future).\r\n\r\n### Fixed\r\n* Repeated channel messages are deduplicated by their original wire time, closing a repeat-echo path that produced duplicates.\r\n* Buffered channel messages can no longer be delivered to a different channel after slots are re-mapped, and the channel map is re-verified after an unexpected disconnect.\r\n* Windows builds no longer ship without their native libraries (v1.7.7 broke USB serial on Windows)\r\n\r\n**Full Changelog**: https://github.com/venamartin/meshtrax/compare/v1.7.7...v1.7.10"
  - version: v1.7.7
    name: Release v1.7.7
    datetime: '2026-07-25T21:58:55Z'
    url: https://github.com/venamartin/meshtrax/releases/tag/v1.7.7
    prerelease: false
    notes: "## What's New in 1.7.7\r\n\r\n### Message storage moved to a real database\r\nThis is the big one. Messages, contacts, discovered nodes, and channel data no\r\nlonger live in app preference files — they're now in an embedded SQLite database\r\nvia Drift. Every write is a single row instead of a rewrite of the whole\r\nconversation, so history can't be clobbered by an unlucky save, and the app reads\r\nwhat it needs instead of loading everything into memory at startup.\r\n\r\nYour existing history migrates automatically the first time you open each\r\nconversation after updating. Nothing to do, and nothing is thrown away.\r\n\r\n### Channels are identified by their key, not their slot number\r\nChannel history is now filed by the channel's encryption key rather than the slot\r\nit happens to occupy on your radio. Reorder your channels, delete one and add\r\nanother in its place, or run two channels with the same name and different keys —\r\nmessages still land in the right conversation. Two channels whose names collide\r\non the air are now told apart correctly, so a channel can no longer go \"deaf\"\r\nbecause another one shares its hash.\r\n\r\nMeshTrax also refuses to create a channel with a key you already have, and checks\r\nyour radio's slot table after each sync to warn you about duplicates.\r\n\r\n### Sending is more reliable\r\nChannel messages sent before the app finished verifying your channel list are no\r\nlonger stranded or silently dropped — they queue and go out once the list is\r\nready. Sends now also wait longer for a quiet moment before transmitting, so a\r\nmessage composed right after a burst of incoming traffic is less likely to\r\ncollide with mesh traffic still in flight.\r\n\r\n### Path tracing\r\nYou can now jump straight from a path trace to Set Custom Path. Traces that fail\r\ntell you so with a toast instead of leaving the previous result on screen, and a\r\nroute that already makes a round trip is no longer doubled in the display. The\r\ncontact picker used to reach path trace was also fixed.\r\n\r\n### Also in this release\r\nRepeater discovery waits 30 seconds instead of 10, so slower repeaters actually\r\nshow up. Repeater CLI commands can return sooner instead of always waiting out a\r\n15-second floor. Line-of-sight endpoint dropdowns are sorted alphabetically.\r\nUnread badges are computed directly from the database, so they stay consistent\r\nwith what you actually see in the conversation.\r\n\r\n**Full Changelog**: https://github.com/venamartin/meshtrax/compare/v1.7.0...v1.7.7\r\nub.com/venamartin/meshtrax/compare/v1.7.0...v1.7.7"
  - version: v1.7.0
    name: Release v1.7.0
    datetime: '2026-07-19T19:38:16Z'
    url: https://github.com/venamartin/meshtrax/releases/tag/v1.7.0
    prerelease: false
    notes: "## What's New in 1.7.0\r\n\r\n### Room server\r\nIf you're an admin on a room server, you can now manage it right from the room\r\nchat — tap the manage icon to reach status, telemetry, settings, neighbors, and\r\nthe command line.\r\n\r\n### Replies that point at the right message\r\nReplying in a channel now quotes the exact message you picked, instead of the\r\nperson's most recent one. Mentioning someone with @ no longer accidentally turns\r\nyour message into a reply, and quoted replies now appear correctly in other\r\nMeshCore apps too.\r\n\r\n### Smarter contact list\r\nNodes with a broken clock no longer show nonsense ages like \"755 days ago\".\r\nMeshTrax corrects the time and marks the contact with a small clock icon so you\r\nknow why.\r\n\r\n### Notifications that go where you expect\r\nTapping a notification now opens the right conversation, even if the app was\r\nclosed.\r\n\r\n### Bug fixes\r\nChannel messages send more reliably over USB, message retries can be turned off,\r\na reconnecting status now shows in chat, notifications no longer appear for\r\nunused channel slots, duplicate device info entries removed, and various fixes\r\nfor improved compatibility with the latest device firmware.\r\n\r\n**Full Changelog**: https://github.com/venamartin/meshtrax/compare/v1.6.3...v1.7.0"
