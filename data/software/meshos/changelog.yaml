  - version: v1.0.19
    name: MeshOS v1.0.19
    datetime: '2026-09-12T15:50:32Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/v1.0.19
    prerelease: false
    notes: |-
      ## MeshOS Companion v1.0.19

      Replaces v1.0.18 from earlier today. Same release plus one fix: profile
      pictures now also show on channel messages that arrived over LoRa, so they no
      longer disappear from the chat while a radio is connected.

      ### Chat
      - Pinch to zoom in any chat. Text, pictures, voice messages and map previews
        all scale together, and the app remembers your size. There is also a Chat
        text size setting in Settings > App.
      - Message text now follows your phone's system font size.

      ### Profile pictures
      - Your picture and name now sit at the top of Settings > App. Change or remove
        the picture there, and tap your name to change it.
      - Profile pictures now show on internet channels too, including in
        notifications and the participants list, so people on the internet side of a
        channel see the same picture AirLink users do. A changed picture reaches other
        phones within a couple of minutes.
      - Pictures are stored at higher quality, so your own picture looks sharp in the
        app.
      - Choose a picture from your photo library or browse files. Use Browse files if
        your phone's photo picker misbehaves.

      ### Radio connection
      - The app now keeps a foreground connection to your radio while it is connected,
        with a light keep-alive, so Android is less likely to drop the Bluetooth link
        when the screen is off. A new Keep CPU awake option in Settings is there for
        phones that still struggle.
      - If Android has MeshOS set to Restricted battery use, the app now warns you and
        offers to open the setting. Restricted mode cuts the radio link a few minutes
        after you leave the app.
      - New Connection log in Settings for troubleshooting connection drops, with copy
        and share.

      ### Channels
      - Fixed AirLink and LoRa Public channels showing as one merged channel when one
        side was switched off.

      ### Settings
      - Colour coded icons across Settings and Tools make the lists easier to scan.
      - Internet Messaging shows a simpler Connected status.

      ### Install
      Download `MeshOS-v1.0.19.apk` and open it to install. Existing users upgrade in
      place, keeping their messages and settings.

      APK SHA-256:
      `ecb016d8fde99755d05b770942e931f8b1b294e3d5d6c361907e38424e6a7005`

      ### macOS
      Download `MeshOS-v1.0.19.dmg`, open it and drag MeshOS into Applications. Needs
      macOS 11 or later. The app is not notarised, so the first time you run it
      right-click MeshOS and choose Open, then Open again in the warning.

      DMG SHA-256:
      `44017aa1873f3d97fa2737108593c4f058622e9ebb0243c32fadcaacbbc50053`
