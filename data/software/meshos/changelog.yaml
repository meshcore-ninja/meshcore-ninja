  - version: v1.0.11
    name: MeshOS v1.0.11
    datetime: '2026-08-02T20:42:48Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/v1.0.11
    prerelease: false
    notes: >-
      ## Internet for your channels

      - Turn on Internet Link for any LoRa channel from its menu. Your messages travel over LoRa and
      the internet at the same time and arrive as one message, never duplicates.

      - Create Internet Channels with the + button. They work anywhere with no radio needed, and
      anyone with the same channel key joins the same room.

      - Channels with Internet Link enabled keep working when your radio is disconnected.


      ## Clearer delivery info

      - Two delivery ticks: blue with a globe means delivered over the internet, green means your
      message was heard back over LoRa. Repeat counts still show next to them.

      - Received messages show a globe when they arrived via the internet, and "LoRa 2 hops" when
      the radio copy lands too.


      ## Maps in chat

      - Shared locations now show a mini map right in the chat bubble. Tap it to open the full map
      view.


      ## Fixes and polish

      - Fixed chat history disappearing from MeshOS and AirLink chats when connecting a LoRa radio.

      - Internet Messaging now stays connected when using a WiFi or Ethernet radio.

      - Settings screens reorganised with clear section dividers.

      - Cleaner chat input styling.


      APK SHA-256: `dc080d474c152db8ada2a004317e8ea84d4b00e3e89dfaf4aa3c0223564bdaf7`
  - version: v1.0.10
    name: MeshOS v1.0.10
    datetime: '2026-07-31T17:31:29Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/v1.0.10
    prerelease: false
    notes: >-
      **Internet Messaging (new)**

      Chat over the internet, with no radio needed. Turn it on in Settings and join the MeshOS
      channel: a global room shared with MeshOS users and devices anywhere, over WiFi or mobile
      data. The channel shows a live green/red connection dot. Works alongside your LoRa radio, and
      when a node is connected you appear under its name.


      **The app is now completely free**

      No licence, no activation, no restrictions. Every feature is unlocked for everyone, with any
      MeshCore radio. MeshOS device owners keep their "Activated" badge.


      **New setup experience**

      A proper first-run flow: choose whether to set up a MeshCore radio or go straight to internet
      and phone-to-phone messaging. Setting up a new radio walks you through region settings and
      your username, then offers the MeshOS channel.


      **Send your location**

      A pin button in every chat sends your current position to that channel or contact, in the same
      format T-Deck and M9 devices use, so it shows on everyone's map.


      **Redesigned message box**

      Grows as you type, keeps the pin, emoji and voice buttons inside it, and sends on Enter with
      hardware keyboards (Shift+Enter for a new line).


      **Also in this release**

      - New MeshOS app icon

      - Cleaner chats screen

      - Fixes: missing Public channel and a stuck refresh spinner after setting up a radio


