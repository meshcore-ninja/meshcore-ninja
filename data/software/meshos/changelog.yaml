      - Pictures are stored at higher quality, so your own picture looks sharp in the
        app.
      - Choose a picture from your photo library or browse files. Use Browse files if
        your phone's photo picker misbehaves.

      ### Radio connection

      - The app now keeps a foreground connection to your radio while it is connected,
        with a light keep-alive, so Android is less likely to drop the Bluetooth link
        when the screen is off. A new Keep CPU awake option in Settings is there for
        phones that still struggle.
      - If Android has MeshOS set to Restricted battery use, the app now warns you and
        offers to open the setting. Restricted mode cuts the radio link a few minutes
        after you leave the app.
      - New Connection log in Settings for troubleshooting connection drops, with copy
        and share.

      ### Channels

      - Fixed AirLink and LoRa Public channels showing as one merged channel when one
        side was switched off.

      ### Settings

      - Colour coded icons across Settings and Tools make the lists easier to scan.

      - Internet Messaging shows a simpler Connected status.


      ### Install

      Download `MeshOS-v1.0.18.apk` and open it to install. Existing users upgrade in

      place, keeping their messages and settings.


