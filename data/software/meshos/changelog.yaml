    url: https://github.com/andymux/meshos-releases/releases/tag/v1.0.24
    prerelease: false
    notes: >-
      # MeshOS app 1.0.24


      ## AirLink and MeshOS repeaters

      - MeshOS repeaters (firmware 1.6) can bridge AirLink and LoRa: phones on AirLink reach the
      LoRa mesh through the repeater, and LoRa messages reach them. The app shows which repeater put
      a message on LoRa.

      - Message paths name the LoRa repeaters a bridged message came through, the same way the map's
      AirLink/LoRa switch shows them.

      - Delivery reports come back from phones that received your message over AirLink as well.

      - Your profile picture is sent to AirLink phones that have not had it yet, and the picture
      menu has "Send my picture over AirLink".

      - Android: steadier AirLink connections; a phone that failed to connect once is tried again.

      - Mac and iPhone: AirLink comes back on after Bluetooth is switched off and on. The Mac app
      connects to MeshOS repeaters over AirLink.


      ## Repeaters

      - Tools > Manage a repeater finds MeshOS repeaters on your network as well as over Bluetooth,
      and opens their page in the app.


      ## Channels and messages

      - An AirLink channel can have its own Internet link.

      - A message that arrives over LoRa after its internet copy is kept with it, so you can see it
      came both ways.

      - Your own LoRa message coming back over AirLink no longer shows as a new message.

      - An internet room is no longer listed a second time beside the channel that already carries
      its internet link.

      - Blocked users: # in a pattern matches one digit, so ######## hides names made of eight
      digits. The participants list offers "Block all names like this".


      ## Downloads

      - Android: MeshOS-v1.0.24.apk

      - macOS: MeshOS-v1.0.24.dmg


