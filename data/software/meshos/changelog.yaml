    notes: >-
      # MeshOS app 1.0.26


      ## Signed messages

      - Your channel messages can carry a signature, so people know they really came from you:
      channel menu, Signed messages, Sign my messages. With a radio connected, your radio signs
      them; on AirLink alone, your phone does.

      - MeshOS checks everyone else's. A green tick means one of your contacts signed the message, a
      grey one that the signature checks out but they are not a contact. Tap a tick to see who
      signed it.

      - Only messages from my contacts is a second switch in the same place. It is set for each
      channel on its own, and starts off.
        - Off: the channel shows every message, as before, with ticks on the signed ones.
        - On: every message has to be signed by the person who sent it, and that person has to be one of your contacts, the way direct messages only come from your contacts. Unsigned messages, and messages signed by anyone else, are hidden and do not notify you.
        - Nothing is deleted. Turn the switch off again, or add the sender as a contact, and their messages are back.
      - Signed messages work over LoRa, AirLink and the internet, and across MeshOS repeaters and
      phones that bridge. Other MeshCore apps and radios show them as normal messages. A signed
      message can be up to 64 bytes, your name included.


      ## Contacts

      - Share my LoRa contact (channel menu, with a radio connected) posts your radio's contact card
      in a channel, and others add it to their radio's contacts with one tap. It is MeshCore's own
      contact link, so other MeshCore apps understand it too.

      - Public Chat's menu now has Share my LoRa contact and Share my AirLink contact too.


      ## Fixes

      - Turning off a channel's Internet Link now really keeps your messages there off the internet,
      even when you also have an internet room with the same key.

      - The internet tick on a message you sent no longer goes missing when the internet is quicker
      than AirLink.

      - A radio reflashed from MeshOS repeater to companion firmware no longer shows, and opens, as
      a repeater in the Bluetooth list.


      ## Downloads

      - Android: MeshOS-v1.0.26.apk

      - macOS: MeshOS-v1.0.26.dmg


      SHA-256:

      - MeshOS-v1.0.26.apk: f96c4b4d0af9a51d38b82e4badd11cb0523cd43e39ccb54c404d2668b884caff

      - MeshOS-v1.0.26.dmg: 56909224e41bcfd7290783c04eb5eb32b19a18c5ca9eecb068ed0d3c7966e090
