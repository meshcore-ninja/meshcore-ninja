    notes: >-
      # MeshOS app 1.0.29


      ## Photos over AirLink, no internet needed

      - You can now send a photo over AirLink with no internet at either end, in AirLink channels
      and in direct messages to AirLink contacts. The picture is shrunk to chat size and sent phone
      to phone over Bluetooth in pieces, the same way a voice message goes. It takes a few seconds
      to arrive.

      - When Internet Messaging is on, photos continue to go as a private link so they reach
      everyone on the channel, including internet-only contacts.

      - A room set to contacts only shows signed text from your contacts, so photos and voice
      messages sent over AirLink do not appear there yet.


      ## Photos and voice in direct messages

      - Direct messages to another MeshOS app user now have a photo button. With Internet Messaging
      on, the picture goes as a private link that only the two of you can open; offline it goes over
      AirLink as above.

      - Voice messages in those direct messages now travel over the internet as well as over
      AirLink. With Internet Messaging on, a voice message reaches a contact who is only online, and
      it still works over AirLink when you are offline.

      - Photos and voice messages are encrypted before they leave your phone. The server only ever
      holds encrypted data.

      - Direct messages to radio contacts over LoRa are unchanged in this release.


      ## Downloads

