    notes: >-
      MeshOS firmware v1.7.9


      LilyGo T-Deck and ThinkNode M9


      WiFi

      - Open networks (no password) can now be joined. Pick the network from the scan and Save; the
      password field says when a password is needed and when it is not.


      Send Image

      - A failed upload is retried once. If it still fails, the message says why (no connection,
      send dropped, connection lost, no reply) instead of a bare "Upload failed".


      CoreBrowser and images

      - A page or image that arrives incomplete over a slow or patchy connection is fetched again
      instead of being shown as unsupported, and slow connections get longer to finish.


      Sound

      - The Sound on/off switch (pull-down panel, Settings > Sound, Notifications) is now remembered
      across restarts. With it off, the radio also starts up silently.


      Install via SD card (firmware.bin) or the in-firmware updater.


