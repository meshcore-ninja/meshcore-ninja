    notes: >-
      # MeshOS app 1.0.30


      ## Heard list and labels

      - The "LoRa radios" filter now shows only radios heard over LoRa. It used to also list people
      who were reachable over AirLink or the internet.

      - Nodes and contacts now say how you reach them: "AirLink Mesh" for the phone-to-phone
      Bluetooth mesh, and "AirLink over Internet" for someone reached through the internet. The same
      wording now runs across the Heard list, your contacts and the map, so it reads the same
      everywhere.

      - An AirLink repeater now reads "AirLink repeater" in the Heard list and on the map, so it is
      clear which ones bridge the phone-to-phone mesh onto LoRa, rather than just saying "Repeater".


      ## Direct messages

      - There is a new info button at the top of a direct message. It opens a page about that
      contact: how your messages reach them, AirLink and the internet, with the last time each was
      seen, and whether an AirLink repeater nearby can also carry the message onto LoRa.


      ## Contacts

      - "Add to contacts" for a LoRa radio now appears only when you have a radio connected, since
      that contact is stored on the radio and cannot be added without one.


      ## Reliability

      - Fixes that improve reliability when using Internet Messaging.


