    notes: |-
      MeshOS firmware v1.7.5

      Storage
      - The malware clean-up now removes files with long names. On some factory map cards
        the worm's shortcut files carry long Chinese names, and 1.7.4 cut those names short
        when it listed them, so they could be found but not removed. A scan now lists up
        to 256 items per pass and says when more remain, so scan again after removing.
      - If 1.7.4 left files behind on your card, update and run the scan once more.
        Formatting the card is still the quickest way to a clean card if you prefer.

      Device firmware for LilyGo T-Deck and ThinkNode M9.
      Install via SD card (firmware.bin) or the in-firmware updater.

