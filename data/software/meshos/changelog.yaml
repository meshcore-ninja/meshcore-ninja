  - version: v1.0.22
    name: MeshOS v1.0.22
    datetime: '2026-09-26T10:17:24Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/v1.0.22
    prerelease: false
    notes: >-
      # MeshOS app 1.0.22


      ## Repeaters over Bluetooth

      - Tools > Manage a repeater opens a MeshOS repeater's own settings page inside the app over
      Bluetooth, so a repeater can be set up with nothing but your phone. It runs the first-time
      setup wizard, shows the nearby nodes list and path trace, and switches the repeater between
      Bluetooth and WiFi.

      - Update a repeater's firmware over Bluetooth. The app fetches the release, checks it, sends
      it to the repeater and reconnects once the repeater has restarted. Needs MeshOS repeater
      firmware 1.5.2 or later.


      ## Scan for Nodes

      - Tools > Scan for Nodes lists the nearby repeaters and sensors that answer, and offers to add
      one as a contact, or to add it and open its management screen over LoRa straight away.


      ## Direct messages

      - Optional automatic retry for direct messages that are not delivered. Turn on Direct Message
      Retry in Settings.

      - A message that was not delivered shows a red cross in the chat list instead of a tick.


      ## Reliability

      - Scanning for repeaters while connected to a radio no longer drops the connection.

      - Fixes that improve reliability when using the radio with the MeshOS app.
