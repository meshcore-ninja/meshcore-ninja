    url: https://github.com/andymux/meshos-releases/releases/tag/fw-v1.6.0
    prerelease: false
    notes: >-
      ## MeshOS 1.6.0


      **🌐 Internet Messaging (new!)** — a global "MeshOS" chat channel over WiFi. Turn it on in
      **Settings → Internet Messaging** and chat with MeshOS users anywhere, even with no LoRa mesh
      around you. Sent messages show a tick once the server relays them. (T-Deck & M9, WiFi
      required.)


      **⚡ Much faster, more reliable maps & browser** — map tiles and CoreBrowser now load
      dramatically faster and no longer stall or stop working after heavy use. Big memory-stability
      fix under the hood; tiles now served from our own fast cache.


      **Improvements & fixes**

      - Fixed the T-Deck slowly running out of memory (maps/browser would eventually stop until a
      reboot).

      - WiFi and Bluetooth now switch cleanly — turning one on turns the other off (they can't run
      together). Fixed: enabling Bluetooth then rebooting could leave it off if WiFi was on.

      - New WiFi On/Off toggle right in WiFi settings.

      - The map now prompts you to turn on WiFi when tiles need downloading.

      - Added a live "largest free memory block" readout on the System screen.


