    name: MeshOS v1.0.25
    datetime: '2026-10-08T18:35:01Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/v1.0.25
    prerelease: false
    notes: >-
      # MeshOS app 1.0.25


      ## Spam Blocker

      - Spam Blocker in Settings brings it all together: blocked users, blocked repeaters and
      routes, blocked channels, and your radio's spam control.

      - Block the repeater a spammer gets onto the mesh through: open the path of one of their
      messages and tap Block next to its first repeater. Their channel messages are hidden however
      they reach you, and your phone stops passing them on over AirLink. Tap Blocked to undo it.

      - Routes (two repeaters in a row) and channels can be blocked too, with the same rules as
      MeshOS repeaters.


      ## Message paths

      - Path opens a full-size screen: every hop from the sender to you, with a Map tab.

      - With 1-byte IDs, hops show by their ID, such as Repeater 07, because many repeaters share
      each one. Turn on Show likely repeaters for the app's best guess at each hop, the distances,
      and a button to try the next possible repeater.

      - An AirLink message from a LoRa user says so, and shows which repeater bridged it.


      ## AirLink contacts

      - Share your AirLink contact with people who have never been in Bluetooth range of you: post
      it in a channel (channel menu, Share my AirLink contact), or show your QR code or send the
      link (Contacts, +, Share my AirLink contact).

      - Add AirLink contacts from a contact card in a chat, by QR code, or from a copied link. You
      are always asked first, and a card never changes a contact you already have.

      - Once added, you can message each other over LoRa too, through MeshOS repeaters and phones
      that bridge.

      - Fixed AirLink messages not arriving from a contact whose short ID is the same as another
      contact's.

      - The heard list marks the nodes that are already in your contacts.

      - Contacts, + is there without a radio connected, while AirLink is on.


      ## Delivery reports

      - Sent message lists the MeshOS repeaters that heard your channel message, with how many hops
      it had made, the signal and the route. MeshOS repeaters with the observer turned on report
      this, for Public and for channels with Internet Link on. Only the reports travel over the
      internet, never your message.


      ## Repeaters

      - Tools > Manage a repeater > Network remembers the repeaters it found before: tap one to open
      its page, Scan network looks again, long-press forgets one.


      ## Downloads

      - Android: MeshOS-v1.0.25.apk

      - macOS: MeshOS-v1.0.25.dmg


