      ## MeshOS Companion v1.0.17

      ### Battery optimisations
      - A round of battery fixes across GPS, Bluetooth scanning and background
        networking. If MeshOS has been draining your phone, especially with the
        Wardrive pill left on, this release should make a big difference.

      ### Tools
      - New Tools screen: tap the spanner in the top bar for Trace Path and Scan for
        Nodes without digging through Settings.

      ### Channels
      - Fixed an issue where channel messages could be shown under the wrong channel
        after connecting a different radio.
      - Internet-enabled channels no longer vanish when you connect a radio that does
        not have them. They stay in your list as an internet-only channel, and you can
        keep chatting over the internet until you add the channel to that radio.

      ### Other
      - The update checker now only runs on Android. The iOS and macOS apps no longer
        point you at the Android download.
      - macOS: the app now needs macOS 11 or later.

      ### Install
      Download `MeshOS-v1.0.17.apk` and open it to install. Existing users upgrade in
      place, keeping their messages and settings.

