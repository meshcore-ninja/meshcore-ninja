    prerelease: false
    notes: |-
      MeshOS firmware v1.7.3

      MeshOS app
      - Fixes that improve reliability when using the radio with the MeshOS app.

      T-Deck memory
      - Around 80 KB of internal RAM freed by two fixes. With Bluetooth switched off, the
        BLE stack is no longer started and torn down at every boot, and the notification
        sound driver is now created only while a sound plays instead of holding 32 KB
        permanently. Boot-time minimum free heap goes from under 10 KB to over 110 KB,
        and companion (Bluetooth) mode has about five times the headroom it had.

      Also
      - /mem now reports the largest free block, and [HEAP] diagnostics are printed on the
        serial console.

      Device firmware for LilyGo T-Deck and ThinkNode M9.
      Install via SD card (firmware.bin) or the in-firmware updater.

