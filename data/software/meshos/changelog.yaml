    notes: >-
      # MeshOS 1.0.33


      ## Messages

      - Fixed message history disappearing after a relaunch. When the store reached its limit it was
      removing the wrong messages first, including your own recent sends and messages that arrived
      over the internet, and a whole direct message thread could vanish. It now removes the oldest
      messages first, trims channel messages before it touches any direct message thread, and keeps
      twice as many messages as before.

      - Clear messages in a channel now clears every message in it. In Public some messages used to
      be left behind.

      - The chats list now previews and sorts by the newest message, not the last one to arrive, so
      an older message arriving late no longer takes over a channel's preview.


      ## Direct messages

      - Tap the status under a sent direct message to see how it got there: delivered over AirLink,
      over the internet or over LoRa, with the hops it came back through.

      - When a direct message is acknowledged over LoRa the second tick turns green, even if the
      internet acknowledged it first.

      - Repeat counters now show on AirLink and direct message bubbles as well as channel messages.


      ## Contacts

      - Your radio's contacts are now remembered on the phone. They stay in Contacts when the radio
      is not connected, and signed messages from them still verify. Actions that need the radio are
      hidden or say so until it is connected.

      - Names that are only an emoji now show the emoji as the avatar instead of a question mark.


      ## Map

      - The legend now says AirLink users and LoRa nodes.


      ## Other

      - Smaller wording tidy-ups and fixes.


