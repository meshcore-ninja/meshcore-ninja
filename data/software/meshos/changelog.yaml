    notes: >-
      # MeshOS 1.0.35


      ## Spam Blocker

      - Known spam is now hidden by its text as well as its route, so it stays hidden whichever way
      it reaches you. The list refreshes every 10 minutes.

      - Your phone also spots new spam for itself: the same message arriving under several different
      one-off names is hidden before the list has it. A greeting shared by people who also chat
      stays visible.

      - A new Hidden by text section on the Spam Blocker page shows what was hidden this way. Tap
      Allow on anything that is not spam and it shows again.

      - Suggested routes you remove are easy to get back. Update tells you how many are off, Re-add
      puts them all back at once, the new Removed by you list lets you pick them one at a time, and
      removing a route now offers Undo.


      ## AirLink

      - Android phones no longer stop linking to new AirLink peers once they have several links.


      ## Display

      - On phones with on-screen back, home and recent buttons, pages no longer run underneath them,
      so the last row of a list can always be read and tapped.


      ## Downloads

