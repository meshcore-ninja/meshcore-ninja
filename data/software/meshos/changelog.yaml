    notes: >-
      # MeshOS app 1.0.27


      ## Contacts

      - Delete contacts in bulk. Long-press a contact to start selecting, then keep holding and drag
      to take in everyone in between: the list scrolls when you reach the top or bottom. Tap to add
      or drop one. Select all picks everything the filter shows, so Repeaters, Select all, Delete
      clears out every repeater in one go. A few hundred take a little while, and the app shows how
      far it has got.

      - Your radio now adds a contact only when you add it, from a card, a QR code or the Heard
      list. Normal MeshCore radios can add everyone they hear, which fills up the contact list and
      may bring in a second contact under the name of one you already have. Everything your radio
      hears still shows in the Heard list, ready to add. An M9 or T-Deck used on its own, without
      the app, follows its own setting on the device: Settings > Auto-add Contacts/Repeaters >
      Clients.

      - Adding a contact with the same name as one you already have, but a different key, now asks
      first and shows the start of both keys. Anyone can use any name, so add it only if you know it
      is them, on a new radio or phone for example.

      - Contacts are named more plainly: radio contacts are "LoRa radio" rather than "Chat", and the
      filters read LoRa radios, Repeaters and Rooms. Every row shows the kind of contact, when it
      was last heard and the start of its key as its contact card shows it (1A2B 3C4D, say), so you
      can match a contact to its card.

      - Adding a contact now tells you when your radio does not take it, for example because its
      contact list is full, instead of saying it was added.

      - With a radio connected, Contacts now lists your AirLink contacts even when AirLink is off,
      and one you have just added (from a card in an internet room, say) shows near the top.

      - A contact you have added from a card or a QR code now says "not heard yet" until its first
      advert is heard, instead of "never", and a new one shows near the top of the list.


      ## Signed messages

      - In a channel set to Only messages from my contacts, a message from someone else could still
      show if it arrived while the app was reconnecting to your radio. It no longer does.

      - The Only messages from my contacts switch explains itself better: each message has to be
      signed by the person who sent it, and they have to be one of your contacts.

      - Tapping the tick on a signed message now shows the start of the sender's key as well as
      their name, the same as their contact card.


      ## Chats

      - On Android, the Return key on the keyboard now always starts a new line, whichever keyboard
      you use, and only the send button sends. With Samsung's keyboard it could still send a
      half-written message.

      - Resend sends your message again as a new message, in a bubble of its own with its own ticks
      and repeats. Resent messages no longer stack up under the original, and Delete removes a
      message completely instead of leaving another copy underneath.


      ## Downloads

      - Android: MeshOS-v1.0.27.apk

      - macOS: MeshOS-v1.0.27.dmg


