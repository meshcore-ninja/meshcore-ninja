  - version: fw-v1.7.8
    name: MeshOS firmware v1.7.8
    datetime: '2026-10-14T17:52:25Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/fw-v1.7.8
    prerelease: false
    notes: >-
      MeshOS firmware v1.7.8


      LilyGo T-Deck and ThinkNode M9


      Delivery reports

      - Your radio now tells people who heard their message: when it hears the LoRa copy of a
      message on a channel with Internet on, or on Public with Internet Messaging on, the sender
      sees your radio in their "heard by" list, the same as the app shows.

      - Long-press one of your own messages to see who heard it: the repeaters that relayed it and
      the phones and radios that reported hearing it, with hops and signal. The list scrolls (joypad
      up and down, or drag) and has a scroll bar.


      Signed messages

      - Each channel's long-press menu has a new Sign row. With it on, your messages on that channel
      carry your radio's signature, so people can see they really came from you.

      - Messages signed by others get a mark after the sender's name: a green tick when the signer
      is one of your contacts, a grey tick when it is another key your radio knows, a grey "?" when
      the key is unknown, and a red cross when the signature does not match.


      Contact cards

      - The attach menu (where Send Position and Send Image live) has a new Send Contact: it sends
      your radio's contact card to a channel or a contact.

      - Cards you send or receive show as cards, with the name, kind and key, instead of a long
      link. Long-press a received card to add the contact.

      - A card from a phone's AirLink identity adds an AirLink contact: it sits in Contacts marked
      AirLink, and that phone's signed messages then get the green tick. There is no radio behind
      it, so messaging it is done from the app.


      Contacts

      - Adding a contact when the table is full (150) now says so, instead of closing as if it had
      worked. Your radio's own Auto-add setting is what fills the table.


      Install via SD card (firmware.bin) or the in-firmware updater.


