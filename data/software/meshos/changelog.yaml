      # MeshOS 1.0.31


      ## New messages divider

      Channels now show a red "New messages" line where the messages you have not read yet begin,
      with a button at the top of the chat to jump straight to them. Opening a channel still takes
      you to the latest message, and nothing scrolls on its own.


      ## Direct messages

      - Tapping the notification for an AirLink or internet direct message now opens that chat. A
      message from someone who is not yet a contact opens your Message requests.

      - AirLink and internet direct messages now show the other person's photo, both on their
      messages and in the chats list.


      ## Channel colours

      Channels are now coloured from their name, so they are easy to tell apart at a glance instead
