    notes: >-
      # MeshOS 1.0.34


      ## Spam Blocker

      - New automatic Spam Blocker. Switch it on in Settings > Spam Blocker and the app fetches the
      routes the Mesh status service sees the current spam coming in through, for your country,
      every hour within minutes of each report. Those routes are blocked while the spam lasts and
      removed again 12 hours after it stops. Routes you add yourself are never touched, and a
      suggested route you remove stays off until that spam episode ends.

      - The Spam Blocker page shows the report's spam map: the area the spam starts in and every
      route out of it, red where blocked, green where not.

      - With a MeshOS radio on firmware 2.3 (1.7.10 on the T-Deck and M9) the app now gets the route
      of every message, including the long messages that were left out before, so most spam can be
      blocked by the route it travelled. A red notice on the Spam Blocker page and under its
      Settings entry says when the connected radio cannot report routes, with a link to the
      configurator.

      - Spam caught by a route rule is no longer passed on over AirLink by a phone that bridges.

      - Spam arriving over AirLink is judged on its whole LoRa route when its first hop cannot be
      told apart from an AirLink phone.

      - A message no longer borrows another packet's route when its own route report is missing,
      which could have hidden an innocent message.


      ## Delivery reports

      - Long-press one of your messages to see who heard it: MeshOS app users and MeshOS repeaters
      as name pills, with the hop count beside each and the time on the right. Tap a name for its
      route and signal.


      ## Map

      - MeshOS observers, the repeaters that report what they hear, are shown on the map in both the
      AirLink and LoRa views, with a button to hide them and a legend entry. Tap one for its name,
      firmware, position and when it was last heard.

      - The map buttons sit centred on the left edge and show their label when pressed. The pause
      button is gone, and the scan button only appears in the LoRa view with a radio connected.


      ## Channels

      - The Public channel has its Path Hash Size and Region Scope settings back in its menu and in
      Channel info.

      - Message Path now shows the right transport and hops for a message opened from the merged
      Public channel. A LoRa message could be shown as if it had arrived over AirLink.

      - Your radio's own spam control setting has moved under the MeshCore tab's Repeater heading
      and is available when Act as repeater is on.


