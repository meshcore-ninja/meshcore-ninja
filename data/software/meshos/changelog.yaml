    notes: >-
      # MeshOS 1.0.32


      ## Contact info

      - Tap a contact's photo to open their info page, for both AirLink and LoRa contacts.

      - The info page shows their key and, when it is known, their location with a button to open
      the map. For LoRa contacts it also shows the path your messages take to reach them.

      - Both LoRa and AirLink contacts now have a menu (the three dots) with the actions for that
      contact, such as share, show on map, set a photo, and remove. The same actions are on the info
      page.

      - Resetting a LoRa contact's path now updates the path shown on their info page straight away.


      ## Map

      - Contacts with a known location now show a location button in the list. Tap it to see that
      person on the map.

      - Viewing someone on the map now goes straight to them, without the slow zoom-out, and no
      longer jumps back to your own area.


      ## New messages line

      The button that jumps to new messages in a channel is smarter now. It only appears when the
      new messages are off the screen, it takes you to the first new message, and it no longer
      appears by mistake when the keyboard opens or just after you send a message.


      ## Other

      - Messages from a device whose clock is wrong now appear where they actually arrived, with
      their time shown in red, instead of being hidden at the top of a chat or pushing a channel to
      the bottom of the list.

      - Smaller wording tidy-ups and fixes.


