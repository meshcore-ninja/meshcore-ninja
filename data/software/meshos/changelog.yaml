  - version: fw-v1.7.4
    name: MeshOS firmware v1.7.4
    datetime: '2026-09-19T11:43:30Z'
    url: https://github.com/andymux/meshos-releases/releases/tag/fw-v1.7.4
    prerelease: false
    notes: |-
      MeshOS firmware v1.7.4

      Storage
      - New Tools > Storage screen: SD card type, size and free space, plus a malware scan
        for the Windows autorun worm found on some factory-loaded ThinkNode M9 map cards
        (it cannot run on the radio, only on a Windows PC). The clean-up removes only the
        files the scan flags, after a confirmation, so map tiles and MeshOS data stay put.
        Elecrow's explanation of the affected cards:
        https://www.elecrow.com/Thinknode-M9-Security-Advisory-SD-Card-Malware-Risk.html
      - Format SD card writes a fresh FAT32 file system. This erases everything on the
        card, including maps.

      Messages
      - A long channel message no longer restarts the radio; the composer stops at the
        160-byte LoRa limit.
      - Room servers: posts are no longer duplicated when the radio logs in again, and
        sync resumes from the last message.

      M9 battery
      - Correct percentage for the M9 cell, with steady readings while charging and
        after unplugging.

      Also
      - The Contacts badge counts only current contacts, accented letters in names are
        shown, and the clock is set from the internet when WiFi is connected.
      - SD card writes tolerate slow cards better: the radio now waits out a card that
        stalls during a write instead of giving up, and a card the driver lost is remounted
        on its own.

      Device firmware for LilyGo T-Deck and ThinkNode M9.
      Install via SD card (firmware.bin) or the in-firmware updater.

      SHA-256:
      - TDeck: 2e2c2e1be1012bfe0f8978c0a58968aa1304ce94eb9bce439857416b23a8ede1
      - M9: 3ca4aadde29f179bbd2e02598d9303e8bb2cc26487691be1f50be0bf2b74139e
